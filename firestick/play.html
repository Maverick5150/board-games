<html lang="en" data-game="party">

<title>Board Games — Controller</title>
<script>/* before first paint: the stored effects level (a phone is never the TV layout) */

  try { if (localStorage.getItem("bgui.effects") === "reduced") h.setAttribute("data-effects", "reduced"); } catch (e) { }
})(document.documentElement);</script>
<link rel="stylesheet" href="../ui/theme.css">

<link rel="preload" href="../ui/fonts/dmserifdisplay-latin.woff2" as="font" type="font/woff2" crossorigin>

<link rel="dns-prefetch" href="https://broker.emqx.io"><link rel="dns-prefetch" href="https://broker.hivemq.com"><link rel="dns-prefetch" href="https://public.cloud.shiftr.io">
<script src="../ui/icons.js" defer></script>
<script src="../ui/ui.js" defer></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body.bg-app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;touch-action:manipulation;overflow-x:hidden;}
  [hidden]{display:none !important;}
  .bg-topbar__title .bg-eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bg-topbar__name{line-height:1.25;}
  #conn{margin:.15rem auto 0;min-height:1.25rem;padding:.05rem .5rem;font-size:var(--fs-micro);}
  #conn:empty{display:none;}
  #conn[data-state="online"]{color:var(--tag-ok-ink);background:var(--tag-ok-bg);box-shadow:inset 0 0 0 1px rgba(79,214,156,.45);}
  .bg-topbar__title{display:grid;justify-items:center;}
  #main{flex:1 0 auto;width:100%;max-width:34rem;margin:0 auto;}
  .big{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.875rem;padding:1rem var(--gutter) calc(env(safe-area-inset-bottom,0px) + 1.5rem);}
  .big.scroll{justify-content:flex-start;padding-top:.75rem;}
  #main > .title, .join-card .title, .ph-sheet-body .title{margin:0;font:400 var(--fs-2xl)/1.15 var(--font-display);color:var(--text-1);}
  #main > .sub, .join-card .sub, .ph-sheet-body .sub{margin:0;font:var(--fw-body) var(--fs-md)/1.4 var(--font-ui);color:var(--text-2);max-width:28rem;}
  #main > .sub[data-seat]{color:var(--seat-text);}
  .sub .dotc{margin-right:.35rem;}
  .dotc{width:.75rem;height:.75rem;border-radius:50%;display:inline-block;margin-right:.35rem;vertical-align:-.05em;box-shadow:0 0 0 2px rgba(255,255,255,.2);}
  .opts{display:grid;gap:.75rem;width:100%;max-width:28rem;margin-top:.375rem;padding:var(--focus-room);margin-inline:calc(-1 * var(--focus-room));width:calc(100% + 2 * var(--focus-room));}
  button.opt{margin:0;white-space:normal;min-height:3.5rem;}
  button.opt.sm{min-height:var(--tap);}
  .opt--seat{color:var(--seat-ink);background:var(--seat);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 22px -12px var(--seat);}
  .seatword{color:var(--seat-text);}
  .ph-status{display:inline-flex;align-items:center;gap:.5rem;}
  .ph-status .bg-ico{width:1.25rem;height:1.25rem;color:var(--gold-100);}
  .ph-hint{font-size:var(--fs-sm);}
  .prow2 .pname{flex:1;min-width:0;}
  .prow2 .bg-ico-slot{display:grid;place-items:center;color:var(--gold-200);}
  .prow2 .bg-ico-slot .bg-ico{width:1.1rem;height:1.1rem;}
  .trow .tname{flex:1;min-width:0;}
  .pcard__head{display:flex;justify-content:space-between;align-items:center;gap:.5rem;}
  .pcard__who{display:inline-flex;align-items:center;gap:.4rem;font:var(--fw-ui-strong) var(--fs-md)/1.2 var(--font-ui);}
  .pcard__who .dotc{background:var(--seat);margin:0;}
  .pcard__cash{color:var(--tag-ok-ink);font:var(--fw-caps) var(--fs-md)/1 var(--font-ui);}
  .pcard__meta{margin-top:.15rem;font:var(--fw-ui) var(--fs-sm)/1.3 var(--font-ui);color:var(--text-2);}
  .ph-toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);z-index:90;padding:.6rem 1rem;border-radius:var(--r-lg);background:var(--ink-3);color:var(--text-1);font:var(--fw-ui-strong) var(--fs-sm)/1.3 var(--font-ui);box-shadow:var(--panel-edge);}
  .join-card{display:grid;gap:.875rem;width:100%;max-width:26rem;padding:1.25rem;text-align:center;justify-items:center;}
  .join-card input{width:100%;min-height:3.25rem;padding:.75rem 1rem;border:0;border-radius:var(--r-md);background:var(--ink-2);color:var(--text-1);box-shadow:var(--well-edge);font:var(--fw-ui-strong) var(--fs-lg)/1.2 var(--font-ui);text-align:center;}
  .join-card input::placeholder{color:var(--text-3);}
  .join-card input:focus{outline:none;box-shadow:var(--focus-ring);}
  #rc{letter-spacing:.35em;text-transform:uppercase;}
  #sc{letter-spacing:.35em;}
  /* getting back in: the line under "The game has started" (the host's answer, a code that did not work) */
  .ph-rjmsg{margin:0;width:100%;padding:.6rem .8rem;border-radius:var(--r-md);background:var(--ink-2);box-shadow:var(--well-edge);font:var(--fw-ui-strong) var(--fs-sm)/1.35 var(--font-ui);color:var(--text-1);}
  .ph-rjmsg.is-warn{box-shadow:inset 0 0 0 1px rgba(245,196,81,.55);color:#ffe3a3;}
  .pill{display:inline-flex;align-items:center;gap:.4rem;margin:0;font:var(--fw-ui-strong) var(--fs-sm)/1.2 var(--font-ui);}
  .ph-wait{display:grid;place-items:center;width:4.5rem;height:4.5rem;border-radius:50%;background:var(--ink-3);box-shadow:inset 0 0 0 1.5px var(--line-gold),0 10px 26px -12px rgba(231,202,144,.5);color:var(--gold-100);}
  .ph-wait .bg-ico{width:2rem;height:2rem;}
  .ph-wait.is-beat .bg-ico{animation:ph-flip 1.1s var(--ease-out) 1 both;}
  @keyframes ph-flip{from{transform:rotate(0)}to{transform:rotate(180deg)}}
  html[data-effects="reduced"] .ph-wait.is-beat .bg-ico{animation:none;}
  /* step 10 smoothness: a tapped control that went to the TV dims at once (opacity only), until the TV's answer redraws it */
  .ph-sent{opacity:.55;transition:opacity .12s ease-out;}
  html[data-effects="reduced"] .ph-sent{transition:none;}
  .seatrow{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:26rem;}
  .mytoken{width:4.5rem;height:4.5rem;font-size:var(--fs-2xl);}
  /* step 10 colour pick (Trouble, Sorry!): a colour another phone holds is greyed out and cannot be picked */
  .ph-colpick{display:grid;gap:.5rem;width:100%;max-width:22rem;}
  .ph-colpick .bg-eyebrow{justify-self:center;}
  .ph-cols{display:grid;grid-template-columns:1fr 1fr;gap:.75rem;padding:var(--focus-room);margin:0 calc(-1 * var(--focus-room));}
  .ph-col{display:flex;align-items:center;justify-content:flex-start;gap:.5rem;min-height:3rem;padding:.5rem .75rem;margin:0;font:var(--fw-ui-strong) var(--fs-md)/1.2 var(--font-ui);text-align:left;}
  .ph-col .ph-cdot{width:1.25rem;height:1.25rem;border-radius:50%;flex:0 0 auto;box-shadow:0 0 0 2px rgba(255,255,255,.3);}
  .ph-col small{display:block;font:var(--fw-ui) var(--fs-xs)/1.2 var(--font-ui);color:var(--text-2);}
  .ph-col[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--gold-200),0 0 0 1px rgba(0,0,0,.4);}
  .ph-col:disabled{opacity:.7;cursor:not-allowed;}
  .ph-col:disabled .ph-cdot{filter:grayscale(1);}
  /* step 10 who goes first: the result the TV shows */
  .ph-first .title{color:var(--gold-100);}
  .ph-firstbar{display:flex;align-items:center;gap:.75rem;width:calc(100% - 2 * var(--gutter));max-width:30rem;margin:.75rem auto 0;padding:.625rem .875rem;border-radius:var(--r-lg);background:var(--panel-fill);box-shadow:inset 0 0 0 2px var(--gold-300),var(--panel-edge);}
  .ph-firstbar .bg-token{width:2.5rem;height:2.5rem;flex:none;}
  .ph-firstbar__t{display:grid;gap:.125rem;min-width:0;}
  .ph-firstbar b{font:400 var(--fs-lg)/1.2 var(--font-display);color:var(--gold-100);}
  .ph-firstbar small{font:var(--fw-ui) var(--fs-sm)/1.3 var(--font-ui);color:var(--text-2);}
  /* review step 10: the Scattergories Ruling on the phone (compact; the TV shows the full sheet) */
  .ph-rl{position:sticky;top:.5rem;z-index:5;display:grid;gap:.375rem;width:100%;margin:0 0 .75rem;padding:.75rem .875rem;border-radius:var(--r-lg);background:var(--ink-3);box-shadow:inset 0 0 0 2px var(--gold-300),0 10px 24px -12px rgba(0,0,0,.8);text-align:left;}
  .ph-rl[data-v="good"]{box-shadow:inset 0 0 0 2px #4fd69c,0 10px 24px -12px rgba(0,0,0,.8);}
  .ph-rl[data-v="bad"]{box-shadow:inset 0 0 0 2px #ff8a8a,0 10px 24px -12px rgba(0,0,0,.8);}
  .ph-rl__eb{font:var(--fw-caps) var(--fs-micro)/1.25 var(--font-ui);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--gold-200);}
  .ph-rl__v{display:flex;align-items:center;gap:.5rem;margin:0;font:400 var(--fs-xl)/1.15 var(--font-display);color:var(--text-1);}
  .ph-rl__v .bg-ico{width:1.4rem;height:1.4rem;flex:none;}
  .ph-rl[data-v="good"] .ph-rl__v .bg-ico{color:#4fd69c;} .ph-rl[data-v="bad"] .ph-rl__v .bg-ico{color:#ff8a8a;}
  .ph-rl__a{margin:0;font:var(--fw-ui-strong) var(--fs-md)/1.3 var(--font-ui);color:var(--text-1);}
  .ph-rl__a small, .ph-rl__l, .ph-rl__c{font:var(--fw-ui) var(--fs-sm)/1.35 var(--font-ui);color:var(--text-2);}
  .ph-rl__l, .ph-rl__c{margin:0;}
  .ph-rl__l{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .ph-rl .bg-btn{margin-top:.25rem;min-height:var(--tap);}
  /* review step 10: a computer's trade offer to this phone (Monopoly) */
  .ph-offer{display:grid;gap:.625rem;width:100%;max-width:28rem;text-align:left;}
  .ph-offer__side{display:grid;gap:.375rem;padding:.75rem .875rem;border-radius:var(--r-lg);background:var(--ink-2);box-shadow:var(--well-edge);}
  .ph-offer__side h3{margin:0;font:var(--fw-caps) var(--fs-micro)/1.25 var(--font-ui);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--gold-200);}
  .ph-offer__it{display:flex;align-items:center;gap:.5rem;font:var(--fw-ui-strong) var(--fs-md)/1.3 var(--font-ui);color:var(--text-1);}
  .ph-offer__it .chip{width:.9rem;height:.9rem;border-radius:.25rem;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.35);}
  .ph-offer__it small{color:var(--text-2);font-weight:var(--fw-ui);}
  .ph-stand{list-style:none;margin:0;padding:0;display:grid;gap:.375rem;width:100%;max-width:24rem;text-align:left;}
  .ph-stand li{display:flex;align-items:center;gap:.5rem;padding:.4rem .75rem;border-radius:var(--r-md);background:var(--ink-2);box-shadow:var(--well-edge);font:var(--fw-ui-strong) var(--fs-sm)/1.3 var(--font-ui);color:var(--text-1);}
  .ph-stand li:first-child{box-shadow:inset 0 0 0 2px var(--gold-300);}
  .ph-stand .dotc{margin:0;}
  .ph-stand__n{min-width:1.2rem;font:400 var(--fs-md)/1 var(--font-display);color:var(--gold-200);}
  .ph-stand__nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ph-stand__v{flex:none;color:var(--text-2);}
  .ph-offer__note{margin:0;font:var(--fw-ui) var(--fs-sm)/1.35 var(--font-ui);color:var(--text-2);}
  .prow2{display:flex;align-items:center;gap:.625rem;width:100%;max-width:26rem;min-height:var(--tap);padding:.75rem .875rem;border:0;border-radius:var(--r-md);background:var(--panel-fill);box-shadow:var(--panel-edge);color:var(--text-1);font:var(--fw-ui-strong) var(--fs-md)/1.25 var(--font-ui);text-align:left;cursor:pointer;margin:0;}
  .prow2 .chip{width:1rem;height:1rem;border-radius:.25rem;flex:0 0 auto;box-shadow:0 0 0 1px rgba(255,255,255,.35);}
  .prow2 small{color:var(--text-2);font-weight:var(--fw-ui);margin-left:auto;font-size:var(--fs-micro);}
  .scard{width:13rem;min-height:18rem;background:#fff;border:.75rem solid #c62222;border-radius:1.25rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;padding:.6rem;color:#222;text-align:center;}
  .scard.sback{border-color:#fff;color:#fff;}
  .sbigb{font:400 var(--fs-3xl)/1 var(--font-display);text-shadow:0 2px 6px #0006;}
  .swho,.swho2{font:var(--fw-ui-strong) var(--fs-sm)/1.2 var(--font-ui);opacity:.9;}
  .sbig{font-family:var(--font-display);font-weight:400;line-height:1;}
  .stxt{font:var(--fw-ui-strong) var(--fs-sm)/1.25 var(--font-ui);}
  .sec{width:100%;max-width:26rem;text-align:left;margin-top:.5rem;}
  .sec h3{margin:.4rem 0 .3rem;font:var(--fw-caps) var(--fs-micro)/1.2 var(--font-ui);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--gold-200);}
  .trow{display:flex;align-items:center;gap:.625rem;min-height:var(--tap);padding:.5rem .625rem;border-radius:var(--r-sm);background:var(--ink-2);box-shadow:var(--well-edge);margin:.25rem 0;font:var(--fw-ui) var(--fs-sm)/1.3 var(--font-ui);}
  .trow input[type=checkbox]{width:1.5rem;height:1.5rem;accent-color:#e7ca90;}
  .trow small{color:var(--text-2);font-size:var(--fs-sm);}
  .trow button[data-v]{min-height:var(--tap);min-width:var(--tap);border:0;border-radius:var(--r-sm);background:var(--control-fill);box-shadow:inset 0 0 0 1px var(--line-2);color:var(--text-1);font:var(--fw-ui-strong) var(--fs-sm)/1 var(--font-ui);padding:0 .75rem;}
  .numin{width:7rem;min-height:var(--tap);padding:.5rem;border:0;border-radius:var(--r-sm);background:var(--ink-1);color:var(--text-1);box-shadow:var(--well-edge);font:var(--fw-ui-strong) var(--fs-md)/1 var(--font-ui);text-align:center;}
  .pcard{width:100%;max-width:26rem;padding:.75rem .875rem;text-align:left;}
  .pchips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem;}
  .pchip{display:inline-flex;align-items:center;gap:.35rem;min-height:var(--tap);font:var(--fw-ui) var(--fs-micro)/1.2 var(--font-ui);background:var(--ink-2);box-shadow:var(--well-edge);border-radius:var(--r-sm);padding:.25rem .6rem;cursor:pointer;color:var(--text-1);}
  .pchip .chip{width:.75rem;height:.75rem;border-radius:.2rem;box-shadow:0 0 0 1px rgba(255,255,255,.35);}
  .afk{width:100%;margin:.25rem 0;padding:.625rem .75rem;border-radius:var(--r-md);background:#3a1218;box-shadow:inset 0 0 0 1px rgba(255,107,125,.5);color:var(--text-1);text-align:center;font:var(--fw-ui-strong) var(--fs-sm)/1.3 var(--font-ui);display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:center;}
  .ph-sheet-body{display:grid;gap:.75rem;justify-items:stretch;text-align:left;padding:var(--focus-room);margin:calc(-1 * var(--focus-room));}
  .ph-sheet-body .title{font-size:var(--fs-xl);}
  #deedv{display:grid;justify-items:center;gap:.5rem;}
  .ph-effects{margin-top:.25rem;}
  .ph-link{display:inline-flex;}
  /* ---------- phone sideways (step 11): a short landscape screen (a phone on its side). Upright is unchanged. A slimmer top bar (the
     room, the name and the link chip on two lines); the prompts' choices in two columns; the card games and Risk as table-plus-hand: the
     table (or the map) pinned on the left under the bar with your hand pinned under it, and on the right whose turn, the buttons and the
     log, which scroll with the page ---------- */
  @media (orientation: landscape) and (max-height: 31.25em){
    html{--ls-bar:3.25rem; --ls-h:100vh; --ls-panel:clamp(15rem,34vw,18rem); --ls-hand:5.75rem;
      --ls-game:calc(var(--ls-h) - var(--ls-bar) - env(safe-area-inset-top,0px) - 1.25rem)}
    @supports (height:100dvh){ html{--ls-h:100dvh} }
    .bg-topbar{height:calc(var(--ls-bar) + env(safe-area-inset-top,0px)); padding-top:calc(env(safe-area-inset-top,0px) + .25rem); padding-bottom:.25rem}
    .bg-topbar__title{grid-template-columns:auto auto; justify-content:center; align-items:center; column-gap:.5rem}
    .bg-topbar__title .bg-eyebrow{grid-column:1 / -1; margin-bottom:.1rem}
    .bg-topbar__name{font-size:var(--fs-lg)}
    #conn{margin:0}
    #main{max-width:52rem}
    .big{padding-top:.75rem; padding-left:max(var(--gutter), env(safe-area-inset-left,0px)); padding-right:max(var(--gutter), env(safe-area-inset-right,0px))}
    .opts{max-width:48rem; grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr))}
    /* the card games and Risk use the whole width */
    #main:has(.rvp, .unph, .scph, .rkph){max-width:none}
    .unph, .scph, .rkph{max-width:none !important}
    /* 500 Rummy: the table (melds beside the stock and the pile) and the hand on the left, the rest on the right */
    html .rvp{display:grid; max-width:none; grid-template-columns:minmax(0,1fr) var(--ls-panel); grid-template-rows:max-content max-content max-content max-content 1fr;
      grid-template-areas:"L head" "L sb" "L chips" "L acts" "L lg"; column-gap:1rem; row-gap:.5rem; align-items:start; text-align:left}
    html .rvp > .head{grid-area:head} html .rvp > .sc:nth-child(2){grid-area:sb; justify-content:flex-start} html .rvp > .sc:nth-child(3){grid-area:chips; justify-content:flex-start}
    html .rvp > .acts{grid-area:acts; justify-content:flex-start} html .rvp > .lg{grid-area:lg; text-align:left} html .rvp > .sheet{grid-column:2}
    html .rvp > .tbl{grid-area:L; position:sticky; top:calc(var(--ls-bar) + env(safe-area-inset-top,0px) + .5rem); display:flex; height:calc(var(--ls-game) - var(--ls-hand)); min-height:0}
    html .rvp .rm{flex:1 1 0; min-width:0; min-height:0; max-height:none}
    html .rvp .pl{flex:none; flex-direction:column; justify-content:center; width:8rem; border-top:0; border-left:1px dashed var(--line-2); padding:4px 2px 4px 8px}
    html .rvp .stk{--cw:42px} html .rvp .dp{--cw:40px; flex:none; width:100%; padding:10px 4px 4px 2px} html .rvp .dp .pc{margin-left:-22px}
    html .rvp > .hd{grid-area:L; position:sticky; top:calc(var(--ls-bar) + env(safe-area-inset-top,0px) + .5rem + var(--ls-game) - var(--ls-hand)); margin-top:calc(var(--ls-game) - var(--ls-hand));
      --cw:48px; flex-wrap:nowrap; height:var(--ls-hand); padding:18px 22px 4px 4px}
    html .rvp > .hd .pc{margin-right:-20px}
    html .rvp > .hd:has(.pc:nth-child(14)) .pc{margin-right:-27px}
    html .rvp > .hd:has(.pc:nth-child(19)) .pc{margin-right:-33px}
    html .rvp > .hd:has(.pc:nth-child(25)){justify-content:flex-start; overflow:auto hidden; scrollbar-width:none}
    /* Uno: the same, from the Uno table (cards.js) */
    .unph .unoT.un-lux{display:grid; grid-template-columns:minmax(0,1fr) var(--ls-panel); grid-template-rows:max-content max-content max-content 1fr;
      grid-template-areas:"L strip" "L stat" "L acts" "L log"; column-gap:1rem; align-items:start}
    .unph #upl{grid-area:strip; padding:.625rem 0 .25rem}
    .unph #ustat{grid-area:stat; margin:0; padding:.5rem .75rem; font-size:var(--fs-sm); justify-content:flex-start; text-align:left}
    .unph #uacts{grid-area:acts; justify-content:flex-start; margin:.5rem 0 0}
    .unph #ulog{grid-area:log; min-height:0; margin:.5rem 0 0; text-align:left}
    .unph #utbl{grid-area:L; position:sticky; top:calc(var(--ls-bar) + env(safe-area-inset-top,0px) + .5rem); height:calc(var(--ls-game) - var(--ls-hand) - .75rem); min-height:0; margin:0; padding:.75rem .75rem .5rem}
    .unph #utbl .pile:not(.un-mid){--cw:min(100px, calc((var(--ls-game) - var(--ls-hand) - 5rem) / 1.5))}
    .unph #uhand{grid-area:L; position:sticky; top:calc(var(--ls-bar) + env(safe-area-inset-top,0px) + .5rem + var(--ls-game) - var(--ls-hand)); margin-top:calc(var(--ls-game) - var(--ls-hand));

  var d=document.createElement("div"); d.className="ph-toast"; d.textContent=m; document.body.appendChild(d); setTimeout(function(){d.remove();},1800); }
/* sheets: BGUI.sheet when it is there (it is on every real phone); the .on class stays as the page's own "is open" flag */
function openSheet(el,opts){ el.classList.add("on"); var B=BG(); if(B&&B.sheet) B.sheet.open(el,opts); }
function closeSheet(el){ var B=BG(); el.classList.remove("on"); if(B&&B.sheet&&B.sheet.isOpen(el)) B.sheet.close(el); }
/* a button in the colour of its seat (your own seat when it names none, the gold primary before you have one) */
function optHTML(label,attrs,color,cls,plain){   /* plain: a button with no colour of its own (Done) is the quiet secondary, not your seat colour */
  var n=sn(color)||(plain?0:sn(myColor));
  return '<button type="button" class="opt bg-btn bg-btn--block '+(n?"opt--seat":(plain?"bg-btn--secondary":"bg-btn--primary"))+(cls?" "+cls:"")+'"'+(n?' data-seat="'+n+'"':'')+(attrs?" "+attrs:"")+'>'+esc(clean(label))+'</button>';
}
function ghostHTML(label,id,icon){ return '<button type="button" class="opt sm ghost bg-btn bg-btn--secondary bg-btn--block" id="'+id+'">'+(icon?'<span data-icon="'+icon+'" aria-hidden="true"></span>':'')+esc(label)+'</button>'; }
/* the most readable ink on a colour (the Sorry! card back) and a darker shade of it (its number on the white card) */
function lum(h){ var m=/^#([0-9a-f]{6})$/i.exec(h||""); if(!m) return 0; var n=parseInt(m[1],16), f=function(v){ v/=255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4); }; return 0.2126*f(n>>16&255)+0.7152*f(n>>8&255)+0.0722*f(n&255); }
function inkFor(hex){ var L=lum(hex); return (L+0.05)/(0.0066+0.05)>=1.05/(L+0.05)?"#14110a":"#ffffff"; }
function darken(hex,t){ var m=/^#([0-9a-f]{6})$/i.exec(hex||""); if(!m) return "#222"; var n=parseInt(m[1],16), c=[n>>16&255,n>>8&255,n&255].map(function(v){ return ("0"+Math.round(v*(1-t)).toString(16)).slice(-2); }); return "#"+c.join(""); }

var params=new URLSearchParams(location.search);
var room=(params.get("room")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,5);
var myPid=BGNet.pid();
var myName=null, myColor=null, net=null, curReq=null, started=false;
var joined=false, joinTick=0, joinTimer=null;
var wantJoin=false, netReady=false, netRoom=null;   /* step 10: the relays open while the name is typed; "Sit down" then only knocks */
/* getting back in (the CEO, 2026-10-16): a seat code from the TV's invite (typed, or ?seat= from the invite's QR) rides along in the join */
var seatCode=(params.get("seat")||"").replace(/\D/g,"").slice(0,4)||null, viewSeen=false, rjAgain=false;
/* seated: the invite's seat code leaves the address, so a reload goes straight back to the seat (not "Take my seat" again) */
function dropSeatParam(){ try{ if(!params.get("seat")) return; params.delete("seat"); var q=params.toString(); history.replaceState(history.state,"",location.pathname+(q?"?"+q:"")+location.hash); }catch(e){} }
/* a reloaded phone keeps its name (FOLLOWUPS party-phone-name-memory): the field shows the one remembered name of all the games (BGUI.names'
   key "bg_player_name"), and a phone that sat down in this room ("bgfs_seat": {room, name, at}; forgotten on Leave) goes straight back to its seat */
function nameGet(){ try{ return String(localStorage.getItem("bg_player_name")||"").replace(/[\u0000-\u001f\u007f<>]/g,"").replace(/\s+/g," ").trim().slice(0,12); }catch(e){ return ""; } }
function nameSet(v){ try{ if(v) localStorage.setItem("bg_player_name",v); }catch(e){} }
function seatMem(){ try{ var o=JSON.parse(localStorage.getItem("bgfs_seat")||"null"); return o&&o.room&&o.name&&Date.now()-(+o.at||0)<12*3600000?o:null; }catch(e){ return null; } }
function seatSave(){ try{ localStorage.setItem("bgfs_seat",JSON.stringify({room:room,name:myName,at:Date.now()})); }catch(e){} }
function seatForget(){ try{ localStorage.removeItem("bgfs_seat"); }catch(e){} }

function setConn(s){ connEl.textContent = s==="online"?"connected":(s==="connecting"?"connecting…":"reconnecting…"); connEl.setAttribute("data-state",s==="online"?"online":"wait"); }
function setRoom(t){ roomEl.textContent=t; }
function chrome(inRoom){   /* the top bar: Leave while seated, the home link otherwise */
  $("lvbtn").style.display= inRoom?"":"none"; $("homebtn").style.display= inRoom?"none":""; $("sethome").style.display= inRoom?"none":"";   /* seated: Leave (with its confirm) is the way out, so the room is told */
}

if(!room){ askRoom(); } else { setRoom("Room "+room); startJoin(); }

function askRoom(msg){
  main.className="big"; chrome(false);
  put((msg?'<p class="sub" role="status">'+esc(msg)+'</p>':'')+'<div class="join-card bg-card bg-spot"><h1 class="title">Enter room code</h1><p class="sub">The five letters on the TV.</p><input id="rc" maxlength="5" autocapitalize="characters" autocomplete="off" aria-label="Room code" placeholder="ABCDE"><button class="opt bg-btn bg-btn--primary bg-btn--cta bg-btn--block" id="go" type="button"><span class="bg-btn__label">Join</span><span class="bg-btn__sub">Then type your name</span></button></div>'+hubLink());
  var go=function(){ var v=($("rc").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,5); if(v.length===5){ room=v; setRoom("Room "+room); startJoin(); } else toast("The room code has 5 letters/numbers"); };
  $("go").onclick=go; $("rc").onkeydown=function(e){ if(e.key==="Enter") go(); };
}
function hubLink(){ return '<a href="../index.html" class="bg-btn bg-btn--ghost ph-link"><span data-icon="home" aria-hidden="true"></span>Back to all games</a>'; }
/* stop talking to this room (Leave, or the TV said we can't sit down) and forget the seat */
function stopNet(){
  if(joinTimer){ clearInterval(joinTimer); joinTimer=null; }
  var old=net; net=null; wantJoin=false; netReady=false; netRoom=null; if(old){ try{ old.close(); }catch(e){} }
  joined=false; started=false; curReq=null; overShown=false; lastSnap=null; myColor=null;
  try{ Rummy.Party.resetUI(); }catch(e){} try{ if(sc&&sc.ctrl) sc.ctrl.destroy(); }catch(e){} sc=null; main.style.justifyContent="";
  $("plbtn").style.display="none"; chrome(false); closeOv(); closeVictory(); connEl.textContent=""; connEl.removeAttribute("data-state"); setRoom("Room —");
  curGame=null; stageGame("party"); if(barName) barName.textContent="Party Mode";
}
function leaveRoom(){
  var r=room; seatForget(); seatCode=null;
  try{ if(net) net.send({t:"leave", pid:myPid}); }catch(e){}
  stopNet(); askRoom("You left room "+r+".");
}
function showNoJoin(o){
  var full=o.why==="full";
  main.className="big";
  put('<h1 class="title">'+(full?"This room is full":"This game has already started")+'</h1>'+
    '<p class="sub">'+(full?"All "+(o.max||"")+" seats are taken. Ask someone to leave, or join the next game.":"Wait for the host to start a new game on the TV, then scan the new QR code.")+'</p>'+
    '<div class="opts"><button class="opt bg-btn bg-btn--primary bg-btn--block" type="button" id="again">Try again</button><button class="opt ghost bg-btn bg-btn--secondary bg-btn--block" type="button" id="other">Enter another code</button></div>'+hubLink());
  $("again").onclick=function(){ setRoom("Room "+room); connect(); };
  $("other").onclick=function(){ askRoom(); };
}
/* getting back in: the game started without this phone (it left, was let go, or is new): ask the host for an invite and type its seat code here.
   The relays stay open, so the host's "Let them back in" on the TV seats this phone too */
function showRejoin(o){
  main.className="big"; chrome(false);
  var again=rjAgain; rjAgain=false;   // "Ask the host again" was pressed: an answer with nothing to ask about says so
  var msg=o.bumped?"Another phone has your seat now. To come back, ask the host for an invite.":o.declined&&o.soon?"The host just said not now. Ask again in a few seconds, or ask them for an invite code.":o.declined&&o.noanswer?"Nobody answered on the TV. Ask again, or ask the host for an invite code.":o.declined?"The host said not now. Ask them for an invite code.":o.bad==="expired"?"That invite ran out. Ask the host for a new seat code.":o.bad==="taken"?"That seat is taken now. Ask the host for another invite.":o.bad==="cancel"?"The host cancelled that invite. Ask them for a new seat code.":o.bad==="new"?"That code was replaced by a newer one. Type the seat code the TV shows now.":o.bad==="wrong"?"That seat code is not right. Check the 4 numbers on the TV.":o.bad==="wait"?"Too many tries. Wait half a minute, then type the code again.":o.asked?"The TV is asking the host to let you back in…":again?"No seat is open for "+(myName||"you")+" right now. Ask the host for an invite code.":"";
  var okMsg=o.asked&&!o.bad&&!o.declined&&!o.bumped;
  put('<div class="join-card bg-card bg-spot"><h1 class="title">The game has started</h1><p class="sub">Ask the host to invite you back: on the TV, Menu, then Invite a player back. Then type the seat code here.</p>'+
    (msg?'<p class="ph-rjmsg'+(okMsg?"":" is-warn")+'" role="status">'+esc(msg)+'</p>':'')+
    '<input id="sc" maxlength="4" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Seat code" placeholder="Seat code">'+
    '<button class="opt bg-btn bg-btn--primary bg-btn--cta bg-btn--block" id="scgo" type="button"><span class="bg-btn__label">Take my seat</span><span class="bg-btn__sub">Room '+esc(room)+(myName?' · '+esc(myName):'')+'</span></button>'+
    (o.declined||o.bumped?'<button class="opt ghost bg-btn bg-btn--secondary bg-btn--block" type="button" id="rjask">Ask the host again</button>':'')+
    '<button class="opt ghost bg-btn bg-btn--secondary bg-btn--block" type="button" id="other">Enter another room code</button></div>'+hubLink());
  var go=function(){ var v=($("sc").value||"").replace(/\D/g,"").slice(0,4); if(v.length!==4){ toast("The seat code has 4 numbers"); $("sc").focus(); return; } seatCode=v; if(!myName) myName=nameGet()||"Player"; connect(); };
  $("scgo").onclick=go; $("sc").onkeydown=function(e){ if(e.key==="Enter") go(); };
  var ak=$("rjask"); if(ak) ak.onclick=function(){ seatCode=null; rjAgain=true; if(!myName) myName=nameGet()||"Player"; connect(); };
  $("other").onclick=function(){ seatCode=null; stopNet(); askRoom(); };
}
function startJoin(){ var m=seatMem(); if(m&&m.room===room&&!seatCode){ myName=m.name; connect(); return; } askName(); }   // reloaded in its room: back to its seat
function askName(){
  main.className="big"; chrome(false);
  put('<div class="join-card bg-card bg-spot"><h1 class="title">Type your name</h1><p class="sub">Room '+esc(room)+(seatCode?' · seat code '+esc(seatCode):'')+'</p><input id="nm" maxlength="12" placeholder="Your name" aria-label="Your name" autocomplete="off" autocapitalize="words" value="'+esc(nameGet())+'"><button class="opt bg-btn bg-btn--primary bg-btn--cta bg-btn--block" id="go" type="button"><span class="bg-btn__label">'+(seatCode?"Take my seat":"Sit down")+'</span><span class="bg-btn__sub">Room '+esc(room)+'</span></button></div>');
  var go=function(){ var v=($("nm").value||"").trim().slice(0,12); if(!v){ toast("Type your name first"); $("nm").focus(); return; } myName=v; nameSet(v); connect(); };
  $("go").onclick=go; $("nm").onkeydown=function(e){ if(e.key==="Enter") go(); };
  $("nm").focus();
  setTimeout(function(){ if(room&&!wantJoin&&$("nm")) openNet(); },60);   // the relays connect while the name is typed (nothing is sent, nothing shown, until "Sit down"); after the form is drawn
}
/* one relay connection per room. Before "Sit down" it only listens to nothing: messages reach the screen once we asked to join */
function openNet(){
  if(net&&netRoom===room) return;
  if(net){ try{ net.close(); }catch(e){} }
  netReady=false; netRoom=room;
  var self=null;
  self=net=BGNet.connect(room,"ctrl",{
    status:setConn,
    ready:function(){ if(net!==self) return; netReady=true; if(wantJoin) knock(); },
    up:function(){ if(net===self&&wantJoin&&!joined&&joinTimer) sendJoin(); },   // a relay just came up: knock on it right away
    msg:function(o){ if(self&&net===self&&wantJoin) onMsg(o); }   // a closed connection (Leave / new room) can't change the screen any more
  });
}
function knock(){
  if(joinTimer){ clearInterval(joinTimer); joinTimer=null; }
  sendJoin();
  // keep knocking every 2s until the TV confirms we are seated, then just a keep-alive every 8s
  joinTimer=setInterval(function(){
    joinTick++;
    if(!joined || joinTick%4===0) sendJoin();
    if(!joined && joinTick===5) showWaiting("Still connecting… make sure the TV is on the lobby screen for room "+room+".", true);
  },2000);
}
function connect(){
  joined=false; joinTick=0; viewSeen=false; if(joinTimer){ clearInterval(joinTimer); joinTimer=null; }
  showWaiting(netReady&&net&&netRoom===room?"Joining room "+room+"…":"Connecting to the TV…", true);
  openNet(); wantJoin=true;
  if(netReady) knock();   // already connected while the name was typed: knock now (otherwise the relay's ready does)
}
function sendJoin(){ net && net.send(seatCode&&!joined?{t:"join", pid:myPid, name:myName, code:seatCode}:{t:"join", pid:myPid, name:myName}); }
/* step 10: instant feedback on the phone. The control the player pressed dims the moment its choice goes to the TV
   (the TV's answer redraws or clears it); presentation only, the message and the flow are unchanged */
var lastPress=null;
main.addEventListener("pointerdown",function(e){ lastPress=e.target&&e.target.closest?e.target.closest("button,[data-a],.uc,.pc,[data-i]"):null; },true);
main.addEventListener("keydown",function(e){ if(e.key==="Enter"||e.key===" ") lastPress=e.target&&e.target.closest?e.target.closest("button,[data-a],.uc,.pc,[data-i]"):null; },true);
function sentFx(){ var el=lastPress; lastPress=null; if(el&&el.isConnected&&main.contains(el)&&el.classList) el.classList.add("ph-sent"); }
function unSent(){ Array.prototype.forEach.call(main.querySelectorAll(".ph-sent"),function(el){ el.classList.remove("ph-sent"); }); }

var overShown=false;   // the "X wins!" screen stays until the host is back in the lobby (a keep-alive re-join must not replace it)
function onMsg0(o){
  if(o.game) stageGame(o.game);
  if(o.pid===myPid&&/^(ask|rvs|rks|ups|pgs|scs|wait|first)$/.test(o.t)) viewSeen=true;   // this phone has a game screen from the TV
  if(o.t==="nojoin" && o.pid===myPid){ if(!joined){ if(o.rejoin){ if(joinTimer){ clearInterval(joinTimer); joinTimer=null; } seatCode=null; showRejoin(o); } else { var r=room; stopNet(); room=r; seatForget(); showNoJoin(o); } } else if(o.rejoin&&started){ var rn=room; seatForget(); stopNet(); room=rn; setRoom("Room "+room); showRejoin({bumped:1}); } }   // a started game: the seat code / the host's answer (the relays stay open)
  else if(o.t==="bumped" && o.pid===myPid){ var rb=room; seatForget(); stopNet(); room=rb; setRoom("Room "+room); showRejoin({bumped:1}); }   // another phone took this seat by invite
  else if(o.t==="you" && o.pid===myPid){ var first=!joined; chrome(true); myColor=o.color; if(o.name) myName=o.name; joined=true; seatCode=null; if(first){ seatSave(); dropSeatParam(); } if(o.started) started=true;
    if(first&&o.started&&!isAsking()&&!overShown&&!viewSeen) showWaiting("You’re back in the game. Waiting for the TV…", false);   // reloaded / let back in: its game, never the lobby (FOLLOWUPS party-reload-lobby-screen)
    if(!joinTimer&&wantJoin) knock();   // seated by the host after a request: the keep-alive starts again
    if(!started && !isAsking() && !overShown) showLobby({players:[{pid:myPid,name:myName,color:myColor}]}); }
  else if(o.t==="lobby"){ if(overShown) closeVictory(); overShown=false; if(!started && !isAsking()) showLobby(o); }   // never fall back to lobby once the game is on
  else if(o.t==="ask" && o.pid===myPid){ started=true; if(KIND_GAME[o.kind]) stageGame(KIND_GAME[o.kind]); showAsk(o); }
  else if(o.t==="rvs" && o.pid===myPid){ started=true; curReq=null; stageGame("rummy500"); rvShow(o.st,false,null); }
  else if(o.t==="rks" && o.pid===myPid){ started=true; curReq=null; stageGame("risk"); rkShow(o.st,false,null); }
  else if(o.t==="ups" && o.pid===myPid){ started=true; curReq=null; stageGame("uno"); unShow(o.st,false,null); }
  else if(o.t==="pgs" && o.pid===myPid){ started=true; pgShow(o.st,null); }   // a plugin game's state for this phone
  else if(o.t==="scs" && o.pid===myPid){ started=true; curReq=null; stageGame("scatter"); scShow(o.st,false,null); }
  else if(o.t==="scdl" && o.pid===myPid){ if(sc&&sc.ctrl) sc.ctrl.setDeadlineIn(o.sec); toast("STOP! "+o.sec+" seconds left"); }
  else if(o.t==="snap"){ lastSnap=o; $("plbtn").style.display=""; if($("ov").classList.contains("on") && ovMode==="players") showPlayers(); }
  else if(o.t==="wait" && (o.pid===myPid || o.pid==="*")){ pgAsk=null; if(o.pid==="*"){ Rummy.Party.resetUI(); firstBar(null); pgReset(); } curReq=null; started=(o.pid!=="*"); if(o.pid==="*"){ lastSnap=null; $("plbtn").style.display="none"; closeOv(); } showWaiting(o.msg||"Waiting…", false, o.turn, o.card); }
  else if(o.t==="started"){ started=true; if(!isAsking()) showWaiting("Game starting…", false); }
  else if(o.t==="over"){ firstBar(null); started=false; curReq=null; Rummy.Party.resetUI(); pgReset(); showOver(o); overShown=true; }
  else if(o.t==="info" && (o.pid===myPid||!o.pid)){ toast(o.msg); }
  else if(o.t==="first" && (!o.to || o.to===myPid)){ showFirst(o); }
  if(lastFirst&&o.t!=="first"&&(isAsking()||ownView())) firstAsking();   // the banner stops saying "Watch the TV." once this phone has its own turn
}
function isAsking(){ return !!curReq; }
/* ---------- Party game plugins (games/registry.js; games/README.md): a plugin game's phone side, loaded when its room is joined ----------
   Messages of a plugin game wait in a queue (in order) while its files load. Its phone side, PartyGames.definePhone(id, {show, reset}),
   draws this phone's view: show(st, ask, api) for the TV's snapshots ("pgs") and its turn asks (kind = the game id). Without a phone side
   the generic option buttons answer the TV's asks. */
var pgReady={}, pgQ=null, pgAsk=null;
function pgEntry(g){ var P=window.PartyGames; return (g&&P&&P.get&&P.get(g))||null; }
function pgPhone(g){ var P=window.PartyGames; return (pgEntry(g)&&P.phone(g))||null; }
function gameName(g){ return GNAME[g]||(pgEntry(g)||{}).title||""; }
function onMsg(o){
  if(pgQ){ pgQ.push(o); return; }
  if(o&&o.game&&pgEntry(o.game)&&!pgReady[o.game]){ pgQ=[o]; pgLoad(o.game); return; }
  onMsg0(o);
}
function pgLoad(g){
  var fin=function(){ pgReady[g]=true; try{ window.PartyGames.palette(g,COL,null,SEATNO); }catch(e){} var q=pgQ||[]; pgQ=null; q.forEach(function(m){ onMsg(m); }); };
  window.PartyGames.load(g,"phone").then(fin,function(err){ try{ console.warn(err); }catch(e){} toast("This game's controls didn't load. The basic buttons still work."); fin(); });
}
function pgApi(g,ask){ return {
  main:main, game:g, pid:myPid, color:function(){ return myColor; }, name:function(){ return myName; }, asking:function(){ return !!pgAsk; }, ask:ask||pgAsk,
  put:put, toast:toast, esc:esc, clean:clean, BG:BG, paintIcons:paintIcons, optHTML:optHTML, afkHTML:afkHTML, focusFirst:focusFirst, waiting:showWaiting,
  seat:function(c){ return sn(c||myColor); }, hex:function(c){ return COL[c||myColor]||"#888888"; },
  /* answer the TV's turn ask: id + data (the TV's H.turn resolves {id, data}); false when this phone has no ask open */
  act:function(id,data){ if(!pgAsk||!net){ toast("Wait for your turn…"); return false; } var a=pgAsk; pgAsk=null; net.send({t:"pick",pid:myPid,reqId:a.reqId,id:id,i:0,data:data}); sentFx(); return true; },
  view:function(data){ if(net) net.send({t:"view",pid:myPid,pg:data}); },        // anything else for the TV (H.onView)
  take:function(){ if(net) net.send({t:"view",pid:myPid,take:1}); }               // "Take over" after the computer played for an away phone
}; }
function pgShow(st,ask){
  var g=curGame, d=pgPhone(g); if(ask) pgAsk=ask;
  window.__pgV=st;
  if(!d||!d.show) return;   // no phone side: only the generic asks (option buttons) reach this phone
  unSent();
  try{ d.show(st,ask||null,pgApi(g,ask)); }catch(e){ try{ console.warn(e); }catch(x){} }
}
function pgReset(){ pgAsk=null; var d=pgPhone(curGame); if(d&&d.reset){ try{ d.reset(pgApi(curGame,null)); }catch(e){} } }

function showLobby(o){
  var me=(o.players||[]).filter(function(p){return p.pid===myPid;})[0];
  if(!me) return;            // only confirm once the TV has actually seated us
  joined=true; main.className="big"; chrome(true);
  var n=sn(me.color);
  var list=(o.players||[]).map(function(p){ return '<span class="bg-chip" data-seat="'+sn(p.color)+'"><span class="bg-chip__dot"></span>'+esc(p.name)+(p.pid===myPid?" (you)":"")+'</span>'; }).join("");
  put('<span class="bg-token mytoken" data-seat="'+n+'" aria-hidden="true">'+esc((myName||"?").trim().charAt(0).toUpperCase())+'</span><h1 class="title">You’re in!</h1><p class="sub"><b class="seatword" data-seat="'+n+'">'+esc(myName)+(me&&me.color?(" — "+me.color.toUpperCase()):"")+'</b></p>'+
    '<div class="seatrow">'+list+'</div>'+colPickHTML(o,me)+
    '<p class="sub ph-status" role="status"><span data-icon="hourglass" aria-hidden="true"></span> Waiting for the host to start on the TV…</p>');
}
/* step 10 colour pick (Trouble, Sorry!): the TV's lobby lists the game's colours; a colour another phone holds is greyed out */
var CNAMES={red:"Red",blue:"Blue",green:"Green",yellow:"Yellow"};
function colPickHTML(o,me){
  if(!o.colors||!o.colors.length||!me) return "";
  var held={}; (o.players||[]).forEach(function(p){ if(p.pid!==myPid) held[p.color]=p.name; });
  return '<div class="ph-colpick" role="group" aria-label="Your colour"><span class="bg-eyebrow" data-stage-text>Your colour</span><div class="ph-cols">'+o.colors.map(function(c){
    var mine=me.color===c, by=held[c];
    return '<button type="button" class="bg-btn bg-btn--secondary ph-col" data-col="'+esc(c)+'" aria-pressed="'+mine+'"'+(by?' disabled':'')+'><span class="ph-cdot" style="background:'+(by?"#6b6f80":(COL[c]||"#777"))+'" aria-hidden="true"></span><span>'+esc(CNAMES[c]||c)+(by?'<small>'+esc(by)+'</small>':mine?'<small>You</small>':'')+'</span></button>';
  }).join("")+'</div></div>';
}
main.addEventListener("click",function(e){
  var b=e.target.closest&&e.target.closest(".ph-col[data-col]"); if(!b||b.disabled||started) return;
  if(b.getAttribute("aria-pressed")==="true") return;
  try{ net&&net.send({t:"color",pid:myPid,color:b.getAttribute("data-col")}); }catch(err){}

  var af=$("unAfk"); if(af){ if(st.afk){ af.innerHTML=afkHTML("unTake"); $("unTake").onclick=function(){ if(net) net.send({t:"view",pid:myPid,take:1}); }; } else af.innerHTML=""; }
}
/* the map's pulsing marks, one finite 1.1 s beat at a time from the effects ticker (a MutationObserver on one stage motif, as the Risk page does): no endless CSS animation */
var PULSE={mo:null,m:null,at:0,b:0};
function pulseTick(){
  var bd=$("rkboard"); if(!bd||!bd.querySelector(".rkpulsel circle, .rkpulse")) return;
  var t=performance.now(); if(t-PULSE.at<1080) return;
  PULSE.at=t; PULSE.b=PULSE.b===1?2:1;
  bd.classList.remove(PULSE.b===1?"is-b2":"is-b1"); bd.classList.add(PULSE.b===1?"is-b1":"is-b2");
}
function pulseWatch(){
  var m=document.querySelector(".bg-ambient .bg-motifs > b");
  if(!m||!window.MutationObserver||(PULSE.m===m&&m.isConnected)) return;
  if(PULSE.mo) PULSE.mo.disconnect();
  PULSE.m=m; PULSE.mo=new MutationObserver(pulseTick); PULSE.mo.observe(m,{attributes:true,attributeFilter:["style"]});
}
var rk=null, rkAsk=null;
function rkSend(a){
  if(!rkAsk||!net){ toast("Wait for your turn…"); return {ok:false,msg:"Wait for your turn."}; }
  var ask=rkAsk; rkAsk=null;
  net.send({t:"pick",pid:myPid,reqId:ask.reqId,id:"act",i:0,data:a}); sentFx();
  return undefined;
}
function rkShow(st,active,ask){
  rkAsk=active?ask:null; unSent();
  if(!rk||!main.contains(rk.el)){
    if(rk&&rk.ctrl) rk.ctrl.destroy();
    main.className="big scroll"; main.style.justifyContent="flex-start";
    main.innerHTML='<div class="rkph" style="width:100%;max-width:680px"><div id="rkAfk"></div><div id="rkB"><div id="rkframe"><div id="rkboard"></div></div></div><div id="rkP"></div></div>';
    document.documentElement.classList.add("rk-luxe"); pulseWatch(); document.addEventListener("bgui:stage",pulseWatch);
    var board=Risk.Board.create($("rkboard"),{labels:"auto",pulseLayer:true});
    var ctrl=Risk.Ctrl.create({root:$("rkP"),board:board,toast:toast,send:rkSend,blitzDelay:450,luxe:true,tv:function(){ return false; },seatOf:function(i){ var P=(window.__rkV&&window.__rkV.players)||[], p=P[i]; if(!p) return 1; return p.neutral?10:([1,2,3,4,9,8][(p.ci==null?i:p.ci)%6]||1); }});
    rk={el:main.firstChild,board:board,ctrl:ctrl};
  }
  rk.board.setView(Risk.Ctrl.boardView(st)); window.__rkV=st; rk.ctrl.update(st); window.__rk=rk;
  var af=$("rkAfk"); if(af){ if(st.afk){ af.innerHTML=afkHTML("rkTake"); $("rkTake").onclick=function(){ if(net) net.send({t:"view",pid:myPid,take:1}); }; } else af.innerHTML=""; }
}
/* the winner screen: the Victory screen (BGUI.win + celebrate, real numbers from the host) over a quiet "X wins" card that stays until the host sends "lobby" */
var winEl=null;
function closeVictory(){ var B=BG(); if(winEl){ try{ if(B&&B.win&&B.win.isOpen()) B.win.close(winEl); }catch(e){} if(winEl.parentNode) winEl.parentNode.removeChild(winEl); } winEl=null; }
function fmtTime(ms){ var m=Math.floor(ms/60000), s=Math.floor(ms/1000)%60; return m+":"+(s<10?"0":"")+s; }
function standHTML(rows){ if(!Array.isArray(rows)||!rows.length) return "";
  return '<ol class="ph-stand" aria-label="Standings">'+rows.slice(0,16).map(function(r,i){ return '<li><span class="ph-stand__n">'+(i+1)+'</span><span class="dotc" style="background:'+esc(r.color||"#888").replace(/"/g,"")+'" aria-hidden="true"></span><span class="ph-stand__nm">'+esc(r.name)+'</span><span class="ph-stand__v">'+esc(r.v)+'</span></li>'; }).join("")+'</ol>'; }
function showOver(o){
  var win=o.winner||"", team=/ & /.test(win), B=BG();
  main.className="big"; closeVictory();
  var st=standHTML(o.standings);   // review step 10: the standings, the winner on top (sent by the TV)
  put('<div class="ph-wait" aria-hidden="true" data-icon="trophy"></div><h1 class="title">'+esc(win)+(team?' win!':' wins!')+'</h1>'+st+'<p class="sub">Thanks for playing. The host can start a new game.</p>');
  if(!B||!B.win) return;
  var stats='';
  if(o.n) stats+='<li class="bg-stat"><b>'+(+o.n)+'</b><span>players</span></li>';
  if(o.ms>0) stats+='<li class="bg-stat"><b>'+fmtTime(+o.ms)+'</b><span>time</span></li>';
  winEl=document.createElement("div"); winEl.className="bg-win"; winEl.id="winph"; winEl.setAttribute("aria-labelledby","winTitle");
  winEl.innerHTML='<div class="bg-win__scrim"></div><div class="bg-win__rays"></div><div class="bg-win__card"><div class="bg-win__medal"></div><p class="bg-eyebrow">Game over'+(gameName(curGame)?' · '+esc(gameName(curGame)):'')+'</p><h2 class="bg-win__title" id="winTitle">Victory</h2>'+
    '<p class="bg-win__sub"><b>'+esc(win)+'</b> '+(team?"win":"wins")+' the game.</p>'+st+(stats?'<ul class="bg-stats bg-win__stats">'+stats+'</ul>':'')+
    '<div class="bg-win__actions"><button class="bg-btn bg-btn--primary bg-btn--lg" type="button" id="winOk">Continue</button></div></div>';
  document.body.appendChild(winEl);
  $("winOk").onclick=function(){ B.win.close(winEl); };
  B.win.open(winEl,{focus:"#winOk"}); if(B.celebrate) B.celebrate();
}
document.addEventListener("DOMContentLoaded",function(){ paintIcons(document); });
})();
</script>
