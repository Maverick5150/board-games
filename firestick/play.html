<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}
  body.bg-app{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;touch-action:manipulation;overflow-x:hidden;}
  [hidden]{display:none !important;}
  .bg-topbar__title .bg-eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bg-topbar__name{line-height:1.25;}
  #conn{margin:.15rem auto 0;min-height:1.25rem;padding:.05rem .5rem;font-size:var(--fs-micro);}
  #conn:empty{display:none;}
  #conn[data-state="online"]{color:var(--tag-ok-ink);background:var(--tag-ok-bg);box-shadow:inset 0 0 0 1px rgba(79,214,156,.45);}
  .bg-topbar__title{display:grid;justify-items:center;}
  #main{flex:1 0 auto;width:100%;max-width:34rem;margin:0 auto;}
  .big{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.875rem;padding:1rem var(--gutter) calc(env(safe-area-inset-bottom,0px) + 1.5rem);}
  .big.scroll{justify-content:flex-start;padding-top:.75rem;}
  #main > .title, .join-card .title, .ph-sheet-body .title{margin:0;font:400 var(--fs-2xl)/1.15 var(--font-display);color:var(--text-1);}
  #main > .sub, .join-card .sub, .ph-sheet-body .sub{margin:0;font:var(--fw-body) var(--fs-md)/1.4 var(--font-ui);color:var(--text-2);max-width:28rem;}
  #main > .sub[data-seat]{color:var(--seat-text);}
  .sub .dotc{margin-right:.35rem;}
  .dotc{width:.75rem;height:.75rem;border-radius:50%;display:inline-block;margin-right:.35rem;vertical-align:-.05em;box-shadow:0 0 0 2px rgba(255,255,255,.2);}
  .opts{display:grid;gap:.75rem;width:100%;max-width:28rem;margin-top:.375rem;padding:var(--focus-room);margin-inline:calc(-1 * var(--focus-room));width:calc(100% + 2 * var(--focus-room));}
  button.opt{margin:0;white-space:normal;min-height:3.5rem;}
  button.opt.sm{min-height:var(--tap);}
  .opt--seat{color:var(--seat-ink);background:var(--seat);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 22px -12px var(--seat);}
  .seatword{color:var(--seat-text);}
  .ph-status{display:inline-flex;align-items:center;gap:.5rem;}
  .ph-status .bg-ico{width:1.25rem;height:1.25rem;color:var(--gold-100);}
  .ph-hint{font-size:var(--fs-sm);}
  .prow2 .pname{flex:1;min-width:0;}
  .prow2 .bg-ico-slot{display:grid;place-items:center;color:var(--gold-200);}
  .prow2 .bg-ico-slot .bg-ico{width:1.1rem;height:1.1rem;}
  .trow .tname{flex:1;min-width:0;}
  .pcard__head{display:flex;justify-content:space-between;align-items:center;gap:.5rem;}
  .pcard__who{display:inline-flex;align-items:center;gap:.4rem;font:var(--fw-ui-strong) var(--fs-md)/1.2 var(--font-ui);}
  .pcard__who .dotc{background:var(--seat);margin:0;}
  .pcard__cash{color:var(--tag-ok-ink);font:var(--fw-caps) var(--fs-md)/1 var(--font-ui);}
  .pcard__meta{margin-top:.15rem;font:var(--fw-ui) var(--fs-sm)/1.3 var(--font-ui);color:var(--text-2);}
  .ph-toast{position:fixed;left:50%;bottom:1rem;transform:translateX(-50%);z-index:90;padding:.6rem 1rem;border-radius:var(--r-lg);background:var(--ink-3);color:var(--text-1);font:var(--fw-ui-strong) var(--fs-sm)/1.3 var(--font-ui);box-shadow:var(--panel-edge);}
  .join-card{display:grid;gap:.875rem;width:100%;max-width:26rem;padding:1.25rem;text-align:center;justify-items:center;}
  .join-card input{width:100%;min-height:3.25rem;padding:.75rem 1rem;border:0;border-radius:var(--r-md);background:var(--ink-2);color:var(--text-1);box-shadow:var(--well-edge);font:var(--fw-ui-strong) var(--fs-lg)/1.2 var(--font-ui);text-align:center;}
  .join-card input::placeholder{color:var(--text-3);}
  .join-card input:focus{outline:none;box-shadow:var(--focus-ring);}
  #rc{letter-spacing:.35em;text-transform:uppercase;}
  .pill{display:inline-flex;align-items:center;gap:.4rem;margin:0;font:var(--fw-ui-strong) var(--fs-sm)/1.2 var(--font-ui);}
  .ph-wait{display:grid;place-items:center;width:4.5rem;height:4.5rem;border-radius:50%;background:var(--ink-3);box-shadow:inset 0 0 0 1.5px var(--line-gold),0 10px 26px -12px rgba(231,202,144,.5);color:var(--gold-100);}
  .ph-wait .bg-ico{width:2rem;height:2rem;}
  .ph-wait.is-beat .bg-ico{animation:ph-flip 1.1s var(--ease-out) 1 both;}
  @keyframes ph-flip{from{transform:rotate(0)}to{transform:rotate(180deg)}}
  html[data-effects="reduced"] .ph-wait.is-beat .bg-ico{animation:none;}
  .seatrow{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem;max-width:26rem;}
  .mytoken{width:4.5rem;height:4.5rem;font-size:var(--fs-2xl);}
  .prow2{display:flex;align-items:center;gap:.625rem;width:100%;max-width:26rem;min-height:var(--tap);padding:.75rem .875rem;border:0;border-radius:var(--r-md);background:var(--panel-fill);box-shadow:var(--panel-edge);color:var(--text-1);font:var(--fw-ui-strong) var(--fs-md)/1.25 var(--font-ui);text-align:left;cursor:pointer;margin:0;}
  .prow2 .chip{width:1rem;height:1rem;border-radius:.25rem;flex:0 0 auto;box-shadow:0 0 0 1px rgba(255,255,255,.35);}
  .prow2 small{color:var(--text-2);font-weight:var(--fw-ui);margin-left:auto;font-size:var(--fs-micro);}
  .scard{width:13rem;min-height:18rem;background:#fff;border:.75rem solid #c62222;border-radius:1.25rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;padding:.6rem;color:#222;text-align:center;}
  .scard.sback{border-color:#fff;color:#fff;}
  .sbigb{font:400 var(--fs-3xl)/1 var(--font-display);text-shadow:0 2px 6px #0006;}
  .swho,.swho2{font:var(--fw-ui-strong) var(--fs-sm)/1.2 var(--font-ui);opacity:.9;}
  .sbig{font-family:var(--font-display);font-weight:400;line-height:1;}
  .stxt{font:var(--fw-ui-strong) var(--fs-sm)/1.25 var(--font-ui);}
  .sec{width:100%;max-width:26rem;text-align:left;margin-top:.5rem;}
  .sec h3{margin:.4rem 0 .3rem;font:var(--fw-caps) var(--fs-micro)/1.2 var(--font-ui);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--gold-200);}
  .trow{display:flex;align-items:center;gap:.625rem;min-height:var(--tap);padding:.5rem .625rem;border-radius:var(--r-sm);background:var(--ink-2);box-shadow:var(--well-edge);margin:.25rem 0;font:var(--fw-ui) var(--fs-sm)/1.3 var(--font-ui);}
  .trow input[type=checkbox]{width:1.5rem;height:1.5rem;accent-color:#e7ca90;}
  .trow small{color:var(--text-2);font-size:var(--fs-sm);}
  .trow button[data-v]{min-height:var(--tap);min-width:var(--tap);border:0;border-radius:var(--r-sm);background:var(--control-fill);box-shadow:inset 0 0 0 1px var(--line-2);color:var(--text-1);font:var(--fw-ui-strong) var(--fs-sm)/1 var(--font-ui);padding:0 .75rem;}
  .numin{width:7rem;min-height:var(--tap);padding:.5rem;border:0;border-radius:var(--r-sm);background:var(--ink-1);color:var(--text-1);box-shadow:var(--well-edge);font:var(--fw-ui-strong) var(--fs-md)/1 var(--font-ui);text-align:center;}
  .pcard{width:100%;max-width:26rem;padding:.75rem .875rem;text-align:left;}
  .pchips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.5rem;}
  .pchip{display:inline-flex;align-items:center;gap:.35rem;min-height:var(--tap);font:var(--fw-ui) var(--fs-micro)/1.2 var(--font-ui);background:var(--ink-2);box-shadow:var(--well-edge);border-radius:var(--r-sm);padding:.25rem .6rem;cursor:pointer;color:var(--text-1);}
  .pchip .chip{width:.75rem;height:.75rem;border-radius:.2rem;box-shadow:0 0 0 1px rgba(255,255,255,.35);}
  .afk{width:100%;margin:.25rem 0;padding:.625rem .75rem;border-radius:var(--r-md);background:#3a1218;box-shadow:inset 0 0 0 1px rgba(255,107,125,.5);color:var(--text-1);text-align:center;font:var(--fw-ui-strong) var(--fs-sm)/1.3 var(--font-ui);display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;justify-content:center;}
  .ph-sheet-body{display:grid;gap:.75rem;justify-items:stretch;text-align:left;padding:var(--focus-room);margin:calc(-1 * var(--focus-room));}
  .ph-sheet-body .title{font-size:var(--fs-xl);}
  #deedv{display:grid;justify-items:center;gap:.5rem;}
  .ph-effects{margin-top:.25rem;}
  .ph-link{display:inline-flex;}
</style>
<style id="rkLuxCss">
/* the Risk phone in Midnight Luxe: the same panel, sheet and map-card rules the single-device page uses (risk/index.html, in game), so the Party phone looks the same. Text-align: the page default here is centred */
.scph,.unph,.rkph{text-align:left}
  /* ---------- in game: the stage with the framed world map ---------- */
  .rk-game{display:flex; flex-direction:column; align-items:center; padding:0 var(--gutter) 1.25rem}
  
  #legend{width:min(100%,56rem); padding:.875rem 0 .5rem}
  #legend .bg-token{font-size:var(--fs-micro)}
  .rk-m{display:inline-flex; align-items:center; gap:.2rem; margin-right:.55rem}
  .rk-m:last-child{margin-right:0}
  .rk-m .bg-ico{width:.95em; height:.95em; color:var(--gold-200)}
  .rk-m b{font-weight:var(--fw-ui-strong); color:inherit}
  #rkframe{position:relative; width:min(100%,56rem); margin:.5rem 0 .375rem; border-radius:16px}
  #rkboard{border-radius:12px}
  /* the map's pulsing marks (the territory to attack from, the targets, the empty territories): the same rings and the same 1.1 s pulse
     (opacity 1 to .35 and back), drawn on ONE overlay under the pieces (board.js pulseLayer) that pulses as a whole on its own layer, so
     a beat never repaints the map (an opacity beat on the compositor). One finite beat at a time from the ONE effects ticker (pulseTick):
     the page runs no endless CSS animation (README section 6); still and lit under Reduce effects and reduced motion. Without ui.js the
     board's own CSS pulse runs in each territory, as before */
  html.rk-luxe .rkpulse{animation:none}
  html.rk-luxe .rkpulsel{will-change:opacity}
  html.rk-luxe #rkboard.is-b1 .rkpulsel{animation:rk-b1 1.1s ease-in-out 1}
  html.rk-luxe #rkboard.is-b2 .rkpulsel{animation:rk-b2 1.1s ease-in-out 1}
  @keyframes rk-b1{50%{opacity:.35}}
  @keyframes rk-b2{50%{opacity:.35}}
  html[data-effects="reduced"] .rkflash, html[data-effects="reduced"] .rkfl, html[data-motion="reduce"] .rkflash, html[data-motion="reduce"] .rkfl{animation:none !important}
  html[data-effects="reduced"] .rkpulse, html[data-motion="reduce"] .rkpulse, html[data-effects="reduced"] .rkpulsel, html[data-motion="reduce"] .rkpulsel{animation:none !important}
  @media (prefers-reduced-motion: reduce){ .rkpulse, .rkpulsel, .rkflash, .rkfl{animation:none !important} }
  /* a territory's name, owner and borders on a tap (or under the D-pad on TV) */
  html.rk-luxe .rkinfo{left:.5rem; bottom:.5rem; max-width:min(80%,32rem); padding:.45rem .7rem; border:0; border-radius:var(--r-md); z-index:6;
    background:rgba(11,13,27,.94); box-shadow:inset 0 0 0 1px var(--line-gold), var(--elev-2); font:var(--fw-ui) var(--fs-xs)/1.35 var(--font-ui); color:var(--text-1)}
  html[data-tv] .rkinfo{left:0; right:0; top:calc(100% + .5rem); bottom:auto; max-width:none; padding:.5rem 1rem; overflow:hidden}
  html[data-tv] .rkinfo b{float:left; margin-right:1.5rem; white-space:nowrap}
  html[data-tv] .rkinfo span{overflow:hidden}   /* a long border list wraps in its own column, never under the name (review, step 5) */
  html.rk-luxe .rkinfo b{display:block; font:400 calc(var(--fs-lg) * 1.22)/1.15 var(--font-display); color:var(--gold-100)}
  html.rk-luxe .rkinfo span{display:block; color:var(--text-2)}
  /* the phone (review, step 5): a compact card across the frame, on the edge away from the territory it names (ctrl.js sets .is-top), clear
     of the Zoom / Fit button in the frame's corner; the name and its continent / owner on one line, its borders under them */
  html.rk-luxe:not([data-tv]) .rkinfo{left:3.75rem; right:.5rem; top:auto; bottom:.5rem; max-width:none; padding:.375rem .7rem .45rem}
  html.rk-luxe:not([data-tv]) .rkinfo.is-top{left:.5rem; top:.5rem; bottom:auto}
  html.rk-luxe:not([data-tv]) .rkinfo b{display:inline; font-size:var(--fs-lg); margin-right:.45rem}
  html.rk-luxe:not([data-tv]) .rkinfo b + span{display:inline}
  .tg{outline:none}
  /* the panel under the map (ctrl.js in its Luxe mode) */
  .rk-panel{display:grid; gap:.5rem; width:min(100%,56rem)}
  .rk-stat{display:flex; align-items:center; gap:.625rem; min-height:calc(1.35em + 1.25rem); padding:.625rem .875rem; border-radius:var(--r-lg);
    background:var(--panel-fill); box-shadow:var(--panel-edge), var(--elev-2); font:var(--fw-ui) var(--fs-md)/1.35 var(--font-ui); color:var(--text-1)}
  .rk-stat[data-seat]{box-shadow:var(--panel-edge), inset 0 0 0 1.5px var(--seat-ring), var(--elev-2)}
  .rk-stat b{font-weight:var(--fw-ui-strong)}
  .rk-stat > .bg-ico{flex:none; width:1.3rem; height:1.3rem; color:var(--gold-200)}
  .rk-dot{flex:none; width:.75rem; height:.75rem; border-radius:50%; background:var(--seat); box-shadow:0 0 0 2px var(--ink-1), 0 0 0 3px rgba(255,255,255,.18)}
  .rk-dice{padding:.5rem .75rem .6rem; border-radius:var(--r-lg); background:var(--ink-2); box-shadow:var(--well-edge); text-align:center}
  .rk-dice:empty{display:none}
  .rk-dicerow{display:flex; align-items:flex-end; justify-content:center; gap:1rem}
  .rk-side{display:grid; justify-items:center; gap:.3rem; min-width:0}
  .rk-side__who{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:var(--fw-ui) var(--fs-xs)/1.2 var(--font-ui); color:var(--text-2)}
  .rk-side__dice{display:flex; gap:.4rem}
  .rk-dice .bg-die{width:2.5rem; height:2.5rem}
  .rk-dice .bg-die.lost{opacity:.4}
  .rk-vs{padding-bottom:.6rem; font:400 var(--fs-lg)/1 var(--font-display); color:var(--gold-200)}
  .rk-res{margin:.45rem 0 0; font:var(--fw-body) var(--fs-sm)/1.35 var(--font-ui); color:var(--text-2)}
  .rk-res b{color:var(--text-1)}
  .rk-res .rk-cq{color:var(--gold-100)}
  .rk-acts{display:flex; flex-wrap:wrap; gap:.5rem; justify-content:center}
  .rk-acts:empty{display:none}
  .rk-acts .bg-btn{padding:0 .875rem}
  .rk-amt{display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:.4rem .75rem; width:100%}
  .rk-amt__lbl{font:var(--fw-ui) var(--fs-sm)/1.2 var(--font-ui); color:var(--text-2)}
  .rk-amt__seg{flex:0 1 15rem}
  .rk-bar{display:flex; flex-wrap:wrap; gap:.5rem; justify-content:center}
  .rk-bar .bg-btn--sm{padding:0 .75rem}
  .rk-zoom{display:flex; gap:.5rem}
  .rk-log{min-height:3rem; text-align:center; font:var(--fw-body) var(--fs-micro)/1.45 var(--font-ui); color:var(--text-2)}
  html:not([data-tv]) .rk-hints{display:none}
  .rk-hints{width:min(100%,56rem)}
  /* the choice sheets keep the map in view: a lighter scrim in play (the map must stay readable above the sheet) */
  body.bg-app:not(.rk-in-setup){--scrim:rgba(3,4,10,.42)}
  .rk-shead{display:grid; gap:.25rem; margin-bottom:1rem}
  .rk-shead .bg-sheet__sub{margin:0}
  .rk-shead .bg-sheet__sub b{color:var(--text-1); font-weight:var(--fw-ui-strong)}
  .rk-dice--sheet{margin:0 0 1rem}
  /* the choice sheets are compact: on a phone the main choice, the dice and the step row fit in the room under the map */
  .rk-asheet .rk-shead{margin-bottom:.75rem}
  .rk-asheet .bg-sheet__title{font-size:var(--fs-xl)}
  .rk-asheet .bg-sheet__options{gap:.5rem}
  html[data-tv] #handoffSheet .bg-sheet__options{gap:1.5rem}   /* the defender question: the focus ring never touches the next option */
  .rk-asheet .bg-sheet__option{padding:.5rem .75rem; gap:.7rem}
  .rk-asheet .bg-sheet__label{font-size:var(--fs-lg)}
  .rk-asheet .rk-dice--sheet{margin:0 0 .75rem; padding:.4rem .6rem .45rem}
  .rk-asheet .rk-dice--sheet .bg-die{width:2.1rem; height:2.1rem}
  .rk-asheet .rk-dice--sheet .rk-res{margin-top:.3rem; font-size:var(--fs-xs)}
  .rk-pick{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:.75rem; margin:0 calc(-1 * var(--focus-room)) .25rem; padding:var(--focus-room)}
  .rk-step .bg-stepper__val{min-width:3rem; text-align:center}
  .rk-sbtns{display:flex; flex-wrap:wrap; gap:.625rem; margin:.5rem calc(-1 * var(--focus-room)) 0; padding:var(--focus-room)}
  .rk-sbtns .bg-btn{flex:1 1 0; min-width:0; white-space:normal}
  .rk-sbtns--end{margin-top:.75rem}
  .rk-note{margin:.75rem 0 0; font:var(--fw-body) var(--fs-sm)/1.45 var(--font-ui); color:var(--text-2)}
  /* the territory cards (card art from ctrl.js, step 5 rebuilds it): bigger, the Luxe serif, readable names, a D-pad ring */
  .rk-cards{gap:.5rem; margin:0 calc(-1 * var(--focus-room)) .25rem; padding:calc(var(--focus-room) + .5rem) var(--focus-room) var(--focus-room)}
  .rk-cards .rkcard{width:6.2rem; height:9.5rem; padding:.2rem; border-radius:.6rem; border-top-width:.55rem; font-family:var(--font-display)}

  .rk-cards .rkcard .cs.wide svg{width:5.25rem; height:1.75rem}
  .rk-cards .rkcard .cf{font-size:var(--fs-micro)}
  .rk-cards .rkcard .cf svg:not(.bg-ico){width:2.4rem; height:2.4rem}

  .rk-radio{display:inline-flex; align-items:center; gap:.4rem; min-height:var(--tap); color:var(--text-1)}

<script>
(function(){
"use strict";
var _st=document.createElement("style");
/* the Monopoly deed card keeps its own face (monodata.js, untouched); these only lift its small print to the 12px floor */
_st.textContent=window.MONO_DEED_CSS+'.deed{margin:.25rem 0;font-family:var(--font-ui)}.deed-title{font-size:12px}.deed-note{font-size:12px}.dl{font-size:14px}.dl.sub{font-size:12px}';
document.head.appendChild(_st);
var $=function(id){return document.getElementById(id);};
var main=$("main"), connEl=$("conn"), roomEl=$("room"), barName=$("barName");
var COL={red:"#e23b3b",blue:"#2b7be0",green:"#27a758",yellow:"#eec21b",orange:"#f08a24",purple:"#a65bd6",teal:"#19b5b0",pink:"#e46aa4",black:"#34363d",brown:"#9a6a3a"};
var SEATNO={red:1,blue:2,green:3,yellow:4,purple:5,teal:6,orange:7,pink:8,black:9,brown:10};
var GNAME={trouble:"Trouble",sorry:"Sorry!",monopoly:"Monopoly",rummy500:"500 Rummy",risk:"Risk",uno:"Uno",scatter:"Scattergories"};
var KIND_GAME={rummy:"rummy500",risk:"risk",uno:"uno",scat:"scatter",manage:"monopoly",trade:"monopoly"};
function sn(c){ return SEATNO[c]||0; }
function BG(){ return window.BGUI||null; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
/* a label from the host may start with an emoji or a symbol (Party's older choice buttons): the Luxe look has no emoji as icons */
function clean(s){ return String(s==null?"":s).replace(/^[^A-Za-z0-9$"'(‘“]+/,"").trim(); }
function paintIcons(scope){ var B=BG(); if(!B||!B.icon) return; Array.prototype.forEach.call((scope||document).querySelectorAll("[data-icon]"),function(el){ if(!el.querySelector("svg")) el.insertAdjacentHTML("afterbegin",B.icon(el.getAttribute("data-icon"))); }); }
function put(html){ main.innerHTML=html; paintIcons(main); }
/* "this page is game X": the stage (theme, ambient) follows the game being played. A phone never gets the TV Back default. */
var curGame=null;
function stageGame(g){
  if(!g||g===curGame) return; curGame=g;
  var run=function(){ var B=BG();
    document.body.classList.toggle("bg-app--felt", g==="rummy500"||g==="uno");
    document.body.classList.toggle("bg-app--scene", !(g==="rummy500"||g==="uno"));
    if(barName&&GNAME[g]) barName.textContent=GNAME[g];
    if(B&&B.stage){ try{ B.stage(g,{back:false}); }catch(e){} } else document.documentElement.setAttribute("data-game",g); };
  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",run); else run();
}
stageGame("party");
function toast(m){ var B=BG(); m=clean(m)||String(m); if(B&&B.toast){ B.toast(m,{ms:2400}); return; }
  var d=document.createElement("div"); d.className="ph-toast"; d.textContent=m; document.body.appendChild(d); setTimeout(function(){d.remove();},1800); }
/* sheets: BGUI.sheet when it is there (it is on every real phone); the .on class stays as the page's own "is open" flag */
function openSheet(el,opts){ el.classList.add("on"); var B=BG(); if(B&&B.sheet) B.sheet.open(el,opts); }
function closeSheet(el){ var B=BG(); el.classList.remove("on"); if(B&&B.sheet&&B.sheet.isOpen(el)) B.sheet.close(el); }
/* a button in the colour of its seat (your own seat when it names none, the gold primary before you have one) */
function optHTML(label,attrs,color,cls,plain){   /* plain: a button with no colour of its own (Done) is the quiet secondary, not your seat colour */
  var n=sn(color)||(plain?0:sn(myColor));
  return '<button type="button" class="opt bg-btn bg-btn--block '+(n?"opt--seat":(plain?"bg-btn--secondary":"bg-btn--primary"))+(cls?" "+cls:"")+'"'+(n?' data-seat="'+n+'"':'')+(attrs?" "+attrs:"")+'>'+esc(clean(label))+'</button>';
}
function ghostHTML(label,id,icon){ return '<button type="button" class="opt sm ghost bg-btn bg-btn--secondary bg-btn--block" id="'+id+'">'+(icon?'<span data-icon="'+icon+'" aria-hidden="true"></span>':'')+esc(label)+'</button>'; }
/* the most readable ink on a colour (the Sorry! card back) and a darker shade of it (its number on the white card) */
function lum(h){ var m=/^#([0-9a-f]{6})$/i.exec(h||""); if(!m) return 0; var n=parseInt(m[1],16), f=function(v){ v/=255; return v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4); }; return 0.2126*f(n>>16&255)+0.7152*f(n>>8&255)+0.0722*f(n&255); }
function inkFor(hex){ var L=lum(hex); return (L+0.05)/(0.0066+0.05)>=1.05/(L+0.05)?"#14110a":"#ffffff"; }
function darken(hex,t){ var m=/^#([0-9a-f]{6})$/i.exec(hex||""); if(!m) return "#222"; var n=parseInt(m[1],16), c=[n>>16&255,n>>8&255,n&255].map(function(v){ return ("0"+Math.round(v*(1-t)).toString(16)).slice(-2); }); return "#"+c.join(""); }

var params=new URLSearchParams(location.search);
var room=(params.get("room")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,5);
var myPid=BGNet.pid();
var myName=null, myColor=null, net=null, curReq=null, started=false;
var joined=false, joinTick=0, joinTimer=null;

/* the player types their name fresh every time — it is never saved or pre-filled */

function setConn(s){ connEl.textContent = s==="online"?"connected":(s==="connecting"?"connecting…":"reconnecting…"); connEl.setAttribute("data-state",s==="online"?"online":"wait"); }
function setRoom(t){ roomEl.textContent=t; }
function chrome(inRoom){   /* the top bar: Leave while seated, the home link otherwise */
  $("lvbtn").style.display= inRoom?"":"none"; $("homebtn").style.display= inRoom?"none":""; $("sethome").style.display= inRoom?"none":"";   /* seated: Leave (with its confirm) is the way out, so the room is told */
}

if(!room){ askRoom(); } else { setRoom("Room "+room); startJoin(); }

function askRoom(msg){
  main.className="big"; chrome(false);
  put((msg?'<p class="sub" role="status">'+esc(msg)+'</p>':'')+'<div class="join-card bg-card bg-spot"><h1 class="title">Enter room code</h1><p class="sub">The five letters on the TV.</p><input id="rc" maxlength="5" autocapitalize="characters" autocomplete="off" aria-label="Room code" placeholder="ABCDE"><button class="opt bg-btn bg-btn--primary bg-btn--cta bg-btn--block" id="go" type="button"><span class="bg-btn__label">Join</span><span class="bg-btn__sub">Then type your name</span></button></div>'+hubLink());
  var go=function(){ var v=($("rc").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,5); if(v.length===5){ room=v; setRoom("Room "+room); startJoin(); } else toast("The room code has 5 letters/numbers"); };
  $("go").onclick=go; $("rc").onkeydown=function(e){ if(e.key==="Enter") go(); };
}
function hubLink(){ return '<a href="../index.html" class="bg-btn bg-btn--ghost ph-link"><span data-icon="home" aria-hidden="true"></span>Back to all games</a>'; }
/* stop talking to this room (Leave, or the TV said we can't sit down) and forget the seat */
function stopNet(){
  if(joinTimer){ clearInterval(joinTimer); joinTimer=null; }
  var old=net; net=null; if(old){ try{ old.close(); }catch(e){} }
  joined=false; started=false; curReq=null; overShown=false; lastSnap=null; myColor=null;
  try{ Rummy.Party.resetUI(); }catch(e){} try{ if(sc&&sc.ctrl) sc.ctrl.destroy(); }catch(e){} sc=null; main.style.justifyContent="";
  $("plbtn").style.display="none"; chrome(false); closeOv(); closeVictory(); connEl.textContent=""; connEl.removeAttribute("data-state"); setRoom("Room —");
  curGame=null; stageGame("party"); if(barName) barName.textContent="Party Mode";
}
function leaveRoom(){
  var r=room;
  try{ if(net) net.send({t:"leave", pid:myPid}); }catch(e){}
  stopNet(); askRoom("You left room "+r+".");
}
function showNoJoin(o){
  var full=o.why==="full";
  main.className="big";
  put('<h1 class="title">'+(full?"This room is full":"This game has already started")+'</h1>'+
    '<p class="sub">'+(full?"All "+(o.max||"")+" seats are taken. Ask someone to leave, or join the next game.":"Wait for the host to start a new game on the TV, then scan the new QR code.")+'</p>'+
    '<div class="opts"><button class="opt bg-btn bg-btn--primary bg-btn--block" type="button" id="again">Try again</button><button class="opt ghost bg-btn bg-btn--secondary bg-btn--block" type="button" id="other">Enter another code</button></div>'+hubLink());
  $("again").onclick=function(){ setRoom("Room "+room); connect(); };
  $("other").onclick=function(){ askRoom(); };
}
function startJoin(){ askName(); }
function askName(){
  main.className="big"; chrome(false);
  put('<div class="join-card bg-card bg-spot"><h1 class="title">Type your name</h1><p class="sub">Room '+esc(room)+'</p><input id="nm" maxlength="12" placeholder="Your name" aria-label="Your name" autocomplete="off" autocapitalize="words" value=""><button class="opt bg-btn bg-btn--primary bg-btn--cta bg-btn--block" id="go" type="button"><span class="bg-btn__label">Sit down</span><span class="bg-btn__sub">Room '+esc(room)+'</span></button></div>');
  var go=function(){ var v=($("nm").value||"").trim().slice(0,12); if(!v){ toast("Type your name first"); $("nm").focus(); return; } myName=v; connect(); };
  $("go").onclick=go; $("nm").onkeydown=function(e){ if(e.key==="Enter") go(); };
  $("nm").focus();
}
function connect(){
  joined=false; joinTick=0; if(joinTimer){ clearInterval(joinTimer); joinTimer=null; }
  showWaiting("Connecting to the TV…", true);
  if(net){ try{ net.close(); }catch(e){} }
  var self=null;
  self=net=BGNet.connect(room,"ctrl",{
    status:setConn,
    ready:function(){
      sendJoin();
      // keep knocking every 2s until the TV confirms we are seated, then just a keep-alive every 8s
      joinTimer=setInterval(function(){
        joinTick++;
        if(!joined || joinTick%4===0) sendJoin();
        if(!joined && joinTick===5) showWaiting("Still connecting… make sure the TV is on the lobby screen for room "+room+".", true);
      },2000);
    },
    up:function(){ if(!joined && joinTimer) sendJoin(); },   // a relay just came up: knock on it right away
    msg:function(o){ if(self&&net===self) onMsg(o); }   // a closed connection (Leave / new room) can't change the screen any more
  });
}
function sendJoin(){ net && net.send({t:"join", pid:myPid, name:myName}); }

var overShown=false;   // the "X wins!" screen stays until the host is back in the lobby (a keep-alive re-join must not replace it)
function onMsg(o){
  if(o.game) stageGame(o.game);
  if(o.t==="nojoin" && o.pid===myPid){ if(!joined){ var r=room; stopNet(); room=r; showNoJoin(o); } }
  else if(o.t==="you" && o.pid===myPid){ chrome(true); myColor=o.color; if(o.name) myName=o.name; joined=true; if(!started && !isAsking() && !overShown) showLobby({players:[{pid:myPid,name:myName,color:myColor}]}); }
  else if(o.t==="lobby"){ if(overShown) closeVictory(); overShown=false; if(!started && !isAsking()) showLobby(o); }   // never fall back to lobby once the game is on
  else if(o.t==="ask" && o.pid===myPid){ started=true; if(KIND_GAME[o.kind]) stageGame(KIND_GAME[o.kind]); showAsk(o); }
  else if(o.t==="rvs" && o.pid===myPid){ started=true; curReq=null; stageGame("rummy500"); rvShow(o.st,false,null); }
  else if(o.t==="rks" && o.pid===myPid){ started=true; curReq=null; stageGame("risk"); rkShow(o.st,false,null); }
  else if(o.t==="ups" && o.pid===myPid){ started=true; curReq=null; stageGame("uno"); unShow(o.st,false,null); }
  else if(o.t==="scs" && o.pid===myPid){ started=true; curReq=null; stageGame("scatter"); scShow(o.st,false,null); }
  else if(o.t==="scdl" && o.pid===myPid){ if(sc&&sc.ctrl) sc.ctrl.setDeadlineIn(o.sec); toast("STOP! "+o.sec+" seconds left"); }
  else if(o.t==="snap"){ lastSnap=o; $("plbtn").style.display=""; if($("ov").classList.contains("on") && ovMode==="players") showPlayers(); }
  else if(o.t==="wait" && (o.pid===myPid || o.pid==="*")){ if(o.pid==="*") Rummy.Party.resetUI(); curReq=null; started=(o.pid!=="*"); if(o.pid==="*"){ lastSnap=null; $("plbtn").style.display="none"; closeOv(); } showWaiting(o.msg||"Waiting…", false, o.turn, o.card); }
  else if(o.t==="started"){ started=true; if(!isAsking()) showWaiting("Game starting…", false); }
  else if(o.t==="over"){ started=false; curReq=null; Rummy.Party.resetUI(); showOver(o); overShown=true; }
  else if(o.t==="info" && (o.pid===myPid||!o.pid)){ toast(o.msg); }
}
function isAsking(){ return !!curReq; }

function showLobby(o){
  var me=(o.players||[]).filter(function(p){return p.pid===myPid;})[0];
  if(!me) return;            // only confirm once the TV has actually seated us
  joined=true; main.className="big"; chrome(true);
  var n=sn(me.color);
  var list=(o.players||[]).map(function(p){ return '<span class="bg-chip" data-seat="'+sn(p.color)+'"><span class="bg-chip__dot"></span>'+esc(p.name)+(p.pid===myPid?" (you)":"")+'</span>'; }).join("");
  put('<span class="bg-token mytoken" data-seat="'+n+'" aria-hidden="true">'+esc((myName||"?").trim().charAt(0).toUpperCase())+'</span><h1 class="title">You’re in!</h1><p class="sub"><b class="seatword" data-seat="'+n+'">'+esc(myName)+(me&&me.color?(" — "+me.color.toUpperCase()):"")+'</b></p>'+
    '<div class="seatrow">'+list+'</div>'+
    '<p class="sub ph-status" role="status"><span data-icon="hourglass" aria-hidden="true"></span> Waiting for the host to start on the TV…</p>');
}
function cardHTML(cd){
  var col=COL[cd.color]||"#c62222";
  if(cd.back) return '<div class="scard sback" style="background:'+col+';color:'+inkFor(col)+'"><div class="sbigb">SORRY!</div><div class="swho2">'+esc(cd.who||"")+' draws…</div></div>';
  var big=(cd.v==="sorry")?"SORRY!":String(cd.v);
  return '<div class="scard" style="border-color:'+col+'"><div class="swho">'+esc(cd.who||"")+' drew</div><div class="sbig" style="color:'+darken(col,.5)+';font-size:'+(cd.v==="sorry"?"3rem":"6rem")+'">'+esc(big)+'</div><div class="stxt">'+esc(cd.text||"")+'</div></div>';
}
function showWaiting(msg, spin, turn, card){
  main.className="big";
  var tn = turn?sn(turn):0;
  put((card?cardHTML(card):'<div class="ph-wait is-beat" aria-hidden="true" data-icon="hourglass"></div>')+
    '<p class="sub" role="status"'+(tn?' data-seat="'+tn+'"':'')+'>'+esc(clean(msg))+'</p>');
}
/* ---------- Monopoly extras: deed cards, manage list, trade builder, players ---------- */
var lastSnap=null, ovMode=null, reopenIdx=null, tradeSel=null;
var MC=window.MONO_COLORS, MD=window.MONO_DEEDS;
function mirror(i){ try{ net&&net.send({t:"view",pid:myPid,i:i}); }catch(e){} }
function sendPick(o,id,data){ curReq=null; mirror(null); net.send({t:"pick", pid:myPid, reqId:o.reqId, id:id, i:0, data:data}); showWaiting("Sent. Waiting…", true); }
function chipColor(i){ var d=MD[i]; if(!d) return "#777"; return d.t==="prop"?MC[d.g]:"#333"; }
function propTag(p){ var t=""; if(p.m) t+=" (mortgaged)"; else if(p.h===5) t+=" hotel"; else if(p.h>0) t+=" "+p.h+(p.h>1?" houses":" house"); return t; }
function focusFirst(scope){ try{ var b=(scope||main).querySelector("button.opt, .prow2"); if(b&&!document.querySelector(".bg-sheet.is-open")&&!(document.activeElement&&document.activeElement.tagName==="INPUT")) b.focus({preventScroll:true}); }catch(e){} }

function showManage(o){
  if(reopenIdx!=null){ var r=reopenIdx; reopenIdx=null; if((o.props||[]).some(function(p){return p.i===r;})){ showDeed(o,r); return; } }
  main.className="big scroll";
  mirror(null);
  var rows=(o.props||[]).map(function(p){ var d=MD[p.i];
    return '<button type="button" class="prow2" data-i="'+p.i+'"><span class="chip" style="background:'+chipColor(p.i)+'"></span><span class="pname">'+esc(d.n)+'</span><small>'+esc(propTag(p).trim())+'</small><span class="bg-ico-slot" data-icon="chevron" aria-hidden="true"></span></button>'; }).join("");
  var extra=(o.extra||[]).map(function(op,k){ return optHTML(op.label,'data-x="'+k+'"',op.color,"sm",true); }).join("");
  put('<h1 class="title">'+esc(o.title||"Properties")+'</h1>'+(o.sub?'<p class="sub">'+esc(o.sub)+'</p>':'')+
    (rows||'<p class="sub">You don’t own any properties yet.</p>')+(/deed/i.test(o.sub||"")?"":'<p class="sub ph-hint">Tap a property to see its deed</p>')+
    '<div class="opts">'+extra+'</div>');
  Array.prototype.forEach.call(main.querySelectorAll(".prow2"), function(b){ b.onclick=function(){ showDeed(o,+b.dataset.i); }; });
  Array.prototype.forEach.call(main.querySelectorAll("button[data-x]"), function(b){ b.onclick=function(){ reopenIdx=null; sendPick(o,o.extra[+b.dataset.x].id); }; });
}
function showDeed(o,i){
  mirror(i);
  main.className="big scroll";
  var p=(o.props||[]).filter(function(x){return x.i===i;})[0]||{i:i,h:0,m:false,actions:[]};
  var acts=(p.actions||[]).map(function(a,k){ return optHTML(a.label,'data-a="'+k+'"',a.color,"sm",true); }).join("");
  put('<p class="sub">'+esc(propTag(p).trim()||"Unimproved")+'</p>'+window.monoDeedHTML(i)+
    '<div class="opts">'+acts+ghostHTML("Back to list","bk","back")+'</div>');
  Array.prototype.forEach.call(main.querySelectorAll("button[data-a]"), function(b){ b.onclick=function(){ reopenIdx=i; sendPick(o,p.actions[+b.dataset.a].id); }; });
  $("bk").onclick=function(){ reopenIdx=null; showManage(o); };
}
function showTrade(o){
  main.className="big scroll";
  if(!tradeSel||tradeSel.req!==o.reqId) tradeSel={req:o.reqId,give:{},get:{},cg:0,cr:0,jg:0,jr:0};
  var T=tradeSel;
  function list(arr,side){ return (arr||[]).map(function(p){ var d=MD[p.i]; return '<label class="trow"><input type="checkbox" data-s="'+side+'" data-i="'+p.i+'" '+((side==="give"?T.give:T.get)[p.i]?"checked":"")+'><span class="chip" style="width:14px;height:14px;border-radius:4px;background:'+chipColor(p.i)+'"></span><span class="tname">'+esc(d.n)+'</span><small>'+(p.m?"mortgaged":"")+'</small><button type="button" data-v="'+p.i+'">deed</button></label>'; }).join("")||'<p class="sub">nothing tradeable (buildings must be sold first)</p>'; }
  put('<h1 class="title">Trade with '+esc(o.partner&&o.partner.name||"player")+'</h1>'+
    '<div class="sec"><h3>You give</h3>'+list(o.mine,"give")+
      '<div class="trow">Cash: $<input class="numin" type="number" inputmode="numeric" min="0" max="'+o.myCash+'" id="cg" value="'+(T.cg||"")+'" placeholder="0" aria-label="Cash you give"> <small>you have $'+o.myCash+'</small></div>'+
      (o.myJokers>0?'<label class="trow"><input type="checkbox" id="jg" '+(T.jg?"checked":"")+'> Give a Get Out of Jail Free card</label>':'')+'</div>'+
    '<div class="sec"><h3>You receive</h3>'+list(o.theirs,"get")+
      '<div class="trow">Cash: $<input class="numin" type="number" inputmode="numeric" min="0" max="'+o.theirCash+'" id="cr" value="'+(T.cr||"")+'" placeholder="0" aria-label="Cash you receive"> <small>they have $'+o.theirCash+'</small></div>'+
      (o.theirJokers>0?'<label class="trow"><input type="checkbox" id="jr" '+(T.jr?"checked":"")+'> Receive a Get Out of Jail Free card</label>':'')+'</div>'+
    '<div class="opts">'+optHTML("Propose Trade",'id="tgo"',"green","sm")+ghostHTML("Cancel","tno")+'</div>');
  Array.prototype.forEach.call(main.querySelectorAll('input[type=checkbox][data-s]'), function(cb){ cb.onchange=function(){ var m=cb.dataset.s==="give"?T.give:T.get; if(cb.checked) m[cb.dataset.i]=1; else delete m[cb.dataset.i]; }; });
  Array.prototype.forEach.call(main.querySelectorAll("button[data-v]"), function(b){ b.onclick=function(e){ e.preventDefault(); e.stopPropagation(); mirror(+b.dataset.v); ovShow('<div id="deedv"></div>'); $("deedv").innerHTML=window.monoDeedHTML(+b.dataset.v)+ghostHTML("Close","ovx"); $("ovx").onclick=closeOv; }; });
  var cgI=$("cg"), crI=$("cr"); cgI.oninput=function(){ T.cg=Math.max(0,parseInt(cgI.value||"0",10)||0); }; crI.oninput=function(){ T.cr=Math.max(0,parseInt(crI.value||"0",10)||0); };
  if($("jg")) $("jg").onchange=function(){ T.jg=$("jg").checked?1:0; }; if($("jr")) $("jr").onchange=function(){ T.jr=$("jr").checked?1:0; };
  $("tno").onclick=function(){ tradeSel=null; sendPick(o,"cancel"); };
  $("tgo").onclick=function(){
    var give=Object.keys(T.give).map(Number), get=Object.keys(T.get).map(Number);
    if(T.cg>o.myCash){ toast("You only have $"+o.myCash); return; }
    if(T.cr>o.theirCash){ toast("They only have $"+o.theirCash); return; }
    if(!give.length&&!get.length&&!T.cg&&!T.cr&&!T.jg&&!T.jr){ toast("Pick something to trade"); return; }
    var data={give:give,get:get,cg:T.cg|0,cr:T.cr|0,jg:T.jg?1:0,jr:T.jr?1:0}; tradeSel=null; sendPick(o,"offer",data);
  };
}
function ovShow(html){ $("ovin").innerHTML=html; paintIcons($("ovin")); openSheet($("ov"),{onClose:function(){ $("ov").classList.remove("on"); ovMode=null; mirror(null); }}); }
function closeOv(){ var ov=$("ov"), was=ov.classList.contains("on"); closeSheet(ov); ovMode=null; if(was) mirror(null); }
function showPlayers(){
  if(!lastSnap) return; ovMode="players"; mirror(null);
  var h='<h2 class="bg-sheet__title">Players &amp; holdings</h2>'+(lastSnap.fp?'<p class="sub">Free Parking pot: $'+lastSnap.fp+'</p>':'');
  /* standing order: the richest (net worth) first, the bankrupt last, ties in seat order (presentation only) */
  (lastSnap.players||[]).map(function(p,i){ return {p:p,i:i,w:p.bankrupt?-1:(+p.net||0)}; }).sort(function(a,b){ return (b.w-a.w)||(a.i-b.i); }).map(function(x){ return x.p; }).forEach(function(p){
    var n=sn(p.color);
    h+='<div class="pcard bg-card'+(p.bankrupt?" is-out":"")+'"><div class="pcard__head"><b class="pcard__who" data-seat="'+n+'"><span class="dotc" aria-hidden="true"></span>'+esc(p.name)+(p.pid===myPid?" (you)":"")+(p.bankrupt?" — OUT":"")+'</b><span class="pcard__cash">$'+p.cash+'</span></div>'+
      '<div class="pcard__meta">Net worth $'+p.net+(p.jail?" · In Jail":"")+(p.jokers?" · "+p.jokers+" jail card"+(p.jokers>1?"s":""):"")+'</div>'+
      '<div class="pchips">'+((p.props||[]).map(function(q){ return '<button type="button" class="pchip" data-i="'+q.i+'" style="'+(q.m?"opacity:.7":"")+'"><span class="chip" style="background:'+chipColor(q.i)+'"></span>'+esc(MD[q.i].n)+esc(propTag(q).trim()?" "+propTag(q).trim():"")+'</button>'; }).join("")||'<span class="pcard__meta">no properties</span>')+'</div></div>';
  });
  h+=ghostHTML("Close","ovc");
  ovShow(h);
  Array.prototype.forEach.call($("ovin").querySelectorAll(".pchip"), function(ch){ ch.onclick=function(){ var i=+ch.dataset.i; ovMode="deed"; mirror(i); ovShow(window.monoDeedHTML(i)+ghostHTML("Back","ovb","back")); $("ovb").onclick=showPlayers; }; });
  $("ovc").onclick=closeOv;
}
$("plbtn").onclick=showPlayers;
$("lvbtn").onclick=function(){
  ovMode="leave";
  ovShow('<h2 class="bg-sheet__title">Leave the game?</h2><p class="sub">'+(started?"The computer will play your seat.":"Your seat will be freed for someone else.")+'</p>'+
    '<button type="button" class="opt sm bg-btn bg-btn--danger bg-btn--block" id="lvy"><span data-icon="close" aria-hidden="true"></span>Leave</button>'+ghostHTML("Stay","lvn"));
  $("lvy").onclick=leaveRoom; $("lvn").onclick=closeOv;
};
/* settings (the gear): Reduce effects, the way back to all games */
$("setbtn").onclick=function(){
  var B=BG(); if(B&&B.mount&&B.mount.effectsRow&&!$("effRow").firstChild) B.mount.effectsRow($("effRow"));
  openSheet($("setsheet"),{});
};
$("setDone").onclick=function(){ closeSheet($("setsheet")); };

function showAsk(o){
  curReq=o.reqId; main.className="big";
  if(o.kind==="rummy"){ curReq=null; rvShow(o.st,true,o); return; }
  if(o.kind==="risk"){ curReq=null; rkShow(o.st,true,o); return; }
  if(o.kind==="uno"){ curReq=null; unShow(o.st,true,o); return; }
  if(o.kind==="scat"){ curReq=null; scShow(o.st,true,o); return; }
  if(o.kind==="manage"){ showManage(o); return; }
  if(o.kind==="trade"){ showTrade(o); return; }
  var opts=(o.options||[]).map(function(op,i){ return optHTML(op.label,'data-i="'+i+'"',op.color); }).join("");
  put((o.card?cardHTML(o.card):"")+'<h1 class="title">'+esc(clean(o.title)||"Your turn")+'</h1>'+
    (o.sub?'<p class="sub">'+esc(o.sub)+'</p>':'')+
    '<div class="opts">'+opts+'</div>');
  Array.prototype.forEach.call(main.querySelectorAll("button.opt"), function(b){
    b.onclick=function(){ var i=+b.dataset.i; var op=o.options[i]; curReq=null;
      net.send({t:"pick", pid:myPid, reqId:o.reqId, id:op.id, i:i});
      showWaiting("Sent. Waiting…", true);
    };
  });
  focusFirst(main);
}
var rvLastKey="", rvAsk=null;
function rvShow(st,active,ask){
  rvAsk=ask;
  var key=JSON.stringify(st)+(active?"A":"-");
  if(key===rvLastKey){ Rummy.Party.unbusy(); return; }
  rvLastKey=key;
  main.className="big scroll";
  Rummy.Party.phoneRender(main,st,{active:active,
    act:function(id,data){ if(rvAsk&&net) net.send({t:"pick",pid:myPid,reqId:rvAsk.reqId,id:id,i:0,data:data}); },
    view:function(i){ if(net) net.send({t:"view",pid:myPid,rv:1,i:i}); },
    toast:toast});
}
var sc=null, scAsk=null;
function scSend(a){
  if(a.t==="submit"){ if(!scAsk||!net) return {ok:true}; var ask=scAsk; scAsk=null; net.send({t:"pick",pid:myPid,reqId:ask.reqId,id:"submit",i:0,data:{answers:a.answers}}); return {ok:true}; }
  if(net) net.send({t:"view",pid:myPid,sc:a});
  return {ok:true};
}
function scShow(st,active,ask){
  if(active) scAsk=ask;
  if(!sc||!main.contains(sc.el)){
    if(sc&&sc.ctrl) sc.ctrl.destroy();
    main.className="big scroll"; main.style.justifyContent="flex-start";
    main.innerHTML='<div class="scph" style="width:100%;max-width:640px"><div id="scC"></div></div>';
    var ctrl=Scatter.UI.create({root:$("scC"),toast:toast,send:scSend,readyLabel:"Done scoring",luxe:!!(BG()&&BG().sheet&&BG().icon),tv:function(){ return false; },icon:function(n){ return BG()&&BG().icon?BG().icon(n):""; },seatOf:function(i){ var s=window.__scV&&window.__scV.seats; return (s&&s[i])||(i%8)+1; },onProgress:function(ans){ if(net) net.send({t:"view",pid:myPid,sc:{t:"prog",answers:ans}}); }});
    sc={el:main.firstChild,ctrl:ctrl};
  }
  window.__scV=st; sc.ctrl.update(st); window.__sc2=sc;
}
function afkHTML(id){ return '<div class="afk" role="status">The computer is playing for you <button type="button" class="bg-btn bg-btn--secondary bg-btn--sm" id="'+id+'">Take over</button></div>'; }
var un=null, unAsk=null;
function unSend(a){
  if(a.t==="uno"||a.t==="catch"||a.t==="jump"){ if(net) net.send({t:"view",pid:myPid,uno:a}); return {ok:true}; }
  if(!unAsk||!net){ toast("Wait for your turn…"); return {ok:false,msg:"Wait for your turn."}; }
  var ask=unAsk; unAsk=null; net.send({t:"pick",pid:myPid,reqId:ask.reqId,id:"act",i:0,data:a});
  return undefined;
}
function unShow(st,active,ask){
  unAsk=active?ask:null;
  if(!un||!main.contains(un.el)){
    if(un&&un.ctrl) un.ctrl.destroy();
    main.className="big scroll"; main.style.justifyContent="flex-start";
    main.innerHTML='<div class="unph" style="width:100%;max-width:640px"><div id="unAfk"></div><div id="unC"></div></div>';
    var ctrl=Uno.Ctrl.create({root:$("unC"),toast:toast,send:unSend,luxe:true,tv:function(){ return false; },pulse:function(){ return !document.hidden; },gameKey:function(){ return room; },seatOf:function(i){ var s=window.__unV&&window.__unV.seats; return (s&&s[i])||(i%10)+1; }});
    un={el:main.firstChild,ctrl:ctrl};
  }
  window.__unV=st; un.ctrl.update(st); window.__un=un;
  var af=$("unAfk"); if(af){ if(st.afk){ af.innerHTML=afkHTML("unTake"); $("unTake").onclick=function(){ if(net) net.send({t:"view",pid:myPid,take:1}); }; } else af.innerHTML=""; }
}
/* the map's pulsing marks, one finite 1.1 s beat at a time from the effects ticker (a MutationObserver on one stage motif, as the Risk page does): no endless CSS animation */
var PULSE={mo:null,m:null,at:0,b:0};
function pulseTick(){
  var bd=$("rkboard"); if(!bd||!bd.querySelector(".rkpulsel circle, .rkpulse")) return;
  var t=performance.now(); if(t-PULSE.at<1080) return;
  PULSE.at=t; PULSE.b=PULSE.b===1?2:1;
  bd.classList.remove(PULSE.b===1?"is-b2":"is-b1"); bd.classList.add(PULSE.b===1?"is-b1":"is-b2");
}
function pulseWatch(){
  var m=document.querySelector(".bg-ambient .bg-motifs > b");
  if(!m||!window.MutationObserver||(PULSE.m===m&&m.isConnected)) return;
  if(PULSE.mo) PULSE.mo.disconnect();
  PULSE.m=m; PULSE.mo=new MutationObserver(pulseTick); PULSE.mo.observe(m,{attributes:true,attributeFilter:["style"]});
}
var rk=null, rkAsk=null;
function rkSend(a){
  if(!rkAsk||!net){ toast("Wait for your turn…"); return {ok:false,msg:"Wait for your turn."}; }
  var ask=rkAsk; rkAsk=null;
  net.send({t:"pick",pid:myPid,reqId:ask.reqId,id:"act",i:0,data:a});
  return undefined;
}
function rkShow(st,active,ask){
  rkAsk=active?ask:null;
  if(!rk||!main.contains(rk.el)){
    if(rk&&rk.ctrl) rk.ctrl.destroy();
    main.className="big scroll"; main.style.justifyContent="flex-start";
    main.innerHTML='<div class="rkph" style="width:100%;max-width:680px"><div id="rkAfk"></div><div id="rkB"><div id="rkframe"><div id="rkboard"></div></div></div><div id="rkP"></div></div>';
    document.documentElement.classList.add("rk-luxe"); pulseWatch(); document.addEventListener("bgui:stage",pulseWatch);
    var board=Risk.Board.create($("rkboard"),{labels:"auto",pulseLayer:true});
    var ctrl=Risk.Ctrl.create({root:$("rkP"),board:board,toast:toast,send:rkSend,blitzDelay:450,luxe:true,tv:function(){ return false; },seatOf:function(i){ var P=(window.__rkV&&window.__rkV.players)||[], p=P[i]; if(!p) return 1; return p.neutral?10:([1,2,3,4,9,8][(p.ci==null?i:p.ci)%6]||1); }});
    rk={el:main.firstChild,board:board,ctrl:ctrl};
  }
  rk.board.setView(Risk.Ctrl.boardView(st)); window.__rkV=st; rk.ctrl.update(st); window.__rk=rk;
  var af=$("rkAfk"); if(af){ if(st.afk){ af.innerHTML=afkHTML("rkTake"); $("rkTake").onclick=function(){ if(net) net.send({t:"view",pid:myPid,take:1}); }; } else af.innerHTML=""; }
}
/* the winner screen: the Victory screen (BGUI.win + celebrate, real numbers from the host) over a quiet "X wins" card that stays until the host sends "lobby" */
var winEl=null;
function closeVictory(){ var B=BG(); if(winEl){ try{ if(B&&B.win&&B.win.isOpen()) B.win.close(winEl); }catch(e){} if(winEl.parentNode) winEl.parentNode.removeChild(winEl); } winEl=null; }
function fmtTime(ms){ var m=Math.floor(ms/60000), s=Math.floor(ms/1000)%60; return m+":"+(s<10?"0":"")+s; }
function showOver(o){
  var win=o.winner||"", team=/ & /.test(win), B=BG();
  main.className="big"; closeVictory();
  put('<div class="ph-wait" aria-hidden="true" data-icon="trophy"></div><h1 class="title">'+esc(win)+(team?' win!':' wins!')+'</h1><p class="sub">Thanks for playing. The host can start a new game.</p>');
  if(!B||!B.win) return;
  var stats='';
  if(o.n) stats+='<li class="bg-stat"><b>'+(+o.n)+'</b><span>players</span></li>';
  if(o.ms>0) stats+='<li class="bg-stat"><b>'+fmtTime(+o.ms)+'</b><span>time</span></li>';
  winEl=document.createElement("div"); winEl.className="bg-win"; winEl.id="winph"; winEl.setAttribute("aria-labelledby","winTitle");
  winEl.innerHTML='<div class="bg-win__scrim"></div><div class="bg-win__rays"></div><div class="bg-win__card"><div class="bg-win__medal"></div><p class="bg-eyebrow">Game over'+(GNAME[curGame]?' · '+esc(GNAME[curGame]):'')+'</p><h2 class="bg-win__title" id="winTitle">Victory</h2>'+
    '<p class="bg-win__sub"><b>'+esc(win)+'</b> '+(team?"win":"wins")+' the game.</p>'+(stats?'<ul class="bg-stats bg-win__stats">'+stats+'</ul>':'')+
    '<div class="bg-win__actions"><button class="bg-btn bg-btn--primary bg-btn--lg" type="button" id="winOk">Continue</button></div></div>';
  document.body.appendChild(winEl);
  $("winOk").onclick=function(){ B.win.close(winEl); };
  B.win.open(winEl,{focus:"#winOk"}); if(B.celebrate) B.celebrate();
}
document.addEventListener("DOMContentLoaded",function(){ paintIcons(document); });
})();
