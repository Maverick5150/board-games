<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e1630">
<title>Board Games — Controller</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{background:radial-gradient(130% 100% at 50% -10%,#24346b,#0e1630 60%);color:#eef2ff;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;
    min-height:100%;padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));touch-action:manipulation;}
  .top{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#9fb0d8;}
  .dotc{width:12px;height:12px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:-1px;}
  h1{font-size:20px;margin:14px 0 4px;}
  .big{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;}
  .title{font-size:26px;font-weight:900;}
  .sub{color:#9fb0d8;font-size:15px;}
  .opts{display:flex;flex-direction:column;gap:12px;width:100%;max-width:440px;margin-top:6px;}
  button.opt{width:100%;padding:20px;border-radius:16px;border:none;font-size:20px;font-weight:800;color:#fff;
    background:#2b7be0;box-shadow:0 8px 0 #1c5bb0,0 12px 20px #0007;cursor:pointer;}
  button.opt:active{transform:translateY(5px);box-shadow:0 3px 0 #1c5bb0;}
  input{width:100%;max-width:360px;padding:16px;border-radius:14px;border:1px solid #39498a;background:#101938;color:#fff;font-size:18px;text-align:center;}
  .pill{background:#16203f;border-radius:20px;padding:6px 12px;font-weight:700;}
  .spin{width:40px;height:40px;border-radius:50%;border:4px solid #2b7be033;border-top-color:#2b7be0;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .waitdot{font-size:40px;animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
</style>
</head>
<body>
  <div class="top">
    <span id="room">Room —</span>
    <button id="plbtn" class="pill" style="display:none;border:none;color:#eef2ff;cursor:pointer;font-size:13px">👥 Players</button>
    <span id="conn" class="pill">connecting…</span>
  </div>
  <div class="big" id="main"></div>
  <div id="ov"><div id="ovin"></div></div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="net.js"></script>
<script src="monodata.js"></script>
<script src="../skins.js"></script>
<script src="../rummy500/engine.js"></script>
<script src="../rummy500/game.js"></script>
<script src="../rummy500/cards.js"></script>
<script src="../rummy500/party.js"></script>
<script src="../risk/map.js"></script>
<script src="../risk/engine.js"></script>
<script src="../risk/board.js"></script>
<script src="../risk/ctrl.js"></script>
<script src="../uno/engine.js"></script>
<script src="../uno/cards.js"></script>
<script src="../scatter/bank.js"></script>
<script src="../scatter/engine.js"></script>
<script src="../scatter/ui.js"></script>
<script>window.Skins=window.Skins||{apply:function(){}};</script>
<script>
(function(){
var _st=document.createElement("style");
_st.textContent=window.MONO_DEED_CSS+
 '.big.scroll{justify-content:flex-start;padding-top:10px;overflow-y:auto;}'+
 '.prow2{display:flex;align-items:center;gap:10px;width:100%;max-width:420px;padding:14px 14px;border-radius:14px;background:#16203f;border:1px solid #2e3b66;color:#eef2ff;font-size:16px;font-weight:700;text-align:left;cursor:pointer;margin:0}'+
 '.prow2 .chip{width:16px;height:16px;border-radius:4px;flex:0 0 auto;border:1px solid #fff5}.prow2 small{color:#9fb0d8;font-weight:600;margin-left:auto;font-size:12px}'+
 '.scard{width:210px;height:290px;background:#fff;border:12px solid #c62222;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;color:#222;text-align:center}.scard.sback{border-color:#fff;color:#fff}.sbigb{font-size:38px;font-weight:900;text-shadow:0 2px 6px #0006}.swho,.swho2{font-size:15px;font-weight:800;opacity:.85}.sbig{font-weight:900;line-height:1}.stxt{font-size:15px;font-weight:700;line-height:1.25}'+
 'button.opt.sm{padding:15px;font-size:17px}button.opt.ghost{background:#2a3663;box-shadow:0 6px 0 #1a2347}'+
 '.sec{width:100%;max-width:420px;text-align:left;margin-top:8px}.sec h3{margin:6px 0 4px;font-size:13px;color:#9fb0d8;text-transform:uppercase;letter-spacing:.5px}'+
 '.trow{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:#101938;margin:4px 0;font-size:15px}.trow input[type=checkbox]{width:20px;height:20px}'+
 '.numin{width:110px;padding:10px;border-radius:10px;border:1px solid #39498a;background:#101938;color:#fff;font-size:17px;text-align:center}'+
 '#ov{position:fixed;inset:0;background:#0b1228f2;z-index:50;display:none;overflow-y:auto;padding:16px}#ov.on{display:block}#ovin{max-width:440px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:8px}'+
 '.pcard{width:100%;max-width:420px;background:#16203f;border-radius:14px;padding:10px 12px;border:1px solid #2e3b66}.pchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.pchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:#101938;border:1px solid #2e3b66;border-radius:8px;padding:3px 7px;cursor:pointer}.pchip .chip{width:11px;height:11px;border-radius:3px}';
document.head.appendChild(_st);
"use strict";
var $=function(id){return document.getElementById(id);};
Skins.apply("party");
var main=$("main"), connEl=$("conn"), roomEl=$("room");
var COL={red:"#e23b3b",blue:"#2b7be0",green:"#27a758",yellow:"#eec21b",orange:"#f08a24",purple:"#a65bd6",teal:"#19b5b0",pink:"#e46aa4",black:"#34363d",brown:"#9a6a3a"};

var params=new URLSearchParams(location.search);
var room=(params.get("room")||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,5);
var myPid=BGNet.pid();
var myName=null, myColor=null, net=null, curReq=null, started=false;
var joined=false, joinTick=0, joinTimer=null;

/* the player types their name fresh every time — it is never saved or pre-filled */

function setConn(s){ connEl.textContent = s==="online"?"● connected":(s==="connecting"?"connecting…":"reconnecting…"); connEl.style.color = s==="online"?"#7CFC9A":"#ffcf7a"; }

if(!room){ askRoom(); } else { roomEl.textContent="Room "+room; startJoin(); }

function askRoom(){
  main.innerHTML='<div class="title">Enter Room Code</div><input id="rc" maxlength="5" autocapitalize="characters" placeholder="ABCDE"><button class="opt" id="go" style="max-width:360px">Join</button>';
  $("go").onclick=function(){ var v=($("rc").value||"").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,5); if(v.length===5){ room=v; roomEl.textContent="Room "+room; startJoin(); } };
}
function startJoin(){ askName(); }
function askName(){
  main.className="big";
  main.innerHTML='<div class="title">Type your name</div><div class="sub">Room '+esc(room)+'</div><input id="nm" maxlength="12" placeholder="Your name" autocomplete="off" autocapitalize="words" value=""><button class="opt" id="go" style="max-width:360px">Sit down ▸</button>';
  var go=function(){ var v=($("nm").value||"").trim().slice(0,12); if(!v){ toast("Type your name first"); $("nm").focus(); return; } myName=v; connect(); };
  $("go").onclick=go; $("nm").onkeydown=function(e){ if(e.key==="Enter") go(); };
  $("nm").focus();
}
function connect(){
  joined=false; joinTick=0; if(joinTimer){ clearInterval(joinTimer); joinTimer=null; }
  showWaiting("Connecting to the TV…", true);
  if(net){ try{ net.close(); }catch(e){} }
  net=BGNet.connect(room,"ctrl",{
    status:setConn,
    ready:function(){
      sendJoin();
      // keep knocking every 2s until the TV confirms we are seated, then just a keep-alive every 8s
      joinTimer=setInterval(function(){
        joinTick++;
        if(!joined || joinTick%4===0) sendJoin();
        if(!joined && joinTick===5) showWaiting("Still connecting… make sure the TV is on the lobby screen for room "+room+".", true);
      },2000);
    },
    up:function(){ if(!joined && joinTimer) sendJoin(); },   // a relay just came up: knock on it right away
    msg:onMsg
  });
}
function sendJoin(){ net && net.send({t:"join", pid:myPid, name:myName}); }

function onMsg(o){
  if(o.t==="you" && o.pid===myPid){ myColor=o.color; if(o.name) myName=o.name; joined=true; if(!started && !isAsking()) showLobby({players:[{pid:myPid,name:myName,color:myColor}]}); }
  else if(o.t==="lobby"){ if(!started && !isAsking()) showLobby(o); }   // never fall back to lobby once the game is on
  else if(o.t==="ask" && o.pid===myPid){ started=true; showAsk(o); }
  else if(o.t==="rvs" && o.pid===myPid){ started=true; curReq=null; rvShow(o.st,false,null); }
  else if(o.t==="rks" && o.pid===myPid){ started=true; curReq=null; rkShow(o.st,false,null); }
  else if(o.t==="ups" && o.pid===myPid){ started=true; curReq=null; unShow(o.st,false,null); }
  else if(o.t==="scs" && o.pid===myPid){ started=true; curReq=null; scShow(o.st,false,null); }
  else if(o.t==="scdl" && o.pid===myPid){ if(sc&&sc.ctrl) sc.ctrl.setDeadlineIn(o.sec); toast("🛑 STOP! "+o.sec+" seconds left"); }
  else if(o.t==="snap"){ lastSnap=o; $("plbtn").style.display="inline-block"; if($("ov").classList.contains("on") && ovMode==="players") showPlayers(); }
  else if(o.t==="wait" && (o.pid===myPid || o.pid==="*")){ if(o.pid==="*") Rummy.Party.resetUI(); curReq=null; started=(o.pid!=="*"); if(o.pid==="*"){ lastSnap=null; $("plbtn").style.display="none"; closeOv(); } showWaiting(o.msg||"Waiting…", false, o.turn, o.card); }
  else if(o.t==="started"){ started=true; if(!isAsking()) showWaiting("Game starting…", false); }
  else if(o.t==="over"){ started=false; curReq=null; Rummy.Party.resetUI(); showOver(o); }
  else if(o.t==="info" && (o.pid===myPid||!o.pid)){ toast(o.msg); }
}
function isAsking(){ return !!curReq; }

function showLobby(o){
  var me=(o.players||[]).filter(function(p){return p.pid===myPid;})[0];
  if(!me) return;            // only confirm once the TV has actually seated us
  joined=true; main.className="big";
  var c = me&&me.color ? COL[me.color] : "#9fb0d8";
  var list=(o.players||[]).map(function(p){ return '<div class="pill" style="margin:4px"><span class="dotc" style="background:'+(COL[p.color]||"#889")+'"></span>'+esc(p.name)+(p.pid===myPid?" (you)":"")+'</div>'; }).join("");
  main.innerHTML='<div class="title" style="color:'+c+'">You’re in!</div><div class="sub">'+esc(myName)+(me&&me.color?(" — "+me.color.toUpperCase()):"")+'</div>'+
    '<div style="display:flex;flex-wrap:wrap;justify-content:center;max-width:440px">'+list+'</div>'+
    '<div class="sub" style="margin-top:10px">Waiting for the host to start on the TV…</div>';
}
function cardHTML(cd){
  var col=COL[cd.color]||"#c62222";
  if(cd.back) return '<div class="scard sback" style="background:'+col+';box-shadow:0 0 34px '+col+'99"><div class="sbigb">SORRY!</div><div class="swho2">'+esc(cd.who||"")+' draws…</div></div>';
  var big=(cd.v==="sorry")?"SORRY!":String(cd.v);
  return '<div class="scard" style="border-color:'+col+';box-shadow:0 0 34px '+col+'99"><div class="swho">'+esc(cd.who||"")+' drew</div><div class="sbig" style="color:'+col+';font-size:'+(cd.v==="sorry"?"46px":"96px")+'">'+big+'</div><div class="stxt">'+esc(cd.text||"")+'</div></div>';
}
function showWaiting(msg, spin, turn, card){
  main.className="big";
  var tcol = turn&&COL[turn] ? COL[turn] : null;
  main.innerHTML=(card?cardHTML(card):(spin?'<div class="spin"></div>':'<div class="waitdot">⏳</div>'))+
    '<div class="sub" style="max-width:440px'+(tcol?';color:'+tcol:'')+'">'+esc(msg)+'</div>';
}
/* ---------- Monopoly extras: deed cards, manage list, trade builder, players ---------- */
var lastSnap=null, ovMode=null, reopenIdx=null, tradeSel=null;
var MC=window.MONO_COLORS, MD=window.MONO_DEEDS;
function mirror(i){ try{ net&&net.send({t:"view",pid:myPid,i:i}); }catch(e){} }
function sendPick(o,id,data){ curReq=null; mirror(null); net.send({t:"pick", pid:myPid, reqId:o.reqId, id:id, i:0, data:data}); showWaiting("Sent ✔  waiting…", true); }
function chipColor(i){ var d=MD[i]; if(!d) return "#777"; return d.t==="prop"?MC[d.g]:"#333"; }
function propTag(p){ var t=""; if(p.m) t+=" (mortgaged)"; else if(p.h===5) t+=" 🏨"; else if(p.h>0) t+=" "+Array(p.h+1).join("🏠"); return t; }

function showManage(o){
  if(reopenIdx!=null){ var r=reopenIdx; reopenIdx=null; if((o.props||[]).some(function(p){return p.i===r;})){ showDeed(o,r); return; } }
  main.className="big scroll";
  var c = myColor?COL[myColor]:"#2b7be0";
  mirror(null);
  var rows=(o.props||[]).map(function(p){ var d=MD[p.i];
    return '<button class="prow2" data-i="'+p.i+'"><span class="chip" style="background:'+chipColor(p.i)+'"></span>'+esc(d.n)+'<small>'+esc(propTag(p).trim())+' ›</small></button>'; }).join("");
  var extra=(o.extra||[]).map(function(op,k){ return '<button class="opt sm" data-x="'+k+'" style="background:'+(op.color?(COL[op.color]||op.color):c)+'">'+esc(op.label)+'</button>'; }).join("");
  main.innerHTML='<div class="title" style="color:'+c+'">'+esc(o.title||"Properties")+'</div>'+(o.sub?'<div class="sub">'+esc(o.sub)+'</div>':'')+
    (rows||'<div class="sub">You don’t own any properties yet.</div>')+'<div class="sub" style="font-size:12px">Tap a property to see its title deed</div>'+
    '<div class="opts">'+extra+'</div>';
  Array.prototype.forEach.call(main.querySelectorAll(".prow2"), function(b){ b.onclick=function(){ showDeed(o,+b.dataset.i); }; });
  Array.prototype.forEach.call(main.querySelectorAll("button[data-x]"), function(b){ b.onclick=function(){ reopenIdx=null; sendPick(o,o.extra[+b.dataset.x].id); }; });
}
function showDeed(o,i){
  mirror(i);
  main.className="big scroll";
  var p=(o.props||[]).filter(function(x){return x.i===i;})[0]||{i:i,h:0,m:false,actions:[]};
  var c = myColor?COL[myColor]:"#2b7be0";
  var acts=(p.actions||[]).map(function(a,k){ return '<button class="opt sm" data-a="'+k+'" style="background:'+(a.color?(COL[a.color]||a.color):c)+'">'+esc(a.label)+'</button>'; }).join("");
  main.innerHTML='<div class="sub">'+esc(propTag(p).trim()||"Unimproved")+'</div>'+window.monoDeedHTML(i)+
    '<div class="opts">'+acts+'<button class="opt sm ghost" id="bk">‹ Back to list</button></div>';
  Array.prototype.forEach.call(main.querySelectorAll("button[data-a]"), function(b){ b.onclick=function(){ reopenIdx=i; sendPick(o,p.actions[+b.dataset.a].id); }; });
  $("bk").onclick=function(){ reopenIdx=null; showManage(o); };
}
function showTrade(o){
  main.className="big scroll";
  var c = myColor?COL[myColor]:"#2b7be0";
  if(!tradeSel||tradeSel.req!==o.reqId) tradeSel={req:o.reqId,give:{},get:{},cg:0,cr:0,jg:0,jr:0};
  var T=tradeSel;
  function list(arr,side){ return (arr||[]).map(function(p){ var d=MD[p.i]; return '<label class="trow"><input type="checkbox" data-s="'+side+'" data-i="'+p.i+'" '+((side==="give"?T.give:T.get)[p.i]?"checked":"")+'><span class="chip" style="width:14px;height:14px;border-radius:4px;background:'+chipColor(p.i)+'"></span><span style="flex:1">'+esc(d.n)+'</span><small style="color:#9fb0d8">'+(p.m?"mortgaged":"")+'</small><button data-v="'+p.i+'" style="background:none;border:1px solid #39498a;color:#9fb0d8;border-radius:8px;padding:2px 8px">deed</button></label>'; }).join("")||'<div class="sub" style="font-size:13px">nothing tradeable (buildings must be sold first)</div>'; }
  main.innerHTML='<div class="title" style="color:'+c+'">Trade with '+esc(o.partner&&o.partner.name||"player")+'</div>'+
    '<div class="sec"><h3>You give</h3>'+list(o.mine,"give")+
      '<div class="trow">Cash: $<input class="numin" type="number" inputmode="numeric" min="0" max="'+o.myCash+'" id="cg" value="'+(T.cg||"")+'" placeholder="0"> <small style="color:#9fb0d8">you have $'+o.myCash+'</small></div>'+
      (o.myJokers>0?'<label class="trow"><input type="checkbox" id="jg" '+(T.jg?"checked":"")+'> Give a Get Out of Jail Free card</label>':'')+'</div>'+
    '<div class="sec"><h3>You receive</h3>'+list(o.theirs,"get")+
      '<div class="trow">Cash: $<input class="numin" type="number" inputmode="numeric" min="0" max="'+o.theirCash+'" id="cr" value="'+(T.cr||"")+'" placeholder="0"> <small style="color:#9fb0d8">they have $'+o.theirCash+'</small></div>'+
      (o.theirJokers>0?'<label class="trow"><input type="checkbox" id="jr" '+(T.jr?"checked":"")+'> Receive a Get Out of Jail Free card</label>':'')+'</div>'+
    '<div class="opts"><button class="opt sm" id="tgo" style="background:#27a758">Propose Trade</button><button class="opt sm ghost" id="tno">Cancel</button></div>';
  Array.prototype.forEach.call(main.querySelectorAll('input[type=checkbox][data-s]'), function(cb){ cb.onchange=function(){ var m=cb.dataset.s==="give"?T.give:T.get; if(cb.checked) m[cb.dataset.i]=1; else delete m[cb.dataset.i]; }; });
  Array.prototype.forEach.call(main.querySelectorAll("button[data-v]"), function(b){ b.onclick=function(e){ e.preventDefault(); e.stopPropagation(); mirror(+b.dataset.v); ovShow('<div id="deedv"></div>'); $("deedv").innerHTML=window.monoDeedHTML(+b.dataset.v)+'<button class="opt sm ghost" id="ovx" style="margin-top:6px">Close</button>'; $("ovx").onclick=closeOv; }; });
  var cgI=$("cg"), crI=$("cr"); cgI.oninput=function(){ T.cg=Math.max(0,parseInt(cgI.value||"0",10)||0); }; crI.oninput=function(){ T.cr=Math.max(0,parseInt(crI.value||"0",10)||0); };
  if($("jg")) $("jg").onchange=function(){ T.jg=$("jg").checked?1:0; }; if($("jr")) $("jr").onchange=function(){ T.jr=$("jr").checked?1:0; };
  $("tno").onclick=function(){ tradeSel=null; sendPick(o,"cancel"); };
  $("tgo").onclick=function(){
    var give=Object.keys(T.give).map(Number), get=Object.keys(T.get).map(Number);
    if(T.cg>o.myCash){ toast("You only have $"+o.myCash); return; }
    if(T.cr>o.theirCash){ toast("They only have $"+o.theirCash); return; }
    if(!give.length&&!get.length&&!T.cg&&!T.cr&&!T.jg&&!T.jr){ toast("Pick something to trade"); return; }
    var data={give:give,get:get,cg:T.cg|0,cr:T.cr|0,jg:T.jg?1:0,jr:T.jr?1:0}; tradeSel=null; sendPick(o,"offer",data);
  };
}
function ovShow(html){ $("ovin").innerHTML=html; $("ov").classList.add("on"); }
function closeOv(){ $("ov").classList.remove("on"); ovMode=null; mirror(null); }
function showPlayers(){
  if(!lastSnap) return; ovMode="players"; mirror(null);
  var h='<div class="title" style="font-size:22px">Players &amp; holdings</div>'+(lastSnap.fp?'<div class="sub">🅿️ Free Parking pot: $'+lastSnap.fp+'</div>':'');
  (lastSnap.players||[]).forEach(function(p){
    h+='<div class="pcard" style="'+(p.bankrupt?"opacity:.45":"")+'"><div style="display:flex;justify-content:space-between;align-items:center"><b><span class="dotc" style="background:'+COL[p.color]+'"></span>'+esc(p.name)+(p.pid===myPid?" (you)":"")+(p.bankrupt?" — OUT":"")+'</b><span style="color:#7CFC9A;font-weight:800">$'+p.cash+'</span></div>'+
      '<div style="font-size:12px;color:#9fb0d8;margin-top:2px">Net worth $'+p.net+(p.jail?" · 🔒 In Jail":"")+(p.jokers?" · 🎫 "+p.jokers+" jail card"+(p.jokers>1?"s":""):"")+'</div>'+
      '<div class="pchips">'+((p.props||[]).map(function(q){ return '<span class="pchip" data-i="'+q.i+'" style="'+(q.m?"opacity:.55":"")+'"><span class="chip" style="background:'+chipColor(q.i)+'"></span>'+esc(MD[q.i].n)+esc(propTag(q).trim()?" "+propTag(q).trim():"")+'</span>'; }).join("")||'<span style="font-size:12px;color:#9fb0d8">no properties</span>')+'</div></div>';
  });
  h+='<button class="opt sm ghost" id="ovc" style="margin-top:6px">Close</button>';
  ovShow(h);
  Array.prototype.forEach.call($("ovin").querySelectorAll(".pchip"), function(ch){ ch.onclick=function(){ var i=+ch.dataset.i; ovMode="deed"; mirror(i); ovShow(window.monoDeedHTML(i)+'<button class="opt sm ghost" id="ovb" style="margin-top:6px">‹ Back</button>'); $("ovb").onclick=showPlayers; }; });
  $("ovc").onclick=closeOv;
}
$("plbtn").onclick=showPlayers;

function showAsk(o){
  curReq=o.reqId; main.className="big";
  if(o.kind==="rummy"){ curReq=null; rvShow(o.st,true,o); return; }
  if(o.kind==="risk"){ curReq=null; rkShow(o.st,true,o); return; }
  if(o.kind==="uno"){ curReq=null; unShow(o.st,true,o); return; }
  if(o.kind==="scat"){ curReq=null; scShow(o.st,true,o); return; }
  if(o.kind==="manage"){ showManage(o); return; }
  if(o.kind==="trade"){ showTrade(o); return; }
  var c = myColor?COL[myColor]:"#2b7be0";
  var opts=(o.options||[]).map(function(op,i){
    var bg=op.color?COL[op.color]||op.color:c;
    return '<button class="opt" data-i="'+i+'" style="background:'+bg+';box-shadow:0 8px 0 #0007,0 12px 20px #0007">'+esc(op.label)+'</button>';
  }).join("");
  main.innerHTML=(o.card?cardHTML(o.card):"")+'<div class="title" style="color:'+c+'">'+esc(o.title||"Your turn")+'</div>'+
    (o.sub?'<div class="sub">'+esc(o.sub)+'</div>':'')+
    '<div class="opts">'+opts+'</div>';
  Array.prototype.forEach.call(main.querySelectorAll("button.opt"), function(b){
    b.onclick=function(){ var i=+b.dataset.i; var op=o.options[i]; curReq=null;
      net.send({t:"pick", pid:myPid, reqId:o.reqId, id:op.id, i:i});
      showWaiting("Sent ✔  waiting…", true);
    };
  });
}
var rvLastKey="", rvAsk=null;
function rvShow(st,active,ask){
  rvAsk=ask;
  var key=JSON.stringify(st)+(active?"A":"-");
  if(key===rvLastKey){ Rummy.Party.unbusy(); return; }
  rvLastKey=key;
  main.className="big scroll"; document.body.style.background="radial-gradient(120% 90% at 50% 20%,#177048,#0b4129 60%,#04180f)";
  Rummy.Party.phoneRender(main,st,{active:active,
    act:function(id,data){ if(rvAsk&&net) net.send({t:"pick",pid:myPid,reqId:rvAsk.reqId,id:id,i:0,data:data}); },
    view:function(i){ if(net) net.send({t:"view",pid:myPid,rv:1,i:i}); },
    toast:toast});
}
var sc=null, scAsk=null;
function scSend(a){
  if(a.t==="submit"){ if(!scAsk||!net) return {ok:true}; var ask=scAsk; scAsk=null; net.send({t:"pick",pid:myPid,reqId:ask.reqId,id:"submit",i:0,data:{answers:a.answers}}); return {ok:true}; }
  if(net) net.send({t:"view",pid:myPid,sc:a});
  return {ok:true};
}
function scShow(st,active,ask){
  if(active) scAsk=ask;
  document.body.style.background="radial-gradient(120% 90% at 50% 20%,#1f6d85,#0f3f52 60%,#082430)";
  if(!sc||!main.contains(sc.el)){
    if(sc&&sc.ctrl) sc.ctrl.destroy();
    main.className="big scroll"; main.style.justifyContent="flex-start";
    main.innerHTML='<div class="scph" style="width:100%;max-width:640px"><div id="scC"></div></div>';
    var ctrl=Scatter.UI.create({root:$("scC"),toast:toast,send:scSend,readyLabel:"I'm done scoring ▶",onProgress:function(ans){ if(net) net.send({t:"view",pid:myPid,sc:{t:"prog",answers:ans}}); }});
    sc={el:main.firstChild,ctrl:ctrl};
  }
  sc.ctrl.update(st); window.__scV=st; window.__sc2=sc;
}
var un=null, unAsk=null;
function unSend(a){
  if(a.t==="uno"||a.t==="catch"||a.t==="jump"){ if(net) net.send({t:"view",pid:myPid,uno:a}); return {ok:true}; }
  if(!unAsk||!net){ toast("Wait for your turn…"); return {ok:false,msg:"Wait for your turn."}; }
  var ask=unAsk; unAsk=null; net.send({t:"pick",pid:myPid,reqId:ask.reqId,id:"act",i:0,data:a});
  return undefined;
}
function unShow(st,active,ask){
  unAsk=active?ask:null;
  document.body.style.background="radial-gradient(120% 90% at 50% 20%,#3a2a78,#241a52 60%,#120c2a)";
  if(!un||!main.contains(un.el)){
    if(un&&un.ctrl) un.ctrl.destroy();
    main.className="big scroll"; main.style.justifyContent="flex-start";
    main.innerHTML='<div class="unph" style="width:100%;max-width:640px"><div id="unAfk"></div><div id="unC"></div></div>';
    var ctrl=Uno.Ctrl.create({root:$("unC"),toast:toast,send:unSend});
    un={el:main.firstChild,ctrl:ctrl};
  }
  un.ctrl.update(st); window.__unV=st; window.__un=un;
  var af=$("unAfk"); if(af){ if(st.afk){ af.innerHTML='<div style="background:#a8281f;border-radius:12px;padding:10px;margin:4px 0;text-align:center;font-weight:800">The computer is playing for you <button id="unTake" style="margin-left:8px;padding:8px 12px;border-radius:10px;border:0;background:#fff;font-weight:900">Take over</button></div>'; $("unTake").onclick=function(){ if(net) net.send({t:"view",pid:myPid,take:1}); }; } else af.innerHTML=""; }
}
var rk=null, rkAsk=null;
function rkSend(a){
  if(!rkAsk||!net){ toast("Wait for your turn…"); return {ok:false,msg:"Wait for your turn."}; }
  var ask=rkAsk; rkAsk=null;
  net.send({t:"pick",pid:myPid,reqId:ask.reqId,id:"act",i:0,data:a});
  return undefined;
}
function rkShow(st,active,ask){
  rkAsk=active?ask:null;
  document.body.style.background="radial-gradient(120% 90% at 50% 20%,#2a4c66,#16293b 60%,#0a141e)";
  if(!rk||!main.contains(rk.el)){
    if(rk&&rk.ctrl) rk.ctrl.destroy();
    main.className="big scroll"; main.style.justifyContent="flex-start";
    main.innerHTML='<div class="rkph" style="width:100%;max-width:680px"><div id="rkAfk"></div><div id="rkB"></div><div id="rkP"></div></div>';
    var board=Risk.Board.create($("rkB"),{labels:"auto"});
    var ctrl=Risk.Ctrl.create({root:$("rkP"),board:board,toast:toast,send:rkSend,blitzDelay:450});
    rk={el:main.firstChild,board:board,ctrl:ctrl};
  }
  rk.board.setView(Risk.Ctrl.boardView(st)); rk.ctrl.update(st); window.__rkV=st; window.__rk=rk;
  var af=$("rkAfk"); if(af){ if(st.afk){ af.innerHTML='<div style="background:#a8281f;border-radius:12px;padding:10px;margin:4px 0;text-align:center;font-weight:800">The computer is playing for you <button id="rkTake" style="margin-left:8px;padding:8px 12px;border-radius:10px;border:0;background:#fff;font-weight:900">Take over</button></div>'; $("rkTake").onclick=function(){ if(net) net.send({t:"view",pid:myPid,take:1}); }; } else af.innerHTML=""; }
}
function showOver(o){
  var win = o.winner||"";
  main.innerHTML='<div class="title">🏆 '+esc(win)+(/ & /.test(win)?' win!':' wins!')+'</div><div class="sub">Thanks for playing. The host can start a new game.</div>';   // a team ("X & Y") wins as a plural, like the TV
}
var toastT;
function toast(m){ var d=document.createElement("div"); d.textContent=m; d.style.cssText="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#000b;padding:10px 16px;border-radius:18px;font-size:14px;z-index:9"; document.body.appendChild(d); setTimeout(function(){d.remove();},1800); }
function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }
})();
</script>
