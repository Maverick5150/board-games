/* ---------- networking ---------- */
var room=null;           // a fresh random room is created every time a game is picked
var net=null;
var players={};         // pid -> {pid,name,color}
var seat={};            // color -> pid
var pending={};         // reqId -> {pid, resolve}
var gameSnap=null;      // set by Monopoly: re-sends the holdings snapshot to phones
var viewHandler=null;   // set by Monopoly: shows the deed a phone is looking at
var lastAsk={};         // pid -> last ask message (for reconnect re-send)
var reqSeq=1;
var inLobby=true;

function send(o,retain){ if(net) net.send(o,retain); }
function startRoom(){
  closeRoom("The host opened a new game room. Scan the new QR code to join.");
  room=BGNet.roomCode();
  players={}; seat={}; pending={}; lastAsk={};
  JOIN_URL=BASE+"play.html?room="+room; SHORT_URL=JOIN_URL.replace(/^https?:\/\//,"");
  net=BGNet.connect(room,"host",{
    status:function(s){ connEl.textContent = s==="online"?"● relay connected":(s==="connecting"?"connecting…":"reconnecting…"); connEl.style.color=s==="online"?"#7CFC9A":"#ffcf7a"; },
    ready:function(){},
    msg:onMsg
  });
}
function closeRoom(msg){
  if(!net) return;
  try{ net.send({t:"wait", pid:"*", msg:msg||"The host closed this room."}); }catch(e){}
  var old=net; net=null;
  setTimeout(function(){ try{ old.close(true); }catch(e){} }, 400);   // let the goodbye go out first
  connEl.textContent="";
}
function broadcastLobby(){ send({t:"lobby", players:Object.keys(players).map(function(p){return players[p];})}, true); }

function onMsg(o){
  if(o.t==="join"){
    if(players[o.pid]){ players[o.pid].name=o.name||players[o.pid].name; }
    else if(inLobby && Object.keys(players).length<maxPlayers()){
      var color=firstFreeColor();
      players[o.pid]={pid:o.pid,name:(o.name||"Player"),color:color};
      seat[color]=o.pid;
      toast((o.name||"Player")+" joined");
    } else if(!inLobby){
      return;   // unknown late joiner mid-game — ignore
    }
    if(players[o.pid]) send({t:"you", pid:o.pid, color:players[o.pid].color, name:players[o.pid].name});
    if(inLobby){ broadcastLobby(); renderLobby(); }
    else {
      // reconnect during the game: re-send their pending prompt so they don't get stuck on the lobby
      var la=lastAsk[o.pid];
      if(la||!noWait) send(la ? la : {t:"wait", pid:o.pid, msg:"Waiting for your turn…"});
      if(gameSnap) gameSnap();
    }
  } else if(o.t==="view"){ if(viewHandler) viewHandler(o);
  } else if(o.t==="pick"){
    var pr=pending[o.reqId];
    if(pr && pr.pid===o.pid){ delete pending[o.reqId]; pr.resolve({id:o.id, i:o.i, data:o.data}); }
  }
}
function firstFreeColor(){ var order=ORDER8; for(var i=0;i<order.length;i++){ if(!seat[order[i]]) return order[i]; } return "red"; }

/* ask a player's phone; resolves with their choice. Shows a TV hint while waiting,
   and auto-advances after a long timeout so a non-responding phone can't hang the game. */
function ask(color, title, sub, options, extraFields){
  var pid=seat[color];
  if(!pid) return Promise.resolve(options&&options[0]?{id:options[0].id,i:0}:{id:null,i:0}); // no controller -> auto first
  var reqId=reqSeq++;
  var msg={t:"ask", pid:pid, reqId:reqId, title:title, sub:sub, options:options}; if(extraFields){ for(var k in extraFields) msg[k]=extraFields[k]; }
  lastAsk[pid]=msg;
  var who = players[pid] ? players[pid].name : "player";
  var hint=$("hint"); if(hint) hint.textContent = "⏳ Waiting for "+who+" — check your phone ("+title+")";
  return new Promise(function(resolve){
    var done=false;
    var fin=function(v){ if(done) return; done=true; clearTimeout(to); if(lastAsk[pid]===msg) delete lastAsk[pid]; var h=$("hint"); if(h) h.textContent="Players: use your phones"; resolve(v); };
    var to=setTimeout(function(){ delete pending[reqId]; fin(options&&options[0]?{id:options[0].id,i:0}:{id:null,i:0}); }, 120000); // 2 min safety
    pending[reqId]={pid:pid, resolve:fin};
    send(msg);
  });
}
function waitPhone(color, msg, turnColor){ var pid=seat[color]; if(pid){ delete lastAsk[pid]; send({t:"wait", pid:pid, msg:msg, turn:turnColor}); } }
function waitAllExcept(activeColor, turnColor){
  Object.keys(seat).forEach(function(c){ if(c!==activeColor) waitPhone(c, CNAME[turnColor]+"’s turn…", turnColor); });
}
function announceStart(){ send({t:"started"}); }
function announceOver(name){ Sound.sfx("win"); send({t:"over", winner:name}, true); }

function playTrouble(){
  var TRACK=28, MAXD=31, cx=300, cy=300, trackR=228, homeR=272;
  var order=["red","green","yellow","blue"];               // play order
  var START={red:0, green:7, yellow:14, blue:21};
  var active=computeActive(order);
  var human={}; active.forEach(function(c){ human[c]=!!seat[c]; });
  var pegs={}; active.forEach(function(c){ pegs[c]=[null,null,null,null]; });
  var die=0, turn=0, sixStreak=0, over=false;

  function ang(i){ return (-90 + 360*i/TRACK)*Math.PI/180; }
  function trackXY(i){ var a=ang(i); return [cx+trackR*Math.cos(a), cy+trackR*Math.sin(a)]; }
  function absSpace(c,d){ return (START[c]+d)%TRACK; }
  function pegXY(c,d){ if(d===null) return null; if(d<=27) return trackXY(absSpace(c,d)); var j=d-28,a=ang(START[c]),r=198-30*j; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
  function homeSlotXY(c,k){ var a=ang(START[c]),bx=cx+homeR*Math.cos(a),by=cy+homeR*Math.sin(a),ox=(k%2?1:-1)*16,oy=(k<2?-1:1)*16; return [bx+ox,by+oy]; }
  function occupantAt(color,targetD){
    if(targetD>27){ for(var k=0;k<4;k++) if(pegs[color][k]===targetD) return {color:color,peg:k}; return null; }
    var abs=absSpace(color,targetD);
    for(var ci=0;ci<active.length;ci++){ var c=active[ci]; for(var p=0;p<4;p++){ var d=pegs[c][p]; if(d===null||d>27) continue; if(absSpace(c,d)===abs) return {color:c,peg:p}; } }
    return null;
  }
  function legalMoves(color,roll){
    var mv=[];
    for(var k=0;k<4;k++){ var d=pegs[color][k];
      if(d===null){ if(roll===6){ var occ=occupantAt(color,0); if(!(occ&&occ.color===color)) mv.push({peg:k,from:null,to:0}); } continue; }
      var nd=d+roll; if(nd>MAXD) continue; var o2=occupantAt(color,nd); if(o2&&o2.color===color) continue; mv.push({peg:k,from:d,to:nd});
    }
    return mv;
  }
  function applyMove(color,mv){ if(mv.to<=27){ var occ=occupantAt(color,mv.to); if(occ&&occ.color!==color){ pegs[occ.color][occ.peg]=null; toast(CNAME[occ.color]+" sent home!"); waitPhone(occ.color, CNAME[occ.color]+" — bumped home!", color); } } pegs[color][mv.peg]=mv.to; }
  function hasWon(color){ return pegs[color].every(function(d){return d!==null&&d>=28;}); }
  function moveLabel(c,mv){

    if(mv.to<=27){ var occ=occupantAt(c,mv.to); if(occ&&occ.color!==c) bump=" — bump "+CNAME[occ.color]+"!"; }
    if(mv.from===null) return "Peg "+n+": leave HOME"+bump;
    if(mv.to>=28) return "Peg "+n+": into FINISH"+bump;
    return "Peg "+n+": move "+die+bump;
  }

  // ---- rendering ----
  var svg;
  function dieFace(v,ox,oy,size){ if(!v) return ""; var h=size/2,o=size*0.26,pr=size*0.08; var s='<rect x="'+(ox-h)+'" y="'+(oy-h)+'" width="'+size+'" height="'+size+'" rx="11" fill="#fdfdfd" stroke="#0005" stroke-width="2"/>'; var P={TL:[-o,-o],TR:[o,-o],ML:[-o,0],MC:[0,0],MR:[o,0],BL:[-o,o],BR:[o,o]}; var M={1:['MC'],2:['TL','BR'],3:['TL','MC','BR'],4:['TL','TR','BL','BR'],5:['TL','TR','MC','BL','BR'],6:['TL','TR','ML','MR','BL','BR']}; M[v].forEach(function(k){ var d=P[k]; s+='<circle cx="'+(ox+d[0])+'" cy="'+(oy+d[1])+'" r="'+pr+'" fill="#1b2340"/>'; }); return s; }
  function build(){
    var s='<defs><radialGradient id="dg" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#d6def4"/><stop offset="1" stop-color="#9aa8cf"/></radialGradient><radialGradient id="pl" cx="50%" cy="42%" r="70%"><stop offset="0" stop-color="#1b2a55"/><stop offset="1" stop-color="#0c1329"/></radialGradient></defs>';
    s+='<circle cx="300" cy="300" r="294" fill="url(#pl)" stroke="#2a3663" stroke-width="4"/>';
    active.forEach(function(c){ var a=ang(START[c]); var p0=trackXY(START[c]); var x1=cx+100*Math.cos(a),y1=cy+100*Math.sin(a); s+='<line x1="'+p0[0].toFixed(1)+'" y1="'+p0[1].toFixed(1)+'" x2="'+x1.toFixed(1)+'" y2="'+y1.toFixed(1)+'" stroke="'+COL[c]+'" stroke-width="30" stroke-linecap="round" opacity="0.18"/>'; });
    for(var i=0;i<TRACK;i++){ var xy=trackXY(i); s+='<circle cx="'+xy[0].toFixed(1)+'" cy="'+xy[1].toFixed(1)+'" r="15.5" fill="#f2f5ff" stroke="#9fb0d8" stroke-width="2"/>'; }
    active.forEach(function(c){ var sp=trackXY(START[c]); s+='<circle cx="'+sp[0].toFixed(1)+'" cy="'+sp[1].toFixed(1)+'" r="15.5" fill="'+COL[c]+'" stroke="#0005" stroke-width="2"/>';
      for(var j=0;j<4;j++){ var f=pegXY(c,28+j); s+='<circle cx="'+f[0].toFixed(1)+'" cy="'+f[1].toFixed(1)+'" r="14" fill="'+COL[c]+'" stroke="#0006" stroke-width="2" opacity="0.9"/><circle cx="'+f[0].toFixed(1)+'" cy="'+f[1].toFixed(1)+'" r="8" fill="#0003"/>'; }

    var c=active[turn];

    var inner='<circle cx="300" cy="300" r="94" fill="#0b1228" stroke="#2a3663" stroke-width="4"/><circle cx="300" cy="300" r="86" fill="url(#dg)"/><ellipse cx="278" cy="270" rx="26" ry="16" fill="#ffffff55"/>';

    if(!over) inner+='<circle cx="300" cy="300" r="94" fill="none" stroke="'+COL[c]+'" stroke-width="5"><animate attributeName="opacity" values="0.35;1;0.35" dur="1.1s" repeatCount="indefinite"/></circle>';

      await sleep(300);

  }

}

  function buildDeck(){ var d=[],add=function(v,n){for(var i=0;i<n;i++)d.push(v);}; add(1,5);add(2,4);add(3,4);add(4,4);add(5,4);add(7,4);add(8,4);add(10,4);add(11,4);add(12,4);add("sorry",4); return d; }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }

  var active=computeActive(order);

  var human={}; active.forEach(function(c){ human[c]=!!seat[c]; });
  var deck=shuffle(buildDeck()), over=false;

  function allP(){ var a=[]; active.forEach(function(c){ a=a.concat(pawns[c]); }); return a; }
  function stepFwd(color,loc){ if(loc.t==="start"||loc.t==="home")return null; if(loc.t==="ring"){ if(loc.i===SAFE_ENTRY[color])return{t:"safe",j:0}; return{t:"ring",i:(loc.i+1)%60}; } if(loc.t==="safe")return loc.j<4?{t:"safe",j:loc.j+1}:{t:"home"}; return null; }
  function stepBack(color,loc){ if(loc.t==="start"||loc.t==="home")return null; if(loc.t==="ring")return{t:"ring",i:(loc.i+59)%60}; if(loc.t==="safe")return loc.j>0?{t:"safe",j:loc.j-1}:{t:"ring",i:SAFE_ENTRY[color]}; return null; }

    if(allowSlide){ var sl=slideTri(dest.i); if(sl&&sl.color!==mover.color){ var set={}; sl.cells.forEach(function(x){set[x]=1;}); allP().forEach(function(p){ if(p!==mover&&p.loc.t==="ring"&&set[p.loc.i]) toStart(p); }); mover.loc={t:"ring",i:sl.cells[sl.cells.length-1]}; toast(CNAME[mover.color]+" slid!"); return; } }
    occAtRing(dest.i,mover).forEach(function(p){ toStart(p); toast(CNAME[p.color]+" bumped!"); }); mover.loc=dest; }
  function legal(color,c){ var list=[],ps=pawns[color]; var onB=ps.filter(function(p){return p.loc.t!=="start"&&p.loc.t!=="home";}); var canL=function(p,loc){return !ownAt(color,loc,p);};
    function fwd(n){ onB.forEach(function(p){ var d=travel(color,p.loc,n,1); if(d&&canL(p,d))list.push({k:"fwd",p:p,n:n}); }); }

    else if(c===10){fwd(10);bk(1);}

  function actLabel(a){ if(a.k==="out")return"#"+(a.p.id+1)+" leave Start"; if(a.k==="fwd")return"#"+(a.p.id+1)+" forward "+a.n; if(a.k==="back")return"#"+(a.p.id+1)+" back "+a.n; if(a.k==="swap")return"#"+(a.p.id+1)+" swap w/ "+CNAME[a.target.color]+" #"+(a.target.id+1); if(a.k==="sorry")return"SORRY! bump "+CNAME[a.target.color]+" #"+(a.target.id+1); if(a.k==="split")return"#"+(a.A.id+1)+"+"+a.a+" & #"+(a.B.id+1)+"+"+a.b; return"?"; }

  // rendering
  var svg;
  function rr(x,y,w,h,r,fill,st,sw){ return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+r+'" fill="'+fill+'"'+(st?' stroke="'+st+'" stroke-width="'+(sw||2)+'"':'')+'/>'; }
  function cell(c,r,fill,st,sw){ var p=px(c,r); return rr(p[0]-HALF+2,p[1]-HALF+2,CELL-4,CELL-4,6,fill,st,sw); }
  function build(){

    for(var i=0;i<60;i++){ var cr=ringCR(i); s+=cell(cr[0],cr[1],"#ffffff","#c9c2ad",2); }
    SLIDES.forEach(function(sl){ var pts=sl.cells.map(ringPx),x0=pts[0][0],y0=pts[0][1],x1=pts[pts.length-1][0],y1=pts[pts.length-1][1];
      s+='<line x1="'+x0+'" y1="'+y0+'" x2="'+x1+'" y2="'+y1+'" stroke="'+COL[sl.color]+'" stroke-width="12" stroke-linecap="round" opacity="0.55"/>';
      var ang=Math.atan2(y1-y0,x1-x0),dx=Math.cos(ang),dy=Math.sin(ang),nx=-dy,ny=dx;

    });

      SAFE_CELLS[c].forEach(function(cc){ s+=cell(cc[0],cc[1],COL[c]+"cc","#0004",2); });
      var hc=HOME_CELL[c],hp=px(hc[0],hc[1]); s+=rr(hp[0]-26,hp[1]-26,52,52,12,COL[c],"#0006",3);
      s+='<text x="'+hp[0]+'" y="'+(hp[1]+4)+'" transform="rotate('+rot+','+hp[0]+','+hp[1]+')" text-anchor="middle" font-size="12" font-weight="800" fill="'+INK[c]+'">HOME</text>';
      var sc=START_CELL[c],sp=px(sc[0],sc[1]); s+='<circle cx="'+sp[0]+'" cy="'+sp[1]+'" r="30" fill="'+COL[c]+'33" stroke="'+COL[c]+'" stroke-width="3"/>';
      var sa=Math.atan2(sp[1]-300,sp[0]-300),lx=(sp[0]+52*Math.cos(sa)).toFixed(1),ly=(sp[1]+52*Math.sin(sa)).toFixed(1);

  function pawnXY(p){ var l=p.loc; if(l.t==="ring")return ringPx(l.i); if(l.t==="safe"){ var sc=SAFE_CELLS[p.color][l.j]; return px(sc[0],sc[1]); } if(l.t==="home"){ var hc=HOME_CELL[p.color],b=px(hc[0],hc[1]); return [b[0]-12+(p.id%2)*24,b[1]-12+(p.id<2?0:24)]; } var sc2=START_CELL[p.color],b2=px(sc2[0],sc2[1]); return [b2[0]-11+(p.id%2)*22,b2[1]-11+(p.id<2?0:22)]; }
  function renderPawns(){ Array.prototype.slice.call(svg.querySelectorAll(".pawn")).forEach(function(e){e.remove();});
    active.forEach(function(c){ pawns[c].forEach(function(p){ var xy=pawnXY(p); var g=document.createElementNS("http://www.w3.org/2000/svg","g"); g.setAttribute("class","pawn"); g.setAttribute("transform","translate("+xy[0].toFixed(1)+","+xy[1].toFixed(1)+")"); g.innerHTML='<circle r="10.5" fill="'+COL[c]+'" stroke="#0008" stroke-width="2"/><circle r="3.4" cx="-3" cy="-3" fill="#ffffff99"/><text y="3.5" text-anchor="middle" font-size="10" font-weight="800" fill="'+INK[c]+'">'+(p.id+1)+'</text>'; svg.appendChild(g); }); });
  }
  function buildPath(color,loc,n,dir){ var path=[],cur=loc; for(var s=0;s<n;s++){ cur=dir>0?stepFwd(color,cur):stepBack(color,cur); if(!cur)break; path.push(cur); } return path; }
  async function animMove(pawn,path){ for(var k=0;k<path.length;k++){ pawn.loc=path[k]; Sound.sfx("tick"); renderPawns(); await sleep(150); } }

    else if(a.k==="fwd"){ await animMove(a.p,buildPath(color,a.p.loc,a.n,1)); resolveLand(a.p,a.p.loc,true); renderPawns(); }

  function prog(color,loc){ if(loc.t==="start")return -1; if(loc.t==="home")return 100; if(loc.t==="safe")return 60+loc.j; return (loc.i-START_EXIT[color]+60)%60; }
  function scoreA(a){ var color=a.p?a.p.color:a.A.color; var ev=function(p,dest){ var sc=0; if(!dest)return -999; if(dest.t==="home")sc+=200; else if(dest.t==="safe")sc+=60+dest.j*4; else if(dest.t==="ring"){ var sl=slideTri(dest.i); if(sl&&sl.color!==color){sc+=70+sl.cells.length*4; sc+=occAtRing(dest.i,p).length*20;} else sc+=occAtRing(dest.i,p).filter(function(o){return o.color!==color;}).length*55; sc+=prog(color,dest)*0.6; } return sc; };

  function wrapTxt(t,n){ var w=String(t).split(" "),lines=[],cur=""; w.forEach(function(x){ if((cur+" "+x).trim().length>n){ lines.push(cur.trim()); cur=x; } else cur=cur+" "+x; }); if(cur.trim()) lines.push(cur.trim()); return lines; }
  function centerCard(v,c,who,back){

    var g=document.createElementNS("http://www.w3.org/2000/svg","g"); g.setAttribute("id","cardc");
    var col=COL[c], cx0=300, cy0=300, w=160, h=222, x0=cx0-w/2, y0=cy0-h/2;
    var t='<rect x="'+(x0+6)+'" y="'+(y0+8)+'" width="'+w+'" height="'+h+'" rx="14" fill="#0005"/>';
    if(back){
      t+='<rect x="'+x0+'" y="'+y0+'" width="'+w+'" height="'+h+'" rx="14" fill="'+col+'" stroke="#fff" stroke-width="5"/>';
      t+='<text x="300" y="'+(cy0-4)+'" text-anchor="middle" font-size="26" font-weight="900" fill="#fff" stroke="#0006" stroke-width="2" paint-order="stroke">SORRY!</text>';
      t+='<text x="300" y="'+(cy0+26)+'" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">'+esc(who)+' draws…</text>';
    } else {
      t+='<rect x="'+x0+'" y="'+y0+'" width="'+w+'" height="'+h+'" rx="14" fill="#fff" stroke="'+col+'" stroke-width="8"/>';
      t+='<text x="300" y="'+(y0+26)+'" text-anchor="middle" font-size="14" font-weight="800" fill="#555">'+esc(who)+' drew</text>';
      var big=(v==="sorry")?"SORRY!":String(v);
      t+='<text x="300" y="'+(v==="sorry"?cy0+6:cy0+20)+'" text-anchor="middle" font-size="'+(v==="sorry"?36:84)+'" font-weight="900" fill="'+col+'">'+big+'</text>';
      wrapTxt(CARD_TEXT[v],21).forEach(function(L,i){ t+='<text x="300" y="'+(cy0+52+i*16)+'" text-anchor="middle" font-size="13" font-weight="700" fill="#222">'+esc(L)+'</text>'; });
    }
    g.innerHTML=t; svg.appendChild(g);
  }
  async function run(){
    gameFrame("sboard"); svg=$("sboard"); build();
    var turn=0;
    while(!over){
      var c=active[turn]; waitAllExcept(c,c);
      setStatus('<span class="dot" style="background:'+COL[c]+'"></span> '+(seat[c]?players[seat[c]].name:CNAME[c]+" (CPU)")+" — "+(human[c]?"draw on your phone":"drawing…"));
      centerCard(null,c,(seat[c]?players[seat[c]].name:CNAME[c]),true);
      if(human[c]){ await ask(c,"Your turn","Draw a card",[{id:"draw",label:"🂠 DRAW A CARD"}],{card:{back:true,color:c,who:(seat[c]?players[seat[c]].name:CNAME[c])}}); }
      else { await sleep(1000); }
      if(deck.length===0) deck=shuffle(buildDeck());
      var v=deck.pop();
      centerCard(v,c,(seat[c]?players[seat[c]].name:CNAME[c]),false);
      active.forEach(function(x){ if(seat[x]) send({t:"wait",pid:seat[x],msg:(seat[c]?players[seat[c]].name:CNAME[c])+" drew a card",turn:c,card:{v:v,text:CARD_TEXT[v],color:c,who:(seat[c]?players[seat[c]].name:CNAME[c])}}); });
      setStatus('<span class="dot" style="background:'+COL[c]+'"></span> '+(seat[c]?players[seat[c]].name:CNAME[c])+' drew <b style="font-size:4vh;color:#ffd86b">'+(v==="sorry"?"SORRY!":v)+'</b> — '+CARD_TEXT[v]);
      await sleep(1200);
      var acts=legal(c,v), moved=false;
      if(acts.length){
        var act;
        if(human[c]){ var opts=acts.map(function(a,i){ return {id:String(i),label:actLabel(a),color:c}; }); var pick=await ask(c,"You drew "+(v==="sorry"?"SORRY!":v),CARD_TEXT[v],opts,{card:{v:v,text:CARD_TEXT[v],color:c,who:(seat[c]?players[seat[c]].name:CNAME[c])}}); act=acts[parseInt(pick.id,10)]||acts[0]; }
        else { var best=acts[0],bs=-1e9; acts.forEach(function(a){ var s=scoreA(a); if(s>bs){bs=s;best=a;} }); act=best; }
        await applyAnim(act); moved=true;
        if(hasWon(c)){ over=true; var wn=seat[c]?players[seat[c]].name:CNAME[c]; setStatus('<span class="dot" style="background:'+COL[c]+'"></span> 🏆 '+wn+" wins!"); announceOver(wn); showPlayAgain(); return; }
      } else { setStatus('<span class="dot" style="background:'+COL[c]+'"></span> '+(seat[c]?players[seat[c]].name:CNAME[c])+" — no move"); await sleep(1100); }
      if(v===2 && moved){ /* draw again, same player */ }
      else turn=(turn+1)%active.length;
      await sleep(300);
    }
  }
  run();
}

/* ============================================================
   MONOPOLY  (TV host) — playable core: roll, buy, rent, cards,
   tax, jail, build, mortgage, auctions, bankruptcy. (Trading next.)
   ============================================================ */
function playMonopoly(){
  var order=["red","blue","green","yellow"];
  var active=computeActive(order);
  var COLORVAR={brown:"#8b5a2b",light_blue:"#9fd0ef",pink:"#d93a96",orange:"#f08d1c",red:"#e23b3b",yellow:"#f3d41b",green:"#1f9d54",dark_blue:"#2b4fe0"};
  var TOKS=["🎩","🏎️","🐕","🚢"];
  var BOARD=MONO_BOARD, CHANCE=MONO_CHANCE, CHEST=MONO_CHEST, RR_IDX=[5,15,25,35], UTIL_IDX=[12,28];
  var GROUPS={}; BOARD.forEach(function(s,i){ if(s.t==="prop"){ (GROUPS[s.g]=GROUPS[s.g]||[]).push(i); } });

  // per-player state keyed by color
  var cash={}, pos={}, injail={}, jailT={}, jokers={}, bankrupt={}, tokE={};
  active.forEach(function(c,i){ cash[c]=1500; pos[c]=0; injail[c]=false; jailT[c]=0; jokers[c]=0; bankrupt[c]=false; tokE[c]=TOKS[i%4]; });
  var owner=[], houses=[], mort=[]; for(var i=0;i<40;i++){ owner[i]=null; houses[i]=0; mort[i]=false; }
  var housesLeft=32, hotelsLeft=12;
  var chanceDeck=shuf(rangeArr(16)), chanceDisc=[], chestDeck=shuf(rangeArr(16)), chestDisc=[];
  var dice=[0,0], doublesCount=0, turn=0, over=false;
  var R={}; for(var rk in monoRules) R[rk]=monoRules[rk];
  var fpPool=0, heldCh=0, heldCs=0, snapT=null;
  var centerGame="", centerView="";
  function centerRender(){ var el=boardEl&&boardEl.querySelector(".mcenter"); if(!el) return; var h=centerView||centerGame; el.innerHTML = h?('<div class="mcw">'+h+'</div>'):'<div class="mlogo">MONOPOLY</div>'; }
  function setGameCenter(h){ centerGame=h||""; centerRender(); }
  function deedBox(i,who){ return '<div class="mwho">'+who+'</div><div class="mdeed">'+window.monoDeedHTML(i)+'</div>'; }
  function cardBox(deckName,c,text){ var isCh=deckName==="chance", col=isCh?"#f08d1c":"#2b7be0"; return '<div class="mwho">'+esc(nm(c))+' draws…</div><div class="mcard" style="border-color:'+col+'"><h2 style="color:'+col+'">'+(isCh?"CHANCE":"COMMUNITY CHEST")+'</h2><p>'+esc(text)+'</p></div>'; }
  function colorOfPid(pid){ for(var k in seat) if(seat[k]===pid) return k; return null; }
  viewHandler=function(o){ var c=colorOfPid(o.pid); var sp=(o.i!=null)?BOARD[o.i]:null;
    if(!c||!sp||!sp.price){ centerView=""; } else { centerView=deedBox(o.i,"👀 "+esc(nm(c))+" is looking at "+esc(sp.n)); }
    centerRender(); };
  function rangeArr(n){ var a=[]; for(var i=0;i<n;i++)a.push(i); return a; }
  function shuf(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
  function nm(c){ return seat[c]?players[seat[c]].name:(CNAME[c]+" (CPU)"); }
  function human(c){ return !!seat[c]; }
  function alive(){ return active.filter(function(c){return !bankrupt[c];}); }
  function money(n){ return (n<0?"-$":"$")+Math.abs(n); }

  function rrOwned(c){ return RR_IDX.filter(function(i){return owner[i]===c;}).length; }
  function utilOwned(c){ return UTIL_IDX.filter(function(i){return owner[i]===c;}).length; }
  function ownsGroup(c,g){ return GROUPS[g].every(function(i){return owner[i]===c;}); }
  function netWorth(c){ var w=cash[c]; for(var i=0;i<40;i++) if(owner[i]===c){ var s=BOARD[i]; w+= mort[i]?Math.floor((s.price||0)/2):(s.price||0); if(s.t==="prop") w+=houses[i]*s.house; } return w; }
  function computeRent(i,o,mult,ds){ var s=BOARD[i]; mult=mult||1;
    if(s.t==="prop"){ if(houses[i]>0) return s.rent[houses[i]]; return ownsGroup(o,s.g)?s.rent[0]*2:s.rent[0]; }
    if(s.t==="rr"){ var n=rrOwned(o); return 25*Math.pow(2,n-1)*mult; }
    if(s.t==="util"){ var n2=utilOwned(o); if(mult>1) return 10*ds; return (n2===2?10:4)*ds; }
    return 0; }

  // ---------- rendering (HTML grid) ----------
  var boardEl;
  function spGrid(i){ var r,c; if(i<=10){r=10;c=10-i;} else if(i<=20){c=0;r=20-i;} else if(i<=30){r=0;c=i-20;} else {c=10;r=i-30;} return [r,c]; }
  function barSide(i){ if(i<=10)return"top"; if(i<=20)return"right"; if(i<=30)return"bottom"; return"left"; }
  function toksAt(i){ var here=active.filter(function(c){return !bankrupt[c]&&pos[c]===i;}); if(!here.length)return""; return '<div class="mtok">'+here.map(function(c){return '<span style="filter:drop-shadow(0 0 1px '+PC(c)+')">'+tokE[c]+'</span>';}).join("")+'</div>'; }
  function PC(c){ return COL[c]; }
  function spInner(i){ var s=BOARD[i];
    if(i===0||i===10||i===20||i===30){ var lab={0:"GO →",10:"JAIL",20:"FREE PARKING",30:"GO TO JAIL"}[i]; return '<div class="mcorner" style="position:absolute;inset:0">'+lab+'</div>'+toksAt(i); }
    var angle = i<=10?0 : i<=20?90 : i<=30?180 : 270;   // rotate names/price to face each side
    var inner="";
    if(s.t==="prop") inner+='<div class="mcbar" style="background:'+COLORVAR[s.g]+'"></div>';
    inner+='<div class="mnm">'+s.n+'</div>';
    var icon = s.t==="rr"?"🚂":s.t==="util"?(i===12?"💡":"🚰"):s.t==="chance"?"?":s.t==="cc"?"📦":s.tax==="income"?"💵":s.tax==="luxury"?"💎":"";
    if(icon) inner+='<div class="mic">'+icon+'</div>';
    if(s.price) inner+='<div class="mpr">$'+s.price+'</div>';
    if(owner[i]!=null) inner+='<div class="mown" style="background:'+PC(owner[i])+'"></div>';
    var h='<div class="mspin" style="transform:rotate('+angle+'deg)">'+inner+'</div><div class="movl">';
    if(s.t==="prop"&&houses[i]>0) h+= houses[i]===5?'<div class="mhs"><i class="hotel"></i></div>':'<div class="mhs">'+Array(houses[i]+1).join("<i></i>")+'</div>';
    if(mort[i]) h+='<div class="mmort"></div>';
    h+='</div>'+toksAt(i);
    return h;
  }
  function renderBoard(){ var html=""; for(var i=0;i<40;i++){ var rc=spGrid(i); html+='<div class="msp" style="grid-row:'+(rc[0]+1)+';grid-column:'+(rc[1]+1)+'">'+spInner(i)+'</div>'; } html+='<div class="mcenter"><div class="mlogo">MONOPOLY</div></div>'; boardEl.innerHTML=html; centerRender(); renderScore(); snapSoon(); }
  function renderScore(){ var el=$("mscore"); if(!el) return; var h='<div class="mshead">Players</div>';
    active.forEach(function(c){ var props=[]; for(var i=0;i<40;i++) if(owner[i]===c) props.push(i);
      h+='<div class="msrow'+(bankrupt[c]?' out':'')+(active[turn]===c&&!bankrupt[c]?' cur':'')+'"><div class="msname"><span class="dot" style="background:'+PC(c)+'"></span>'+tokE[c]+' '+esc(nm(c))+'</div><div class="mscash">'+money(cash[c])+(injail[c]?' 🔒':'')+(jokers[c]?' 🎫'+jokers[c]:'')+(bankrupt[c]?' OUT':'')+'</div><div class="mschips">'+props.map(function(i){ var sp=BOARD[i]; var col=sp.t==="prop"?COLORVAR[sp.g]:"#555"; return '<i style="background:'+col+(mort[i]?';opacity:.35':'')+'" title="'+sp.n+'">'+(houses[i]>0?(houses[i]===5?'H':houses[i]):(sp.t==="rr"?'R':sp.t==="util"?'U':''))+'</i>'; }).join("")+'</div></div>'; });
    if(R.fpJackpot) h+='<div class="msfp">🅿️ Free Parking: '+money(fpPool)+'</div>';
    el.innerHTML=h; }
  function snapNow(){ var pl=active.map(function(c){ var props=[]; for(var i=0;i<40;i++) if(owner[i]===c) props.push({i:i,h:houses[i],m:mort[i]}); return {color:c,pid:seat[c]||null,name:nm(c),cash:cash[c],net:netWorth(c),jail:injail[c],jokers:jokers[c],bankrupt:bankrupt[c],props:props}; }); send({t:"snap",players:pl,fp:R.fpJackpot?fpPool:0}); }
  function snapSoon(){ clearTimeout(snapT); snapT=setTimeout(snapNow,400); }
  function tv(html){ setStatus(html); }
  function turnBanner(c,extra){ tv('<span class="dot" style="background:'+PC(c)+'"></span> '+tokE[c]+' <b>'+nm(c)+'</b> · '+money(cash[c])+(R.fpJackpot&&fpPool>0?' · 🅿️ '+money(fpPool):'')+(extra?' · '+extra:'')); }

  // ---------- money / debt ----------
  async function payBank(c,amt){ cash[c]-=amt; if(R.fpJackpot) fpPool+=amt; if(cash[c]<0) await resolveDebt(c,null); }
  async function payTo(c,to,amt){ cash[c]-=amt; cash[to]+=amt; if(cash[c]<0) await resolveDebt(c,to); }
  function liquidatable(c){ var v=cash[c]; for(var i=0;i<40;i++) if(owner[i]===c){ var s=BOARD[i]; if(s.t==="prop"&&houses[i]>0) v+=Math.floor(houses[i]*s.house/2); if(!mort[i]) v+=Math.floor((s.price||0)/2); } return v; }
  function aiRaise(c){ var guard=200; while(cash[c]<0 && guard-->0){ var best=-1,bh=0; for(var i=0;i<40;i++) if(owner[i]===c&&BOARD[i].t==="prop"&&houses[i]>bh){bh=houses[i];best=i;} if(best>=0){ sellHouse(c,best); continue; } var did=false; for(var j=0;j<40;j++) if(owner[j]===c&&!mort[j]&&(BOARD[j].t!=="prop"||houses[j]===0)){ doMort(c,j); did=true; break; } if(!did) break; } }
  function propActions(c,i,debt){ var s=BOARD[i], a=[];
    if(debt){ if(s.t==="prop"&&houses[i]>0) a.push({id:"s"+i,label:"Sell a building (+"+money(Math.floor(s.house/2))+")"}); else if(!mort[i]) a.push({id:"m"+i,label:"Mortgage (+"+money(s.mort)+")",color:"red"}); return a; }
    if(canBuild(c,i)&&cash[c]>=s.house) a.push({id:"b"+i,label:(houses[i]===4?"🏨 Build Hotel":"🏠 Build House")+" — "+money(s.house),color:"green"});
    if(s.t==="prop"&&houses[i]>0&&canSell(c,i)) a.push({id:"s"+i,label:"Sell a building (+"+money(Math.floor(s.house/2))+")"});
    if(!mort[i]&&(s.t!=="prop"||houses[i]===0)) a.push({id:"m"+i,label:"Mortgage (+"+money(s.mort)+")",color:"red"});
    if(mort[i]&&cash[c]>=Math.ceil(s.mort*1.1)) a.push({id:"u"+i,label:"Lift mortgage — "+money(Math.ceil(s.mort*1.1)),color:"green"});
    return a; }
  function propList(c,debt){ var arr=[]; for(var i=0;i<40;i++) if(owner[i]===c) arr.push({i:i,h:houses[i],m:mort[i],actions:propActions(c,i,debt)}); return arr; }
  async function resolveDebt(c,creditor){
    if(human(c)){
      while(cash[c]<0){
        if(liquidatable(c)<0){ declareBankrupt(c,creditor); return; }
        var pick=await ask(c,"You owe "+money(-cash[c])+" more","Tap a property to sell buildings / mortgage, or declare bankruptcy",[{id:"bankrupt",label:"❌ Declare Bankruptcy"}],{kind:"manage",props:propList(c,true),extra:[{id:"bankrupt",label:"❌ Declare Bankruptcy",color:"red"}]});
        if(!pick.id||pick.id==="bankrupt"){ declareBankrupt(c,creditor); return; }
        var op=pick.id[0], idx=parseInt(pick.id.slice(1),10);
        if(owner[idx]===c){ if(op==="s") sellHouse(c,idx); else if(op==="m") doMort(c,idx); }
        renderBoard(); turnBanner(c);
      }
    } else { aiRaise(c); if(cash[c]<0) declareBankrupt(c,creditor); }
  }
  function declareBankrupt(c,creditor){
    toast(nm(c)+" is bankrupt!");
    var refund=0;
    for(var i=0;i<40;i++) if(owner[i]===c && BOARD[i].t==="prop" && houses[i]>0){ refund+=Math.floor(houses[i]*BOARD[i].house/2); if(houses[i]===5)hotelsLeft++; else housesLeft+=houses[i]; houses[i]=0; }
    if(creditor){ cash[creditor]+=cash[c]+refund; jokers[creditor]+=jokers[c]; for(var j=0;j<40;j++) if(owner[j]===c) owner[j]=creditor; }
    else { for(var k=0;k<40;k++) if(owner[k]===c){ owner[k]=null; mort[k]=false; } for(var jk=0;jk<jokers[c];jk++) returnJoker(); }
    cash[c]=0; jokers[c]=0; bankrupt[c]=true;
    if(seat[c]) send({t:"wait", pid:seat[c], msg:"You went bankrupt — game over for you."});
    renderBoard();
  }

  // ---------- build / mortgage ----------
  function canBuild(c,i){ var s=BOARD[i]; if(s.t!=="prop"||owner[i]!==c) return false; if(!ownsGroup(c,s.g)) return false; if(GROUPS[s.g].some(function(x){return mort[x];})) return false; if(houses[i]>=5) return false; if(houses[i]===4){ return R.unlimited||hotelsLeft>0; } if(!R.unlimited&&housesLeft<=0) return false; if(!R.evenBuild) return true; var min=Math.min.apply(null,GROUPS[s.g].map(function(x){return houses[x];})); return houses[i]===min; }
  function buildHouse(c,i){ var s=BOARD[i]; if(!canBuild(c,i)||cash[c]<s.house) return; cash[c]-=s.house; if(houses[i]===4){ houses[i]=5; hotelsLeft--; housesLeft+=4; } else { houses[i]++; housesLeft--; } }
  function canSell(c,i){ var s=BOARD[i]; if(s.t!=="prop"||owner[i]!==c||houses[i]<=0) return false; if(!R.evenBuild) return true; var max=Math.max.apply(null,GROUPS[s.g].map(function(x){return houses[x];})); return houses[i]===max; }
  function sellHouse(c,i){ if(houses[i]<=0) return; cash[c]+=Math.floor(BOARD[i].house/2); if(houses[i]===5){ houses[i]=4; hotelsLeft++; housesLeft-=4; } else { houses[i]--; housesLeft++; } }
  function doMort(c,i){ var s=BOARD[i]; if(owner[i]!==c||mort[i]) return; if(s.t==="prop"&&houses[i]>0){ while(houses[i]>0) sellHouse(c,i); } mort[i]=true; cash[c]+=s.mort; }
  function unMort(c,i){ var s=BOARD[i]; if(owner[i]!==c||!mort[i]) return; var cost=Math.ceil(s.mort*1.1); if(cash[c]<cost) return; cash[c]-=cost; mort[i]=false; }
  async function manage(c){
    while(true){
      var pick=await ask(c,"Your properties — "+money(cash[c]),"Tap a property to see its title deed",[{id:"done",label:"◀ Done"}],{kind:"manage",props:propList(c,false),extra:[{id:"done",label:"◀ Done",color:"blue"}]});
      if(!pick.id||pick.id==="done") return;
      var op=pick.id[0], idx=parseInt(pick.id.slice(1),10);
      if(owner[idx]===c){ if(op==="b") buildHouse(c,idx); else if(op==="s") sellHouse(c,idx); else if(op==="m") doMort(c,idx); else if(op==="u") unMort(c,idx); }
      renderBoard(); turnBanner(c);
    }
  }
  function aiBuild(c){ var guard=40,imp=true; while(imp&&guard-->0){ imp=false; for(var g in GROUPS){ if(!ownsGroup(c,g))continue; var lots=GROUPS[g].slice().sort(function(a,b){return houses[a]-houses[b];}); for(var k=0;k<lots.length;k++){ var i=lots[k]; if(cash[c]>BOARD[i].house+250 && canBuild(c,i)){ buildHouse(c,i); imp=true; break; } } } } }

  // ---------- movement ----------
  function passGo(c){ cash[c]+=200; toast(nm(c)+" passes GO +$200"); }
  async function stepTo(c,steps){ for(var s=0;s<steps;s++){ pos[c]=(pos[c]+1)%40; Sound.sfx("tick"); if(pos[c]===0) passGo(c); renderBoard(); await sleep(150); } }
  async function moveToIdx(c,idx,collect){ var steps=(idx-pos[c]+40)%40; await stepTo(c,steps); }
  function goJail(c){ pos[c]=10; injail[c]=true; jailT[c]=0; doublesCount=0; renderBoard(); }

  // ---------- auction ----------
  async function auction(i){
    toast("Auction: "+BOARD[i].n);
    var bidders=alive().slice(); var price=0, high=null, idx=0;
    while(bidders.length>1){
      var c=bidders[idx%bidders.length];
      var need=price+(price<20?5:10);
      setGameCenter(deedBox(i,"🔨 Auction — "+(price?"high bid "+money(price)+" by "+esc(nm(high)):"no bids yet")+" · "+esc(nm(c))+" to bid"));
      var bid;
      if(human(c)){
        var opts=[{id:"bid",label:"Bid "+money(need),color:"green"},{id:"pass",label:"Pass",color:"red"}];
        if(cash[c]<need) opts=[{id:"pass",label:"Pass (can’t afford "+money(need)+")",color:"red"}];
        turnBanner(c,"Auction "+BOARD[i].n+" — high "+(price?money(price):"none"));
        var pk=await ask(c,"Auction: "+BOARD[i].n,"High bid "+(price?money(price)+" by "+nm(high):"none"),opts);
        bid = pk.id==="bid";
      } else { await sleep(500); var val=aiAuctionVal(c,i); bid = (need<=val && cash[c]>=need); }
      if(bid){ price=need; high=c; idx++; } else { bidders=bidders.filter(function(x){return x!==c;}); }
    }
    if(high!=null){ cash[high]-=price; owner[i]=high; toast(nm(high)+" wins "+BOARD[i].n+" for "+money(price)); }
    renderBoard();
  }
  function aiAuctionVal(c,i){ var s=BOARD[i]; var v=s.price; if(s.t==="prop"){ var owned=GROUPS[s.g].filter(function(x){return owner[x]===c;}).length; if(owned>0) v=Math.floor(s.price*(1+0.4*owned)); } if(s.t==="rr") v=Math.floor(s.price*1.2); return Math.min(v,Math.max(0,cash[c]-50)); }

  // ---------- cards ----------
  function nearest(p,list){ for(var s=1;s<=40;s++){ var q=(p+s)%40; if(list.indexOf(q)>=0) return q; } return list[0]; }
  async function drawCard(c,deckName){
    var isCh=deckName==="chance"; var dk=isCh?chanceDeck:chestDeck; var dc=isCh?chanceDisc:chestDisc; var src=isCh?CHANCE:CHEST;
    if(dk.length===0){ while(dc.length) dk.push(dc.pop()); shuf(dk); }
    var ci=dk.shift(); var card=src[ci];
    tv('<span class="dot" style="background:'+PC(c)+'"></span> '+(isCh?"Chance":"Community Chest")+': <b>'+card.text+'</b>');
    Sound.sfx("card"); setGameCenter(cardBox(deckName,c,card.text)); await sleep(3200); setGameCenter("");
    if(card.fx==="joker"){ jokers[c]++; if(isCh)heldCh++; else heldCs++; } else { dc.push(ci); }
    await applyCard(c,card);
  }
  async function applyCard(c,card){
    var a=card.a;
    if(card.fx==="gain"){ cash[c]+=a; }
    else if(card.fx==="pay"){ await payBank(c,a); }
    else if(card.fx==="move"){ var tgt=a; if(tgt<=pos[c]&&tgt!==pos[c]) {} var steps=(tgt-pos[c]+40)%40; await stepTo(c,steps); if(tgt!==0) await resolveLanding(c,false); }
    else if(card.fx==="jail"){ goJail(c); }
    else if(card.fx==="back3"){ for(var k=0;k<3;k++){ pos[c]=(pos[c]+39)%40; renderBoard(); await sleep(150); } await resolveLanding(c,false); }
    else if(card.fx==="payeach"){ for(var qi=0;qi<active.length;qi++){ var q=active[qi]; if(q!==c&&!bankrupt[q]){ cash[c]-=a; cash[q]+=a; } } if(cash[c]<0) await resolveDebt(c,null); }
    else if(card.fx==="collecteach"){ for(var ri=0;ri<active.length;ri++){ var r=active[ri]; if(r!==c&&!bankrupt[r]){ cash[r]-=a; cash[c]+=a; if(cash[r]<0) await resolveDebt(r,c); } } }
    else if(card.fx==="repairs"){ var hh=0,ht=0; for(var i=0;i<40;i++) if(owner[i]===c&&BOARD[i].t==="prop"){ if(houses[i]===5)ht++; else hh+=houses[i]; } await payBank(c,hh*a[0]+ht*a[1]); }
    else if(card.fx==="nearRR"){ var idx=nearest(pos[c],RR_IDX); await stepTo(c,(idx-pos[c]+40)%40); await landRailUtil(c,idx,2); }
    else if(card.fx==="nearUtil"){ var idu=nearest(pos[c],UTIL_IDX); await stepTo(c,(idu-pos[c]+40)%40); await landRailUtil(c,idu,10); }
    renderBoard();
  }
  async function landRailUtil(c,idx,mult){ var o=owner[idx];
    if(o==null){ await offerBuy(c,idx); }
    else if(o===c){} else if(mort[idx]){}
    else { var rent = BOARD[idx].t==="rr" ? computeRent(idx,o,1)*2 : 10*(1+Math.floor(Math.random()*6)+1+Math.floor(Math.random()*6)); toast(nm(c)+" pays "+nm(o)+" "+money(rent)); await payTo(c,o,rent); }
  }

  // ---------- landing ----------
  async function declineBuy(i){ if(R.noAuction) toast("Left unsold"); else await auction(i); }
  async function offerBuy(c,i){ var s=BOARD[i];
    setGameCenter(deedBox(i,esc(nm(c))+" can buy this for "+money(s.price)));
    try{ await offerBuyInner(c,i); } finally { setGameCenter(""); }
  }
  async function offerBuyInner(c,i){ var s=BOARD[i];
    if(human(c)){
      var opts=[{id:"buy",label:"✅ Buy "+s.n+" for "+money(s.price),color:"green"},{id:"no",label:R.noAuction?"❌ Don’t buy":"❌ Decline → Auction",color:"red"}];
      if(cash[c]<s.price) opts=[{id:"no",label:R.noAuction?"Can’t afford":"Can’t afford — to Auction",color:"red"}];
      var pk=await ask(c,"Buy property?",s.n+" — "+money(s.price)+" · you have "+money(cash[c]),opts);
      if(pk.id==="buy"&&cash[c]>=s.price){ cash[c]-=s.price; owner[i]=c; toast(nm(c)+" buys "+s.n); renderBoard(); } else { await declineBuy(i); }
    } else {
      if(aiWantsBuy(c,i)){ cash[c]-=s.price; owner[i]=c; toast(nm(c)+" buys "+s.n); renderBoard(); } else { await declineBuy(i); }
    }
  }
  function aiWantsBuy(c,i){ var s=BOARD[i]; if(cash[c]<s.price+50) return false; var score=0.5; if(s.t==="prop"){ var owned=GROUPS[s.g].filter(function(x){return owner[x]===c;}).length; score+=owned*0.25; } if(s.t==="rr")score+=0.3; if(cash[c]>s.price*2.5)score+=0.3; return Math.random()<score; }
  async function resolveLanding(c,wasDouble){ var i=pos[c], s=BOARD[i];
    if(s.t==="go"){ if(R.doubleGo){ cash[c]+=200; toast(nm(c)+" landed on GO — extra $200!"); } }
    else if(s.t==="fp"){ if(R.fpJackpot&&fpPool>0){ toast(nm(c)+" collects the Free Parking pot "+money(fpPool)+"!"); cash[c]+=fpPool; fpPool=0; } }
    else if(s.t==="jail"){ }
    else if(s.t==="gotojail"){ toast(nm(c)+" goes to Jail"); goJail(c); }
    else if(s.t==="tax"){ var amt = s.tax==="income"?200:(R.lux75?75:100); toast(nm(c)+" pays "+(s.tax==="income"?"Income":"Luxury")+" Tax "+money(amt)); await payBank(c,amt); }
    else if(s.t==="chance"){ await drawCard(c,"chance"); }
    else if(s.t==="cc"){ await drawCard(c,"chest"); }
    else if(s.t==="prop"||s.t==="rr"||s.t==="util"){
      var o=owner[i];
      if(o==null){ await offerBuy(c,i); }
      else if(o===c){ }
      else if(mort[i]){ toast(s.n+" is mortgaged — no rent"); }
      else if(R.noRentJail&&injail[o]){ toast(nm(o)+" is in Jail — no rent"); }
      else { var rent=computeRent(i,o,1,dice[0]+dice[1]); toast(nm(c)+" pays "+nm(o)+" "+money(rent)+" rent"); setGameCenter(deedBox(i,esc(nm(c))+" pays "+esc(nm(o))+" "+money(rent)+" rent")); await sleep(2200); setGameCenter(""); await payTo(c,o,rent); }
    }
  }
  function returnJoker(){ if(heldCh>0){ heldCh--; chanceDisc.push(8); } else if(heldCs>0){ heldCs--; chestDisc.push(4); } }

  // ---------- trading ----------
  function assetVal(i){ var sp=BOARD[i]; var v=mort[i]?Math.floor(sp.price/2):sp.price; if(sp.t==="prop") v+=houses[i]*sp.house; return v; }
  function tradeableOf(c){ var a=[]; for(var i=0;i<40;i++) if(owner[i]===c && !(BOARD[i].t==="prop"&&GROUPS[BOARD[i].g].some(function(x){return houses[x]>0;}))) a.push({i:i,m:mort[i]}); return a; }
  function aiTradeOK(p,inc,inCash,inJ,out,outCash,outJ){ var v=0; inc.forEach(function(i){v+=assetVal(i);}); v+=inCash+inJ*50; out.forEach(function(i){v-=assetVal(i);}); v-=outCash+outJ*50;
    inc.forEach(function(i){ var sp=BOARD[i]; if(sp.t==="prop"){ var after=GROUPS[sp.g].filter(function(x){return owner[x]===p||inc.indexOf(x)>=0;}).length; if(after===GROUPS[sp.g].length) v+=sp.price; } });
    out.forEach(function(i){ var sp=BOARD[i]; if(sp.t==="prop"&&ownsGroup(p,sp.g)) v-=Math.floor(sp.price*1.5); });
    return v>=-10; }
  function sumTxt(items,amt,j){ var a=items.map(function(i){return BOARD[i].n+(mort[i]?" (mortgaged)":"");}); if(amt) a.push(money(amt)); if(j) a.push("a Get Out of Jail Free card"); return a.length?a.join(", "):"nothing"; }
  async function tradeFlow(c){
    var others=alive().filter(function(x){return x!==c;}); if(!others.length) return;
    var popts=others.map(function(x){ return {id:x,label:tokE[x]+" "+nm(x)+" — "+money(cash[x]),color:x}; }); popts.push({id:"cancel",label:"Cancel",color:"blue"});
    var pk=await ask(c,"Trade with who?","Pick a player",popts);
    if(!pk.id||pk.id==="cancel"||others.indexOf(pk.id)<0) return; var p=pk.id;
    var tr=await ask(c,"Trade","",[{id:"cancel",label:"Cancel"}],{kind:"trade",partner:{name:nm(p),color:p},mine:tradeableOf(c),theirs:tradeableOf(p),myCash:cash[c],theirCash:cash[p],myJokers:jokers[c],theirJokers:jokers[p]});
    if(tr.id!=="offer"||!tr.data) return;
    var d=tr.data;
    var okT=function(who,i){ return i>=0&&i<40&&owner[i]===who && !(BOARD[i].t==="prop"&&GROUPS[BOARD[i].g].some(function(x){return houses[x]>0;})); };
    var uniq=function(v,k,a){ return a.indexOf(v)===k; };
    var give=(d.give||[]).map(Number).filter(function(i){return okT(c,i);}).filter(uniq);
    var get=(d.get||[]).map(Number).filter(function(i){return okT(p,i);}).filter(uniq);
    var cg=Math.max(0,Math.min(cash[c],parseInt(d.cg,10)||0)), cr=Math.max(0,Math.min(cash[p],parseInt(d.cr,10)||0));
    var jg=(d.jg&&jokers[c]>0)?1:0, jr=(d.jr&&jokers[p]>0)?1:0;
    if(!give.length&&!get.length&&!cg&&!cr&&!jg&&!jr) return;
    toast(nm(c)+" offers a trade to "+nm(p));
    setGameCenter('<div class="mtradebox"><b>🤝 Trade offer</b><div style="margin-top:1vh"><b>'+esc(nm(c))+' gives:</b> '+esc(sumTxt(give,cg,jg))+'</div><div style="margin-top:.8vh"><b>'+esc(nm(p))+' gives:</b> '+esc(sumTxt(get,cr,jr))+'</div><div style="margin-top:1vh;color:#555">'+esc(nm(p))+' is deciding…</div></div>');
    var accept;
    if(human(p)){ var ans=await ask(p,"Trade offer from "+nm(c),"You GET: "+sumTxt(give,cg,jg)+"   ·   You GIVE: "+sumTxt(get,cr,jr),[{id:"yes",label:"✅ Accept",color:"green"},{id:"no",label:"❌ Decline",color:"red"}]); accept=(ans.id==="yes"); }
    else { await sleep(1200); accept=aiTradeOK(p,give,cg,jg,get,cr,jr); }
    setGameCenter(""); if(!accept){ toast(nm(p)+" declined the trade"); return; }
    give.forEach(function(i){ owner[i]=p; if(mort[i]) cash[p]-=Math.ceil(BOARD[i].mort*0.1); });
    get.forEach(function(i){ owner[i]=c; if(mort[i]) cash[c]-=Math.ceil(BOARD[i].mort*0.1); });
    cash[c]-=cg; cash[p]+=cg; cash[p]-=cr; cash[c]+=cr;
    if(jg){ jokers[c]--; jokers[p]++; } if(jr){ jokers[p]--; jokers[c]++; }
    toast("🤝 Trade done: "+nm(c)+" ⇄ "+nm(p));
    renderBoard(); turnBanner(c);
    if(cash[c]<0) await resolveDebt(c,null); if(cash[p]<0) await resolveDebt(p,null);
  }

  // ---------- turn loop ----------
  function aiPreRoll(c){ aiBuild(c); }
  async function run(){
    monoFrame(); boardEl=$("mboard"); gameSnap=snapNow; renderBoard(); snapNow();
    while(alive().length>1){
      var c=active[turn]; if(bankrupt[c]){ turn=(turn+1)%active.length; continue; }
      doublesCount=0;
      // play this player's turn (may repeat on doubles)
      var endTurn=false;
      while(!endTurn && !over){
        centerView=""; renderBoard(); turnBanner(c, injail[c]?"in Jail":"");
        active.forEach(function(x){ if(x!==c && seat[x]) waitPhone(x, nm(c)+" is playing…", c); });
        // jail handling
        if(injail[c]){
          var jopts=[{id:"roll",label:"🎲 Roll for doubles",color:"blue"}];
          if(cash[c]>=50) jopts.push({id:"pay",label:"Pay $50 to get out",color:"green"});
          if(jokers[c]>0) jopts.push({id:"card",label:"Use Get Out of Jail Free"});
          var jp = human(c)? await ask(c,"You’re in Jail","Turn "+(jailT[c]+1)+" of 3",jopts) : {id: (jokers[c]>0?"card": (cash[c]>300&&jailT[c]>=1?"pay":"roll"))};
          if(jp.id==="card"){ jokers[c]--; returnJoker(); injail[c]=false; jailT[c]=0; toast(nm(c)+" uses Jail card"); }
          else if(jp.id==="pay"){ await payBank(c,50); injail[c]=false; jailT[c]=0; }
          else { // roll for doubles
            await rollDice(c); if(dice[0]===dice[1]){ injail[c]=false; jailT[c]=0; toast(nm(c)+" rolled doubles — out!"); await stepTo(c,dice[0]+dice[1]); await resolveLanding(c,false); endTurn=true; break; }
            else { jailT[c]++; if(jailT[c]>=3){ await payBank(c,50); injail[c]=false; toast(nm(c)+" pays $50, leaves Jail"); await stepTo(c,dice[0]+dice[1]); await resolveLanding(c,false); } else { toast(nm(c)+" stays in Jail"); } endTurn=true; break; }
          }
        }
        // pre-roll menu
        if(human(c)){
          var pre=[{id:"roll",label:"🎲 Roll Dice",color:"blue"},{id:"manage",label:"🏠 Manage properties"}];
          if(alive().length>1) pre.push({id:"trade",label:"🤝 Trade"});
          var pk=await ask(c,"Your turn — "+money(cash[c]),"Roll, manage, or trade first",pre);
          if(pk.id==="manage"){ await manage(c); continue; }
          if(pk.id==="trade"){ await tradeFlow(c); continue; }
        } else { aiPreRoll(c); }
        // roll + move
        await rollDice(c);
        if(R.snakeEyes&&dice[0]===1&&dice[1]===1){ cash[c]+=500; toast(nm(c)+" rolled snake-eyes — +$500!"); }
        if(dice[0]===dice[1]){ doublesCount++; if(doublesCount===3){ toast(nm(c)+" rolled 3 doubles — Jail!"); goJail(c); endTurn=true; break; } }
        await stepTo(c, dice[0]+dice[1]);
        await resolveLanding(c,false);
        if(over) return;
        if(bankrupt[c]){ endTurn=true; break; }
        if(dice[0]===dice[1]){ toast(nm(c)+" rolled doubles — go again"); continue; }
        // end-of-turn menu
        if(human(c)){
          while(true){
            var post=[{id:"end",label:"✔ End Turn",color:"green"},{id:"manage",label:"🏠 Manage properties"}];
            if(alive().length>1) post.push({id:"trade",label:"🤝 Trade"});
            var pe=await ask(c,"Turn done — "+money(cash[c]),"Manage, trade, or End Turn",post);
            if(pe.id==="manage"){ await manage(c); }
            else if(pe.id==="trade"){ await tradeFlow(c); }
            else break;
            if(bankrupt[c]) break;
          }
        }
        endTurn=true;
      }
      if(alive().length<=1){ break; }
      turn=(turn+1)%active.length;
      await sleep(250);
    }
    var w=alive()[0]; over=true; tv('<span class="dot" style="background:'+(w?PC(w):"#fff")+'"></span> 🏆 '+(w?nm(w):"?")+" wins!"); announceOver(w?nm(w):"?"); showPlayAgain();
  }
  async function rollDice(c){
    var face=function(){ return '<div class="mwho">'+esc(nm(c))+' rolls…</div><div class="mdice"><div class="mdie">'+dice[0]+'</div><div class="mdie">'+dice[1]+'</div></div>'; };
    Sound.sfx("dice");
    for(var k=0;k<6;k++){ dice=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)]; turnBanner(c,"🎲 "+dice[0]+" + "+dice[1]); setGameCenter(face()); await sleep(90); }
    dice=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)];
    turnBanner(c,"🎲 "+dice[0]+" + "+dice[1]+" = "+(dice[0]+dice[1]));
    setGameCenter(face()+'<div class="mwho" style="font-size:3.4vh">= '+(dice[0]+dice[1])+(dice[0]===dice[1]?" — doubles!":"")+'</div>');
    await sleep(1000); setGameCenter("");
  }
  run();
}
/* ============================================================
   500 RUMMY  (TV host) — the TV is the table (public cards only); each phone is a private hand
   ============================================================ */
function playRummy(){
  var myRun=++runId, R=window.Rummy, GM=R.Game, P=R.Party, UI=R.UI; noWait=true;
  var active=computeActive(ORDER8), opts=rvOpts();
  var names=active.map(function(c){ return seat[c]?players[seat[c]].name:CNAME[c]+" CPU"; });
  var humans=active.map(function(c){ return !!seat[c]; });
  var G=GM.newGame({names:names,humans:humans,opts:opts});
  if(G.o.teams){ var c0=COL[active[0]], c1=COL[active[1]]; G.colors=[c0,c1,c0,c1]; } else G.colors=active.map(function(c){ return COL[c]; });
  G.logText=[];
  var flashMeld=null, flashCard=null, mirrorPf=null, askingIdx=-1;
  screenState="game"; setBack("‹ Quit", true); Skins.apply("rummy500");
  var st0=document.createElement("style"); st0.textContent=P.tvCSS; document.head.appendChild(st0);
  UI.injectCSS();
  wrap.innerHTML='<div class="rvtv" id="rvtv"></div><div class="status" id="status" style="margin:.6vh 0"></div><div class="rvlog" id="rvlog"></div><div class="hintbar" id="hint">Players: use your phones</div>';
  function alive(){ return myRun===runId; }
  function dotOf(i){ return '<span class="dot" style="background:'+UI.colorOf(G,i)+'"></span>'; }
  function log(m){ G.logText.push(m); if(G.logText.length>6) G.logText.shift(); Sound.fromText(m); var l=$("rvlog"); if(l) l.innerHTML=G.logText.slice(-3).map(esc).join("<br>"); }
  function draw(){ var el=$("rvtv"); if(el) el.innerHTML=P.tvHTML(G,{flashMeld:flashMeld,flashCard:flashCard,pf:mirrorPf}); }
  function pushAll(skip){ G.players.forEach(function(p,i){ if(p.human&&i!==skip&&seat[active[i]]) send({t:"rvs",pid:seat[active[i]],st:P.snap(G,i,{})}); }); }
  gameSnap=function(){ pushAll(askingIdx); };
  viewHandler=function(o){ if(o.rv&&!G.roundOver&&G.players[G.turn].human&&seat[active[G.turn]]===o.pid){ mirrorPf=(o.i==null?null:o.i); draw(); } };
  function doAction(a){
    var msg=P.describe(G,a), res=GM.applyAction(G,a);
    if(!res.ok) return res;
    log(msg);
    flashMeld=(a.t==="meld"&&res.meld)?res.meld.id:(a.t==="layoff"?a.meld:null);
    flashCard=a.t==="discard"?a.card:null;
    if(res.roundOver&&res.roundOver.reason==="out") log(G.players[res.roundOver.out].name+" goes out!");
    draw(); pushAll(G.roundOver?-1:G.turn);
    return res;
  }
  function stat(i,txt){ setStatus(dotOf(i)+" "+esc(names[i])+" — "+txt); }
  async function humanStep(i){
    var color=active[i], pid=seat[color];
    askingIdx=i; stat(i,G.phase==="draw"?"drawing (use your phone)":"melding / discarding");
    var r=await ask(color,"Your turn","",[{id:"auto",label:"Auto-play"}],{kind:"rummy",st:P.snap(G,i,{active:true})});
    askingIdx=-1; if(mirrorPf!=null){ mirrorPf=null; draw(); }
    if(!alive()||G.roundOver||G.turn!==i) return;
    var d=r.data||{}, a;
    if(r.id==="undo"){ var u=GM.undo(G); if(!u.ok) send({t:"info",pid:pid,msg:u.msg}); else { log(names[i]+" takes back the last move"); draw(); } return; }
    if(r.id==="stock") a={t:"stock"};
    else if(r.id==="take") a={t:"take",idx:d.idx};
    else if(r.id==="meld") a={t:"meld",ids:d.ids||[]};
    else if(r.id==="layoff") a={t:"layoff",meld:d.meld,card:d.card};
    else if(r.id==="discard") a={t:"discard",card:d.card};
    else a=GM.aiAction(G);
    if(!a) return;
    var res=doAction(a);
    if(!res.ok) send({t:"info",pid:pid,msg:res.msg||"That didn't work"});
  }
  async function cpuStep(i){
    askingIdx=-1; stat(i,G.phase==="draw"?"choosing a card…":"playing…");
    await sleep(G.phase==="draw"?1500:1300);
    if(!alive()||G.roundOver||G.turn!==i) return;
    var a=GM.aiAction(G); if(!a) return;
    var res=doAction(a);
    if(!res.ok){ if(G.phase==="draw") doAction({t:"stock"}); else doAction({t:"discard",card:G.players[i].hand[0].id}); }
  }
  async function roundEnd(){
    pushAll(-1); askingIdx=-1;
    var el=$("rvtv"); if(!el) return;
    el.innerHTML=P.roundSheetHTML(G);
    setStatus(G.over?"🏆 "+esc(G.roundOver.winnerName)+(/ & /.test(G.roundOver.winnerName)?" win!":" wins!"):"Round "+G.round+" complete");
    if(G.over) return;
    var b=document.createElement("button"); b.className="big"; b.textContent="Next round ▶"; b.style.marginTop="1vh"; el.appendChild(b); b.focus();
    await new Promise(function(res){ var done=false,fin=function(){ if(!done){ done=true; res(); } }; b.onclick=fin; setTimeout(fin,25000); });
  }
  async function run(){
    while(alive()){
      GM.startRound(G); G.logText=[]; flashMeld=null; flashCard=null; Sound.sfx("deal");
      log(G.players[G.dealer].name+" deals — round "+G.round);
      draw(); pushAll(-1); await sleep(1800);
      while(alive()&&!G.roundOver){ var i=G.turn; if(G.players[i].human) await humanStep(i); else await cpuStep(i); }
      if(!alive()) return;
      await roundEnd();
      if(G.over){ var wn=G.roundOver.winnerName; if(alive()){ announceOver(wn); showPlayAgain(); } return; }
    }
  }
  run();
}
function monoFrame(){ screenState="game"; setBack("‹ Quit", true); wrap.innerHTML='<div class="status" id="status"></div><div class="mwrap"><div id="mboard" class="mboard"></div><div id="mscore" class="mscore"></div></div><div class="hintbar" id="hint">Players: use your phones</div>'; }

function showPlayAgain(){
  var b=document.createElement("button"); b.className="big"; b.textContent="New Game"; b.style.marginTop="2vh";
  b.onclick=function(){ seat={}; players={}; pending={}; screenSelect(); };
  wrap.appendChild(b); b.focus();
}

function esc(s){ return String(s==null?"":s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];}); }

/* boot */
Sound.mountButton({top:"6.5vh",size:"2.4vh"});
screenSelect();
})();
