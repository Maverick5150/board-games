  .bg-topbar{min-height:4.5rem;}
  .bg-topbar__title{max-width:62rem;margin:0 auto;}
  .bg-topbar__title .bg-eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  body.ps-ingame .bg-topbar__name{display:none;}
  .status{display:flex;align-items:center;justify-content:center;gap:.6rem;min-height:1.6rem;max-width:100%;font:var(--fw-ui-strong) var(--fs-lg)/1.2 var(--font-ui);color:var(--text-1);text-align:center;}
  .status:empty, body:not(.ps-ingame) .status{display:none;}
  .dot{width:.85rem;height:.85rem;border-radius:50%;display:inline-block;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.2);}

  .bg-hintbar{width:100%;margin-top:1vh;}

  .hintbar{font:var(--fw-ui) var(--fs-sm)/1.25 var(--font-ui);color:var(--text-2);text-align:center;}
  /* game select: the shelf */
  .ps-select{width:100%;max-width:72rem;display:grid;gap:1.25rem;justify-items:center;}
  .ps-head{text-align:center;display:grid;gap:.4rem;justify-items:center;}
  .ps-head h1{margin:0;font:400 var(--fs-3xl)/1.1 var(--font-display);color:var(--text-1);}
  .ps-head p{margin:0;font:var(--fw-body) var(--fs-md)/1.35 var(--font-ui);color:var(--text-2);max-width:40rem;}
  #cards.bg-tiles{grid-template-columns:repeat(4,13.5rem);justify-content:center;width:max-content;max-width:100%;}

  .lobby{display:grid;grid-template-columns:minmax(0,25rem) minmax(0,1fr);gap:2.5rem;align-items:start;width:100%;max-width:76rem;}
  .lobby .lcol{position:sticky;top:5.5rem;display:grid;gap:.9rem;justify-items:center;text-align:center;min-width:0;padding:var(--focus-room);margin:calc(-1 * var(--focus-room));}

  #cpuBtns button, #paceBtns button{min-height:var(--tap);}

  .rulebox{display:grid;gap:1.25rem;}

  .ps-vdesc b{color:var(--text-1);font-weight:var(--fw-ui-strong);}
  .rulebox .bg-version{min-height:5rem;justify-content:center;}
  .ps-rules{display:grid;border-radius:var(--r-lg);background:var(--panel-fill);box-shadow:var(--panel-edge),var(--elev-1);padding:var(--focus-room);}
  .ps-rule{position:relative;}
  .ps-rule + .ps-rule{box-shadow:inset 0 1px 0 var(--line-1);}
  .ps-rule .bg-row{padding-left:7.25rem;}
  .ps-rule > .bg-tag{position:absolute;left:1rem;top:50%;transform:translateY(-50%);pointer-events:none;}
  .ps-rule .ps-val{flex:none;max-width:48%;text-align:right;font:var(--fw-ui-strong) var(--fs-sm)/1.25 var(--font-ui);color:var(--gold-100);}

  #svbar.svbar{margin:0;padding:var(--sp-3);border:0;border-radius:var(--r-lg);background:var(--panel-fill);box-shadow:var(--panel-edge),var(--elev-1);max-width:none;font-size:inherit;}

  #svbar .r{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr));gap:1.5rem .75rem;margin:0 0 1.5rem;padding:var(--focus-room);}

  #boardWrap{width:min(70vh,96vw);aspect-ratio:1/1;position:relative;}
  svg{width:100%;height:100%;display:block;}
  .mwrap{display:flex;gap:2vh;align-items:flex-start;justify-content:center;flex-wrap:wrap;width:100%;}
  .mscore{width:min(40vh,94vw);display:flex;flex-direction:column;gap:1vh;}
  .mshead{font:var(--fw-caps) var(--fs-micro)/1.2 var(--font-ui);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--gold-200);}

  #unPl .bg-players{grid-template-columns:1fr;gap:.9rem;}
  #unPl .bg-players.is-two{grid-template-columns:repeat(2,minmax(0,1fr));}

  .mscore .bg-player{flex-wrap:wrap;border-radius:var(--r-lg);align-items:center;row-gap:.35rem;padding:.5rem .75rem .5rem .5rem;}
  .mscore .bg-player.is-turn{margin-top:.2rem;}
  .mscore .bg-player .bg-player__meta{color:var(--text-1);}
  .mscore .mschips{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:.2rem;margin:0;}
  .mschips i{min-width:1.2rem;height:1.2rem;border-radius:.3rem;border:1px solid #fff5;font-style:normal;font:var(--fw-caps) var(--fs-micro)/1 var(--font-ui);color:#fff;display:inline-flex;align-items:center;justify-content:center;text-shadow:0 0 2px #000;}
  .msfp{font:var(--fw-ui-strong) var(--fs-md)/1.3 var(--font-ui);color:var(--gold-100);}
  .rulebox{text-align:left;}
  .mcw{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh;width:100%;height:100%;padding:1vh;}
  .mwho{font-size:2.6vh;font-weight:800;color:#09250f;text-align:center;background:#ffffffd9;border-radius:1.4vh;padding:.6vh 1.6vh;max-width:100%;}
  .mdeed .deed{width:34vh;max-width:none;margin:0;box-shadow:0 .6vh 2vh #0007;}
  .mdeed .deed-title{font-size:1.2vh;}.mdeed .deed-name{font-size:2.5vh;}.mdeed .dl{font-size:1.9vh;}.mdeed .dl.sub{font-size:1.65vh;}.mdeed .deed-note{font-size:1.35vh;}.mdeed .icon-band{font-size:5vh;}.mdeed .deed-body{padding:1vh 1.6vh;}.mdeed .deed-band{padding:1.1vh 1vh;}
  .mcard{width:38vh;background:#fff;border:.8vh solid #f08d1c;border-radius:2vh;padding:3vh 2.6vh;text-align:center;box-shadow:0 .8vh 2.4vh #0007;color:#111;}
  .mcard h2{margin:0 0 1.4vh;font-size:3vh;letter-spacing:.2vh;}.mcard p{margin:0;font-size:2.7vh;font-weight:700;line-height:1.25;}
  .mdice{display:flex;gap:2vh;align-items:center;}.mdie{width:11vh;height:11vh;border-radius:2vh;background:#fff;color:#111;font-size:8vh;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 .6vh 1.6vh #0007;}
  .mtradebox{background:#fff;border-radius:2vh;padding:2vh 2.4vh;width:46vh;max-width:90%;color:#111;box-shadow:0 .8vh 2.4vh #0007;text-align:left;font-size:2.3vh;line-height:1.3;}
  /* monopoly board */
  /* the board itself is monopoly/board.js (shared with the phone game): one static SVG, pieces and marks laid over it */
  .mboard{width:min(80vh,96vw);aspect-ratio:1/1;border-radius:6px;box-shadow:0 0 0 .5vh #d4a017,0 0 0 .9vh #0a0f22,0 2.4vh 6vh rgba(0,0,0,.8);}
  .mcenter{display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
  .mtk{display:inline-block;vertical-align:middle;}.mtk svg{display:block;width:3.4vh;height:3.4vh;}
  /* the end of a game: the New game button under the board (the Victory screen offers it too) */
  .ps-again{margin-top:1vh;}
  .bg-win .ps-winact{display:flex;flex-wrap:wrap;gap:1.5rem;justify-content:center;}
</style>

var room=null;           // a fresh random room is created every time a game is picked
var net=null;
var players={};         // pid -> {pid,name,color}
var seat={};            // color -> pid
var pending={};         // reqId -> {pid, resolve}
var gameSnap=null;      // set by Monopoly: re-sends the holdings snapshot to phones
var viewHandler=null;   // set by Monopoly: shows the deed a phone is looking at
var lastAsk={};         // pid -> last ask message (for reconnect re-send)
var leaveHandler=null;  // set by a game whose own state marks seats as human: called with the colour of a phone that left mid-game
var reqSeq=1;
var inLobby=true;

function send(o,retain){ if(net) net.send(o,retain); }
function startRoom(){
  closeRoom("The host opened a new game room. Scan the new QR code to join.");
  room=BGNet.roomCode();
  players={}; seat={}; settlePending(); lastAsk={};
  JOIN_URL=BASE+"play.html?room="+room; SHORT_URL=JOIN_URL.replace(/^https?:\/\//,"");
  net=BGNet.connect(room,"host",{
    status:function(s){ connEl.textContent = s==="online"?"relay connected":(s==="connecting"?"connecting…":"reconnecting…"); connEl.setAttribute("data-state",s); },
    ready:function(){},
    msg:onMsg
  });
}
function closeRoom(msg){
  if(!net) return;
  try{ net.send({t:"wait", pid:"*", msg:msg||"The host closed this room."}); }catch(e){}
  var old=net; net=null;
  setTimeout(function(){ try{ old.close(true); }catch(e){} }, 400);   // let the goodbye go out first
  connEl.textContent="";
}
function broadcastLobby(){ send({t:"lobby", players:Object.keys(players).map(function(p){return players[p];})}, true); }

function onMsg(o){
  if(o.t==="join"){
    if(players[o.pid]){ players[o.pid].name=o.name||players[o.pid].name; }
    else if(inLobby && Object.keys(players).length<maxPlayers()){
      var color=firstFreeColor();
      players[o.pid]={pid:o.pid,name:(o.name||"Player"),color:color};
      seat[color]=o.pid;
      toast((o.name||"Player")+" joined");
    } else {
      send({t:"nojoin", pid:o.pid, why:inLobby?"full":"started", max:maxPlayers()});   // tell the phone why it can't sit down (room full / game already on)
      return;
    }
    if(players[o.pid]) send({t:"you", pid:o.pid, color:players[o.pid].color, name:players[o.pid].name});
    if(inLobby){ broadcastLobby(); renderLobby(); }
    else {
      // reconnect during the game: re-send their pending prompt so they don't get stuck on the lobby
      var la=lastAsk[o.pid];
      if(la||!noWait) send(la ? la : {t:"wait", pid:o.pid, msg:"Waiting for your turn…"});
      if(gameSnap) gameSnap();
    }
  } else if(o.t==="leave"){
    var pl=players[o.pid]; if(!pl) return;
    delete players[o.pid]; if(seat[pl.color]===o.pid) delete seat[pl.color]; delete lastAsk[o.pid];
    if(inLobby){ toast(pl.name+" left"); broadcastLobby(); renderLobby(); }
    else if(gameOver){ toast(pl.name+" left"); settlePending(o.pid); }   // the game is finished: nobody takes the seat over
    else {   // mid-game: a computer takes the seat; a prompt the phone was answering gets its safe default
      toast(pl.name+" left — the computer plays "+CNAME[pl.color]);
      if(leaveHandler) leaveHandler(pl.color);
      settlePending(o.pid);
    }
  } else if(o.t==="view"){ if(viewHandler) viewHandler(o);
  } else if(o.t==="pick"){
    var pr=pending[o.reqId];
    if(pr && pr.pid===o.pid){ delete pending[o.reqId]; pr.resolve({id:o.id, i:o.i, data:o.data}); }
  }
}
function firstFreeColor(){ var order=ORDER(); for(var i=0;i<order.length;i++){ if(!seat[order[i]]) return order[i]; } return "red"; }

/* ask a player's phone; resolves with their choice. Shows a TV hint while waiting,
   and auto-advances after a long timeout so a non-responding phone can't hang the game. */
function ask(color, title, sub, options, extraFields){
  var pid=seat[color];
  // the answer used when nobody answers (timeout, phone left, game quit): extraFields.dflt = the SAFE option's id
  // (Pass, Decline, don't buy...), otherwise the first option
  var dk=extraFields&&extraFields.dflt, di=-1; (options||[]).forEach(function(op,i){ if(di<0&&op.id===dk) di=i; });
  var def=dk!=null?{id:dk,i:Math.max(di,0)}:(options&&options[0]?{id:options[0].id,i:0}:{id:null,i:0});
  if(!pid) return Promise.resolve(def); // no controller -> default
  var reqId=reqSeq++;
  var msg={t:"ask", pid:pid, reqId:reqId, title:title, sub:sub, options:options}; if(extraFields){ for(var k in extraFields) if(k!=="dflt") msg[k]=extraFields[k]; }
  lastAsk[pid]=msg;
  var who = players[pid] ? players[pid].name : "player";
  var hint=$("hint"); if(hint) hint.textContent = "Waiting for "+who+" — check your phone ("+title+")";
  return new Promise(function(resolve){
    var done=false;
    var fin=function(v){ if(done) return; done=true; clearTimeout(to); if(lastAsk[pid]===msg) delete lastAsk[pid]; var h=$("hint"); if(h) h.textContent="Players: use your phones"; resolve(v); };
    var to=setTimeout(function(){ delete pending[reqId]; fin(def); }, (extraFields&&extraFields.timeoutMs)||120000); // 2 min safety (long rounds can ask for more)
    pending[reqId]={pid:pid, resolve:fin, dflt:def};
    send(msg);
  });
}
/* answer every open prompt (or one phone's) with its default right away: used when a game is quit or a phone leaves,
   so no 2-minute ask timer outlives its game */
function settlePending(pid){
  Object.keys(pending).forEach(function(k){ var pr=pending[k]; if(pid&&pr.pid!==pid) return; delete pending[k]; try{ pr.resolve(pr.dflt||{id:null,i:0}); }catch(e){} });
}
/* Trouble / Sorry! / Monopoly: a quit game must never act again. Once runId moves on, the game's sleeps and asks
   never resolve, so its loop stops at its next await (same effect as "if(myRun!==runId) return" after every await,
   including the awaits inside helpers like auctions, trades and animations). */
function runGate(myRun){
  var stop=function(){ return new Promise(function(){}); };
  return {
    live:function(){ return myRun===runId; },
    sleep:function(ms){ return sleep(ms).then(function(v){ return myRun===runId?v:stop(); }); },
    ask:function(){ return ask.apply(null,arguments).then(function(v){ return myRun===runId?v:stop(); }); }
  };
}
function waitPhone(color, msg, turnColor){ var pid=seat[color]; if(pid){ delete lastAsk[pid]; send({t:"wait", pid:pid, msg:msg, turn:turnColor}); } }
function waitAllExcept(activeColor, turnColor){
  Object.keys(seat).forEach(function(c){ if(c!==activeColor) waitPhone(c, CNAME[turnColor]+"’s turn…", turnColor); });
}

    if(a.k==="swap"){ locs.set(a.target,a.p.loc); simLand(locs,a.p,tl); var t=locs.get(a.target); if(t.t==="ring") simLand(locs,a.target,t); }
    else { locs.set(a.target,{t:"start"}); simLand(locs,a.p,tl); }
    return locs; }
  function sweepSc(color,locs,skip){ var s=0; locs.forEach(function(l,p){ if(p!==skip&&l.t==="start"&&p.loc.t!=="start") s+=p.color===color?-60:20; }); return s; }   // sent to Start: rivals +20, own -60
  function scoreA(a){ if(a.k==="pass") return 20; var color=a.p?a.p.color:a.A.color; var ev=function(p,dest){ var sc=0; if(!dest)return -999; if(dest.t==="home")sc+=200; else if(dest.t==="safe")sc+=60+dest.j*4; else if(dest.t==="ring"){ var sl=slideTri(dest.i); if(sl&&sl.color!==color){sc+=70+sl.cells.length*4; sc+=occAtRing(dest.i,p).length*20;} else sc+=occAtRing(dest.i,p).filter(function(o){return o.color!==color;}).length*55; sc+=prog(color,dest)*0.6; } return sc; };
    if(a.k==="out")return 55+occAtRing(START_EXIT[color]).filter(function(o){return o.color!==color;}).length*55;
    if(a.k==="fwd")return ev(a.p,travel(color,a.p.loc,a.n,1))+2;
    if(a.k==="back"){ var d=travel(color,a.p.loc,a.n,-1); if(!d||d.t!=="ring") return -8; var L=boardNow(); simLand(L,a.p,d); return sweepSc(color,L,a.p)/20*55-8; }
    if(a.k==="swap"){ var L2=simAfter(a), gain=prog(color,L2.get(a.p))-prog(color,a.p.loc); return (gain>0?gain+20:gain-20)+sweepSc(color,L2,a.p); }   // never switch backwards
    if(a.k==="sorry")return 150+prog(a.target.color,a.target.loc)+sweepSc(color,simAfter(a),a.target);
    if(a.k==="split"){ var L3=simAfter(a), own=0; pawns[color].forEach(function(p){ if(p.loc.t!=="start"&&L3.get(p).t==="start") own++; });   // a split may slide over its own pawn
      return ev(a.A,travel(color,a.A.loc,a.a,1))+ev(a.B,travel(color,a.B.loc,a.b,1))-own*150; }
    return 0; }

  function wrapTxt(t,n){ var w=String(t).split(" "),lines=[],cur=""; w.forEach(function(x){ if((cur+" "+x).trim().length>n){ lines.push(cur.trim()); cur=x; } else cur=cur+" "+x; }); if(cur.trim()) lines.push(cur.trim()); return lines; }
  function centerCard(v,c,who,back){
    if(!back) Sound.sfx("card");
    var old=svg.querySelector("#cardc"); if(old) old.remove();
    var g=document.createElementNS("http://www.w3.org/2000/svg","g"); g.setAttribute("id","cardc");
    var col=COL[c], cx0=300, cy0=300, w=160, h=222, x0=cx0-w/2, y0=cy0-h/2;
    var t='<rect x="'+(x0+6)+'" y="'+(y0+8)+'" width="'+w+'" height="'+h+'" rx="14" fill="#0005"/>';
    if(back){
      t+='<rect x="'+x0+'" y="'+y0+'" width="'+w+'" height="'+h+'" rx="14" fill="'+col+'" stroke="#fff" stroke-width="5"/>';
      t+='<text x="300" y="'+(cy0-4)+'" text-anchor="middle" font-size="26" font-weight="900" fill="#fff" stroke="#0006" stroke-width="2" paint-order="stroke">SORRY!</text>';
      t+='<text x="300" y="'+(cy0+26)+'" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">'+esc(who)+' draws…</text>';
    } else {
      t+='<rect x="'+x0+'" y="'+y0+'" width="'+w+'" height="'+h+'" rx="14" fill="#fff" stroke="'+col+'" stroke-width="8"/>';
      t+='<text x="300" y="'+(y0+26)+'" text-anchor="middle" font-size="14" font-weight="800" fill="#555">'+esc(who)+' drew</text>';
      var big=(v==="sorry")?"SORRY!":String(v);
      t+='<text x="300" y="'+(v==="sorry"?cy0+6:cy0+20)+'" text-anchor="middle" font-size="'+(v==="sorry"?36:84)+'" font-weight="900" fill="'+col+'">'+big+'</text>';
      wrapTxt(CARD_TEXT[v],21).forEach(function(L,i){ t+='<text x="300" y="'+(cy0+52+i*16)+'" text-anchor="middle" font-size="13" font-weight="700" fill="#222">'+esc(L)+'</text>'; });
    }
    g.innerHTML=t; svg.appendChild(g);
  }
  async function run(){
    gameFrame("sboard"); svg=$("sboard"); build();
    var turn=0;
    while(!over && live()){
      var c=active[turn]; waitAllExcept(c,c);
      setStatus('<span class="dot" style="background:'+COL[c]+'"></span> '+(seat[c]?players[seat[c]].name:CNAME[c]+" (CPU)")+" — "+(human[c]?"draw on your phone":"drawing…"));
      centerCard(null,c,(seat[c]?players[seat[c]].name:CNAME[c]),true);
      if(human[c]){ await ask(c,"Your turn","Draw a card",[{id:"draw",label:"🂠 DRAW A CARD"}],{card:{back:true,color:c,who:(seat[c]?players[seat[c]].name:CNAME[c])}}); }
      else { await sleep(1000); }
      if(deck.length===0) deck=shuffle(buildDeck());
      var v=deck.pop();
      centerCard(v,c,(seat[c]?players[seat[c]].name:CNAME[c]),false);
      active.forEach(function(x){ if(seat[x]) send({t:"wait",pid:seat[x],msg:(seat[c]?players[seat[c]].name:CNAME[c])+" drew a card",turn:c,card:{v:v,text:CARD_TEXT[v],color:c,who:(seat[c]?players[seat[c]].name:CNAME[c])}}); });
      setStatus('<span class="dot" style="background:'+COL[c]+'"></span> '+(seat[c]?players[seat[c]].name:CNAME[c])+' drew <b style="font-size:4vh;color:#ffd86b">'+(v==="sorry"?"SORRY!":v)+'</b> — '+CARD_TEXT[v]);
      await sleep(1200);
      var acts=legal(c,v), moved=false;
      if(acts.length){
        var act;
        if(human[c]){ var opts=acts.map(function(a,i){ return {id:String(i),label:actLabel(a),color:c}; }); var pick=await ask(c,"You drew "+(v==="sorry"?"SORRY!":v),CARD_TEXT[v],opts,{card:{v:v,text:CARD_TEXT[v],color:c,who:(seat[c]?players[seat[c]].name:CNAME[c])}}); act=acts[parseInt(pick.id,10)]||acts[0]; }
        else { var best=acts[0],bs=-1e9; acts.forEach(function(a){ var s=scoreA(a); if(s>bs){bs=s;best=a;} }); act=best; }
        await applyAnim(act); moved=true;
        if(hasWon(c)){ over=true; var wn=seat[c]?players[seat[c]].name:CNAME[c]; setStatus('<span class="dot" style="background:'+COL[c]+'"></span> '+wn+" wins!"); announceOver(wn); showPlayAgain(); return; }
      } else { setStatus('<span class="dot" style="background:'+COL[c]+'"></span> '+(seat[c]?players[seat[c]].name:CNAME[c])+" — no move"); await sleep(1100); }
      if(v===2){ /* official rules: a 2 always draws again (same player), even when it could not be played */ }
      else turn=(turn+1)%active.length;
      await sleep(300);
    }
  }
  run();
}

/* ============================================================
   MONOPOLY  (TV host) — playable core: roll, buy, rent, cards,
   tax, jail, build, mortgage, auctions, bankruptcy. (Trading next.)
   ============================================================ */
function playMonopoly(){
  var RG=runGate(++runId), live=RG.live, sleep=RG.sleep, ask=RG.ask;   // a quit game stops at its next await
  var order=["red","blue","green","yellow"];
  var active=computeActive(order);
  var COLORVAR={brown:"#8b5a2b",light_blue:"#9fd0ef",pink:"#d93a96",orange:"#f08d1c",red:"#e23b3b",yellow:"#f3d41b",green:"#1f9d54",dark_blue:"#2b4fe0"};
  var TOKS=["Top Hat","Race Car","Dog","Battleship"];   // the pieces are drawn by MonoBoard (board.js), by name
  var SEATN={red:1,blue:2,green:3,yellow:4,purple:5,teal:6,orange:7,pink:8};   // player colour -> the Luxe seat colour of the pieces and owner marks
  function tokH(c){ return '<span class="mtk">'+(window.MonoBoard?MonoBoard.tokenSVG(tokE[c],SEATN[c]||1):'')+'</span>'; }
  var BOARD=MONO_BOARD, CHANCE=MONO_CHANCE, CHEST=MONO_CHEST, RR_IDX=[5,15,25,35], UTIL_IDX=[12,28];
  var GROUPS={}; BOARD.forEach(function(s,i){ if(s.t==="prop"){ (GROUPS[s.g]=GROUPS[s.g]||[]).push(i); } });

  // per-player state keyed by color
  var cash={}, pos={}, injail={}, jailT={}, jokers={}, bankrupt={}, tokE={};
  active.forEach(function(c,i){ cash[c]=1500; pos[c]=0; injail[c]=false; jailT[c]=0; jokers[c]=0; bankrupt[c]=false; tokE[c]=TOKS[i%4]; });
  var owner=[], houses=[], mort=[]; for(var i=0;i<40;i++){ owner[i]=null; houses[i]=0; mort[i]=false; }
  var housesLeft=32, hotelsLeft=12;
  var chanceDeck=shuf(rangeArr(16)), chanceDisc=[], chestDeck=shuf(rangeArr(16)), chestDisc=[];
  var dice=[0,0], doublesCount=0, turn=0, over=false;
  var R={}; for(var rk in monoRules) R[rk]=monoRules[rk];
  var fpPool=0, heldCh=0, heldCs=0, snapT=null;
  var centerGame="", centerView="";
  function centerRender(){ var el=boardEl&&boardEl.querySelector(".mcenter"); if(!el) return; var h=centerView||centerGame; el.innerHTML = h?('<div class="mcw">'+h+'</div>'):(window.MonoBoard?MonoBoard.plateHTML():'MONOPOLY'); }
  function setGameCenter(h){ centerGame=h||""; centerRender(); }
  function deedBox(i,who){ return '<div class="mwho">'+who+'</div><div class="mdeed">'+window.monoDeedHTML(i)+'</div>'; }
  function cardBox(deckName,c,text){ var isCh=deckName==="chance", col=isCh?"#f08d1c":"#2b7be0"; return '<div class="mwho">'+esc(nm(c))+' draws…</div><div class="mcard" style="border-color:'+col+'"><h2 style="color:'+col+'">'+(isCh?"CHANCE":"COMMUNITY CHEST")+'</h2><p>'+esc(text)+'</p></div>'; }
  function colorOfPid(pid){ for(var k in seat) if(seat[k]===pid) return k; return null; }
  viewHandler=function(o){ var c=colorOfPid(o.pid); var sp=(o.i!=null)?BOARD[o.i]:null;
    if(!c||!sp||!sp.price){ centerView=""; } else { centerView=deedBox(o.i,"👀 "+esc(nm(c))+" is looking at "+esc(sp.n)); }
    centerRender(); };
  function rangeArr(n){ var a=[]; for(var i=0;i<n;i++)a.push(i); return a; }
  function shuf(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
  function nm(c){ return seat[c]?players[seat[c]].name:(CNAME[c]+" (CPU)"); }
  function human(c){ return !!seat[c]; }
  function alive(){ return active.filter(function(c){return !bankrupt[c];}); }
  function money(n){ return (n<0?"-$":"$")+Math.abs(n); }

  function rrOwned(c){ return RR_IDX.filter(function(i){return owner[i]===c;}).length; }
  function utilOwned(c){ return UTIL_IDX.filter(function(i){return owner[i]===c;}).length; }
  function ownsGroup(c,g){ return GROUPS[g].every(function(i){return owner[i]===c;}); }
  function netWorth(c){ var w=cash[c]; for(var i=0;i<40;i++) if(owner[i]===c){ var s=BOARD[i]; w+= mort[i]?Math.floor((s.price||0)/2):(s.price||0); if(s.t==="prop") w+=houses[i]*s.house; } return w; }
  function computeRent(i,o,mult,ds){ var s=BOARD[i]; mult=mult||1;
    if(s.t==="prop"){ if(houses[i]>0) return s.rent[houses[i]]; return ownsGroup(o,s.g)?s.rent[0]*2:s.rent[0]; }
    if(s.t==="rr"){ var n=rrOwned(o); return 25*Math.pow(2,n-1)*mult; }
    if(s.t==="util"){ var n2=utilOwned(o); if(mult>1) return 10*ds; return (n2===2?10:4)*ds; }
    return 0; }

  // ---------- rendering (HTML grid) ----------
  var boardEl;
  function PC(c){ return COL[c]; }
  var MB=null, centerEl=null;
  function boardState(){
    var own=[],i; for(i=0;i<40;i++) own[i]=owner[i]!=null?(SEATN[owner[i]]||1):0;
    var toks=active.filter(function(c){return !bankrupt[c];}).map(function(c){ return {id:c,i:pos[c],seat:SEATN[c]||1,tok:tokE[c],cur:active[turn]===c,title:nm(c),jail:!!injail[c]}; });
    var cc=active[turn];
    return {own:own,houses:houses,mort:mort,toks:toks,hl:(cc&&!bankrupt[cc]&&!over)?pos[cc]:-1};
  }
  function renderBoard(){
    if(window.MonoBoard){
      if(!MB||MB.host!==boardEl){ centerEl=document.createElement("div"); centerEl.className="mcenter"; MB=MonoBoard.mount(boardEl,{squares:BOARD,zoom:false,dpad:false,center:centerEl}); }
      MB.update(boardState());
    }
    centerRender(); renderScore(); snapSoon();
  }
  function renderScore(){ var el=$("mscore"); if(!el) return; var h='<div class="mshead">Players</div><ul class="bg-players">';
    active.forEach(function(c){ var props=[]; for(var i=0;i<40;i++) if(owner[i]===c) props.push(i);
      var meta=money(cash[c])+(injail[c]?" · in jail":"")+(jokers[c]?" · "+jokers[c]+" jail card"+(jokers[c]>1?"s":""):"")+(bankrupt[c]?" · OUT":"");
      var chips='<div class="mschips">'+props.map(function(i){ var sp=BOARD[i]; var col=sp.t==="prop"?COLORVAR[sp.g]:"#555"; return '<i style="background:'+col+(mort[i]?';opacity:.35':'')+'" title="'+sp.n+'">'+(houses[i]>0?(houses[i]===5?'H':houses[i]):(sp.t==="rr"?'R':sp.t==="util"?'U':''))+'</i>'; }).join("")+'</div>';
      h+=chipHTML({color:PC(c),name:nm(c),meta:meta,tokHTML:tokH(c),out:bankrupt[c],turn:active[turn]===c&&!bankrupt[c],cls:"msrow"+(bankrupt[c]?" out":"")+(active[turn]===c&&!bankrupt[c]?" cur":""),extra:chips});
    });
    h+='</ul>';
    if(R.fpJackpot) h+='<div class="msfp">Free Parking: '+money(fpPool)+'</div>';
    el.innerHTML=h; markTurn(el,"t"+turn); }
  function snapNow(){ var pl=active.map(function(c){ var props=[]; for(var i=0;i<40;i++) if(owner[i]===c) props.push({i:i,h:houses[i],m:mort[i]}); return {color:c,pid:seat[c]||null,name:nm(c),cash:cash[c],net:netWorth(c),jail:injail[c],jokers:jokers[c],bankrupt:bankrupt[c],props:props}; }); send({t:"snap",players:pl,fp:R.fpJackpot?fpPool:0}); }
  function snapSoon(){ clearTimeout(snapT); snapT=setTimeout(function(){ if(live()) snapNow(); },400); }
  function tv(html){ setStatus(html); }
  function turnBanner(c,extra){ tv('<span class="dot" style="background:'+PC(c)+'"></span> '+tokH(c)+' <b>'+nm(c)+'</b> · '+money(cash[c])+(R.fpJackpot&&fpPool>0?' · 🅿️ '+money(fpPool):'')+(extra?' · '+extra:'')); }

  // ---------- money / debt ----------
  async function payBank(c,amt){ cash[c]-=amt; if(R.fpJackpot) fpPool+=amt; if(cash[c]<0) await resolveDebt(c,null); }
  async function payTo(c,to,amt){ cash[c]-=amt; cash[to]+=amt; if(cash[c]<0) await resolveDebt(c,to); }
  function liquidatable(c){ var v=cash[c]; for(var i=0;i<40;i++) if(owner[i]===c){ var s=BOARD[i]; if(s.t==="prop"&&houses[i]>0) v+=Math.floor(houses[i]*s.house/2); if(!mort[i]) v+=Math.floor((s.price||0)/2); } return v; }
  function aiRaise(c){ var guard=200; while(cash[c]<0 && guard-->0){ var best=-1,bh=0; for(var i=0;i<40;i++) if(owner[i]===c&&BOARD[i].t==="prop"&&houses[i]>bh){bh=houses[i];best=i;} if(best>=0){ sellHouse(c,best); continue; } var did=false; for(var j=0;j<40;j++) if(owner[j]===c&&!mort[j]&&groupBare(j)){ doMort(c,j); did=true; break; } if(!did) break; } }
  function sellLabel(i){ return (hotelShort(i)?"Sell hotel — bank has only "+Math.max(0,housesLeft)+" house"+(Math.max(0,housesLeft)===1?"":"s"):"Sell a building")+" (+"+money(sellGain(i))+")"; }
  function propActions(c,i,debt){ var s=BOARD[i], a=[];
    if(debt){ if(s.t==="prop"&&houses[i]>0){ if(canSell(c,i)) a.push({id:"s"+i,label:sellLabel(i)}); } else if(!mort[i]&&groupBare(i)) a.push({id:"m"+i,label:"Mortgage (+"+money(s.mort)+")",color:"red"}); return a; }
    if(canBuild(c,i)&&cash[c]>=s.house) a.push({id:"b"+i,label:(houses[i]===4?"🏨 Build Hotel":"🏠 Build House")+" — "+money(s.house),color:"green"});
    if(s.t==="prop"&&houses[i]>0&&canSell(c,i)) a.push({id:"s"+i,label:sellLabel(i)});
    if(!mort[i]&&groupBare(i)) a.push({id:"m"+i,label:"Mortgage (+"+money(s.mort)+")",color:"red"});
    if(mort[i]&&cash[c]>=Math.ceil(s.mort*1.1)) a.push({id:"u"+i,label:"Lift mortgage — "+money(Math.ceil(s.mort*1.1)),color:"green"});
    return a; }
  function propList(c,debt){ var arr=[]; for(var i=0;i<40;i++) if(owner[i]===c) arr.push({i:i,h:houses[i],m:mort[i],actions:propActions(c,i,debt)}); return arr; }
  async function resolveDebt(c,creditor){
    if(human(c)){
      while(cash[c]<0){
        if(liquidatable(c)<0){ await goBankrupt(c,creditor); return; }
        var pick=await ask(c,"You owe "+money(-cash[c])+" more","Tap a property to sell buildings / mortgage, or declare bankruptcy",[{id:"bankrupt",label:"❌ Declare Bankruptcy"}],{kind:"manage",props:propList(c,true),extra:[{id:"bankrupt",label:"❌ Declare Bankruptcy",color:"red"}],dflt:"auto"});
        if(pick.id==="auto"){ aiRaise(c); renderBoard(); turnBanner(c); if(cash[c]<0){ await goBankrupt(c,creditor); return; } continue; }   // no answer: sell/mortgage like the computer, never a surprise bankruptcy
        if(!pick.id||pick.id==="bankrupt"){ await goBankrupt(c,creditor); return; }
        var op=pick.id[0], idx=parseInt(pick.id.slice(1),10);
        if(owner[idx]===c){ if(op==="s") sellHouse(c,idx); else if(op==="m") doMort(c,idx); }
        renderBoard(); turnBanner(c);
      }
    } else { aiRaise(c); if(cash[c]<0) await goBankrupt(c,creditor); }
  }
  // official: what a player owes the bank and can't pay -> the bank auctions every deed taken (not with the "No auctions" house rule)
  async function goBankrupt(c,creditor){ var lots=declareBankrupt(c,creditor); if(!creditor&&!R.noAuction&&alive().length>1){ for(var n=0;n<lots.length;n++) await auction(lots[n]); } }
  function declareBankrupt(c,creditor){
    toast(nm(c)+" is bankrupt!");
    var refund=0, lots=[];
    for(var i=0;i<40;i++) if(owner[i]===c && BOARD[i].t==="prop" && houses[i]>0){ refund+=Math.floor(houses[i]*BOARD[i].house/2); if(houses[i]===5)hotelsLeft++; else housesLeft+=houses[i]; houses[i]=0; }
    if(creditor){ cash[creditor]+=cash[c]+refund; jokers[creditor]+=jokers[c]; for(var j=0;j<40;j++) if(owner[j]===c) owner[j]=creditor; }
    else { for(var k=0;k<40;k++) if(owner[k]===c){ owner[k]=null; mort[k]=false; lots.push(k); } for(var jk=0;jk<jokers[c];jk++) returnJoker(); }
    cash[c]=0; jokers[c]=0; bankrupt[c]=true;
    if(seat[c]) send({t:"wait", pid:seat[c], msg:"You went bankrupt — game over for you."});
    renderBoard();
    return lots;
  }

  // ---------- build / mortgage ----------
  function canBuild(c,i){ var s=BOARD[i]; if(s.t!=="prop"||owner[i]!==c) return false; if(!ownsGroup(c,s.g)) return false; if(GROUPS[s.g].some(function(x){return mort[x];})) return false; if(houses[i]>=5) return false; if(houses[i]===4){ if(R.evenBuild&&GROUPS[s.g].some(function(x){return houses[x]<4;})) return false; return R.unlimited||hotelsLeft>0; } if(!R.unlimited&&housesLeft<=0) return false; if(!R.evenBuild) return true; var min=Math.min.apply(null,GROUPS[s.g].map(function(x){return houses[x];})); return houses[i]===min; }
  function buildHouse(c,i){ var s=BOARD[i]; if(!canBuild(c,i)||cash[c]<s.house) return; cash[c]-=s.house; if(houses[i]===4){ houses[i]=5; hotelsLeft--; housesLeft+=4; } else { houses[i]++; housesLeft--; } }
  function canSell(c,i){ var s=BOARD[i]; if(s.t!=="prop"||owner[i]!==c||houses[i]<=0) return false; if(!R.evenBuild) return true; var max=Math.max.apply(null,GROUPS[s.g].map(function(x){return houses[x];})); return houses[i]===max; }
  // a hotel sold back is exchanged for 4 houses; in a housing shortage it is sold down to the houses the bank has left
  function hotelShort(i){ return houses[i]===5 && !R.unlimited && housesLeft<4; }
  function sellGain(i){ var half=Math.floor(BOARD[i].house/2); return hotelShort(i)?(5-Math.max(0,housesLeft))*half:half; }
  function sellHouse(c,i){ if(!canSell(c,i)) return; cash[c]+=sellGain(i); if(houses[i]===5){ var back=R.unlimited?4:Math.min(4,Math.max(0,housesLeft)); houses[i]=back; hotelsLeft++; housesLeft-=back; } else { houses[i]--; housesLeft++; } }
  // official: every building in the colour group must be sold before any lot of it is mortgaged (or traded)
  function groupBare(i){ var s=BOARD[i]; return s.t!=="prop" || GROUPS[s.g].every(function(x){return houses[x]===0;}); }
  function doMort(c,i){ var s=BOARD[i]; if(owner[i]!==c||mort[i]||!groupBare(i)) return; mort[i]=true; cash[c]+=s.mort; }
  function unMort(c,i){ var s=BOARD[i]; if(owner[i]!==c||!mort[i]) return; var cost=Math.ceil(s.mort*1.1); if(cash[c]<cost) return; cash[c]-=cost; mort[i]=false; }
  async function manage(c){
    while(true){
      var pick=await ask(c,"Your properties — "+money(cash[c]),"Tap a property to see its deed",[{id:"done",label:"◀ Done"}],{kind:"manage",props:propList(c,false),extra:[{id:"done",label:"◀ Done",color:"blue"}]});
      if(!pick.id||pick.id==="done") return;
