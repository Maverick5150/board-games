<style>
  *{box-sizing:border-box;}
  html,body{margin:0;}
  html{scrollbar-width:none;}   /* the host is always the TV layout: no scrollbar down the right edge (the D-pad still scrolls) */
  body.bg-app{min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden;overflow-y:auto;}
  [hidden]{display:none !important;}
  .muted{color:var(--text-2);}
  /* text straight on the stage keeps its contrast while a light beam passes: the shared dark halo (scene) */
  body.bg-app--scene [data-stage-text]{text-shadow:0 0 .15em rgba(4,5,12,.95), 0 0 .45em rgba(4,5,12,.8), 0 0 1em rgba(4,5,12,.55);}
  body.bg-app--scene .bg-section > [data-stage-text]{text-shadow:0 0 .1em rgba(4,5,12,1), 0 0 .3em rgba(4,5,12,.95), 0 0 .7em rgba(4,5,12,.8), 0 0 1.3em rgba(4,5,12,.5);}
  /* top bar: Back / Quit, where you are (or the game's status line), the relay, the sound button */
  .bg-topbar{min-height:4.5rem;}
  .bg-topbar__title{max-width:62rem;margin:0 auto;}
  .bg-topbar__title .bg-eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bg-topbar__name{line-height:1.25;}
  #backbtn{min-width:var(--tap);}
  #conn{white-space:nowrap;}
  #conn:empty{display:none;}
  #conn[data-state="online"]{color:var(--tag-ok-ink);background:var(--tag-ok-bg);box-shadow:inset 0 0 0 1px rgba(79,214,156,.45);}
  .wrap{flex:1 0 auto;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem var(--gutter) 1.5rem;}
  .wrap.is-game{padding:.4vh 2vw .3vh;}
  .wrap.is-lobby{justify-content:flex-start;padding-top:1.5rem;}
  /* the in-game status line lives in the top bar (it replaces the game name) */
  body.ps-ingame .bg-topbar__name{display:none;}
  .status{display:flex;align-items:center;justify-content:center;gap:.6rem;min-height:1.6rem;max-width:100%;font:var(--fw-ui-strong) var(--fs-lg)/1.2 var(--font-ui);color:var(--text-1);text-align:center;}
  .status:empty, body:not(.ps-ingame) .status{display:none;}
  .dot{width:.85rem;height:.85rem;border-radius:50%;display:inline-block;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.2);}
  /* remote legend + the live hint */
  .bg-hintbar{width:100%;margin-top:1vh;}
  .bg-hintbar #hint{flex:0 1 auto;min-width:0;max-width:62vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-1);}
  .hintbar{font:var(--fw-ui) var(--fs-sm)/1.25 var(--font-ui);color:var(--text-2);text-align:center;}
  /* game select: the shelf */
  .ps-select{width:100%;max-width:72rem;display:grid;gap:1.25rem;justify-items:center;}
  .ps-head{text-align:center;display:grid;gap:.4rem;justify-items:center;}
  .ps-head h1{margin:0;font:400 var(--fs-3xl)/1.1 var(--font-display);color:var(--text-1);}
  .ps-head p{margin:0;font:var(--fw-body) var(--fs-md)/1.35 var(--font-ui);color:var(--text-2);max-width:40rem;}
  #cards.bg-tiles{grid-template-columns:repeat(4,13.5rem);justify-content:center;width:max-content;max-width:100%;}
  /* lobby: the join column (QR, code, Start) stays on screen while the options column scrolls */
  .lobby{display:grid;grid-template-columns:minmax(0,25rem) minmax(0,1fr);gap:2.5rem;align-items:start;width:100%;max-width:76rem;}
  .lobby .lcol{position:sticky;top:5.5rem;display:grid;gap:.9rem;justify-items:center;text-align:center;min-width:0;padding:var(--focus-room);margin:calc(-1 * var(--focus-room));}
  .lobby .rcol{display:grid;gap:1.25rem;min-width:0;padding:var(--focus-room);margin:calc(-1 * var(--focus-room));}
  .qrbox{display:block;padding:.7rem;border-radius:var(--r-lg);background:#fff;box-shadow:0 0 0 1px rgba(231,202,144,.5),0 1rem 2rem -1rem rgba(0,0,0,.9);}
  .qrimg{display:block;width:min(16.5rem,56vh);height:auto;}
  .qrfallback{color:#111;background:#fff;padding:1.5rem;border-radius:var(--r-lg);font-weight:700;text-align:center;max-width:20rem;}
  .join-url{overflow-wrap:anywhere;text-wrap:balance;margin:0;font:var(--fw-body) var(--fs-md)/1.35 var(--font-ui);color:var(--text-2);}
  .join-url b{color:var(--text-1);font-weight:var(--fw-ui-strong);}
  .codewrap{display:grid;gap:.3rem;justify-items:center;}
  .code{display:flex;gap:.4rem;margin:0;font:400 var(--fs-4xl)/1 var(--font-display);color:var(--gold-100);}
  .code span{display:grid;place-items:center;width:3.4rem;height:4.4rem;border-radius:var(--r-md);background:var(--ink-3);box-shadow:inset 0 0 0 1px var(--line-gold),inset 0 1px 0 rgba(255,255,255,.08);}
  .ps-cta{width:100%;}
  .ps-cta .bg-btn--cta{width:100%;}
  .ps-sec{display:grid;gap:.75rem;min-width:0;}
  .ps-sec > .bg-section{margin:0;}
  .ps-line{margin:0;padding:.7rem 1rem;border-radius:var(--r-md);background:var(--ink-2);box-shadow:var(--well-edge);font:var(--fw-ui-strong) var(--fs-sm)/1.3 var(--font-ui);color:var(--text-1);}
  .ps-line.is-warn{box-shadow:inset 0 0 0 1px rgba(245,196,81,.55);color:#ffe3a3;}
  .players{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.75rem,1fr));gap:.75rem;padding:var(--focus-room);margin:calc(-1 * var(--focus-room));}
  .players .bg-seatcard{padding:.9rem .5rem .75rem;gap:.35rem;}
  .players .bg-seatcard .bg-token{width:3rem;height:3rem;font-size:var(--fs-lg);}
  .players .prow{display:contents;}
  .players .pdot{display:grid;place-items:center;font-family:var(--font-ui);font-weight:var(--fw-caps);}
  .players .pdot::before{content:attr(data-ch);}
  .players .bg-seatcard--empty .pdot{opacity:.45;box-shadow:0 0 0 2px var(--ink-1);}
  .players .prow .bg-seatcard__name{font-size:var(--fs-lg);}
  .players .empty .bg-seatcard__name{font:var(--fw-ui) var(--fs-xs)/1.25 var(--font-ui);white-space:normal;color:var(--text-3);}
  .players .cpuname{text-transform:capitalize;}
  .ps-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1.25rem;align-items:start;}
  .ps-two .bg-seg{width:100%;}
  #cpuBtns.bg-seg--grid5{grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-flow:row;}
  #cpuBtns button, #paceBtns button, #skillBtns button{min-height:var(--tap);}
  #paceBtns button, #skillBtns button{padding-inline:.4rem;}
  .ps-stack{display:grid;gap:1.25rem;min-width:0;}
  .ps-rule .bg-ico-slot{flex:none;display:grid;place-items:center;width:1.5rem;color:var(--gold-200);}
  .ps-rule .bg-ico-slot .bg-ico{width:1.25rem;height:1.25rem;}
  .rulebox{display:grid;gap:1.25rem;}
  .ps-vdesc{margin:.875rem 0 0;padding:.75rem .875rem;border-radius:var(--r-md);background:var(--ink-2);box-shadow:var(--well-edge);font:var(--fw-body) var(--fs-sm)/1.45 var(--font-ui);color:var(--text-2);}
  .ps-vdesc b{color:var(--text-1);font-weight:var(--fw-ui-strong);}
  .rulebox .bg-version{min-height:5rem;justify-content:center;}
  .ps-rules{display:grid;border-radius:var(--r-lg);background:var(--panel-fill);box-shadow:var(--panel-edge),var(--elev-1);padding:var(--focus-room);}
  .ps-rule{position:relative;}
  .ps-rule + .ps-rule{box-shadow:inset 0 1px 0 var(--line-1);}
  .ps-rule .bg-row{padding-left:7.25rem;}
  .ps-rule > .bg-tag{position:absolute;left:1rem;top:50%;transform:translateY(-50%);pointer-events:none;}
  .ps-rule .ps-val{flex:none;max-width:48%;text-align:right;font:var(--fw-ui-strong) var(--fs-sm)/1.25 var(--font-ui);color:var(--gold-100);}
  .ps-legend{margin:0;font:var(--fw-body) var(--fs-xs)/1.4 var(--font-ui);color:var(--text-2);}
  /* the shared save bar (saves.js), restyled in Luxe */
  #svbar.svbar{margin:0;padding:var(--focus-room);border:0;border-radius:var(--r-lg);background:none;box-shadow:none;max-width:none;font-size:inherit;}   /* open (no card behind the slots): the stage motion shows between them */
  #svbar h4{display:none;}
  #svbar .r{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr));gap:1.5rem .75rem;margin:0 0 1.5rem;padding:var(--focus-room);}
  #svbar .r:last-child{margin-bottom:0;}
  #svbar button{display:grid;grid-template-columns:auto minmax(0,auto);align-items:center;justify-content:center;gap:.15rem .45rem;min-width:0;min-height:var(--tap);margin:0;padding:.45rem .625rem;border:0;border-radius:var(--r-md);color:var(--text-1);background:var(--control-fill);box-shadow:inset 0 0 0 1px var(--line-2),inset 0 1px 0 rgba(255,255,255,.08);font:var(--fw-ui-strong) var(--fs-sm)/1.15 var(--font-ui);white-space:normal;text-align:center;cursor:pointer;}
  #svbar button:focus{outline:none;}
  #svbar button[disabled]{opacity:.42;}
  #svbar button small{grid-column:1 / -1;margin:0;font:var(--fw-ui) var(--fs-micro)/1.2 var(--font-ui);color:var(--text-3);opacity:1;}
  #svbar button.is-focus, #svbar button:focus-visible{box-shadow:var(--focus-ring);position:relative;z-index:2;}
  /* in game */
  #boardWrap{width:min(70vh,96vw);aspect-ratio:1/1;position:relative;}
  svg{width:100%;height:100%;display:block;}
  .mwrap{display:flex;gap:2vh;align-items:flex-start;justify-content:center;flex-wrap:wrap;width:100%;}
  .mscore{width:min(40vh,94vw);display:flex;flex-direction:column;gap:1vh;}
  .mshead{font:var(--fw-caps) var(--fs-micro)/1.2 var(--font-ui);letter-spacing:var(--track-caps);text-transform:uppercase;color:var(--gold-200);}
  .mscore .bg-players, #rkPl .bg-players, #unPl .bg-players{padding:.9rem 0 .3rem;}
  .mscore .bg-players{display:flex;flex-direction:column;gap:.9rem;}
  #rkPl .bg-players{grid-template-columns:1fr;gap:.9rem;}
  #unPl .bg-players{grid-template-columns:1fr;gap:.9rem;}
  #unPl .bg-players.is-two{grid-template-columns:repeat(2,minmax(0,1fr));}
  #rkPl .bg-player__meta, #unPl .bg-player__meta{white-space:normal;}
  .mscore .bg-player{flex-wrap:wrap;border-radius:var(--r-lg);align-items:center;row-gap:.35rem;padding:.5rem .75rem .5rem .5rem;}
  .mscore .bg-player.is-turn{margin-top:.2rem;}
  .mscore .bg-player .bg-player__meta{color:var(--text-1);}
  .mscore .mschips{flex:1 1 100%;display:flex;flex-wrap:wrap;gap:.2rem;margin:0;}
  .mschips i{min-width:1.2rem;height:1.2rem;border-radius:.3rem;border:1px solid #fff5;font-style:normal;font:var(--fw-caps) var(--fs-micro)/1 var(--font-ui);color:#fff;display:inline-flex;align-items:center;justify-content:center;text-shadow:0 0 2px #000;}
  .mscore.is-many{width:min(84vh,calc(96vw - 82vh));}
  .mscore.is-many .bg-players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;align-items:start;}
  .mscore.is-many .bg-player.is-turn{margin-top:0;}
  .msfp{font:var(--fw-ui-strong) var(--fs-md)/1.3 var(--font-ui);color:var(--gold-100);}
  .rulebox{text-align:left;}
  .mcw{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2vh;width:100%;height:100%;padding:1vh;}
  .mwho{font-size:2.6vh;font-weight:800;color:#09250f;text-align:center;background:#ffffffd9;border-radius:1.4vh;padding:.6vh 1.6vh;max-width:100%;}
  .mdeed .deed{width:34vh;max-width:none;margin:0;box-shadow:0 .6vh 2vh #0007;}
  .mdeed .deed-title{font-size:1.2vh;}.mdeed .deed-name{font-size:2.5vh;}.mdeed .dl{font-size:1.9vh;}.mdeed .dl.sub{font-size:1.65vh;}.mdeed .deed-note{font-size:1.35vh;}.mdeed .icon-band{font-size:5vh;}.mdeed .deed-body{padding:1vh 1.6vh;}.mdeed .deed-band{padding:1.1vh 1vh;}
  .mcard{width:38vh;background:#fff;border:.8vh solid #f08d1c;border-radius:2vh;padding:3vh 2.6vh;text-align:center;box-shadow:0 .8vh 2.4vh #0007;color:#111;}
  .mcard h2{margin:0 0 1.4vh;font-size:3vh;letter-spacing:.2vh;}.mcard p{margin:0;font-size:2.7vh;font-weight:700;line-height:1.25;}
  .mdice{display:flex;gap:2vh;align-items:center;}.mdie{width:11vh;height:11vh;border-radius:2vh;background:#fff;color:#111;font-size:8vh;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 .6vh 1.6vh #0007;}
  .mtradebox{background:#fff;border-radius:2vh;padding:2vh 2.4vh;width:46vh;max-width:90%;color:#111;box-shadow:0 .8vh 2.4vh #0007;text-align:left;font-size:2.3vh;line-height:1.3;}
  /* monopoly board */
  /* the board itself is monopoly/board.js (shared with the phone game): one static SVG, pieces and marks laid over it */
  .mboard{width:min(80vh,96vw);aspect-ratio:1/1;border-radius:6px;box-shadow:0 0 0 .5vh #d4a017,0 0 0 .9vh #0a0f22,0 2.4vh 6vh rgba(0,0,0,.8);}
  .mcenter{display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
  .mtk{display:inline-block;vertical-align:middle;}.mtk svg{display:block;width:3.4vh;height:3.4vh;}
  /* Trouble and Sorry! boards: the single-device Luxe boards (trouble/index.html, sorry/index.html) */
  #tboard .tb-lbl{font:800 16px/1 var(--font-ui);letter-spacing:.11em;pointer-events:none;}
  #tboard .tb-nm{font:800 10.5px/1 var(--font-ui);letter-spacing:.05em;paint-order:stroke;stroke:#05060d;stroke-width:2.6px;stroke-linejoin:round;pointer-events:none;}
  #tboard .tb-pn{font:800 14px/1 var(--font-ui);fill:#0b0a12;pointer-events:none;}
  #tboard .tb-pop{font:800 26px/1 var(--font-ui);letter-spacing:.14em;fill:#f1e8d4;opacity:.92;pointer-events:none;}
  #sboard .sr-lbl{font:800 15px/1 var(--font-ui);letter-spacing:.1em;paint-order:stroke;stroke:#05060d;stroke-width:3.4px;stroke-linejoin:round;pointer-events:none;}
  #sboard .sr-pn{font:800 8.5px/1 var(--font-ui);fill:#0b0a12;pointer-events:none;}
  #sboard .sr-title{font:400 42px/1 var(--font-display);letter-spacing:.03em;pointer-events:none;}
  #sboard .sr-cbig{font-family:var(--font-display);font-weight:400;letter-spacing:.02em;}
  #sboard .sr-cwho{font:800 13px/1 var(--font-ui);}
  #sboard .sr-ctxt{font:700 13.5px/1 var(--font-ui);}
  #tboard .peg, #sboard .peg{transition:transform .2s ease-out;}
  html[data-effects="reduced"] #tboard .peg, html[data-effects="reduced"] #sboard .peg, html[data-motion="reduce"] #tboard .peg, html[data-motion="reduce"] #sboard .peg{transition:none;}
  @media (prefers-reduced-motion: reduce){ #tboard .peg, #sboard .peg{transition:none;} }
  /* the dome's turn ring: its opacity is set on the effects ticker's frames (see startPulse), the compositor glides between them */
  .tb-pulse{position:absolute;left:33.333%;top:33.333%;width:33.333%;height:33.333%;pointer-events:none;opacity:.9;will-change:opacity;color:#e23b3b;transition:opacity 125ms linear;}
  .tb-pulse > svg{display:block;width:100%;height:100%;}
  html[data-motion="reduce"] .tb-pulse{transition:none;}
  @media (prefers-reduced-motion: reduce){ .tb-pulse{transition:none;} }
  /* the end of a game: the New game button under the board (the Victory screen offers it too) */
  .ps-again{margin-top:1vh;}
  .bg-win .ps-winact{display:flex;flex-wrap:wrap;gap:1.5rem;justify-content:center;}
</style>
</head>

/* ---------- networking ---------- */
var room=null;           // a fresh random room is created every time a game is picked
var net=null;
var players={};         // pid -> {pid,name,color}
var seat={};            // color -> pid
var pending={};         // reqId -> {pid, resolve}
var gameSnap=null;      // set by Monopoly: re-sends the holdings snapshot to phones
var viewHandler=null;   // set by Monopoly: shows the deed a phone is looking at
var lastAsk={};         // pid -> last ask message (for reconnect re-send)
var leaveHandler=null;  // set by a game whose own state marks seats as human: called with the colour of a phone that left mid-game
var reqSeq=1;
var inLobby=true;

function send(o,retain){ if(net){ if(o&&o.game===undefined&&chosenGame) o.game=chosenGame; net.send(o,retain); } }   // every message says which game this room is, so a phone can theme itself (older phones ignore it)
function showConn(s){ connEl.textContent = s==="online"?"relay connected":(s==="connecting"?"connecting…":"reconnecting…"); connEl.setAttribute("data-state",s); }
/* step 10 smoothness: the next room's relays open while the game picker is up (its code is new and shown nowhere yet, so
   nobody can talk to it), and picking a game takes it over: the lobby is "relay connected" at once instead of seconds later */
var pre=null;   // {room, net, st}
function prepRoom(){
  if(pre||!window.BGNet) return;
  var p={room:BGNet.roomCode(), net:null, st:"connecting"};
  p.net=BGNet.connect(p.room,"host",{
    status:function(s){ p.st=s; if(net===p.net) showConn(s); },
    ready:function(){},
    msg:function(o){ if(net===p.net) onMsg(o); }
  });
  pre=p;
}
function startRoom(){
  closeRoom("The host opened a new game room. Scan the new QR code to join.");
  players={}; seat={}; settlePending(); lastAsk={};
  if(pre){ var p=pre; pre=null; room=p.room; net=p.net; showConn(p.st); }
  else {
    room=BGNet.roomCode();
    net=BGNet.connect(room,"host",{
      status:showConn,
      ready:function(){},
      msg:onMsg
    });
  }
  JOIN_URL=BASE+"play.html?room="+room; SHORT_URL=JOIN_URL.replace(/^https?:\/\//,"");
}
function closeRoom(msg){
  if(!net) return;
  try{ net.send({t:"wait", pid:"*", msg:msg||"The host closed this room."}); }catch(e){}
  var old=net; net=null;
  setTimeout(function(){ try{ old.close(true); }catch(e){} }, 400);   // let the goodbye go out first
  connEl.textContent="";
}
function broadcastLobby(){ send({t:"lobby", players:Object.keys(players).map(function(p){return players[p];})}, true); }

function onMsg(o){
  if(o.t==="join"){
    if(players[o.pid]){ players[o.pid].name=o.name||players[o.pid].name; }
    else if(inLobby && Object.keys(players).length<maxPlayers()){
      var color=firstFreeColor();
      players[o.pid]={pid:o.pid,name:(o.name||"Player"),color:color};
      seat[color]=o.pid;
      toast((o.name||"Player")+" joined");
    } else {
      send({t:"nojoin", pid:o.pid, why:inLobby?"full":"started", max:maxPlayers()});   // tell the phone why it can't sit down (room full / game already on)
      return;
    }
    if(players[o.pid]) send({t:"you", pid:o.pid, color:players[o.pid].color, name:players[o.pid].name});
    if(inLobby){ broadcastLobby(); renderLobby(); }
    else {
      // reconnect during the game: re-send their pending prompt so they don't get stuck on the lobby
      var la=lastAsk[o.pid];
      if(la||!noWait) send(la ? la : {t:"wait", pid:o.pid, msg:"Waiting for your turn…"});
      if(gameSnap) gameSnap();
    }
  } else if(o.t==="leave"){
    var pl=players[o.pid]; if(!pl) return;
    delete players[o.pid]; if(seat[pl.color]===o.pid) delete seat[pl.color]; delete lastAsk[o.pid];
    if(inLobby){ toast(pl.name+" left"); broadcastLobby(); renderLobby(); }
    else if(gameOver){ toast(pl.name+" left"); settlePending(o.pid); }   // the game is finished: nobody takes the seat over
    else {   // mid-game: a computer takes the seat; a prompt the phone was answering gets its safe default
      if(!CPUN[pl.color]){ try{ var ex=Object.keys(CPUN).map(function(k){ return CPUN[k]; }).concat(Object.keys(players).map(function(p){ return players[p].name; }),[pl.name]), g1=window.Names&&window.Names.pick(1,ex); if(g1&&g1[0]) CPUN[pl.color]=g1[0]; }catch(e){} }   // the seat now belongs to a computer: it gets a random name too
      toast(pl.name+" left — the computer plays "+cpuName(pl.color));
      if(leaveHandler) leaveHandler(pl.color);
      settlePending(o.pid);
    }
  } else if(o.t==="view"){ if(viewHandler) viewHandler(o);
  } else if(o.t==="pick"){
    var pr=pending[o.reqId];
    if(pr && pr.pid===o.pid){ delete pending[o.reqId]; pr.resolve({id:o.id, i:o.i, data:o.data}); }
  }
}
function firstFreeColor(){ var order=ORDER(); for(var i=0;i<order.length;i++){ if(!seat[order[i]]) return order[i]; } return "red"; }

/* ask a player's phone; resolves with their choice. Shows a TV hint while waiting,
   and auto-advances after a long timeout so a non-responding phone can't hang the game. */
function ask(color, title, sub, options, extraFields){
  var pid=seat[color];
  // the answer used when nobody answers (timeout, phone left, game quit): extraFields.dflt = the SAFE option's id
  // (Pass, Decline, don't buy...), otherwise the first option
  var dk=extraFields&&extraFields.dflt, di=-1; (options||[]).forEach(function(op,i){ if(di<0&&op.id===dk) di=i; });
  var def=dk!=null?{id:dk,i:Math.max(di,0)}:(options&&options[0]?{id:options[0].id,i:0}:{id:null,i:0});
  if(!pid) return Promise.resolve(def); // no controller -> default
  var reqId=reqSeq++;
  var msg={t:"ask", pid:pid, reqId:reqId, title:title, sub:sub, options:options}; if(extraFields){ for(var k in extraFields) if(k!=="dflt") msg[k]=extraFields[k]; }
  lastAsk[pid]=msg;
  var who = players[pid] ? players[pid].name : "player";
  var hint=$("hint"); if(hint) hint.textContent = "Waiting for "+who+" — check your phone ("+title+")";
  return new Promise(function(resolve){
    var done=false;
    var fin=function(v){ if(done) return; done=true; clearTimeout(to); if(lastAsk[pid]===msg) delete lastAsk[pid]; var h=$("hint"); if(h) h.textContent="Players: use your phones"; resolve(v); };
    var to=setTimeout(function(){ delete pending[reqId]; fin(def); }, (extraFields&&extraFields.timeoutMs)||120000); // 2 min safety (long rounds can ask for more)
    pending[reqId]={pid:pid, resolve:fin, dflt:def};
    send(msg);
  });
}
/* answer every open prompt (or one phone's) with its default right away: used when a game is quit or a phone leaves,
   so no 2-minute ask timer outlives its game */
function settlePending(pid){
  Object.keys(pending).forEach(function(k){ var pr=pending[k]; if(pid&&pr.pid!==pid) return; delete pending[k]; try{ pr.resolve(pr.dflt||{id:null,i:0}); }catch(e){} });
}
/* Trouble / Sorry! / Monopoly: a quit game must never act again. Once runId moves on, the game's sleeps and asks
   never resolve, so its loop stops at its next await (same effect as "if(myRun!==runId) return" after every await,
   including the awaits inside helpers like auctions, trades and animations). */
function runGate(myRun){
  var stop=function(){ return new Promise(function(){}); };
  return {
    live:function(){ return myRun===runId; },
    sleep:function(ms){ return sleep(ms).then(function(v){ return myRun===runId?v:stop(); }); },
    ask:function(){ return ask.apply(null,arguments).then(function(v){ return myRun===runId?v:stop(); }); }
  };
}
function waitPhone(color, msg, turnColor){ var pid=seat[color]; if(pid){ delete lastAsk[pid]; send({t:"wait", pid:pid, msg:msg, turn:turnColor}); } }
function waitAllExcept(activeColor, turnColor){

}

function startGame(){
  drawCpuNames();   // step 10: fresh random names for this game's computers (also on "Play again")
  inLobby=false; gameOver=false; leaveHandler=null; Sound.skip(); winnerName=""; gameStartedAt=Date.now(); gamePhones=Object.keys(seat).length; gamePlayers=computeActive(ORDER()).length;   // each game sets its own leaveHandler
  send({t:"started"}, true);   // retained so a reconnecting phone knows the game is on (not the lobby)
  if(chosenGame==="trouble") playTrouble();
  else if(chosenGame==="sorry") playSorry();
  else if(chosenGame==="monopoly") playMonopoly();
  else if(chosenGame==="rummy500") playRummy();
  else if(chosenGame==="risk") playRisk();
  else if(chosenGame==="uno") playUno();
  else if(chosenGame==="scatter") playScatter();
}

}

/* ============================================================
   TROUBLE  (TV host)
   ============================================================ */
function playTrouble(){
  var RG=runGate(++runId), live=RG.live, sleep=RG.sleep, ask=RG.ask;   // a quit game stops at its next await
  var TRACK=28, MAXD=31, cx=300, cy=300, trackR=228, homeR=272;
  var order=ORDERT;                                       // play order (the lobby uses the same one)
  var START={red:0, green:7, yellow:14, blue:21};
  var active=computeActive(order);
  var human={}; active.forEach(function(c){ human[c]=!!seat[c]; });
  leaveHandler=function(c){ human[c]=false; };                // a phone left: the computer plays that colour
  var pegs={}; active.forEach(function(c){ pegs[c]=[null,null,null,null]; });
  var die=0, turn=0, sixStreak=0, over=false;

  function ang(i){ return (-90 + 360*i/TRACK)*Math.PI/180; }
  function trackXY(i){ var a=ang(i); return [cx+trackR*Math.cos(a), cy+trackR*Math.sin(a)]; }
  function absSpace(c,d){ return (START[c]+d)%TRACK; }
  function pegXY(c,d){ if(d===null) return null; if(d<=27) return trackXY(absSpace(c,d)); var j=d-28,a=ang(START[c]),r=198-30*j; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
  var PADC={red:[70,70], green:[530,70], yellow:[530,530], blue:[70,530]}, PADW=110, PADH=112;   // each colour's home tray sits in a corner of the square board
  function homeSlotXY(c,k){ var p=PADC[c]; return [p[0]+(k%2?25:-25), p[1]+(k<2?-8:30)]; }
  function occupantAt(color,targetD){
    if(targetD>27){ for(var k=0;k<4;k++) if(pegs[color][k]===targetD) return {color:color,peg:k}; return null; }
    var abs=absSpace(color,targetD);
    for(var ci=0;ci<active.length;ci++){ var c=active[ci]; for(var p=0;p<4;p++){ var d=pegs[c][p]; if(d===null||d>27) continue; if(absSpace(c,d)===abs) return {color:c,peg:p}; } }
    return null;
  }
  function legalMoves(color,roll){
    var mv=[];
    for(var k=0;k<4;k++){ var d=pegs[color][k];
      if(d===null){ if(roll===6){ var occ=occupantAt(color,0); if(!(occ&&occ.color===color)) mv.push({peg:k,from:null,to:0}); } continue; }
      var nd=d+roll; if(nd>MAXD) continue; var o2=occupantAt(color,nd); if(o2&&o2.color===color) continue; mv.push({peg:k,from:d,to:nd});
    }
    return mv;
  }
  function applyMove(color,mv){ if(mv.to<=27){ var occ=occupantAt(color,mv.to); if(occ&&occ.color!==color){ pegs[occ.color][occ.peg]=null; toast(nmOf(occ.color)+" sent home!"); waitPhone(occ.color, CNAME[occ.color]+" — bumped home!", color); } } pegs[color][mv.peg]=mv.to; }
  function hasWon(color){ return pegs[color].every(function(d){return d!==null&&d>=28;}); }
  function moveLabel(c,mv){
    var n=mv.peg+1, bump="";
    if(mv.to<=27){ var occ=occupantAt(c,mv.to); if(occ&&occ.color!==c) bump=" — bump "+nmOf(occ.color)+"!"; }
    if(mv.from===null) return "Peg "+n+": leave HOME"+bump;
    if(mv.to>=28) return "Peg "+n+": into FINISH"+bump;
    return "Peg "+n+": move "+die+bump;
  }

  // ---- rendering: the same Luxe board as trouble/index.html (one static art layer, glossy pegs gliding on top) ----
  var svg, svgns="http://www.w3.org/2000/svg", spaceR=15.5, holeR=13.5, pegEls={}, lastMv=null, tilt=0, jig=[0,0], pulseEl=null;
  var SIDE={red:"top",green:"right",yellow:"bottom",blue:"left"};
  function f1(n){ return Math.round(n*10)/10; }
  function nmOf(c){ return seat[c]?players[seat[c]].name:cpuName(c); }
  function dieFaceSVG(v,ox,oy,size,rot){
    if(!v) return "";
    var h=size/2, o=size*0.26, pr=size*0.085;
    var s='<g transform="rotate('+(rot||0)+' '+ox+' '+oy+')"><ellipse cx="'+(ox+3)+'" cy="'+(oy+h+4)+'" rx="'+(h*0.95)+'" ry="'+(size*0.11)+'" fill="#000" opacity=".4"/>'+
      '<rect x="'+(ox-h)+'" y="'+(oy-h)+'" width="'+size+'" height="'+size+'" rx="'+(size*0.18)+'" fill="url(#tbDie)" stroke="#2a2440" stroke-opacity=".55" stroke-width="2"/>'+
      '<path d="M'+(ox-h+size*0.18)+' '+(oy-h+2.5)+'H'+(ox+h-size*0.18)+'" stroke="#fff" stroke-opacity=".9" stroke-width="2.4" stroke-linecap="round"/>';

    MAP[v].forEach(function(key){ var dx=P[key][0], dy=P[key][1]; s+='<circle cx="'+(ox+dx)+'" cy="'+(oy+dy)+'" r="'+pr+'" fill="#1b2340"/><circle cx="'+(ox+dx-pr*0.3)+'" cy="'+(oy+dy-pr*0.35)+'" r="'+(pr*0.32)+'" fill="#fff" opacity=".35"/>'; });
    return s+"</g>";

  function dieRestSVG(ox,oy,size,rot){   // the die waiting in the dome

    return '<g transform="rotate('+rot+' '+ox+' '+oy+')" opacity=".42"><path d="M'+(x0+r)+' '+y0+'H'+(x1-r)+'Q'+x1+' '+y0+' '+x1+' '+(y0+r)+'V'+(y1-r)+'Q'+x1+' '+y1+' '+(x1-r)+' '+y1+'H'+(x0+r)+'Q'+x0+' '+y1+' '+x0+' '+(y1-r)+'V'+(y0+r)+'Q'+x0+' '+y0+' '+(x0+r)+' '+y0+'Z" fill="url(#tbDie)" stroke="#2a2440" stroke-opacity=".5" stroke-width="2"/></g>';

  function lbl(c,txt,pos){ return '<text '+pos+' class="tb-lbl" fill="'+SEATC[c].hi+'">'+txt+'</text>'; }
  function build(){
    lastMv=null;
    var s='<defs>'+
      '<linearGradient id="tbPlate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--board-lite)"/><stop offset=".5" style="stop-color:var(--board)"/><stop offset="1" style="stop-color:var(--felt-deep)"/></linearGradient>'+
      '<radialGradient id="tbGlow" cx=".5" cy=".4" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>'+
      '<linearGradient id="tbGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f9ebc6"/><stop offset=".5" stop-color="#d5af6d"/><stop offset="1" stop-color="#8a6633"/></linearGradient>'+
      '<radialGradient id="tbHole" cx=".4" cy=".34" r=".78"><stop offset="0" stop-color="#fbf6ea"/><stop offset=".62" stop-color="#e5d9bf"/><stop offset="1" stop-color="#b5a37a"/></radialGradient>'+
      '<radialGradient id="tbDeep" cx=".42" cy=".3" r=".85"><stop offset="0" stop-color="#262b4d"/><stop offset="1" stop-color="#06070f"/></radialGradient>'+

      '<linearGradient id="tbDie" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d8d2e6"/></linearGradient>'+
      '<radialGradient id="tbBase" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#2a3566"/><stop offset=".7" stop-color="#121733"/><stop offset="1" stop-color="#070914"/></radialGradient>'+
      '<radialGradient id="tbPlat" cx=".4" cy=".32" r=".8"><stop offset="0" stop-color="#47528c"/><stop offset="1" stop-color="#171c3c"/></radialGradient>'+
      '<radialGradient id="tbGlass" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#cfe0ff" stop-opacity=".02"/><stop offset=".72" stop-color="#cfe0ff" stop-opacity=".1"/><stop offset="1" stop-color="#fff" stop-opacity=".36"/></radialGradient>'+
      '<linearGradient id="tbSpec" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>'+
      '</defs><g id="tbArt">';
    // the molded plate: a rounded square with a gold bezel, a dark moat and a faint inner light
    s+='<rect width="600" height="600" rx="64" fill="url(#tbPlate)"/><rect width="600" height="600" rx="64" fill="url(#tbGlow)"/>'+
       '<rect x="3" y="3" width="594" height="594" rx="61" fill="none" stroke="url(#tbGold)" stroke-width="3"/>'+
       '<rect x="9" y="9" width="582" height="582" rx="55" fill="none" stroke="#000" stroke-opacity=".5" stroke-width="2"/>'+
       '<rect x="11.5" y="11.5" width="577" height="577" rx="52.5" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="1"/>';
    // the track: a recessed band with gold edge lines
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="'+trackR+'" fill="none" stroke="#04050d" stroke-opacity=".34" stroke-width="35"/>'+
       '<circle cx="'+cx+'" cy="'+cy+'" r="'+(trackR+17.5)+'" fill="none" stroke="#e7ca90" stroke-opacity=".34" stroke-width="1.4"/>'+

    COLORS4.forEach(function(c){

      s+='<line x1="'+f1(p0[0])+'" y1="'+f1(p0[1])+'" x2="'+f1(x1)+'" y2="'+f1(y1)+'" stroke="'+K.m+'" stroke-opacity=".5" stroke-width="37" stroke-linecap="round"/>'+
         '<line x1="'+f1(p0[0])+'" y1="'+f1(p0[1])+'" x2="'+f1(x1)+'" y2="'+f1(y1)+'" stroke="'+K.tint+'" stroke-width="33" stroke-linecap="round"/>';
    });
    // track spaces (clockwise loop); start spaces carry their seat colour and an arrow outside the loop
    for(var i=0;i<TRACK;i++){

      COLORS4.forEach(function(c){ if(START[c]===i) sc=c; });
      if(sc){ var K=SEATC[sc], a=ang(i), ux=Math.cos(a), uy=Math.sin(a), tx=-uy, ty=ux, r1=trackR+25, bx=cx+r1*ux, by=cy+r1*uy;   // t = clockwise tangent
        s+='<circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+(spaceR+2)+'" fill="'+K.lo+'"/><circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+spaceR+'" fill="'+K.m+'"/><circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="'+spaceR+'" fill="url(#tbPeg)"/><circle cx="'+f1(x)+'" cy="'+f1(y)+'" r="10.5" fill="none" stroke="#fff" stroke-opacity=".85" stroke-width="1.6"/>';
        s+='<path d="M'+f1(bx+tx*10)+' '+f1(by+ty*10)+'L'+f1(bx-tx*5+ux*6)+' '+f1(by-ty*5+uy*6)+'L'+f1(bx-tx*5-ux*6)+' '+f1(by-ty*5-uy*6)+'Z" fill="'+K.hi+'"/>';

      for(var j=0;j<4;j++){ var fp=pegXY(c,28+j); s+=holeDeep(fp[0],fp[1],c,holeR); }
      s+='<rect x="'+(px0-PADW/2-2.5)+'" y="'+(py0-PADH/2-2.5)+'" width="'+(PADW+5)+'" height="'+(PADH+5)+'" rx="23" fill="#02030a" opacity=".45"/>'+

         '<rect x="'+(px0-PADW/2+4)+'" y="'+(py0-PADH/2+4)+'" width="'+(PADW-8)+'" height="'+(PADH-8)+'" rx="17" fill="none" stroke="#fff" stroke-opacity=".1" stroke-width="1"/>';
      s+=lbl(c,"HOME",'x="'+px0+'" y="'+(py0-34)+'" text-anchor="middle"');
      for(var k=0;k<4;k++){ var hp=homeSlotXY(c,k); s+=holeDeep(hp[0],hp[1],c,holeR); }
      if(active.indexOf(c)>=0) s+='<text x="'+px0+'" y="'+(py0+54.5)+'" text-anchor="middle" class="tb-nm" fill="'+K.hi+'">'+esc(nmOf(c).toUpperCase().slice(0,11))+'</text>';
      // START label on the plate beside the start space, and FINISH beside the lane
      var side=SIDE[c], W=CNAME[c].toUpperCase()+" START";
      if(side==="top") s+=lbl(c,W,'x="300" y="30" text-anchor="middle"');
      else if(side==="bottom") s+=lbl(c,W,'x="300" y="581.5" text-anchor="middle"');
      else if(side==="right") s+=lbl(c,W,'transform="translate(570 300) rotate(90)" text-anchor="middle"');

      else s+=lbl(c,"FINISH",'x="'+f1(mx)+'" y="'+f1(my-26)+'" text-anchor="middle"');
    });
    s+='</g><g id="tbHint"></g><g id="tbPegs"></g>';
    // the Pop-O-Matic: a gold bezel, a dark base, the die on its pad, a clear glass bubble over it (the die changes, the glass stays)

      h+='<circle cx="'+f1(a1[0])+'" cy="'+f1(a1[1])+'" r="18" fill="none" stroke="#e7ca90" stroke-opacity=".6" stroke-width="2.4"/><circle cx="'+f1(a2[0])+'" cy="'+f1(a2[1])+'" r="20" fill="none" stroke="#e7ca90" stroke-opacity=".95" stroke-width="2.4"/>';

  var aiBrains={};
  function cpuMove(c,moves){

  function aiAuctionVal(c,i){ var s=BOARD[i]; var v=s.price; if(s.t==="prop"){ var owned=GROUPS[s.g].filter(function(x){return owner[x]===c;}).length; if(owned>0) v=Math.floor(s.price*(1+0.4*owned)); } if(s.t==="rr") v=Math.floor(s.price*1.2); return Math.min(v,Math.max(0,cash[c]-50)); }

  // ---------- cards ----------
  function nearest(p,list){ for(var s=1;s<=40;s++){ var q=(p+s)%40; if(list.indexOf(q)>=0) return q; } return list[0]; }
  async function drawCard(c,deckName){

  async function resolveLanding(c,wasDouble){ var i=pos[c], s=BOARD[i];

  // ---------- trading ----------
  function assetVal(i){ var sp=BOARD[i]; var v=mort[i]?Math.floor(sp.price/2):sp.price; if(sp.t==="prop") v+=houses[i]*sp.house; return v; }
  function tradeableOf(c){ var a=[]; for(var i=0;i<40;i++) if(owner[i]===c && !(BOARD[i].t==="prop"&&GROUPS[BOARD[i].g].some(function(x){return houses[x]>0;}))) a.push({i:i,m:mort[i]}); return a; }

    inc.forEach(function(i){ var sp=BOARD[i]; if(sp.t==="prop"){ var after=GROUPS[sp.g].filter(function(x){return owner[x]===p||inc.indexOf(x)>=0;}).length; if(after===GROUPS[sp.g].length) v+=sp.price; } });

  function sumTxt(items,amt,j){ var a=items.map(function(i){return BOARD[i].n+(mort[i]?" (mortgaged)":"");}); if(amt) a.push(money(amt)); if(j) a.push("a Get Out of Jail Free card"); return a.length?a.join(", "):"nothing"; }
  async function tradeFlow(c){
    var others=alive().filter(function(x){return x!==c;}); if(!others.length) return;
    var popts=others.map(function(x){ return {id:x,label:nm(x)+" ("+tokE[x]+") — "+money(cash[x]),color:x}; }); popts.push({id:"cancel",label:"Cancel",color:"blue"});
    var pk=await ask(c,"Trade with who?","Pick a player",popts,{dflt:"cancel"});

    if(tr.id!=="offer"||!tr.data) return;
    var d=tr.data;
    var okT=function(who,i){ return i>=0&&i<40&&owner[i]===who && !(BOARD[i].t==="prop"&&GROUPS[BOARD[i].g].some(function(x){return houses[x]>0;})); };
    var uniq=function(v,k,a){ return a.indexOf(v)===k; };
    var give=(d.give||[]).map(Number).filter(function(i){return okT(c,i);}).filter(uniq);
    var get=(d.get||[]).map(Number).filter(function(i){return okT(p,i);}).filter(uniq);
    var cg=Math.max(0,Math.min(cash[c],parseInt(d.cg,10)||0)), cr=Math.max(0,Math.min(cash[p],parseInt(d.cr,10)||0));
    var jg=(d.jg&&jokers[c]>0)?1:0, jr=(d.jr&&jokers[p]>0)?1:0;
    if(!give.length&&!get.length&&!cg&&!cr&&!jg&&!jr) return;
    // whoever receives a mortgaged deed pays the bank 10% interest at once, so each side must be able to cover it
    var fee=function(list){ return list.filter(function(i){return mort[i];}).reduce(function(a,i){return a+Math.ceil(BOARD[i].mort*0.1);},0); };
    if(cash[c]-cg+cr<fee(get)){ toast(nm(c)+" can’t cover the 10% interest on the mortgaged deed"); return; }
    if(cash[p]-cr+cg<fee(give)){ toast(nm(p)+" can’t cover the 10% interest on the mortgaged deed"); return; }
    toast(nm(c)+" offers a trade to "+nm(p));
    setGameCenter('<div class="mtradebox"><b>Trade offer</b><div style="margin-top:1vh"><b>'+esc(nm(c))+' gives:</b> '+esc(sumTxt(give,cg,jg))+'</div><div style="margin-top:.8vh"><b>'+esc(nm(p))+' gives:</b> '+esc(sumTxt(get,cr,jr))+'</div><div style="margin-top:1vh;color:#555">'+esc(nm(p))+' is deciding…</div></div>');
    var accept;
    if(human(p)){ var ans=await ask(p,"Trade offer from "+nm(c),"You GET: "+sumTxt(give,cg,jg)+"   ·   You GIVE: "+sumTxt(get,cr,jr),[{id:"yes",label:"✅ Accept",color:"green"},{id:"no",label:"❌ Decline",color:"red"}],{dflt:"no"}); accept=(ans.id==="yes"); }
    else { await sleep(1200); accept=aiAccept(p,give,cg,jg,get,cr,jr,c); }
    setGameCenter(""); if(!accept){ toast(nm(p)+" declined the trade"); return; }
    give.forEach(function(i){ owner[i]=p; if(mort[i]) cash[p]-=Math.ceil(BOARD[i].mort*0.1); });
    get.forEach(function(i){ owner[i]=c; if(mort[i]) cash[c]-=Math.ceil(BOARD[i].mort*0.1); });
    cash[c]-=cg; cash[p]+=cg; cash[p]-=cr; cash[c]+=cr;
    if(jg){ jokers[c]--; jokers[p]++; } if(jr){ jokers[p]--; jokers[c]++; }

  // ---------- turn loop ----------
  function aiPreRoll(c){ if(mb(c,"build")){ aiTrades(c); aiManage(c); renderBoard(); return; } aiBuild(c); }
  async function run(){
    monoFrame(); boardEl=$("mboard"); gameSnap=snapNow; renderBoard(); snapNow();
    while(alive().length>1 && live()){
      var c=active[turn]; if(bankrupt[c]){ turn=(turn+1)%active.length; continue; }
      doublesCount=0; mTurns++;
      // play this player's turn (may repeat on doubles)

      while(!endTurn && !over && !bankrupt[c] && alive().length>1 && live()){
        centerView=""; renderBoard(); turnBanner(c, injail[c]?"in Jail":"");
        active.forEach(function(x){ if(x!==c && seat[x]) waitPhone(x, nm(c)+" is playing…", c); });
        // jail handling
        if(injail[c]){
          var jopts=[{id:"roll",label:"🎲 Roll for doubles",color:"blue"}];
          if(cash[c]>=50) jopts.push({id:"pay",label:"Pay $50 to get out",color:"green"});
          if(jokers[c]>0) jopts.push({id:"card",label:"Use Get Out of Jail Free"});
          var jp = human(c)? await ask(c,"You’re in Jail","Turn "+(jailT[c]+1)+" of 3",jopts) : {id:aiJail(c)};
          if(!human(c)&&jp.id==="roll"&&mb(c,"build")) aiPreRoll(c);   // step 10: the brain trades and builds from Jail too
          if(jp.id==="card"){ jokers[c]--; returnJoker(); injail[c]=false; jailT[c]=0; toast(nm(c)+" uses Jail card"); }
          else if(jp.id==="pay"){ await payBank(c,50); injail[c]=false; jailT[c]=0; }

            await rollDice(c); if(dice[0]===dice[1]){ injail[c]=false; jailT[c]=0; toast(nm(c)+" rolled doubles — out!"); await stepTo(c,dice[0]+dice[1]); await resolveLanding(c,false); endTurn=true; break; }
            else { jailT[c]++; if(jailT[c]>=3){ await payBank(c,50); if(bankrupt[c]){ endTurn=true; break; } injail[c]=false; jailT[c]=0; toast(nm(c)+" pays $50, leaves Jail"); await stepTo(c,dice[0]+dice[1]); await resolveLanding(c,false); } else { toast(nm(c)+" stays in Jail"); } endTurn=true; break; }   // bankrupted by the fine: no move
          }

        if(human(c)){
          var pre=[{id:"roll",label:"🎲 Roll Dice",color:"blue"},{id:"manage",label:"🏠 Manage properties"}];
          if(alive().length>1) pre.push({id:"trade",label:"🤝 Trade"});
          var pk=await ask(c,"Your turn — "+money(cash[c]),"Roll, manage, or trade first",pre);
          if(pk.id==="manage"){ await manage(c); continue; }

        if(R.snakeEyes&&dice[0]===1&&dice[1]===1){ cash[c]+=500; toast(nm(c)+" rolled snake-eyes — +$500!"); }
        if(dice[0]===dice[1]){ doublesCount++; if(doublesCount===3){ toast(nm(c)+" rolled 3 doubles — Jail!"); goJail(c); endTurn=true; break; } }
        await stepTo(c, dice[0]+dice[1]);

        // end-of-turn menu
        if(human(c)){

            var post=[{id:"end",label:"✔ End Turn",color:"green"},{id:"manage",label:"🏠 Manage properties"}];
            if(alive().length>1) post.push({id:"trade",label:"🤝 Trade"});
            var pe=await ask(c,"Turn done — "+money(cash[c]),"Manage, trade, or End Turn",post);

            if(bankrupt[c]) break;

    }

    var w=alive()[0]; over=true; tv('<span class="dot" style="background:'+(w?PC(w):"#fff")+'"></span> '+(w?nm(w):"?")+" wins!"); announceOver(w?nm(w):"?"); showPlayAgain();
  }
  async function rollDice(c){
    var face=function(){ return '<div class="mwho">'+esc(nm(c))+' rolls…</div><div class="mdice"><div class="mdie">'+dice[0]+'</div><div class="mdie">'+dice[1]+'</div></div>'; };
    Sound.sfx("dice");
    for(var k=0;k<6;k++){ dice=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)]; turnBanner(c,"Dice "+dice[0]+" + "+dice[1]); setGameCenter(face()); await sleep(90); }

    await sleep(1000); setGameCenter("");

  run();
}
