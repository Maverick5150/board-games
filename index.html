<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1630">
<title>Board Games</title>
<style>
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:radial-gradient(120% 120% at 50% 0%,#1b2a55,#0e1630 60%);color:#eef2ff;
    display:flex;flex-direction:column;align-items:center;padding:40px 16px;}
  h1{letter-spacing:1px;margin:0 0 4px;}
  p{color:#9fb0d8;margin:0 0 28px;font-size:14px;}
  .grid{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;width:100%;max-width:560px;}
  a.tile{display:flex;flex-direction:column;justify-content:flex-end;width:160px;height:160px;
    border-radius:18px;text-decoration:none;color:#fff;padding:16px;font-weight:800;font-size:20px;
    background:linear-gradient(145deg,#e23b3b,#2b7be0);box-shadow:0 10px 20px #0006;}
  a.tile small{display:block;font-weight:500;font-size:12px;opacity:.85;}
</style>
</head>
<body>
  <h1>🎲 Board Games</h1>
  <p>Tap a game to play</p>
  <div class="grid">
    <a class="tile" href="trouble/index.html">Trouble<small>pop &amp; race home</small></a>
  </div>
</body>
</html>
