<!doctype html>
<html lang="en" data-game="monopoly">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#080a15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Monopoly</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="../ui/art/icon-monopoly-192.png">
<link rel="apple-touch-icon" href="../ui/art/icon-monopoly-maskable-512.png">
<script>/* before first paint: TV for ?tv=1 or the Fire TV bridge, and the stored effects level */
(function (h) {
  if (/[?&]tv=1(&|$)/.test(location.search) || window.AndroidTV) h.setAttribute("data-tv", "");
  try { if (localStorage.getItem("bgui.effects") === "reduced") h.setAttribute("data-effects", "reduced"); } catch (e) { }
})(document.documentElement);</script>
<link rel="stylesheet" href="../ui/theme.css">
<script src="../ui/icons.js" defer></script>
<script src="../ui/ui.js" defer></script>
<style>
  /* Monopoly on the shared Midnight Luxe system (ui/theme.css). Page layout only (mn- prefix); every control is a bg- class.
     The board (#board) is the game's own art, rebuilt on Luxe surfaces in step 5: here it only scales with its width (its sizes are
     in em of a base that follows the board, 10px on a 390px board) and sits in the Luxe frame skins.js gives #board. Every dialog
     is ONE host, #overlay > #modal (the game's own dialog engine): a Luxe bottom sheet through BGUI.sheet, or the setup page. */
  *, *::before, *::after{box-sizing:border-box}
  [hidden]{display:none !important}
  :root{--m-board:#cfe8d4; --mn-bw:min(calc(100vw - 10px), 640px)}
  html[data-tv]{--mn-bw:min(calc(100vh - 7.5rem), 52vw)}
  body.bg-app{overflow-x:hidden; touch-action:manipulation}

  /* ---------- the board (step 5): monopoly/board.js draws it (one static SVG, the pieces and marks as light overlays); here only its size
     and the pulse of the piece whose turn it is. The Luxe frame is the one skins.js gives #board. ---------- */
  #boardWrap{position:relative; flex:none; width:var(--mn-bw); aspect-ratio:1/1; margin:.5rem auto .5rem}
  #board{width:100%; height:100%; border-radius:8px}
  /* the current player's piece pulses, 1 to 1.3 and back every second, on a plain wrapper: its colour glow (the filter on .tk) is
     painted once into the wrapper's layer and only the transform changes. With ui/ui.js every beat is ONE finite 1 s pulse (the same
     keyframes and easing as before), started by the ONE effects ticker about once a second (pulseTick), so the page runs no endless
     CSS animation (README section 6) and the compositor plays each beat as it played the old loop. Two names for the same beat, so
     switching them starts the next one without a reflow. Without ui.js (no ticker) the old CSS pulse runs, as it always did */
  .tkp.cur{transform:scale(1.15)}
  html.mn-luxe .tkp.cur{will-change:transform}
  html.mn-luxe .tkp.cur.is-b1, html.mn-luxe .tkp.cur.is-b2{transform:scale(1)}
  html.mn-luxe .tkp.cur.is-b1{animation:pulse 1s 1}
  html.mn-luxe .tkp.cur.is-b2{animation:pulse-b 1s 1}
  html:not(.mn-luxe) .tkp.cur{animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
  @keyframes pulse-b{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
  /* the current token keeps its "whose turn" lift, still, under Reduce effects and reduced motion */
  html[data-effects="reduced"] .tkp.cur, html[data-motion="reduce"] .tkp.cur{animation:none !important; transform:scale(1.15) !important}
  @media (prefers-reduced-motion: reduce){ .tkp.cur{animation:none !important; transform:scale(1.15) !important} }
  /* ---------- in game (phone): the board first, so a sheet opened below it keeps the whole board in view ---------- */
  .mn-game{display:flex; flex-direction:column; align-items:center; padding:.25rem 0 1.5rem}
  body.mn-in-setup .mn-game{display:none !important}
  #players{width:100%; max-width:40rem; padding:.875rem var(--gutter) .375rem}
  /* a bankrupt player's chip (.is-out): a dark chip, the token and the CPU badge faded, the text at full contrast: ui/theme.css since 4c */
  .mn-statuscard{display:flex; align-items:center; gap:.75rem; width:calc(100% - 2 * var(--gutter)); max-width:38rem; margin:.25rem 0 0; padding:.625rem .875rem; border-radius:var(--r-lg)}
  .mn-dice{display:flex; gap:.375rem; flex:none}
  .mn-die{width:2.25rem; height:2.25rem; font:var(--fw-caps) var(--fs-lg)/1 var(--font-ui)}
  .mn-die.is-blank{opacity:.32}
  .status{flex:1; min-width:0; display:flex; flex-wrap:wrap; align-items:center; gap:.35rem .5rem; color:var(--text-1); font:var(--fw-ui) var(--fs-sm)/1.3 var(--font-ui)}
  .mn-turn{flex:1 1 100%; min-width:0}
  .mn-turn b{font-weight:var(--fw-caps)}
  .pill{display:inline-flex; align-items:center; gap:.3rem; padding:.2rem .6rem; border-radius:var(--r-pill); font:var(--fw-ui) var(--fs-xs)/1.25 var(--font-ui); color:var(--text-2); background:var(--ink-2); box-shadow:inset 0 0 0 1px var(--line-1)}
  .mn-dot{display:inline-block; flex:none; width:.75rem; height:.75rem; margin-right:.3rem; border-radius:50%; vertical-align:-.04em; background:var(--seat); box-shadow:0 0 0 2px var(--ink-1), 0 0 0 3px rgba(255,255,255,.18)}
  .mn-controls{display:flex; flex-wrap:wrap; justify-content:center; gap:.5rem; width:calc(100% - 2 * var(--gutter)); max-width:38rem; margin:.75rem 0 0}
  .mn-controls .bg-btn{flex:1 1 auto; min-width:6.5rem}
  .mn-controls .mn-main{flex-basis:100%}
  .mn-log{width:calc(100% - 2 * var(--gutter)); max-width:38rem; max-height:5.6rem; overflow-y:auto; margin:.5rem 0 0; padding:.5rem .75rem; border-radius:var(--r-md);
    background:var(--ink-2); box-shadow:var(--well-edge); font:var(--fw-body) var(--fs-xs)/1.35 var(--font-ui); color:var(--text-2)}
  .mn-log div{margin:.1rem 0}
  .mn-log b{color:var(--text-1)}
  html:not([data-tv]) .mn-hints{display:none}

  /* the square inspector (TV: the right-hand column while the D-pad is on the board; phone: the square's sheet) */
  .mn-insp{grid-area:log; align-self:stretch; min-height:0; overflow:hidden; margin:.5rem 0 0; padding:1rem 1.25rem; border-radius:var(--r-md); background:var(--ink-2); box-shadow:var(--well-edge)}
  html:not([data-tv]) .mn-insp{display:none}
  .mn-insp{--mbi-cols:3; padding:.5rem 1.25rem}
  .mn-insp .mbi__chip, .mn-insp .mbi__st, .mn-insp .mbi__own{padding:.15rem .6rem}
  .mn-insp .mbi__rents div{padding:.05rem 0}
  .mn-insp .mbi{gap:.4rem}
  .mn-insp .mbi__name{font-size:var(--fs-xl)}
  .mn-insp .mbi__chip, .mn-insp .mbi__st, .mn-insp .mbi__own, .mn-insp .mbi__rents div, .mn-insp .mbi__desc{font-size:var(--fs-micro)}
  .mn-insp .mbi__ic svg{width:1.6rem; height:1.6rem}
  .mn-insp .mbi__head{padding-bottom:.4rem; border-bottom-width:.3rem}
  .mn-insp .mbi__meta, .mn-insp .mbi__state{gap:.3rem .4rem}
  /* TV: the whole board takes the ivory focus ring while the D-pad is on it (the square ring inside shows which square) */
  html[data-tv] #board.is-focus, html[data-tv] #board:focus-visible{box-shadow:var(--focus-ring) !important; position:relative; z-index:2}
  .mn-sqhead{border-bottom:.4rem solid var(--grp, var(--gold-300)); padding-bottom:.6rem}
  .mn-sqhead__row{display:flex; align-items:center; gap:.75rem}
  .mn-sqhead__ic{flex:none; display:grid; place-items:center}
  .mn-sqhead .bg-sheet__title{font:400 var(--fs-3xl)/1.05 var(--font-display); text-transform:uppercase; letter-spacing:-.01em}
  /* ---------- the dialog host: a Luxe bottom sheet (BGUI.sheet), or the setup page in the flow ---------- */
  .mn-ov{display:none}
  .mn-ov.on{display:block}
  .mn-ov.mn-ov--page{position:static; padding:0}
  html.mn-luxe .mn-ov.bg-sheet{display:block}
  /* without ui/ui.js: the old full-screen dialog (the Luxe sheet takes over when it is there) */
  html:not(.mn-luxe) .mn-ov.on:not(.mn-ov--page){position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center; padding:14px; background:rgba(8,10,21,.94)}
  html:not(.mn-luxe) .mn-ov.on:not(.mn-ov--page) > .modal{width:min(94vw,30rem); max-height:88vh; overflow-y:auto; padding:1.125rem; border-radius:1rem; background:var(--ink-3, #151930); color:var(--text-1, #f6f1e7)}
  /* a choice sheet that keeps the board in view (phone peek, every TV sheet beside the board): a lighter scrim over the board */
  body.mn-peek, html[data-tv] body.bg-app{--scrim:rgba(3,4,10,.42)}
  .mn-head{margin:0 0 .875rem}
  .mn-head .bg-sheet__sub b{color:var(--text-1); font-weight:var(--fw-ui-strong)}
  .mn-head .bg-sheet__sub .mn-dot{margin-left:.15rem}
  .mn-title--neg{color:var(--danger-text)}
  .mn-money{color:var(--accent-text); font-weight:var(--fw-ui-strong)}
  .mn-neg{color:var(--danger-text)}
  .mn-note{margin:.25rem 0 .875rem; font:var(--fw-body) var(--fs-sm)/1.4 var(--font-ui); color:var(--text-2)}
  .mn-note b{color:var(--text-1)}
  .mn-acts{display:grid; gap:.625rem; margin:.875rem 0 0}
  .mn-acts .bg-btn{white-space:normal}
  .mn-acts--2{display:grid; grid-template-columns:1fr 1fr; gap:inherit}
  .mn-opts{margin:.25rem calc(-1 * var(--focus-room)) 0}
  .mn-opts .bg-sheet__option > .bg-ico{width:1.4rem; height:1.4rem}
  .mn-auto{display:block; height:3px; margin:.875rem 0 0; border-radius:var(--r-pill); background:var(--ink-2); overflow:hidden}
  .mn-auto > i{display:block; height:100%; background:var(--gold-fill); transform-origin:0 50%; animation:mn-auto var(--mn-auto-ms,1700ms) linear forwards}
  @keyframes mn-auto{from{transform:scaleX(1)} to{transform:scaleX(0)}}
  html[data-motion="reduce"] .mn-auto > i{animation:none}
  @media (prefers-reduced-motion: reduce){ .mn-auto > i{animation:none} }
  /* the property deed: a lit paper card (DEED, never the official wording), the colour group's band on top */
  .deed{margin:.875rem 0 .25rem; border-radius:var(--r-md); overflow:hidden; color:var(--text-on-paper);
    background:radial-gradient(95% 70% at 50% 0%, var(--paper-50) 0%, var(--paper-100) 60%, var(--paper-200) 100%); box-shadow:inset 0 0 0 1px rgba(29,26,42,.18), 0 10px 24px -14px rgba(0,0,0,.9)}
  .deed-band{padding:.625rem .875rem .75rem; text-align:center; color:var(--paper-50); box-shadow:inset 0 -1px 0 rgba(0,0,0,.18)}
  .deed-band.light{color:#0b0905}   /* >= 4.6:1 on every light band (pink 4.73, red 4.66) */
  .deed-title{display:inline-block; padding:.22rem .6rem; border-radius:var(--r-pill); font:var(--fw-caps) var(--fs-micro)/1 var(--font-ui); letter-spacing:var(--track-eyebrow); text-transform:uppercase; color:var(--gold-200); background:var(--ink-2)}
  .deed-name{margin-top:.35rem; font:400 1.5rem/1.1 var(--font-display); letter-spacing:-.005em}
  .deed-body{padding:.625rem .875rem .75rem}
  .dl{display:flex; justify-content:space-between; gap:.75rem; padding:.2rem 0; font:var(--fw-body) var(--fs-sm)/1.3 var(--font-ui)}
  .dl b{font-weight:var(--fw-caps); font-variant-numeric:tabular-nums}
  .dl.rule{margin-top:.35rem; padding-top:.45rem; box-shadow:inset 0 1px 0 rgba(29,26,42,.16)}
  .dl.sub{color:var(--text-on-paper-muted); font-size:var(--fs-xs)}
  .deed-note{margin-top:.5rem; text-align:center; font:var(--fw-body) var(--fs-xs)/1.35 var(--font-ui); color:var(--text-on-paper-muted)}
  .deed-note b{color:var(--text-on-paper)}
  .icon-band{padding:.25rem 0 .5rem; text-align:center; font-size:2.25rem; line-height:1.1}
  /* a Chance / Community Chest card: paper with the deck's colour inlay */
  .cardbig{margin:.875rem 0 .25rem; padding:1.25rem 1.125rem; border-radius:var(--r-md); text-align:center; color:var(--text-on-paper); font:var(--fw-ui-strong) var(--fs-lg)/1.4 var(--font-ui);
    background:radial-gradient(95% 70% at 50% 0%, var(--paper-50) 0%, var(--paper-100) 62%, var(--paper-300) 100%);
    box-shadow:inset 0 0 0 .3125rem var(--paper-50), inset 0 0 0 calc(.3125rem + 2px) var(--mn-deck, #e07a10), 0 10px 24px -14px rgba(0,0,0,.9)}
  .cardbig.is-chest{--mn-deck:#2b6fd0}
  /* the debt dialog's rows, lists of properties, player cards, property chips */
  .mn-debt{display:grid; gap:.5rem; margin:.25rem 0 0}
  .mn-drow{display:flex; align-items:center; justify-content:space-between; gap:.75rem; padding:.45rem .5rem .45rem .875rem; border-radius:var(--r-md); background:var(--ink-2); box-shadow:var(--well-edge); font:var(--fw-ui) var(--fs-sm)/1.3 var(--font-ui)}
  .mn-drow .bg-btn{flex:none}
  .mn-ok{margin:.5rem 0; font:var(--fw-ui-strong) var(--fs-md)/1.3 var(--font-ui); color:var(--accent-text)}
  .mn-list{display:grid; gap:.5rem; padding:var(--focus-room); margin:0 calc(-1 * var(--focus-room))}
  .mn-lrow{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:.75rem; width:100%; min-height:var(--tap); margin:0; padding:.55rem .75rem; border:0; border-radius:var(--r-md);
    text-align:left; font:inherit; color:var(--text-1); background:var(--control-fill); box-shadow:inset 0 0 0 1px var(--line-2), inset 0 1px 0 rgba(255,255,255,.08); cursor:pointer; transition:transform var(--dur-instant) var(--ease-out)}
  .mn-lrow:active{transform:scale(.98)}
  .mn-lrow__name{display:block; font:var(--fw-ui-strong) var(--fs-md)/1.25 var(--font-ui)}
  .mn-lrow__meta{display:block; font:var(--fw-body) var(--fs-xs)/1.3 var(--font-ui); color:var(--text-3)}
  .mn-lrow > .bg-ico{color:var(--gold-200)}
  .mn-chip{display:inline-block; flex:none; width:.875rem; height:.875rem; border-radius:3px; vertical-align:-.1em; box-shadow:inset 0 0 0 1px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.22)}
  .mn-chip--rr{background:#1e1e1e}
  .mn-chip--util{background:#c4c8d8}
  .mn-pcards{display:grid; gap:.75rem}
  .mn-pcard{padding:.75rem .875rem; border-radius:var(--r-lg); background:var(--panel-fill); box-shadow:var(--panel-edge)}
  .mn-pcard.is-out{background:var(--ink-2)}   /* a bankrupt player: the Out tag and a faded token; the text keeps full contrast */
  .mn-pcard.is-out .bg-token{opacity:.45}
  .mn-pcard.is-out .mn-pcard__cash{color:var(--text-3)}
  .mn-pcard__top{display:flex; align-items:center; gap:.65rem}
  .mn-pcard__top .bg-token{font-size:1.15rem}
  .mn-pcard__name{display:flex; flex-wrap:wrap; align-items:center; gap:.25rem .5rem; flex:1; min-width:0; font:var(--fw-ui-strong) var(--fs-md)/1.2 var(--font-ui)}
  .mn-pcard__cash{font:400 var(--fs-xl)/1 var(--font-display); color:var(--accent-text)}
  .mn-pcard__meta{margin:.35rem 0 .5rem; font:var(--fw-body) var(--fs-xs)/1.35 var(--font-ui); color:var(--text-3)}
  .mn-pchips{display:flex; flex-wrap:wrap; gap:.4rem; padding:var(--focus-room); margin:calc(-1 * var(--focus-room))}
  .mn-pchip{display:inline-flex; align-items:center; gap:.35rem; min-height:var(--tap); margin:0; padding:.3rem .65rem; border:0; border-radius:var(--r-sm); cursor:pointer;
    font:var(--fw-ui) var(--fs-xs)/1.2 var(--font-ui); color:var(--text-1); background:var(--ink-2); box-shadow:inset 0 0 0 1px var(--line-2)}
  .mn-pchip.is-mort{color:var(--text-3)}
  .mn-sets{margin-top:.5rem; font:var(--fw-ui) var(--fs-xs)/1.3 var(--font-ui); color:var(--accent-text)}
  .mn-trade .bg-section:first-of-type{margin-top:.5rem}
  .mn-num{width:7rem; min-height:var(--tap); margin:0; padding:0 .75rem; border:0; border-radius:var(--r-sm); font:var(--fw-ui-strong) var(--fs-md)/1 var(--font-ui);
    color:var(--text-1); background:var(--ink-2); box-shadow:inset 0 0 0 1px var(--line-gold)}
  .mn-num:focus{outline:none; box-shadow:var(--focus-ring)}
  .mn-num{scroll-margin:calc(var(--focus-room) + .5rem)}   /* the trade's cash fields: room for the ring when the D-pad scrolls them in (as every bg- control) */
  .mn-none{margin:0; padding:.75rem 1rem; font:var(--fw-body) var(--fs-sm)/1.3 var(--font-ui); color:var(--text-3)}
  .mn-trade .bg-row__title small, .mn-rules .bg-row__title small{font:var(--fw-body) var(--fs-xs)/1.2 var(--font-ui); color:var(--text-3)}
  .mn-offer{display:grid; gap:.5rem; margin:.25rem 0 0}
  .mn-offer p{margin:0; padding:.6rem .875rem; border-radius:var(--r-md); background:var(--ink-2); box-shadow:var(--well-edge); font:var(--fw-body) var(--fs-sm)/1.4 var(--font-ui); color:var(--text-2)}
  .mn-offer b{color:var(--text-1)}

  /* ---------- the setup page (also reached from the Menu's New Game) ---------- */
  .mn-setup{display:flex; flex-direction:column; width:min(100%,40rem); margin:0 auto; padding:0 var(--gutter)}
  .mn-col{display:contents}
  .mn-hero{order:1} .mn-sec--players{order:2} .mn-sec--tokens{order:3} .mn-sec--rules{order:4} .mn-sec--save{order:5} .mn-back{order:6} .mn-dock{order:7}
  /* hero art band on top, the title under it (README section 10, narrow hero); the art fades into the scene */
  .mn-hero{min-height:0; margin:0 calc(-1 * var(--gutter)); padding-top:46%; border-radius:0; background:transparent}
  .mn-hero .bg-hero__layer{bottom:auto; height:auto; aspect-ratio:16/9; border-radius:0; background-color:transparent;
    background-image:url("../ui/art/hero-monopoly-960.webp"); background-size:100% auto; background-position:100% 0;
    -webkit-mask-image:linear-gradient(180deg,#000 58%,rgba(0,0,0,0) 100%); mask-image:linear-gradient(180deg,#000 58%,rgba(0,0,0,0) 100%)}
  .mn-hero .bg-hero__shade{display:none}
  .mn-hero .bg-hero__body{max-width:none; padding:0 var(--gutter) .25rem}
  .mn-hero .bg-hero__pitch{max-width:30rem}
  .mn-sec{min-width:0}
  .mn-card{display:grid; gap:.75rem}
  .mn-field{display:grid; gap:.15rem}
  .mn-field .bg-row__desc{margin-top:0}
  .mn-seats{display:flex; align-items:center; gap:.875rem; padding:.625rem .875rem; border-radius:var(--r-md); background:var(--ink-2); box-shadow:var(--well-edge)}
  .mn-seats__tokens{display:flex; flex:none; padding-left:.4rem}
  .mn-seats__tokens .bg-token{width:2rem; height:2rem; margin-left:-.4rem; font-size:1rem}
  .mn-seats__txt{min-width:0; font:var(--fw-ui) var(--fs-xs)/1.3 var(--font-ui); color:var(--text-2)}
  .mn-seats__txt b{display:block; font:var(--fw-ui-strong) var(--fs-sm)/1.25 var(--font-ui); color:var(--text-1)}
  /* the token picker: the eight pieces in a 4 x 2 keypad; a picked piece takes its player's seat colour and P1, P2 ... */
  .mn-toks{grid-template-columns:repeat(4, minmax(0, 1fr))}
  .mn-toks > button{display:grid; justify-items:center; align-content:center; gap:.3rem; min-height:5.25rem; padding:.5rem .25rem; white-space:normal;
    font:var(--fw-ui-strong) var(--fs-xs)/1.15 var(--font-ui); color:var(--text-2)}
  .mn-toks .bg-token{width:2.5rem; height:2.5rem; font-size:1.35rem}
  .mn-toks .bg-token:not([data-seat]){background:radial-gradient(circle at 35% 30%, #3b4374 0%, #1d2240 60%, #12162c 100%)}
  .mn-toks .pb{font:var(--fw-caps) var(--fs-micro)/1 var(--font-ui); letter-spacing:.06em; color:var(--text-on-gold)}
  /* captions right on the setup scene (no card behind them) are ivory: the scene's bright green band under the top bar took text-3
     to 3.65:1 (step 4 review), and with a light beam at its brightest behind them even text-2 fell to 3.5:1 (repair, TV); ivory keeps
     >= 4.5:1 there. Marked data-stage-text, so the stage's motifs fade out over them */
  .mn-tokmsg{min-height:1.35em; margin:.5rem 0 0; font:var(--fw-body) var(--fs-xs)/1.35 var(--font-ui); color:var(--text-1)}
  .mn-rules .bg-row__desc{color:var(--text-3)}
  .mn-rulenote{margin:.5rem 0 0; font:var(--fw-body) var(--fs-xs)/1.35 var(--font-ui); color:var(--text-1)}
  /* every text right on the setup scene (marked data-stage-text: the hero, the section eyebrows, the captions, the way back) carries the
     shared soft dark halo (ui/theme.css since 4c; it began here): a light beam at its brightest behind a gold section eyebrow or the
     hero pitch took them to 3.4:1 and 3.3:1 on the phone; with the halo every one keeps >= 4.5:1 (repair) */
  /* saves.js bars (setup #svbar, Menu #svbar2), dressed in Luxe (ids, data-a and behaviour unchanged) */
  #svbar.svbar, #svbar2.svbar{margin:0; padding:var(--sp-3); border:0; border-radius:var(--r-lg); background:var(--panel-fill); box-shadow:var(--panel-edge),var(--elev-1)}
  #svbar h4, #svbar2 h4{display:none}
  #svbar .r, #svbar2 .r{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,8.5rem),1fr)); gap:.5rem; margin:0 0 .5rem}
  #svbar .r:last-child, #svbar2 .r:last-child{margin-bottom:0}
  #svbar button, #svbar2 button{display:grid; grid-template-columns:auto minmax(0,auto); align-items:center; justify-content:center; gap:.15rem .45rem; min-width:0; min-height:var(--tap); margin:0;

/* ============================ DATA ============================ */

/* ======================= HOUSE RULES ======================= */
// default = rules-accurate classic game
const RULES={
 freeParkingJackpot:false, fpSeed500:false,

 startingCash:1500,

const RULE_DEFS=[
 ["freeParkingJackpot","Free Parking jackpot","All taxes & fees collect in the middle; land on Free Parking to win the pool.","house"],
 ["fpSeed500","Seed the pool with $500","With the Free Parking jackpot: when claimed, the pool resets to $500 instead of empty.","house"],
 ["incomeTaxChoice","Income Tax: $200 or 10%","Let the player choose to pay $200 or 10% of total worth (pre-2008 rule).","official"],
 ["luxury75","Luxury Tax = $75","Use the older $75 Luxury Tax instead of the current $100.","house"],

];

/* ============================ STATE ============================ */
let G=null;
function freshState(nPlayers,nHumans,tokenIdx){
  const players=[];
  for(let i=0;i<nPlayers;i++){
    players.push({ id:i, name:(i<nHumans?("You"+(nHumans>1?" "+(i+1):"")):"CPU "+(i+1-nHumans)),
      human:i<nHumans, token:TOKENS[tokenIdx[i]], color:PCOLORS[i],
      cash:RULES.startingCash, pos:0, jail:false, jailTurns:0, jokers:0, bankrupt:false, lapDone:false });
  }
  return {
    players, cur:0, dice:[0,0], doublesCount:0, phase:"preroll",
    owner:Array(40).fill(-1), houses:Array(40).fill(0), mort:Array(40).fill(false),
    chanceDraw:shuffle(CHANCE.map((_,i)=>i)), chanceDisc:[],
    chestDraw:shuffle(CHEST.map((_,i)=>i)), chestDisc:[],
    jokersHeld:{chance:0,chest:0},
    housesLeft:32, hotelsLeft:12, fpPool:0, over:false, started:false,
    turnDouble:false, phaseSince:0, bankAuctionActive:false

}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function cur(){ return G.players[G.cur]; }
function alive(){ return G.players.filter(p=>!p.bankrupt); }
// who is managing right now: the current human, or (during a CPU turn) the human player, so you can
// build & mortgage any time like the official rules allow
function viewer(){ return cur().human ? cur() : (G.players.find(p=>p.human && !p.bankrupt) || cur()); }

/* ========================= HELPERS ========================= */
function groupOf(i){ return BOARD[i].g; }
function ownsFullGroup(pl,g){ return GROUPS[g].every(i=>G.owner[i]===pl.id); }
function countRR(plid){ return RR_IDX.filter(i=>G.owner[i]===plid).length; } // note: typo-safe below
function rrOwned(plid){ return RR_IDX.filter(i=>G.owner[i]===plid).length; }
function utilOwned(plid){ return UTIL_IDX.filter(i=>G.owner[i]===plid).length; }
function netWorth(pl){
  let w=pl.cash;
  for(let i=0;i<40;i++) if(G.owner[i]===pl.id){
    const s=BOARD[i];
    w+= G.mort[i]? Math.floor((s.price||0)/2) : (s.price||0);
    if(s.t==="prop") w+= G.houses[i]*s.house;
  }
  return w;
}
// Income Tax "10% of your total worth" (official rule text): cash on hand + the PRINTED price of every
// deed, mortgaged or not + the cost price of every building
function taxWorth(pl){
  let w=pl.cash;
  for(let i=0;i<40;i++) if(G.owner[i]===pl.id){ const s=BOARD[i]; w+=s.price||0; if(s.t==="prop") w+=G.houses[i]*s.house; }
  return w;
}
// the owner's lots in i's colour group; no lot of a group may be mortgaged or traded while any of them has buildings
function ownLots(i){ return GROUPS[BOARD[i].g].filter(x=>G.owner[x]===G.owner[i]); }
function groupBare(i){ return BOARD[i].t!=="prop" || ownLots(i).every(x=>G.houses[x]===0); }

   the Victory screen, Luxe toasts, the TV Back steps and the D-pad focus. Without ui/ui.js every dialog opens as it always did
   (the jsdom harnesses run that path). */
const SEATS=[1,2,3,4,5,7];   // players 1-6 -> Luxe seats red, blue, green, yellow, purple, orange (the board keeps PCOLORS until step 5)
const DARK_BAND={light_blue:1,pink:1,orange:1,red:1,yellow:1,green:1};   // deed bands where dark text reads (the ivory reads on the others)
const SV_ICON={ss:"save",ls:"load",std:"reset",sg:"save",lg:"load",au:"resume"};
const CTRL_ICON={"Roll Dice":"dice","Roll for doubles":"dice","Roll Again (doubles)":"dice","End Turn":"check","Manage":"deed","Trade":"swap","Players":"user","New Game":"play","CPU thinking…":"hourglass","Moving…":"hourglass"};
const ui={dlg:{}, closing:false, sheetDis:null, peek:false, strip:"", meta:{}, turnKey:"", rolls:0, rollShown:0, diceKey:"", clock0:0, winShown:-1, hadFocus:null, mainSeen:"", bar:null};
function BG(){ return window.BGUI||null; }

function resultDue(){ const B=BG(); return !!(G&&G.started&&G.over&&ui.winShown!==EPOCH&&B&&B.win); }   // a win whose Victory screen has not opened yet

function plural(n,one,many){ return n+" "+(n===1?one:many); }
// presentation-only counters in G.stats (the Turn N eyebrow, the Victory pills); saves made before step 4 start fresh ones
function freshStats(){ return {turns:0,ms:0}; }
function readStats(s){ if(!s||typeof s!=="object") return freshStats(); return {turns:Math.max(0,Math.floor(+s.turns||0)),ms:Math.max(0,+s.ms||0)}; }
// the play clock: the time a live game is on screen
function clockOn(){ ui.clock0=(liveGame()&&!document.hidden)?Date.now():0; }
function clockOff(){ if(ui.clock0&&G&&G.stats) G.stats.ms+=Math.max(0,Date.now()-ui.clock0); ui.clock0=0; }
function clockSync(){ if(ui.clock0&&G&&G.stats){ const n=Date.now(); G.stats.ms+=Math.max(0,n-ui.clock0); ui.clock0=n; } }
function playMs(){ return G&&G.stats?G.stats.ms+(ui.clock0?Math.max(0,Date.now()-ui.clock0):0):0; }
function fmtTime(ms){ const s=Math.max(0,Math.round(ms/1000)), h=Math.floor(s/3600), m=Math.floor(s/60)%60, x=s%60;
  return (h?h+":"+String(m).padStart(2,"0"):String(m))+":"+String(x).padStart(2,"0"); }
// a sheet's head: the title comes first (a dialog is read by its first words), then a plain-English line
function head(title,sub,cls){ return `<div class="bg-sheet__grip" aria-hidden="true"></div><div class="mn-head"><h2 class="bg-sheet__title${cls?" "+cls:""}" id="dlgTitle">${title}</h2>${sub?`<p class="bg-sheet__sub">${sub}</p>`:""}</div>`; }

/* ---- the dialog host: a Luxe bottom sheet (BGUI.sheet), or the setup page in the flow ---- */
function setupShown(){ const ov=$("overlay"); return !!ov&&ov.classList.contains("on")&&ov.classList.contains("mn-ov--page"); }
function sheetOpen(){ const B=BG(); return !!(B&&B.sheet&&B.sheet.isOpen($("overlay"))); }
function sheetClose(){ const B=BG(); if(!sheetOpen()) return; ui.closing=true; try{ B.sheet.close($("overlay")); }finally{ ui.closing=false; } }
function dlgShow(){
  const ov=$("overlay"), o=ui.dlg||{}, B=BG();
  if(o.page){
    sheetClose(); peekOff(); ui.hadFocus=null;
    const entering=!ov.classList.contains("mn-ov--page");
    ov.classList.remove("bg-sheet"); ov.classList.add("mn-ov--page"); ov.style.zIndex="";
    ["role","aria-modal","tabindex","aria-labelledby"].forEach(a=>ov.removeAttribute(a)); ov.setAttribute("aria-label","New game");
    setupChrome(true,entering);
    return;
  }
  if(ov.classList.contains("mn-ov--page")){ ov.classList.remove("mn-ov--page"); setupChrome(false,true); }
  ov.removeAttribute("aria-label"); ov.setAttribute("aria-labelledby","dlgTitle");
  if(!luxeOn()) return;   // no ui.js: the old full-screen dialog (fallback CSS)
  const dis=typeof o.dismiss==="function";
  if(sheetOpen()&&ui.sheetDis!==dis) sheetClose();   // whether Back / the scrim may close it is fixed when a sheet opens: open it again
  if(!ov.classList.contains("bg-sheet")){ ov.classList.add("bg-sheet"); void ov.offsetWidth; }   // starts below the screen, so it slides in
  ov.scrollTop=0;
  if(o.peek) peekOn(); else peekOff();
  if(sheetOpen()){ sheetFocus(); if(B.toast&&B.toast.place) B.toast.place(); return; }
  ui.sheetDis=dis;
  B.sheet.open(ov,{dismissible:dis,onClose:sheetClosed});
}
// BGUI closed the sheet by itself (Back, Escape, the scrim: dismissible dialogs only): that dialog's own way out
function sheetClosed(){
  if(ui.closing) return;
  const f=ui.dlg&&ui.dlg.dismiss;
  if(typeof f==="function") f(); else if(overlayOn()) dlgShow();
}
function dlgHide(){
  const ov=$("overlay");
  peekOff();
  if(ov.classList.contains("mn-ov--page")){ ov.classList.remove("mn-ov--page"); setupChrome(false,true); }
  sheetClose();
  setTimeout(()=>tvKeep(null),0);
}
// the control a redraw should give the focus back to: its id, data key or label (prices after " — " change, the label does not)
function focusKey(e){
  if(!e||!e.getAttribute) return null;
  if(e.id) return "#"+e.id;
  for(const a of ["data-k","data-t","data-a","data-i"]){ const v=e.getAttribute(a); if(v!==null) return a+"="+v; }
  const n=e.getAttribute("data-n"); if(n!==null) return ((e.parentNode&&e.parentNode.id)||"")+"/n="+n;
  return "t="+(e.textContent||"").split(" — ")[0].trim();
}
function focusEl(el){ const B=BG(); if(!el) return; if(B&&B.focus&&B.focus.enabled&&onTV()) B.focus.set(el); else { try{ el.focus({preventScroll:true}); }catch(e){} } }
function usableEl(e){ return !!e&&!e.disabled&&e.getClientRects().length>0; }
function sheetFocus(){   // new content in an open sheet: the same control again (Build House twice), else the default one
  const ov=$("overlay"), had=ui.hadFocus; ui.hadFocus=null;
  const list=[].slice.call(ov.querySelectorAll("button, a[href], input, select"));
  const el=(had&&list.find(e=>usableEl(e)&&focusKey(e)===had))||[].slice.call(ov.querySelectorAll("[data-autofocus]")).find(usableEl)||list.find(usableEl);
  focusEl(el);
}
// content added to an open sheet after it opened (the debt list, the Menu's save bar) changes its height: a showing toast is placed
// again, so it never sits on the sheet
function sheetGrew(){ const B=BG(); if(sheetOpen()&&B.toast&&B.toast.place) B.toast.place(); }
function refocusIn(box){   // a list redrawn under the focus (the debt dialog after a sale): the focus stays in it
  const a=document.activeElement;
  if(!box||(a&&a!==document.body&&a.isConnected)) return;
  focusEl(box.querySelector("[data-autofocus]:not([disabled])")||box.querySelector("button:not([disabled])"));
}
function keepIn(box,fn){   // redraw a picker without losing the keyboard / D-pad focus
  const a=document.activeElement, k=a&&box.contains(a)?focusKey(a):null;
  fn();
  if(k===null) return;
  focusEl([].slice.call(box.querySelectorAll("button, input")).find(e=>!e.disabled&&focusKey(e)===k));
}
// a phone keeps the whole board in view above a choice sheet (the board comes first on the page): the sheet takes the room below
// it when that leaves it a useful height, else it opens over the board as usual. A toast waits for such a sheet to close.
function peekOn(){
  const ov=$("overlay"), bw=$("boardWrap");
  if(onTV()||!bw||!bw.getClientRects().length){ peekOff(); return; }
  const vh=innerHeight, se=document.scrollingElement||document.documentElement, r=bw.getBoundingClientRect(), room=Math.floor(vh-(r.bottom+(se.scrollTop||0))-12);
  if(r.height<1||room<Math.max(280,vh*0.36)){ peekOff(); return; }
  ov.style.maxHeight=room+"px"; bw.setAttribute("data-toast-avoid",""); document.body.classList.add("mn-peek"); ui.peek=true;
  if((se.scrollTop||0)>0){ const B=BG(); window.scrollTo({top:0,behavior:B&&B.reducedMotion&&B.reducedMotion()?"auto":"smooth"}); }
}
function peekOff(){ if(!ui.peek) return; ui.peek=false; $("overlay").style.maxHeight=""; document.body.classList.remove("mn-peek"); const bw=$("boardWrap"); if(bw) bw.removeAttribute("data-toast-avoid"); }
// the setup page (and the scene tint) or the game
function setupChrome(on,move){
  const b=document.body;
  b.classList.toggle("mn-in-setup",on); b.classList.toggle("bg-app--scene",on);
  const m=$("menuBtn"); if(m) m.hidden=on;   // the setup page has Resume (mid-game) and Back to all games instead
  if(move) (document.scrollingElement||document.documentElement).scrollTop=0;
  if(!on&&G){ ui.turnKey=""; renderStatus(); }   // the board is back: the strip pulses whose turn it is

}
// TV: the D-pad focus stays on the actions across redraws. A new main action (Roll Dice, End Turn) takes the focus; otherwise the
// same control keeps it. Focus left in a closed sheet counts as lost. It never takes the focus from the top bar, the sound panel,
// an open sheet or the Victory screen.
function tvKeep(had){
  const B=BG(); if(!B||!B.focus||!B.focus.enabled||!onTV()) return;
  const c=$("controls"), main=c.querySelector(".mn-main:not([disabled])"), label=main?main.textContent:"", fresh=label!==ui.mainSeen;
  ui.mainSeen=label;
  if(overlayOn()||(B.win&&B.win.isOpen())||(B.sheet&&B.sheet.top())) return;
  const a=document.activeElement, ov=$("overlay");
  const lost=!a||a===document.body||a===document.documentElement||!a.isConnected||!a.getClientRects().length||ov.contains(a);
  if(!lost&&!had) return;
  const list=[].slice.call(c.querySelectorAll("button:not([disabled])"));
  const el=(fresh&&main)||(had&&list.find(b=>b.textContent===had))||main||list[0];
  if(el) B.focus.set(el);
}

/* ---- the strip, the dice and the top bar ---- */
function barTitle(){
  const e=$("barEyebrow"); if(!e) return;
  const t=setupShown()?(liveGame()?"Game in progress":resultDue()?"Game over":"New game"):(G&&G.over?"Game over":(G&&G.started?"Turn "+Math.max(1,(G.stats&&G.stats.turns)||1):"New game"));
  if(e.textContent!==t) e.textContent=t;
}
function syncStrip(){
  const el=$("players"); if(!el||!G) return;
  const B=BG(), sk=G.players.map(p=>p.id+":"+p.name+":"+p.token.n+(p.human?"H":"C")).join("|");
  if(sk!==ui.strip||el.children.length!==G.players.length){
    el.classList.toggle("bg-players--scroll",G.players.length>4);
    el.innerHTML=G.players.map(p=>`<li class="bg-player" data-seat="${seatOf(p)}" data-p="${p.id}"><span class="bg-token" aria-hidden="true">${tokV(p.token)}</span>`+
      (p.human?"":`<span class="bg-player__cpu" aria-hidden="true">${icon("cpu")}</span>`)+
      `<span class="bg-player__txt"><span class="bg-player__name">${p.name}</span><span class="bg-player__meta"></span></span></li>`).join("");
    ui.strip=sk; ui.meta={}; ui.turnKey="";
  }
  G.players.forEach(p=>{
    const deeds=G.owner.filter(o=>o===p.id).length;
    const m=p.bankrupt?"Bankrupt":money(p.cash)+(p.jail?" · In Jail":deeds?" · "+plural(deeds,"deed","deeds"):"");
    if(ui.meta[p.id]===m) return;

  // the turn pulse plays in a live game on screen only (never behind the setup page, never for the placeholder at load)
  if(B&&B.setTurn) B.setTurn(chip,{pulse:liveGame()&&!setupShown()&&!document.hidden});

}
function syncDice(){
  const a=$("die1"), b=$("die2"); if(!a||!b||!G) return;
  const B=BG(), on=!!(G.dice&&G.dice[0]), key=on?G.dice[0]+"+"+G.dice[1]:"";
  if(on&&ui.rolls!==ui.rollShown){   // a new roll: the ivory dice tumble to it (BGUI.dice: transform + a few face swaps)
    ui.rollShown=ui.rolls; ui.diceKey=key; a.classList.remove("is-blank"); b.classList.remove("is-blank");
    if(B&&B.dice&&!setupShown()){ B.dice.roll(a,G.dice[0],{ms:560,haptic:false}); B.dice.roll(b,G.dice[1],{ms:640}); return; }
  }
  else if(key===ui.diceKey) return;
  ui.diceKey=key;
  [a,b].forEach((d,k)=>{
    d.classList.toggle("is-blank",!on);
    if(on){ if(B&&B.dice) B.dice.render(d,G.dice[k]); else d.textContent=String(G.dice[k]); }
    else { d.innerHTML=""; d.removeAttribute("data-value"); d.removeAttribute("aria-label"); }
  });
}

/* ---- the turn token's pulse, beat by beat from the ONE effects ticker (the page runs no endless CSS animation: README section 6) ----
   The current player's piece scales 1 to 1.3 and back every second, the old pulse's look: each beat is one finite 1 s CSS pulse
   (.is-b1 / .is-b2, the same keyframes), and pulseTick() starts the next one about once a second. It runs in the frames the effects
   ticker already draws for the stage: a MutationObserver on one stage motif's style, which the ticker writes on every tick (8 a
   second), as Trouble's dome ring does. The ticker stops for "Reduce effects", reduced motion, a hidden page and the Victory screen,
   so no new beat starts then (the CSS rests the piece at its still 1.15 lift). A redrawn board's new piece joins the running beat at
   its phase (renderBoard calls pulseTick; a negative animation-delay), so a move or a buy never restarts the pulse. */
const PULSE={mo:null,m:null,at:0,b:0};
function pulseTick(){
  const el=$("board").querySelector(".tkp.cur"); if(!el) return;
  const t=performance.now();
  if(t-PULSE.at>=930){ PULSE.at=t; PULSE.b=PULSE.b===1?2:1; }   // the next beat: a second after the last (to within one 125 ms tick)
  const want=PULSE.b===1?"is-b1":"is-b2", other=PULSE.b===1?"is-b2":"is-b1";
  if(el.classList.contains(want)) return;
  const joins=!el.classList.contains(other);   // a new piece (redrawn board): it takes the beat where it is
  el.classList.remove(other); el.classList.add(want);
  el.style.animationDelay=joins?(-Math.round(t-PULSE.at))+"ms":"";
}
function pulseWatch(){   // (again) follow the ticker through the stage's first motif; the stage may be rebuilt (bgui:stage)
  const m=document.querySelector(".bg-ambient .bg-motifs > b");
  if(!m||!window.MutationObserver||(PULSE.m===m&&m.isConnected)) return;
  if(PULSE.mo) PULSE.mo.disconnect();
  PULSE.m=m; PULSE.mo=new MutationObserver(pulseTick); PULSE.mo.observe(m,{attributes:true,attributeFilter:["style"]});
}

/* ---- the Victory screen (BGUI.win + BGUI.celebrate) with this game's real numbers ---- */
function showWin(w){
  const B=BG();
  if(!(B&&B.win&&luxeOn())){ openModal(`<h2>${w?w.name:"Game Over"} wins!</h2><p>Last player standing with assets.</p><button type="button" class="bg-btn bg-btn--primary bg-btn--block" onclick="window.__close()">OK</button>`); return; }
  ui.winShown=EPOCH;
  const st=G.stats||freshStats(), ms=playMs(), min=Math.round(ms/60000), one=humansN()===1, props=w?G.owner.filter(o=>o===w.id).length:0;
  $("winEyebrow").textContent="Game over · "+(min<1?"under a minute":min===1?"1 minute":min+" minutes");
  $("winTitle").textContent=w&&w.human?"Victory":(w?w.name+" wins":"Game over");
  $("winSub").innerHTML=w?`<b>${w.human&&one?"You":w.name}</b> ${w.human&&one?"are":"is"} the last player standing, with ${plural(props,"property","properties")}.`:"Nobody is left standing.";
  const pill=(v,l)=>`<li class="bg-stat"><b>${v}</b><span>${l}</span></li>`;
  $("winStats").innerHTML=pill(st.turns,st.turns===1?"turn":"turns")+pill(money(w?netWorth(w):0),"net worth")+pill(fmtTime(ms),"time");
  barTitle();

}
function closeWin(){ const B=BG(); if(B&&B.win&&B.win.isOpen()) B.win.close($("winBox")); }
// the game ended behind the Menu or the setup page: Resume becomes "See the result" (the board, then the Victory screen)

    const sub=$("modal").querySelector(".mn-head .bg-sheet__sub"); if(sub) sub.textContent="The game is over.";
  }

// the Start button says what it starts, and the seat preview who sits at the table

  lab.textContent="Start Game · "+nP+" players";

function nearestIn(row,a){   // D-pad: the nearest enabled button of a save-bar row
  const r0=a.getBoundingClientRect(), x0=r0.left+r0.width/2; let best=null, bd=Infinity;
  row.querySelectorAll("button:not([disabled])").forEach(b=>{ const r=b.getBoundingClientRect(), dx=Math.abs(r.left+r.width/2-x0); if(r.width>0&&dx<bd){ bd=dx; best=b; } });
  return best;
}
function buyWhy(p,i){   // the plain-English line under "Buy for $X"
  const s=BOARD[i];
  if(s.t==="rr"){ const n=rrOwned(p.id)+1; return n===1?"Your first railroad: rent $25.":"Railroad number "+n+" for you: rent "+money(25*Math.pow(2,n-1))+" on each."; }
  if(s.t==="util") return utilOwned(p.id)?"Both utilities: rent 10 times the dice.":"Rent is 4 times the dice.";
  const g=GROUPS[s.g], mine=g.filter(x=>G.owner[x]===p.id).length+1, name=s.g.replace("_"," ");
  if(mine===g.length) return "Completes your "+name+" set: double rent, and you can build.";
  return "Rent "+money(s.rent[0])+". You would own "+mine+" of the "+g.length+" "+name+" streets.";
}

/* ========================= RENDER ========================= */
/* the board is monopoly/board.js (shared with Party Mode): one static SVG drawn once with every name in full, pieces and marks laid over it.
   renderBoard() only describes the game to it (owners, buildings, mortgages, who stands where); a jsdom harness has no board.js and
   simply skips the drawing. Old saves need nothing new: it all comes from G. */
let BV=null;
const MBd=()=>window.MonoBoard||null;
function tokV(t,seat){ const M=MBd(); return M?M.tokenSVG(t.n,seat||0):t.e; }   // a piece for a seat disc: silver metal on the seat colour
function boardState(){
  const own=[], toks=[];
  for(let i=0;i<40;i++){ const o=G.owner[i]; own[i]=o>=0&&G.players[o]?seatOf(G.players[o]):0; }
  G.players.forEach(p=>{ if(!p.bankrupt) toks.push({id:p.id,i:p.pos,seat:seatOf(p),tok:p.token.n,cur:!!(G.started&&p.id===G.cur),title:p.name}); });
  const cp=G.started&&!G.over?G.players[G.cur]:null;
  return {own,houses:G.houses,mort:G.mort,toks,hl:cp&&!cp.bankrupt?cp.pos:-1,
    amt:{4:RULES.incomeTaxChoice?"PAY 10% OR $200":"PAY $200",38:"PAY $"+(RULES.luxury75?75:100)}};
}
function ensureBoard(){
  const M=MBd(); if(BV||!M) return BV;
  BV=M.mount($("board"),{squares:BOARD,zoom:!onTV(),emblem:true,
    start:()=>G&&G.started&&G.players[G.cur]?G.players[G.cur].pos:0,
    onTap:i=>{ if($("overlay").classList.contains("on")) return; openDeed(i); },   // tap any square: its deed / info sheet (not over an open dialog)
    onOpen:i=>{ if($("overlay").classList.contains("on")) return; openDeed(i); },  // TV: OK on the square the D-pad is on
    onFocus:i=>tvInspect(i)});
  return BV;
}
function renderBoard(){
  const v=ensureBoard(); if(!v||!G) return;
  v.update(boardState());
  if(PULSE.mo) pulseTick();   // the new current piece joins the running beat at its phase before it is first drawn: no restart, no jump
}
// TV: the square the D-pad is on, large, in the right-hand column (it takes the log's place while the D-pad is on the board)
function squareInfo(i){
  const s=BOARD[i], o=G.owner[i]>=0?G.players[G.owner[i]]:null;
  return {sq:s,owner:o?{name:o.name,seat:seatOf(o)}:null,houses:G.houses[i],mort:G.mort[i],now:o&&s.price&&!G.mort[i]?computeRent(i,G.owner[i],1):null,
    desc:spaceDesc(s),amt:s.tax==="income"?(RULES.incomeTaxChoice?"Pay $200 or 10%":"Pay $200"):s.tax==="luxury"?"Pay $"+(RULES.luxury75?75:100):""};
}
function tvInspect(i){
  const el=$("sqInsp"), lg=$("log"); if(!el||!lg) return;
  const M=MBd();
  if(i<0||!M||!G||!onTV()){ el.hidden=true; lg.hidden=false; return; }
  el.innerHTML=M.card(i,squareInfo(i)); el.hidden=false; lg.hidden=true;
}
function spaceDesc(s){
  if(s.t==="go") return "Collect $200 salary as you pass.";
  if(s.t==="jail") return "Just visiting (or in jail). No penalty for visiting.";
  if(s.t==="fp") return RULES.freeParkingJackpot?"Land here to win the pool of collected fees.":"Free resting space — nothing happens (officially).";
  if(s.t==="gotojail") return "Go directly to Jail. Do not pass GO, do not collect $200.";
  if(s.tax==="income") return RULES.incomeTaxChoice?"Pay $200 or 10% of your total worth.":"Pay $200.";
  if(s.tax==="luxury") return "Pay "+(RULES.luxury75?"$75":"$100")+".";
  if(s.t==="chance") return "Draw a Chance card.";
  if(s.t==="cc") return "Draw a Community Chest card.";
  return "";
}
function dispName(i){ const M=MBd(); return M?M.NAMES[i].replace(/ /g," "):BOARD[i].n; }   // the name as printed on the board
function grpName(g){ const M=MBd(); return (M&&M.GROUPS[g]?M.GROUPS[g].n:String(g).replace("_"," "))+" set"; }
// a square's sheet head: the name in large type over its colour group's band, with its own drawn icon
function sqHead(i,sub){
  const s=BOARD[i], M=MBd(), g=M&&M.GROUPS[s.g], ic=M?M.iconFor(i):"";
  return `<div class="bg-sheet__grip" aria-hidden="true"></div><div class="mn-head mn-sqhead"${g?` style="--grp:${g.c}"`:""}><div class="mn-sqhead__row">${ic?`<span class="mn-sqhead__ic" aria-hidden="true">${M.icon(ic,44)}</span>`:""}<h2 class="bg-sheet__title" id="dlgTitle">${dispName(i)}</h2></div>${sub?`<p class="bg-sheet__sub">${sub}</p>`:""}</div>`;
}
function openDeed(i,fromManage){

  }
  const own=G.owner[i];

  if(own>=0 && !G.mort[i]) sub+=`<br>Rent if landed on now: <b class="mn-money">${money(computeRent(i,own,1))}</b>`;
  let h=sqHead(i,sub), acts="";
  if(mine){
    const grpMort = s.t==="prop" && GROUPS[s.g].some(x=>G.mort[x]);

      if(canBuildOn(v,i)) acts+=`<button type="button" class="bg-btn bg-btn--primary bg-btn--block" onclick="window.__dBuild(${i})">${G.houses[i]===4?"Build Hotel":"Build House"} — ${money(s.house)}</button>`;
      else if(!grpMort && ownsFullGroup(v,s.g) && G.houses[i]<5 && v.cash<s.house) acts+=`<button type="button" class="bg-btn bg-btn--secondary bg-btn--block" disabled>Need ${money(s.house)} to build</button>`;
      if(G.houses[i]>0 && canSellHouse(v,i)){ const hl=Math.max(0,G.housesLeft); acts+=`<button type="button" class="bg-btn bg-btn--secondary bg-btn--block" onclick="window.__dSell(${i})">${hotelShort(i)?`Sell hotel — bank has only ${hl} house${hl===1?"":"s"}`:"Sell building"} — +${money(sellGain(i))}</button>`; }
    }
    if(!G.mort[i] && groupBare(i)) acts+=`<button type="button" class="bg-btn bg-btn--danger bg-btn--block" onclick="window.__dMort(${i})">Mortgage — +${money(s.mort)}</button>`;
    if(G.mort[i]) acts+=`<button type="button" class="bg-btn bg-btn--accent bg-btn--block" onclick="window.__dUnmort(${i})" ${v.cash<Math.ceil(s.mort*1.1)?"disabled":""}>Lift mortgage — ${money(Math.ceil(s.mort*1.1))}</button>`;
  }
  acts+=`<button type="button" class="bg-btn bg-btn--secondary bg-btn--block" onclick="${fromManage?"window.__backManage()":"window.__close()"}">${fromManage?"Back":"Close"}</button>`;
  h+=`<div class="mn-acts">${acts}</div>`+deedCardHTML(i);   // the actions first, so they are on screen; the deed under them
  openModal(h,"",opt);
  const reopen=()=>{ refresh(); openDeed(i,fromManage); };
  window.__dBuild=()=>{ buildHouse(v,i); reopen(); };
  window.__dSell=()=>{ sellHouse(v,i); reopen(); };
  window.__dMort=()=>{ mortgage(v,i); reopen(); };
  window.__dUnmort=()=>{ unmortgage(v,i); reopen(); };
  window.__backManage=openManage;
}

/* ========================= UI BITS ========================= */
let toastT;
// #toast still receives every message (the fallback without ui.js, and what the harnesses read); BGUI.toast shows it in Luxe,
// placed clear of the player strip, the actions, an open sheet and the top bar
function toast(m){ Sound.fromText(m); const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),1600);
  const B=BG(); if(!B||!B.toast||!luxeOn()) return;
  const who=G&&/ (accepts!|rejects\.)$/.test(m)?G.players.find(q=>m.indexOf(q.name+" ")===0):null;
  B.toast(m,who?{seat:seatOf(who),token:"",ms:2400}:{icon:"info",ms:2400});
  if(who&&MBd()){ const d=document.querySelector(".bg-toast .bg-token"); if(d) d.innerHTML=tokV(who.token); } }   // the piece, not an emoji, in the toast's seat disc
function log(m){ Sound.fromText(m); const l=$("log"); const d=document.createElement("div"); d.innerHTML=m; l.appendChild(d); l.scrollTop=l.scrollHeight; }
function money(n){ return (n<0?"-$":"$")+Math.abs(n); }
function dotc(p){ return `<span class="mn-dot" data-seat="${seatOf(p)}" aria-hidden="true"></span>`; }   // the Luxe seat colour

// the status card: whose turn and what to do, then the bank (the .pill hooks stay); the strip, the dice and the top bar follow G
function renderStatus(){
  if(!G) return;
  const p=cur();
  let h;
  if(G.over) h=`<span class="mn-turn"><b>Game over</b> · ${winnerLine()}</span>`;
  else if(!G.started) h=`<span class="mn-turn">Set up a new game to play.</span>`;
  else {
    let what;
    if(!p.human) what=G.phase==="moving"&&G.dice[0]?"rolled "+G.dice[0]+" + "+G.dice[1]:"is playing";
    else if(G.phase==="preroll"){
      const o=["roll for doubles"]; if(p.cash>=50) o.push("pay $50"); if(p.jokers>0) o.push("use your Jail card");
      what=p.jail?"in Jail: "+(o.length<3?o.join(" or "):o.slice(0,-1).join(", ")+" or "+o[o.length-1]):"roll the dice";
    }
    else if(G.phase==="rolledAgain") what="doubles, roll again";
    else if(G.phase==="action") what="buy, build, trade or end the turn";
    else what=G.dice[0]?"rolled "+G.dice[0]+" + "+G.dice[1]:"moving";
    h=`<span class="mn-turn">${dotc(p)}<b>${p.name}</b> · ${what}</span>`;
  }
  if(p.jail&&!G.over) h+=`<span class="pill">In Jail (${p.jailTurns})</span>`;
  if(G.fpPool>0) h+=`<span class="pill">Free Parking ${money(G.fpPool)}</span>`;
  h+=`<span class="pill">${plural(G.housesLeft,"house","houses")} · ${plural(G.hotelsLeft,"hotel","hotels")}</span>`;
  $("status").innerHTML=h;
  syncDice(); syncStrip(); barTitle();
}
// actions: the main one (Roll, End Turn) is the gold primary, the rest lit secondary; line icons, no emoji
function addBtn(c,label,cls,fn,dis){ const b=document.createElement("button"); b.type="button";
  b.className="bg-btn "+((cls==="primary"||cls==="go")?"bg-btn--primary mn-main":cls==="warn"?"bg-btn--danger":"bg-btn--secondary");
  b.textContent=label; const ic=CTRL_ICON[label]?icon(CTRL_ICON[label]):""; if(ic) b.insertAdjacentHTML("afterbegin",ic);
  if(dis)b.disabled=true; else b.onclick=fn; c.appendChild(b); return b; }
function renderControls(){
  const c=$("controls"), fa=document.activeElement, had=fa&&c.contains(fa)?fa.textContent:null; c.innerHTML="";
  const add=(label,cls,fn,dis)=>addBtn(c,label,cls,fn,dis);
  if(!G || !G.started){ add("New Game","primary",openSetup); tvKeep(had); return; }
  const p=cur();
  if(G.over){ add("New Game","primary",openSetup); add("Players","",openPlayers); tvKeep(had); return; }
  if(!p.human){ add("CPU thinking…","",()=>{},true); if(G.players.some(x=>x.human&&!x.bankrupt)){ add("Manage","",openManage); } add("Players","",openPlayers); tvKeep(had); return; }
  if(G.phase==="preroll"){
    if(p.jail){
      add("Roll for doubles","go",humanRoll);
      if(p.cash>=50) add("Pay $50","",()=>{ payBank(p,50,true); p.jail=false; p.jailTurns=0; log(`${p.name} pays $50 to leave Jail.`); refresh(); });
      if(p.jokers>0) add("Use Jail card","",()=>{ p.jokers--; p.jail=false; p.jailTurns=0; returnJoker(); log(`${p.name} uses Get Out of Jail Free.`); refresh(); });
    } else {
      add("Roll Dice","go",humanRoll);
    }
    add("Manage","",openManage);
    add("Trade","",openTradeSetup);
  } else if(G.phase==="action"){
    add("End Turn","primary",endTurn);
    add("Manage","",openManage);
    add("Trade","",openTradeSetup);
  } else if(G.phase==="rolledAgain"){
    add("Roll Again (doubles)","go",humanRoll);
    add("Manage","",openManage);
  } else {
    // "moving"/processing — show a working indicator so the human is never left with a blank screen
    add("Moving…","",()=>{},true);
  }
  add("Players","",openPlayers);
  tvKeep(had);
}
// the Menu (the top bar's menu knob, or Back on TV): Resume is the gold primary and New Game a secondary further down, so one
// stray tap never ends a game; once the game is over it offers "See the result" until the Victory screen has opened

  else if(over) top=`<button type="button" class="bg-btn bg-btn--primary bg-btn--cta bg-btn--block" data-autofocus onclick="window.__mnew()"><span class="bg-btn__label">New Game</span><span class="bg-btn__sub">Choose the players and the rules</span></button>`+

  else top=`<button type="button" class="bg-btn bg-btn--primary bg-btn--cta bg-btn--block" id="mnResume" data-autofocus onclick="window.__close()"><span class="bg-btn__label">Resume Game</span><span class="bg-btn__sub">${p?"Turn "+Math.max(1,G.stats?G.stats.turns:1)+" · "+p.name+(p.human?" to play":" is playing"):"Back to the board"}</span></button>`;
