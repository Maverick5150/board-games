function refresh(){ renderBoard(); renderStatus(); renderControls(); }

/* ========================= MONEY ========================= */
function payBank(p,amt,toPool){
  p.cash-=amt;
  if(toPool && RULES.freeParkingJackpot) G.fpPool+=amt;
  if(p.cash<0) resolveDebt(p,null,!!toPool);
}
function gain(p,amt){ p.cash+=amt; }
function payTo(p,creditor,amt){
  p.cash-=amt; creditor.cash+=amt;           // creditor is tentatively credited in full
  if(p.cash<0) resolveDebt(p,creditor,false); // if payer can't cover it, bankruptcy claws the shortfall back
}

/* ========================= TURN FLOW ========================= */
let lastSnap=null;
function takeSnap(){
  if(!G||!G.started||G.over) return;
  clockSync();   // the play time so far goes into the snapshot (G.stats, presentation only)
  const lg=$("log"); const kids=lg?Array.from(lg.children).slice(-60).map(x=>x.innerHTML):[];
  lastSnap=JSON.parse(JSON.stringify({G:G,rules:RULES,setup:SETUP,log:kids}));
  Saves.auto("monopoly",lastSnap);
}
// game generation: New Game / Load / Continue bump it, so timers left over from the old game do nothing
let EPOCH=0;
function later(fn,ms){ const e=EPOCH; return setTimeout(()=>{ if(e===EPOCH) fn(); },ms); }
function loadSavedGame(d){
  EPOCH++;
  G=JSON.parse(JSON.stringify(d.G)); Object.assign(RULES,DEFAULT_RULES,d.rules||{}); if(d.setup) SETUP=d.setup;
  if(G.housesLeft<0) G.housesLeft=0; if(G.hotelsLeft<0) G.hotelsLeft=0;   // old saves (pre-M5 fix) could hold a negative bank stock
  G.stats=readStats(G.stats);   // presentation-only counters: saves made before step 4 have none and start fresh ones
  AUC=null; AUC_WAIT.length=0; TRADE=null; DEBT_THEN=null; G.bankAuctionActive=false;
  const lg=$("log"); lg.innerHTML=""; (d.log||[]).forEach(h=>{ const x=document.createElement("div"); x.innerHTML=h; lg.appendChild(x); });
  lg.scrollTop=lg.scrollHeight; log("<i>Saved game loaded.</i>");
  closeModal(); armBack(); clockOn(); Sound.skip(); startTurn();
}
function startTurn(){
  if(G.over) return;
  const p=cur();
  if(p.bankrupt){ advancePlayer(); return; }
  G.dice=[0,0]; G.phase="preroll"; G.turnDouble=false; takeSnap();
  if(G.stats) G.stats.turns++;   // presentation only (Turn N, the Victory pills): counted after the snapshot, so a Continue counts this turn once
  G.dice=[0,0]; G.phase="preroll"; refresh();
  if(!p.human){ later(aiTurn,650); }
}
function advancePlayer(){
  const liveOnes=alive();
  if(liveOnes.length<=1){ endGame(); return; }
  do{ G.cur=(G.cur+1)%G.players.length; }while(G.players[G.cur].bankrupt);
  G.doublesCount=0;
  startTurn();
}
function endGame(){
  if(G.over) return;
  G.over=true;
  Saves.del("monopoly","auto"); lastSnap=null;   // a finished game is not offered as "Continue last game"
  const w=alive()[0];
  log(`<b>${w?w.name:"?"} wins the game!</b>`);
  clockOff(); refresh(); gameEnded();
  whenFree(()=>showWin(w));   // the Victory screen (Luxe), or the old dialog without ui.js; it waits for a Menu / Manage the human has open
}

function humanRoll(){ if(G.phase!=="preroll"&&G.phase!=="rolledAgain")return; doRoll(); }
function setMoving(){ G.phase="moving"; G.phaseSince=Date.now(); renderControls(); renderStatus(); }
function doRoll(){ Sound.sfx("dice");
  const p=cur();
  setMoving();   // lock out double-rolls during movement
  const d1=1+rnd(6), d2=1+rnd(6);
  G.dice=[d1,d2]; ui.rolls++;   // presentation: the dice tumble to the new roll
  const dbl=d1===d2;
  G.turnDouble=false;
  log(`${p.name} rolls ${d1}+${d2}${dbl?" (doubles)":""}.`);
  if(p.jail){ handleJailRoll(dbl,d1+d2); return; }
  if(dbl){ G.doublesCount++; if(RULES.threeDoublesJail && G.doublesCount===3){ log(`${p.name} rolled 3 doubles — Go to Jail!`); goToJail(p); endOrContinue(); return; } G.turnDouble=true; }
  else G.doublesCount=0;
  if(RULES.snakeEyesBonus && d1===1 && d2===1){ gain(p,500); log(`${p.name} rolled snake-eyes — +$500!`); }
  moveBy(p,d1+d2,dbl);
}
function handleJailRoll(dbl,total){
  const p=cur();
  if(dbl){ log(`${p.name} rolls doubles and leaves Jail!`); p.jail=false; p.jailTurns=0; moveBy(p,total,false); return; }
  p.jailTurns++;
  if(p.jailTurns>=3 && RULES.mustLeaveAfter3){
    log(`${p.name} failed 3 times — pays $50 and moves.`);
    // a player bankrupted by the fine never moves; a human short of cash settles it in the debt dialog first
    const leave=()=>{ if(p.bankrupt){ endOrContinue(); return; } p.jail=false; p.jailTurns=0; moveBy(p,total,false); };
    payBank(p,50,true);
    if(p.cash<0 && !p.bankrupt){ DEBT_THEN=leave; return; }
    leave(); return;
  }
  log(`${p.name} stays in Jail.`);
  G.phase="action"; endOrContinue(false);
}
const STEP_MS=165;   // per-space hop speed
function moveBy(p,steps,wasDouble){ stepMove(p,steps,1,()=>resolveLanding(p,wasDouble)); }
// hop the token one space at a time (dir +1 forward, -1 back); collect $200 when crossing GO forward
function stepMove(p,steps,dir,done){
  if(G) G.phaseSince=Date.now();   // keep the stuck-turn watchdog from firing mid-animation
  if(steps<=0){ later(done,240); return; }
  p.pos=(p.pos+dir+40)%40; Sound.sfx("tick");
  if(dir>0 && p.pos===0) passGo(p);
  renderBoard(); renderStatus();
  later(()=>stepMove(p,steps-1,dir,done), STEP_MS);
}
function passGo(p){ gain(p,200); p.lapDone=true; log(`${p.name} passes GO (+$200).`); }
function animateLand(p,wasDouble){
  refresh();
  later(()=>resolveLanding(p,wasDouble),350);
}

/* ===================== LANDING RESOLUTION ===================== */
function resolveLanding(p,wasDouble){
  if(p.bankrupt){ endOrContinue(); return; }   // a bankrupt player's token never resolves a landing
  const i=p.pos, s=BOARD[i];
  if(i===0 && RULES.doubleGoSalary){ gain(p,200); log(`${p.name} landed on GO — extra $200!`); }
  switch(s.t){
    case "go": case "jail": case "fp":
      if(s.t==="fp" && RULES.freeParkingJackpot && G.fpPool>0){ gain(p,G.fpPool); log(`${p.name} collects Free Parking pool ${money(G.fpPool)}!`); G.fpPool=RULES.fpSeed500?500:0; }
      endOrContinue(wasDouble); break;
    case "gotojail": goToJail(p); endOrContinue(false); break;
    case "tax": doTax(p,s); break;
    case "chance": drawCard(p,"chance"); break;
    case "cc": drawCard(p,"chest"); break;
    case "prop": case "rr": case "util": landProperty(p,i,wasDouble,1); break;
  }
}
function goToJail(p){ p.pos=10; p.jail=true; p.jailTurns=0; G.doublesCount=0; }
function doTax(p,s){
  if(s.tax==="income"){
    if(RULES.incomeTaxChoice && p.human){
      const pct=Math.floor(taxWorth(p)*0.1), flatBest=pct>=200;   // the cheaper choice is marked: gold edge and the check (the other: a plain minus)
      const opt=(amt,label,desc,best)=>`<button type="button" class="bg-sheet__option${best?" is-best":""}"${best?" data-autofocus":""} onclick="window.__tax(${amt})">${icon(best?"check":"minus")}<span class="bg-sheet__text"><span class="bg-sheet__label">${label}</span><span class="bg-sheet__desc">${desc}</span><span class="bg-sheet__detail">Cash ${money(p.cash)} to ${money(p.cash-amt)}</span></span></button>`;
      openModal(head("Income Tax",`Pay $200, or 10% of your total worth: your cash, the printed price of every deed you own and your buildings, ${money(taxWorth(p))} in all.`)+
        `<div class="bg-sheet__options mn-opts">${opt(200,"Pay $200","The flat amount.",flatBest)}${opt(pct,`Pay 10% (${money(pct)})`,"10% of your total worth.",!flatBest)}</div>`,"",{peek:true,kind:"tax"});
      window.__tax=(amt)=>{ closeModal(); payBank(p,amt,true); log(`${p.name} pays Income Tax ${money(amt)}.`); endOrContinue(false); };
      return;
    }
    const amt = (RULES.incomeTaxChoice? Math.min(200,Math.floor(taxWorth(p)*0.1)) : 200);
    payBank(p,amt,true); log(`${p.name} pays Income Tax ${money(amt)}.`);
  } else {
    const amt=RULES.luxury75?75:100; payBank(p,amt,true); log(`${p.name} pays Luxury Tax ${money(amt)}.`);
  }
  endOrContinue(false);
}

function landProperty(p,i,wasDouble,rentMult){
  const s=BOARD[i], own=G.owner[i];
  if(own===-1){
    // unowned -> buy or auction
    if(RULES.buyAfterLap && !p.lapDone){ log(`${p.name} can't buy yet (needs one lap).`); endOrContinue(wasDouble); return; }
    offerBuy(p,i,wasDouble); return;
  }
  if(own===p.id){ endOrContinue(wasDouble); return; }
  const owner=G.players[own];
  if(G.mort[i]){ log(`${BOARD[i].n} is mortgaged — no rent.`); endOrContinue(wasDouble); return; }
  if(owner.jail && RULES.noRentInJail){ log(`${owner.name} is in Jail — no rent collected.`); endOrContinue(wasDouble); return; }
  let rent=computeRent(i,own,rentMult);
  log(`${p.name} pays ${owner.name} ${money(rent)} rent for ${s.n}.`);
  payTo(p,owner,rent);
  endOrContinue(wasDouble);
}
function computeRent(i,own,mult){
  const s=BOARD[i]; mult=mult||1;
  if(s.t==="prop"){
    let r;
    if(G.houses[i]>0) r=s.rent[G.houses[i]];
    else r = ownsFullGroup(G.players[own],s.g) ? s.rent[0]*2 : s.rent[0];
    return r;
  }
  if(s.t==="rr"){ const n=rrOwned(own); return 25*Math.pow(2,n-1)*mult; }
  if(s.t==="util"){
    const n=utilOwned(own);
    const d = (mult>1)? (1+rnd(6))+(1+rnd(6)) : (G.dice[0]+G.dice[1]);
    // card "nearest utility" pays 10x dice regardless of count
    if(mult>1) return 10*d;
    return (n===2?10:4)*d;
  }
  return 0;
}

function endOrContinue(){   // doubles tracked on G.turnDouble (ignores any arg passed by callers)
  if(G.over || G.bankAuctionActive) return;   // game over / a bankruptcy auction is running (it advances the turn when done)
  const p=cur();
  if(p.bankrupt){ G.phase="action"; advancePlayer(); return; }
  if(G.turnDouble && !p.jail){ G.turnDouble=false; G.phase="rolledAgain"; refresh(); if(!p.human) later(aiTurn,600); return; }
  G.phase="action"; refresh();
  if(!p.human) later(()=>endTurn(),600);
}
function endTurn(){ advancePlayer(); }

/* ========================= BUY / AUCTION ========================= */
function offerBuy(p,i,wasDouble){
  if(p.bankrupt){ endOrContinue(); return; }
  const s=BOARD[i];
  if(p.human){
    // the choice first (each with its exact outcome; Buy is marked when you can afford it), the deed under it
    const can=p.cash>=s.price, one=humansN()===1;
    openModal(head("Buy this property?",`${s.n} · price <b>${money(s.price)}</b> · ${one?"your":p.name+"'s"} cash <b class="mn-money">${money(p.cash)}</b>`)+
      `<div class="bg-sheet__options mn-opts">`+
      `<button type="button" class="bg-sheet__option${can?" is-best":""}"${can?" data-autofocus":""} ${p.cash<s.price?"disabled":""} onclick="window.__buy()">${icon("check")}<span class="bg-sheet__text"><span class="bg-sheet__label">Buy for ${money(s.price)}</span>`+
        `<span class="bg-sheet__desc">${can?buyWhy(p,i):"Not enough cash. Decline, and it goes to auction."}</span><span class="bg-sheet__detail">${can?"Cash "+money(p.cash)+" to "+money(p.cash-s.price):"Needs "+money(s.price-p.cash)+" more"}</span></span></button>`+
      `<button type="button" class="bg-sheet__option" onclick="window.__decline()">${icon("close")}<span class="bg-sheet__text"><span class="bg-sheet__label">${RULES.noAuction?"Don't buy":"Decline"}</span>`+
        `<span class="bg-sheet__desc">${RULES.noAuction?"It stays with the bank for now.":"Then every player, you too, can bid for it at auction."}</span><span class="bg-sheet__detail">${RULES.noAuction?"Stays unowned":"Auction from $1"}</span></span></button>`+
      `</div>${deedCardHTML(i)}`,"",{peek:true,kind:"buy"});
    window.__buy=()=>{ closeModal(); buyProp(p,i); endOrContinue(); };
    window.__decline=()=>{ closeModal(); if(RULES.noAuction){ log(`${p.name} declines ${s.n}.`); endOrContinue();} else startAuction(i,endOrContinue); };
  } else {
    // AI decides — show the decision so the human can follow along
    const wants=aiWantsToBuy(p,i);
    const title = wants ? `${p.name} buys ${s.n}` : `${p.name} ${RULES.noAuction?"passes on":"declines"} ${s.n}`;
    cpuShow(head(title,`Price ${money(s.price)} · ${p.name} has ${money(p.cash)}`), ()=>{
      if(wants){ buyProp(p,i); endOrContinue(); }
      else { if(RULES.noAuction){ log(`${p.name} declines ${s.n}.`); endOrContinue();} else startAuction(i,endOrContinue); }
    }, 1700, deedCardHTML(i));
  }
}
function buyProp(p,i){ const s=BOARD[i]; p.cash-=s.price; G.owner[i]=p.id; log(`${p.name} buys ${s.n} for ${money(s.price)}.`); }
function aiWantsToBuy(p,i){
  const s=BOARD[i];
  if(p.cash < s.price+50) return false;
  // keener if completes/extends a group or buffer healthy
  let score=0.5;
  if(s.t==="prop"){ const owned=GROUPS[s.g].filter(x=>G.owner[x]===p.id).length; score+=owned*0.25; }
  if(s.t==="rr") score+=0.3; if(s.t==="util") score+=0.1;
  if(p.cash>s.price*2.5) score+=0.3;
  return Math.random()<score;
}

let AUC=null, AUC_WAIT=[];   // AUC_WAIT: auctions asked for while one is running; they run next, never over it
function auctionQueue(list,onAllDone){   // auction each property in turn, then call onAllDone
  if(!list.length){ onAllDone(); return; }
  const i=list.shift();
  startAuction(i, ()=>auctionQueue(list,onAllDone));
}
function startAuction(i,onDone){
  if(AUC){ AUC_WAIT.push([i,onDone]); return; }
  const bidders=alive();
  if(bidders.length===0){ if(onDone) onDone(); return; }
  AUC={i,onDone,price:0,high:null,active:bidders.map(b=>b.id),idx:0};
  log(`Auction: ${BOARD[i].n} — bidding starts at $1.`);
  auctionStep();
}
function auctionStep(){
  if(!AUC) return;
  // it ends only once every player has had the chance to bid: no one left, or only the high bidder left
  if(AUC.active.length===0 || (AUC.active.length===1 && AUC.high===AUC.active[0])){
    closeIf("auction");
    if(AUC.high!=null){ const w=G.players[AUC.high]; w.cash-=AUC.price; G.owner[AUC.i]=w.id; log(`${w.name} wins ${BOARD[AUC.i].n} at auction for ${money(AUC.price)}.`); }
    else log(`No bids — ${BOARD[AUC.i].n} stays unowned.`);
    const done=AUC.onDone; AUC=null; if(done) done();
    if(!AUC && AUC_WAIT.length){ const [j,cb]=AUC_WAIT.shift(); startAuction(j,cb); }
    return;
  }
  const bidderId=AUC.active[AUC.idx%AUC.active.length];
  const b=G.players[bidderId];
  const need=AUC.price+ (AUC.price<20?5:10);
  if(b.human){ const a=AUC;
    whenFree(()=>{ if(AUC!==a) return;   // the bid prompt waits for a Menu / Manage the human has open
    const one=humansN()===1, can=b.cash>=need;
    openModal(head(`Auction: ${BOARD[AUC.i].n}`,`High bid <b>${AUC.price?money(AUC.price):"none"}</b>${AUC.high!=null?" by "+G.players[AUC.high].name:""} · ${one?"your":b.name+"'s"} cash <b class="mn-money">${money(b.cash)}</b>`)+
      `<p class="mn-note">Your turn${one?"":", "+b.name}. ${can?`The next bid is <b>${money(need)}</b>: win at that and you keep ${money(b.cash-need)}.`:`The next bid, ${money(need)}, is more than your cash.`}</p>`+
      `<div class="mn-acts"><button type="button" class="bg-btn bg-btn--primary bg-btn--block"${can?" data-autofocus":""} ${b.cash<need?"disabled":""} onclick="window.__bid(${need})">Bid ${money(need)}</button>`+
      `<div class="mn-acts--2"><button type="button" class="bg-btn bg-btn--secondary" onclick="window.__bid('custom')">Bid other amount</button>`+
      `<button type="button" class="bg-btn bg-btn--danger" onclick="window.__pass()">Pass (drop out)</button></div></div>${deedCardHTML(AUC.i,true)}`,"auction",{peek:true,kind:"auction"});
    window.__bid=(amt)=>{ if(amt==="custom"){ const v=parseInt(prompt("Enter your bid (> "+AUC.price+"):"),10); if(!v||v<=AUC.price||v>b.cash){ return; } amt=v; } placeBid(bidderId,amt); };
    window.__pass=()=>{ dropBidder(bidderId); };
    });
  } else {
    const val=aiAuctionValue(b,AUC.i);
    later(()=>{
      if(!AUC) return;
      if(need<=val && b.cash>=need){ placeBid(bidderId,need); }
      else { dropBidder(bidderId); }
    },420);
  }
}
function placeBid(id,amt){ if(!AUC) return; AUC.price=amt; AUC.high=id; log(`${G.players[id].name} bids ${money(amt)}.`); AUC.idx++; closeIf("auction"); auctionStep(); }
function dropBidder(id){
  if(!AUC) return; const pos=AUC.active.indexOf(id); if(pos<0) return;
  AUC.active.splice(pos,1); AUC.idx=AUC.active.length?pos%AUC.active.length:0;   // the next bidder moves up into this seat
  log(`${G.players[id].name} drops out.`); closeIf("auction"); auctionStep();
}
function aiAuctionValue(p,i){
  const s=BOARD[i]; let v=s.price;
  if(s.t==="prop"){ const owned=GROUPS[s.g].filter(x=>G.owner[x]===p.id).length; if(owned>0) v=Math.floor(s.price*(1+0.4*owned)); }
  if(s.t==="rr") v=Math.floor(s.price*1.2);
  return Math.min(v, Math.max(0,p.cash-50));
}

/* ========================= CARDS ========================= */
const JOKER_IDX={chance:CHANCE.findIndex(c=>c.fx==="joker"), chest:CHEST.findIndex(c=>c.fx==="joker")};
// true draw pile + discard pile per deck; a "Get Out of Jail Free" that's drawn & kept
// leaves circulation (not discarded) until used/returned. Pile reshuffles when exhausted.
function drawCard(p,deck){ Sound.sfx("card");
  const isCh=deck==="chance";
  const draw=isCh?G.chanceDraw:G.chestDraw;
  const disc=isCh?G.chanceDisc:G.chestDisc;
  const src=isCh?CHANCE:CHEST;
  if(draw.length===0){ while(disc.length) draw.push(disc.pop()); shuffle(draw); }
  if(draw.length===0){ endOrContinue(); return; } // only possible if every card is held (impossible here)
  const cardIdx=draw.shift();
  const card=src[cardIdx];
  const face=`<div class="cardbig${isCh?"":" is-chest"}">${card.text}</div>`;   // a paper card with the deck's colour inlay
  const show=cb=>{
    if(p.human){ openModal(head(isCh?"Chance":"Community Chest",humansN()>1?p.name+" draws a card.":"You draw a card.")+face+`<div class="mn-acts"><button type="button" class="bg-btn bg-btn--primary bg-btn--block" data-autofocus onclick="window.__ok()">OK</button></div>`,"",{peek:true,kind:"card"}); window.__ok=()=>{ closeModal(); cb(); }; }
    else { log(`${p.name} — ${isCh?"Chance":"Chest"}: ${card.text}`); cpuShow(head(`${isCh?"Chance":"Community Chest"} — ${p.name}`)+face, cb, 1900); }
  };
  show(()=>{
    if(card.fx==="joker"){ G.jokersHeld[deck]++; }   // held by player, stays out of the pile
    else disc.push(cardIdx);                           // returned to the bottom of the deck
    applyCard(p,card,deck);
  });
}
function applyCard(p,card,deck){
  switch(card.fx){
    case "gain": gain(p,card.a); endOrContinue(false); break;
    case "pay": payBank(p,card.a,true); endOrContinue(false); break;
    case "move": {
      const target=card.a;
      const steps=(target-p.pos+40)%40;   // move forward around the board (collects GO if it crosses it)
      stepMove(p,steps,1,()=>{ if(target===0) endOrContinue(); else resolveLanding(p,false); }); break;
    }
    case "jail": goToJail(p); refresh(); endOrContinue(false); break;
    case "joker": p.jokers++; endOrContinue(false); break;
    case "back3": { stepMove(p,3,-1,()=>resolveLanding(p,false)); break; }
    case "payeach": { payRound(alive().filter(q=>q!==p).map(q=>[p,q]),card.a,()=>endOrContinue(false)); break; }
    case "collecteach": { payRound(alive().filter(q=>q!==p).map(q=>[q,p]),card.a,()=>endOrContinue(false)); break; }
    case "repairs": { let h=0,ht=0; for(let i=0;i<40;i++) if(G.owner[i]===p.id && BOARD[i].t==="prop"){ if(G.houses[i]===5) ht++; else h+=G.houses[i]; } const amt=h*card.a[0]+ht*card.a[1]; payBank(p,amt,true); log(`${p.name} pays repairs ${money(amt)}.`); endOrContinue(false); break; }
    case "nearRR": { const idx=nearest(p.pos,RR_IDX); goToAndPay(p,idx,2); break; }
    case "nearUtil": { const idx=nearest(p.pos,UTIL_IDX); goToAndPay(p,idx,10); break; }
  }
}
function returnJoker(){ // a held Get-Out-of-Jail card goes back to the bottom of its deck
  if(G.jokersHeld.chance>0){ G.jokersHeld.chance--; G.chanceDisc.push(JOKER_IDX.chance); }
  else if(G.jokersHeld.chest>0){ G.jokersHeld.chest--; G.chestDisc.push(JOKER_IDX.chest); }
}
function nearest(pos,list){ for(let step=1;step<=40;step++){ const q=(pos+step)%40; if(list.includes(q)) return q; } return list[0]; }
function goToAndPay(p,idx,mult){
  const steps=(idx-p.pos+40)%40;
  stepMove(p,steps,1,()=>{
    const own=G.owner[idx];
    if(own===-1){ if(!(RULES.buyAfterLap&&!p.lapDone)) offerBuy(p,idx,false); else endOrContinue(false); }
    else if(own===p.id){ endOrContinue(false); }
    else if(G.mort[idx]){ endOrContinue(false); }
    else { const owner=G.players[own]; let rent= BOARD[idx].t==="rr" ? computeRent(idx,own,1)*2 : computeRent(idx,own,mult); log(`${p.name} pays ${owner.name} ${money(rent)}.`); payTo(p,owner,rent); endOrContinue(false); }
  },320);
}

/* ========================= DEBT / BANKRUPTCY ========================= */
let DEBT_THEN=null;   // what the turn does once the human's debt dialog is settled (paid, or bankrupt)
function resolveDebt(p,creditor,toPool){
  if(p.cash>=0) return;
  if(p.human){ openDebtModal(p,creditor,toPool); }          // interactive; opened synchronously
  else { aiRaiseFunds(p); if(p.cash<0) declareBankrupt(p,creditor,toPool); }
}
// non-interactive payment used for CPUs by the "pay/collect from each player" cards (may auto-bankrupt a non-current player)
function forcePayTo(p,creditor,amt){
  p.cash-=amt; creditor.cash+=amt;
  if(p.cash<0){ aiRaiseFunds(p); if(p.cash<0) declareBankrupt(p,creditor,false); }
}
// "pay each player" / "collect from every player" cards: one payment at a time. A human who comes up short
// chooses what to sell or mortgage in the debt dialog (the rest of the round waits); CPUs raise it automatically.
function payRound(pairs,amt,done){
  while(pairs.length){
    const [from,to]=pairs.shift();
    if(from.bankrupt||to.bankrupt) continue;
    if(!from.human){ forcePayTo(from,to,amt); continue; }
    payTo(from,to,amt);
    if(from.cash<0 && !from.bankrupt){ DEBT_THEN=()=>payRound(pairs,amt,done); return; }
  }
  done();
}
function liquidatableValue(p){
  let v=p.cash;
  for(let i=0;i<40;i++) if(G.owner[i]===p.id){ const s=BOARD[i];
    if(s.t==="prop" && G.houses[i]>0) v+=Math.floor(G.houses[i]*s.house/2);
    if(!G.mort[i]) v+=Math.floor((s.price||0)/2);
  }
  return v;
}
function aiRaiseFunds(p){
  // sell houses evenly, then mortgage
  let guard=200;
  while(p.cash<0 && guard-->0){
    let sold=false;
    // sell a house from most-developed owned prop
    let best=-1,bh=0;
    for(let i=0;i<40;i++) if(G.owner[i]===p.id && BOARD[i].t==="prop" && G.houses[i]>bh){ bh=G.houses[i]; best=i; }
    if(best>=0){ sellHouse(p,best,true); sold=true; }
    else { // mortgage
      for(let i=0;i<40;i++) if(G.owner[i]===p.id && !G.mort[i] && groupBare(i)){ mortgage(p,i,true); sold=true; break; } }
    if(!sold) break;
  }
}
function declareBankrupt(p,creditor,toPool){
  log(`<b>${p.name} is bankrupt!</b>`);
  // sell all buildings back to the bank; proceeds (half price) go to the creditor, if any
  let refund=0;
  for(let i=0;i<40;i++) if(G.owner[i]===p.id && BOARD[i].t==="prop" && G.houses[i]>0){
    const s=BOARD[i]; refund+=Math.floor(G.houses[i]*s.house/2);
    if(G.houses[i]===5) G.hotelsLeft++; else G.housesLeft+=G.houses[i];
    G.houses[i]=0;
  }
  if(creditor){
    creditor.cash += p.cash + refund;   // p.cash is the negative shortfall → claws back any over-credit
    creditor.jokers += p.jokers;
    const taken=[]; for(let i=0;i<40;i++) if(G.owner[i]===p.id){ G.owner[i]=creditor.id; taken.push(i); }
    for(const i of taken) if(G.mort[i]){ const fee=Math.ceil(BOARD[i].mort*0.1); if(creditor.cash>=fee) creditor.cash-=fee; } // 10% interest to keep mortgaged
    p.cash=0; p.jokers=0; p.bankrupt=true;
    closeIf("debt");
    if(alive().length<=1) endGame();
    return;
  }
  // bankrupt to the BANK: cash lost (to FP pool under that rule), jail cards returned, properties auctioned
  if(toPool && RULES.freeParkingJackpot && p.cash<0) G.fpPool+=p.cash; // claw back over-credit from the pool
  for(let k=0;k<p.jokers;k++) returnJoker();
  const list=[]; for(let i=0;i<40;i++) if(G.owner[i]===p.id){ G.owner[i]=-1; list.push(i); } // mortgage state kept for auction
  p.cash=0; p.jokers=0; p.bankrupt=true;
  closeIf("debt");
  if(alive().length<=1){ endGame(); return; }
  if(list.length){ G.bankAuctionActive=true; log(`The bank auctions ${p.name}'s ${list.length} propert${list.length>1?'ies':'y'}.`); auctionQueue(list, ()=>{ G.bankAuctionActive=false; advancePlayer(); }); }
}
// "Declare Bankruptcy" in the debt dialog; the turn then moves on exactly once
function finishBankrupt(p,creditor,toPool){
  const then=DEBT_THEN; DEBT_THEN=null;
  declareBankrupt(p,creditor,toPool);
  if(G.over) return;
  if(then) then(); else endOrContinue();
}
function openDebtModal(p,creditor,toPool){
  const need=-p.cash;
  // assets can't cover it: bankrupt now, and the caller moves the turn on (once)
  if(liquidatableValue(p)<0){ declareBankrupt(p,creditor,toPool); return; }
  openModal(head(`${G.players.filter(x=>x.human).length>1?p.name+" owes":"You owe"} ${money(need)} more`,"Sell buildings or mortgage properties to raise the cash, or declare bankruptcy.","mn-title--neg")+
    `<div id="debtList" class="mn-debt"></div>
    <div class="mn-acts"><button type="button" class="bg-btn bg-btn--danger bg-btn--block" onclick="window.__bankrupt()">Declare Bankruptcy</button></div>`,"debt",{kind:"debt"});
  window.__bankrupt=()=>finishBankrupt(p,creditor,toPool);
  renderDebtList(p,creditor);
  const first=$("debtList")&&$("debtList").querySelector("button:not([disabled])");
  if(first&&luxeOn()) focusEl(first);   // the focus starts on a sale or a mortgage, never on Declare Bankruptcy
}
function renderDebtList(p,creditor){
  const el=$("debtList"); if(!el) return; let h="";
  // even selling: only the most-built lots of a group can sell; no lot is mortgaged while its group has buildings
  for(let i=0;i<40;i++) if(G.owner[i]===p.id){ const s=BOARD[i];
    if(s.t==="prop" && G.houses[i]>0){ if(canSellHouse(p,i,true)) h+=`<div class="mn-drow"><span>${s.n} — sell building (+${money(sellGain(i))})</span><button type="button" class="bg-btn bg-btn--secondary bg-btn--sm" data-i="${i}" onclick="window.__sell(${i})">Sell</button></div>`; }
    else if(!G.mort[i] && groupBare(i)) h+=`<div class="mn-drow"><span>${s.n} — mortgage (+${money(s.mort)})</span><button type="button" class="bg-btn bg-btn--secondary bg-btn--sm" data-i="${i}" onclick="window.__mort(${i})">Mortgage</button></div>`;
  }
  if(p.cash>=0){ h=`<p class="mn-ok">Debt cleared! Cash ${money(p.cash)}.</p><button type="button" class="bg-btn bg-btn--primary bg-btn--block" data-autofocus onclick="window.__done()">Continue</button>`; }
  el.innerHTML=h;
  window.__sell=(i)=>{ sellHouse(p,i,true); renderDebtList(p,creditor); renderStatus(); };
  window.__mort=(i)=>{ mortgage(p,i,true); renderDebtList(p,creditor); renderStatus(); };
  window.__done=()=>{ closeModal(); const f=DEBT_THEN; DEBT_THEN=null; if(f) f(); };
  refocusIn(el);   // TV: the D-pad focus stays in the list after a sale
  sheetGrew();
}

/* ========================= BUILD / MORTGAGE ========================= */
function canBuildOn(p,i){
  const s=BOARD[i]; if(s.t!=="prop") return false;
  if(G.owner[i]!==p.id) return false;
  if(RULES.buildFullSet && !ownsFullGroup(p,s.g)) return false;
  if(GROUPS[s.g].some(x=>G.mort[x])) return false;
  if(G.houses[i]>=5) return false;
  // hotel step: under even building every lot of the group needs 4 houses (or a hotel) first
  if(G.houses[i]===4){ if(RULES.evenBuild && GROUPS[s.g].some(x=>G.houses[x]<4)) return false; if(RULES.hotelsRequire4){ if(!RULES.unlimitedBuildings && G.hotelsLeft<=0) return false; } return true; }
  if(!RULES.unlimitedBuildings && G.housesLeft<=0) return false;
  // even build
  if(RULES.evenBuild){ const min=Math.min(...GROUPS[s.g].map(x=>G.houses[x])); if(G.houses[i]!==min) return false; }
  return true;
}
function buildHouse(p,i){
  const s=BOARD[i]; if(!canBuildOn(p,i)) return;
  if(p.cash<s.house){ toast("Not enough cash."); return; }
  p.cash-=s.house;
  if(G.houses[i]===4){ // to hotel
    G.houses[i]=5; if(!RULES.unlimitedBuildings){ G.hotelsLeft--; if(RULES.hotelsRequire4) G.housesLeft+=4; }
    log(`${p.name} builds a hotel on ${s.n}.`);
  } else { G.houses[i]++; if(!RULES.unlimitedBuildings) G.housesLeft--; log(`${p.name} builds a house on ${s.n}.`); }
}
// a hotel sold back is exchanged for 4 houses; when the bank has fewer (housing shortage) it can't be broken up
function hotelShort(i){ return G.houses[i]===5 && RULES.hotelsRequire4 && !RULES.unlimitedBuildings && G.housesLeft<4; }
// even selling: only from the most-built of the owner's lots in the group. During a housing shortage a hotel
// (sold by choice or to pay a debt) comes down to the houses the bank has left, as in the Party copy.
function canSellHouse(p,i){
  const s=BOARD[i]; if(s.t!=="prop"||G.owner[i]!==p.id||G.houses[i]<=0) return false;
  if(RULES.evenBuild){ const max=Math.max(...ownLots(i).map(x=>G.houses[x])); if(G.houses[i]!==max) return false; }
  return true;
}
function sellGain(i){ const half=Math.floor(BOARD[i].house/2); return hotelShort(i)?(5-Math.max(0,G.housesLeft))*half:half; }
function sellHouse(p,i,force){
  const s=BOARD[i]; if(!canSellHouse(p,i)) return;
  const amt=sellGain(i); p.cash+=amt;
  if(G.houses[i]===5){
    G.houses[i]=4;
    if(!RULES.unlimitedBuildings){ G.hotelsLeft++; if(RULES.hotelsRequire4){ const back=Math.min(4,Math.max(0,G.housesLeft)); G.houses[i]=back; G.housesLeft-=back; } }
  }
  else { G.houses[i]--; if(!RULES.unlimitedBuildings) G.housesLeft++; }
  log(`${p.name} sells ${amt>Math.floor(s.house/2)?"buildings":"a building"} on ${s.n} (+${money(amt)}).`);
}
// sell every building in the owner's colour group, evenly (a forced mortgage needs the group bare)
function sellGroupBuildings(p,i){
  for(let guard=60;guard>0;guard--){
    const top=ownLots(i).filter(x=>G.houses[x]>0).sort((a,b)=>G.houses[b]-G.houses[a])[0];
    if(top===undefined) break;
    sellHouse(p,top,true);
  }
}
function mortgage(p,i,force){
  const s=BOARD[i]; if(G.owner[i]!==p.id||G.mort[i]) return;
  if(!groupBare(i)){ if(!force){ toast("Sell all buildings in this colour group first."); return; } sellGroupBuildings(p,i); }
  G.mort[i]=true; p.cash+=s.mort; log(`${p.name} mortgages ${s.n} (+${money(s.mort)}).`);
}
function unmortgage(p,i){
  const s=BOARD[i]; if(G.owner[i]!==p.id||!G.mort[i]) return;
  const cost=Math.ceil(s.mort*1.1);
  if(p.cash<cost){ toast("Not enough cash."); return; }
  p.cash-=cost; G.mort[i]=false; log(`${p.name} lifts mortgage on ${s.n} (-${money(cost)}).`);
}

/* ========================= AI TURN ========================= */
function aiTurn(){
  if(G.over) return;
  const p=cur();
  if(!p || p.human || p.bankrupt) return;
  if(G.phase==="preroll"){
    if(p.jail){
      if(p.jokers>0){ p.jokers--; p.jail=false; p.jailTurns=0; log(`${p.name} uses Get Out of Jail Free.`); refresh(); later(doRoll,400); return; }
      if(p.jailTurns<2 && p.cash<300){ doRoll(); return; } // try doubles early
      if(p.cash>=50){ payBank(p,50,true); p.jail=false; p.jailTurns=0; log(`${p.name} pays $50 to leave Jail.`); refresh(); later(doRoll,400); return; }
      doRoll(); return;
    }
    aiBuildPhase(p);
    refresh(); later(doRoll,400); return;
  }
  if(G.phase==="rolledAgain"){ doRoll(); return; }
  if(G.phase==="action"){ later(()=>endTurn(),300); return; }
}
function aiBuildPhase(p){
  // lift mortgages if rich; then build evenly across owned monopolies
  let guard=60;
  // build
  let improved=true;
  while(improved && guard-->0){
    improved=false;
    for(const g in GROUPS){
      if(!ownsFullGroup(p,g)) continue;
      // lowest house count lot that's buildable
      const lots=GROUPS[g].slice().sort((a,b)=>G.houses[a]-G.houses[b]);
      for(const i of lots){ if(p.cash> BOARD[i].house+250 && canBuildOn(p,i)){ buildHouse(p,i); improved=true; break; } }
    }
  }
}

/* ========================= TRADE ========================= */
let TRADE=null;
function tradableList(){ return !RULES.noTradeUntilAllOwned || G.owner.every((o,i)=>!BOARD[i].price || o>=0); }
function openTradeSetup(){
  const me=cur();
  const others=alive().filter(p=>p!==me);
  if(!others.length){ toast("No one to trade with."); return; }
  if(!tradableList()){ toast("Trading locked until all property owned."); return; }
  let h=head("Trade","Choose a player to trade with.")+`<div class="bg-sheet__options mn-opts">`;
  others.forEach((o,k)=>{ const n=propsOf(o).length; h+=`<button type="button" class="bg-sheet__option"${k?"":" data-autofocus"} onclick="window.__tp(${o.id})"><span class="bg-token" data-seat="${seatOf(o)}" aria-hidden="true">${tokV(o.token)}</span>`+
    `<span class="bg-sheet__text"><span class="bg-sheet__label">${o.name}</span><span class="bg-sheet__desc">${o.human?"Plays on this "+devWord()+": they accept or decline.":"A computer player: it decides at once."}</span><span class="bg-sheet__detail">${money(o.cash)} · ${plural(n,"property","properties")}</span></span>${icon("chevron")}</button>`; });
  h+=`</div><div class="mn-acts"><button type="button" class="bg-btn bg-btn--secondary bg-btn--block" onclick="window.__close()">Cancel</button></div>`;
  openModal(h,"",{dismiss:closeModal,kind:"trade"});
  window.__tp=(id)=>buildTrade(me,G.players[id]);
}
function buildTrade(me,them){
  TRADE={me:me.id,them:them.id,give:new Set(),get:new Set(),cashGive:0,cashGet:0,giveJoker:0,getJoker:0};
  renderTrade();
}
function propsOf(pl){ const a=[]; for(let i=0;i<40;i++) if(G.owner[i]===pl.id) a.push(i); return a; }
function renderTrade(){
  const me=G.players[TRADE.me], them=G.players[TRADE.them];
  // each property a whole-row switch; the cash a number field; the same window.__ hooks as before
  const list=(pl,set,side)=>propsOf(pl).map(i=>`<label class="bg-row"><span class="bg-row__main"><span class="bg-row__title">${colorChip(i)} ${BOARD[i].n}${G.houses[i]?' <small>(has buildings)</small>':(groupBare(i)?'':' <small>(set has buildings)</small>')}${G.mort[i]?' <small>(mortgaged)</small>':''}</span></span><input type="checkbox" class="bg-toggle" ${set.has(i)?"checked":""} onchange="window.__tog('${side}',${i})"></label>`).join("");
  const rows=(pl,set,side)=>{ const r=list(pl,set,side); return r?`<div class="bg-rows">${r}</div>`:`<p class="mn-none">No properties to offer.</p>`; };
  const extra=(side,cash,jk,jkOn,jkLabel)=>`<div class="bg-rows"><label class="bg-row bg-row--static"><span class="bg-row__main"><span class="bg-row__title">Cash</span></span><input type="number" min="0" inputmode="numeric" class="mn-num" aria-label="Cash" value="${cash}" oninput="window.__cash('${side}',this.value)"></label>`+
    (jk?`<label class="bg-row"><span class="bg-row__main"><span class="bg-row__title">${jkLabel}</span></span><input type="checkbox" class="bg-toggle" ${jkOn?"checked":""} onchange="window.__joker('${side}')"></label>`:"")+`</div>`;
  let h=head(`Trade with ${them.name}`,them.human?`Pick what each side gives, then propose it. ${them.name} accepts or declines.`:`Pick what each side gives, then propose it. ${them.name} decides at once.`)+`<div class="mn-trade">`;
  h+=`<div class="bg-section"><h3 class="bg-eyebrow">You give</h3></div>${rows(me,TRADE.give,"give")}${extra("give",TRADE.cashGive,me.jokers>0,TRADE.giveJoker,"Give a Jail card")}`;
  h+=`<div class="bg-section"><h3 class="bg-eyebrow">You receive</h3></div>${rows(them,TRADE.get,"get")}${extra("get",TRADE.cashGet,them.jokers>0,TRADE.getJoker,"Receive a Jail card")}</div>`;
  h+=`<div class="mn-acts"><button type="button" class="bg-btn bg-btn--primary bg-btn--block" onclick="window.__offer()">Propose Trade</button>`;
  h+=`<button type="button" class="bg-btn bg-btn--secondary bg-btn--block" onclick="window.__close()">Cancel</button></div>`;
  openModal(h,"",{dismiss:closeModal,kind:"trade"});
  window.__tog=(side,i)=>{ const set=side==="give"?TRADE.give:TRADE.get; if(set.has(i))set.delete(i); else set.add(i); };
  window.__cash=(side,v)=>{ v=Math.max(0,parseInt(v||"0",10)); if(side==="give")TRADE.cashGive=v; else TRADE.cashGet=v; };
  window.__joker=(side)=>{ if(side==="give")TRADE.giveJoker=TRADE.giveJoker?0:1; else TRADE.getJoker=TRADE.getJoker?0:1; };
  window.__offer=()=>proposeTrade();
}
function tradeValueFor(pl, incomingIdx, incomingCash, incomingJoker, outgoingIdx, outgoingCash, outgoingJoker){
  let v=0;
  incomingIdx.forEach(i=>v+=assetVal(i)); v+=incomingCash+incomingJoker*50;
  outgoingIdx.forEach(i=>v-=assetVal(i)); v-=outgoingCash+outgoingJoker*50;
  // bonus if incoming completes a set for pl
  incomingIdx.forEach(i=>{ const s=BOARD[i]; if(s.t==="prop"){ const after=GROUPS[s.g].filter(x=>G.owner[x]===pl.id||incomingIdx.includes(x)).length; if(after===GROUPS[s.g].length) v+=s.price; } });
  return v;
}
function assetVal(i){ const s=BOARD[i]; let v=G.mort[i]?Math.floor(s.price/2):s.price; if(s.t==="prop") v+=G.houses[i]*s.house; return v; }
function proposeTrade(){
  const me=G.players[TRADE.me], them=G.players[TRADE.them];
  const giveIdx=[...TRADE.give], getIdx=[...TRADE.get];
  if(TRADE.cashGive>me.cash){ toast("You don't have that much cash."); return; }
  // official: no lot may be traded while buildings stand on any lot of its colour group
  if([...giveIdx,...getIdx].some(i=>!groupBare(i))){ toast("Sell all buildings in that colour group before trading it."); return; }
  if(TRADE.cashGet>them.cash){ toast(them.name+" can't afford that cash."); return; }
  // whoever receives a mortgaged deed pays the bank 10% interest at once, so each side must be able to cover it
  const fee=list=>list.filter(i=>G.mort[i]).reduce((a,i)=>a+Math.ceil(BOARD[i].mort*0.1),0);
  if(me.cash-TRADE.cashGive+TRADE.cashGet<fee(getIdx)){ toast("You can't cover the 10% interest on the mortgaged deed."); return; }
  if(them.cash-TRADE.cashGet+TRADE.cashGive<fee(giveIdx)){ toast(them.name+" can't cover the 10% interest on the mortgaged deed."); return; }
  if(them.human){   // hot-seat: the other human decides
    const side=(idx,cash,jk)=>[...idx.map(i=>BOARD[i].n+(G.mort[i]?" (mortgaged)":"")),...(cash?[money(cash)]:[]),...(jk?["a Get Out of Jail Free card"]:[])].join(", ")||"nothing";
    openModal(head(`Trade offer for ${them.name}`,`Pass the ${devWord()} to <b>${them.name}</b>.`)+
      `<div class="mn-offer"><p>${me.name} gives you: <b>${side(giveIdx,TRADE.cashGive,TRADE.giveJoker)}</b></p><p>${me.name} wants: <b>${side(getIdx,TRADE.cashGet,TRADE.getJoker)}</b></p></div>`+
      `<div class="mn-acts mn-acts--2"><button type="button" class="bg-btn bg-btn--primary" data-autofocus onclick="window.__tAcc()">Accept</button><button type="button" class="bg-btn bg-btn--danger" onclick="window.__tRej()">Decline</button></div>`,"",{kind:"offer"});
    window.__tAcc=()=>{ execTrade(); log(`${them.name} accepts the trade.`); toast(them.name+" accepts!"); };
    window.__tRej=()=>{ TRADE=null; log(`${them.name} rejects the trade.`); toast(them.name+" rejects."); closeModal(); };
    return;
  }
  // AI evaluates from their perspective
  const val=tradeValueFor(them, giveIdx, TRADE.cashGive, TRADE.giveJoker, getIdx, TRADE.cashGet, TRADE.getJoker);
  if(val>=-10){
    execTrade(); log(`${them.name} accepts the trade.`); toast(them.name+" accepts!");
  } else {
    log(`${them.name} rejects the trade.`); toast(them.name+" rejects.");
    closeModal();
  }
}
function execTrade(){
  const me=G.players[TRADE.me], them=G.players[TRADE.them];
  const giveMort=[...TRADE.give].filter(i=>G.mort[i]);
  const getMort=[...TRADE.get].filter(i=>G.mort[i]);
  [...TRADE.give].forEach(i=>G.owner[i]=them.id);
  [...TRADE.get].forEach(i=>G.owner[i]=me.id);
  me.cash-=TRADE.cashGive; them.cash+=TRADE.cashGive;
  them.cash-=TRADE.cashGet; me.cash+=TRADE.cashGet;
  if(TRADE.giveJoker){ me.jokers--; them.jokers++; }
  if(TRADE.getJoker){ them.jokers--; me.jokers++; }
  // 10% bank interest on each mortgaged property that changes hands (new owner keeps it mortgaged)
  let fee=0;
  giveMort.forEach(i=>{ const f=Math.ceil(BOARD[i].mort*0.1); them.cash-=f; fee+=f; });
  getMort.forEach(i=>{ const f=Math.ceil(BOARD[i].mort*0.1); me.cash-=f; fee+=f; });
  if(fee>0) log(`Mortgage interest paid to the bank on traded deeds.`);
  TRADE=null; closeModal(); refresh();
}

/* ========================= MODAL / RULES / SETUP ========================= */
let MODAL_TAG="";   // game step that owns the open dialog ("cpu", "auction", "debt"); "" = any other dialog
// opt (presentation only): {page} the setup page; {dismiss: fn} Back / Escape / the scrim may close it, fn is its way out;
// {peek} a choice that keeps the board in view on a phone; {kind} what it is (the Menu offers "See the result")
function openModal(html,tag,opt){ const a=document.activeElement; ui.hadFocus=a&&$("overlay").contains(a)?focusKey(a):null;
  $("modal").innerHTML=html; $("overlay").classList.add("on"); MODAL_TAG=tag||""; ui.dlg=opt||{}; dlgShow(); }
function overlayOn(){ return $("overlay").classList.contains("on"); }
// close the dialog only if that game step opened it, so a Menu / Manage / trade the human has open stays put
function closeIf(tag){ if(MODAL_TAG===tag && overlayOn()) closeModal(); }
// run fn once no dialog is open: a CPU's dialog waits until the human closes their Menu / Manage / setup / trade
function whenFree(fn){ if(!overlayOn()) fn(); else { G.phaseSince=Date.now(); later(()=>whenFree(fn),250); } }
// show a CPU's card / decision so the human can follow along; auto-continues, or tap to skip (Back on TV skips too).
// body: what goes under the Continue button (a tall deed), so the button stays on screen
function cpuShow(html,cb,ms,body){
  whenFree(()=>{
    let done=false; const e=EPOCH;
    const go=()=>{ if(done||e!==EPOCH) return; done=true; closeIf("cpu"); cb(); };
    openModal(html+`<span class="mn-auto" aria-hidden="true" style="--mn-auto-ms:${ms||1700}ms"><i></i></span><div class="mn-acts"><button type="button" class="bg-btn bg-btn--secondary bg-btn--block" data-autofocus onclick="window.__cpuGo()">Continue</button></div>`+(body||""),"cpu",{dismiss:go,peek:true,kind:"cpu"});
    window.__cpuGo=go;
    later(go, ms||1700);
  });
}
function closeModal(){ $("overlay").classList.remove("on"); MODAL_TAG=""; dlgHide(); }
window.__close=closeModal;

function openRules(){
  let h=head("House Rules","Defaults match the official classic game. Official is the real rule (switching it off is the variant); House is a variant, off by default.")+rulesHTML();
  h+=`<div class="mn-acts"><button type="button" class="bg-btn bg-btn--primary bg-btn--block" onclick="window.__close()">Done</button></div>`;
  openModal(h,"",{dismiss:closeModal,kind:"rules"});
  wireRules($("modal"));
}

let SETUP={humans:1,cpus:3,humanTokens:[0]};
// the setup page (Midnight Luxe): the hero, the players, the tokens, the rules as switches, save and load, and the Start dock with
// a contextual label. Reached at load and from the Menu's New Game; mid-game its dock also holds Resume
function openSetup(){
  const tv=onTV(), live=liveGame(), due=resultDue(), redraw=setupShown(), B=BG(), p=G&&G.started?cur():null;
  const fa=document.activeElement, had=redraw&&fa&&$("modal").contains(fa)?focusKey(fa):null;   // a redraw (Standard rules, Load settings) keeps the focus
  let h=`<div class="mn-setup"><div class="mn-col mn-col--a">`;
  h+=`<section class="bg-hero mn-hero" aria-labelledby="setupTitle"><div class="bg-hero__layer is-on"></div><div class="bg-hero__shade"></div><div class="bg-hero__body" data-stage-text>`+
     `<span class="bg-eyebrow">Roll · buy · build</span><h2 class="bg-hero__title" id="setupTitle">Monopoly</h2>`+
     `<p class="bg-hero__pitch">Roll round the board, buy streets, railroads and utilities, build houses and hotels, and be the last player standing.</p></div></section>`;
  h+=`<section class="mn-sec mn-sec--tokens"><div class="bg-section"><h3 class="bg-eyebrow" id="tokHdr">Pick your token</h3></div>`+
     `<div class="bg-seg bg-seg--grid5 mn-toks" id="tokGrid" role="group" aria-labelledby="tokHdr"></div><p class="mn-tokmsg" id="tokMsg" data-stage-text></p></section>`;
  h+=`<section class="mn-sec mn-sec--rules">${rulesHTML()}</section></div>`;
  h+=`<div class="mn-col mn-col--b"><section class="mn-sec mn-sec--players"><div class="bg-section"><h3 class="bg-eyebrow">Players</h3></div><div class="bg-card mn-card">`+
     `<div class="mn-field"><span class="bg-row__title" id="humTitle">${tv?"Players on this TV":"Players on this phone"}</span><span class="bg-row__desc">Pass the ${tv?"remote":"phone"} when it's a player's turn. 2 to 6 players in all.</span></div>`+
     `<div class="bg-seg" id="segH" role="group" aria-labelledby="humTitle"></div>`+
     `<div class="mn-field"><span class="bg-row__title" id="cpuTitle">Computer players</span><span class="bg-row__desc">They buy, build, bid and trade on their own.</span></div>`+
     `<div class="bg-seg" id="segC" role="group" aria-labelledby="cpuTitle"></div><div class="mn-seats" id="seatPreview"></div></div></section>`;
  h+=`<section class="mn-sec mn-sec--save"><div class="bg-section"><h3 class="bg-eyebrow">Save and load</h3></div><div id="svbar"></div></section>`;
  h+=`<a href="${hubHref()}" class="bg-btn bg-btn--ghost bg-btn--block mn-back" id="backHub">${icon("home")}Back to all games</a>`;
  h+=`<div class="mn-dock${live||due?" has-resume":""}" id="startDock" data-toast-avoid>`+
     (live||due?`<button type="button" class="bg-btn bg-btn--secondary mn-resume" id="resumeBtn" onclick="window.__resume()"><span><span class="bg-btn__label" id="resumeLabel">${due?"See the result":"Resume"}</span>`+
       `<span class="bg-btn__sub" id="resumeSub">${due?winnerLine():"Turn "+Math.max(1,G.stats?G.stats.turns:1)+" · "+p.name}</span></span></button>`:"")+
     `<button type="button" class="bg-btn bg-btn--primary bg-btn--cta" id="startBtn" onclick="window.__start()"><span class="bg-btn__label" id="startLabel">Start Game</span><span class="bg-btn__sub" id="startSub"></span></button></div>`;
  h+=`</div></div>`;
  openModal(h,"",{page:true,kind:"setup"});
  // text that sits right on the setup scene (no card behind it): the stage's motifs fade out over it (BGUI.stage.hush)
  $("modal").querySelectorAll(".mn-setup .bg-section > .bg-eyebrow, .mn-rulenote, #backHub").forEach(e=>e.setAttribute("data-stage-text",""));
  const drawTok=()=>{
    const hdr=$("tokHdr"), grid=$("tokGrid"), msg=$("tokMsg");
    hdr.textContent = SETUP.humans>1 ? "Pick tokens (Player 1 = You)" : "Pick your token";
    grid.innerHTML = TOKENS.map((t,i)=>{
      const slot=SETUP.humanTokens.indexOf(i);   // a picked piece takes its player's seat colour, P1, P2 ...
      return `<button type="button" class="tokbtn" data-t="${i}" aria-pressed="${slot>=0}"><span class="bg-token"${slot>=0?` data-seat="${SEATS[slot]}"`:""} aria-hidden="true">${tokV(t)}</span><span>${t.n}</span>${slot>=0?`<span class="pb">P${slot+1}</span>`:""}</button>`;
    }).join("");
    const need=SETUP.humans-SETUP.humanTokens.length;
    msg.textContent = need>0 ? `${tv?"Pick":"Tap"} ${need} more (unchosen will be random).` : (SETUP.humans>1?`All human tokens chosen. ${tv?"Press OK on one":"Tap one"} to change.`:"The computers get the other tokens at random.");
    grid.querySelectorAll(".tokbtn").forEach(b=>b.onclick=()=>{
      const t=+b.dataset.t, at=SETUP.humanTokens.indexOf(t);
      if(at>=0) SETUP.humanTokens.splice(at,1);                       // unpick
      else if(SETUP.humanTokens.length<SETUP.humans) SETUP.humanTokens.push(t); // pick into next slot
      else if(SETUP.humans===1) SETUP.humanTokens=[t];               // single-human: just switch
      keepIn(grid,drawTok);
    });
    syncCTA();
  };
  const clampTokens=()=>{ if(SETUP.humanTokens.length>SETUP.humans) SETUP.humanTokens=SETUP.humanTokens.slice(0,SETUP.humans); };
  const drawH=()=>{ const seg=$("segH"); seg.innerHTML=[1,2,3,4,5,6].map(n=>`<button type="button" data-n="${n}" class="${SETUP.humans===n?"on":""}" aria-pressed="${SETUP.humans===n}">${n}</button>`).join(""); seg.querySelectorAll("button").forEach(b=>b.onclick=()=>{ SETUP.humans=+b.dataset.n; clampTokens(); keepIn(seg,()=>{ drawH(); drawC(); drawTok(); }); }); };
  const drawC=()=>{ const seg=$("segC"); const maxC=6-SETUP.humans, minC=SETUP.humans>=2?0:(2-SETUP.humans); if(SETUP.cpus>maxC)SETUP.cpus=maxC; if(SETUP.cpus<minC)SETUP.cpus=minC; seg.innerHTML=[0,1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" class="${SETUP.cpus===n?"on":""}" aria-pressed="${SETUP.cpus===n}"${(n>maxC||n<minC)?" disabled":""}>${n}</button>`).join(""); seg.querySelectorAll("button:not([disabled])").forEach(b=>b.onclick=()=>{ SETUP.cpus=+b.dataset.n; keepIn(seg,drawC); }); syncCTA(); };
  drawH(); drawC(); drawTok();
  ui.bar=Saves.bar({game:"monopoly",el:$("svbar"),
    getSettings:()=>({setup:SETUP,rules:RULES}),
    applySettings:s=>{ Object.assign(RULES,DEFAULT_RULES,s.rules||{}); SETUP=Object.assign({humans:1,cpus:3,humanTokens:[0]},s.setup||{}); openSetup(); },
    standard:()=>{ Object.assign(RULES,DEFAULT_RULES); SETUP={humans:1,cpus:3,humanTokens:[0]}; openSetup(); },
    getSnapshot:()=>(G&&G.started&&!G.over)?lastSnap:null,
    loadSnapshot:loadSavedGame});
  dressSaveBar($("svbar"));
  wireRules($("modal"));
  window.__rules=openRules;
  window.__start=()=>{ Sound.skip(); const nH=SETUP.humans, nP=Math.min(6,Math.max(2,nH+SETUP.cpus)); startGame(nP,nH); };
  window.__resume=resumeGame;
  if(had) focusEl([].slice.call($("modal").querySelectorAll("button, input, a[href]")).find(e=>!e.disabled&&focusKey(e)===had));
  else if(!redraw&&(live||due)&&B&&B.focus&&B.focus.enabled&&tv){ const r=$("resumeBtn"); setTimeout(()=>{ if(r&&r.isConnected&&setupShown()) B.focus.set(r); },0); }   // a stray OK goes back to the game
}
function startGame(nP,nH){
  EPOCH++; AUC=null; AUC_WAIT.length=0; TRADE=null; DEBT_THEN=null;   // nothing from the old game carries over
  const chosen=(SETUP.humanTokens||[]).slice(0,nH);
  const used=new Set(chosen);
  const remaining=shuffle(TOKENS.map((_,i)=>i).filter(i=>!used.has(i)));
  const toks=[];
  for(let i=0;i<nP;i++){ toks.push( (i<nH && chosen[i]!==undefined) ? chosen[i] : remaining.shift() ); }
  G=freshState(nP,nH,toks);
  G.started=true; G.stats=freshStats();   // presentation-only counters (Turn N, the Victory pills)
  $("log").innerHTML="";
  log(`New game: ${nP} players, ${nH} human. Good luck!`);
  closeModal(); armBack(); clockOn();
  startTurn();
}
/* ========================= BOOT ========================= */
// placeholder empty board before start
G=freshState(4,1,[0,1,2,3]);
Skins.apply("monopoly"); Sound.mountButton(); Sound.music("monopoly");
renderBoard(); renderStatus(); renderControls();   // never leave the UI blank
// Tap any square (phone) or press OK on it (TV): board.js calls onTap / onOpen (ensureBoard) and the square's deed / info sheet opens
openSetup();

/* ---- Midnight Luxe wiring (presentation only) ---- */
$("menuBtn").addEventListener("click",()=>openMenu());   // the top bar's menu knob (it took over from the old menu glyph button in the action row)
// the Victory screen's buttons; Escape (or a TV Back key) closes it, then the board is back
$("winAgain").addEventListener("click",()=>{ closeWin(); if(window.__start) window.__start(); });
$("winMenu").addEventListener("click",()=>{ closeWin(); openMenu(); });
document.addEventListener("keydown",e=>{
  const B=BG(); if(e.defaultPrevented||!B||!B.win||!B.win.isOpen()) return;
  if(e.key==="Escape"||e.key==="GoBack"||e.key==="BrowserBack"||e.keyCode===27||e.keyCode===4){ e.preventDefault(); closeWin(); }
});
// D-pad (TV): Down from the players picker always lands on the computer picker and Up goes back, even past a disabled count;
// Down from a save bar's first row lands on the nearest button of the second row that is on. Registered before ui.js, so
// BGUI.focus sees these keys as handled.
document.addEventListener("keydown",e=>{
  const B=BG(); if(!B||!B.focus||!B.focus.enabled||e.defaultPrevented||e.altKey||e.ctrlKey||e.metaKey) return;
  const down=e.key==="ArrowDown"||e.keyCode===40, up=e.key==="ArrowUp"||e.keyCode===38, a=document.activeElement;
  if((!down&&!up)||!a||!a.closest) return;
  const pick=sel=>document.querySelector(sel+" button.on:not([disabled])")||document.querySelector(sel+" button:not([disabled])");
  const bar=a.closest("#svbar, #svbar2"), rows=bar?bar.querySelectorAll(".r"):[], row1=rows[0], row2=rows[1];
  const to=(down&&a.closest("#segH"))?pick("#segC"):(up&&a.closest("#segC"))?pick("#segH"):(down&&row1&&row2&&row1.contains(a))?nearestIn(row2,a):null;
  if(to){ e.preventDefault(); B.focus.set(to); }
});
// the play clock counts while the page is on screen
document.addEventListener("visibilitychange",()=>{ if(document.hidden) clockOff(); else clockOn(); });
// saves.js toasts ("Game saved ...") go through BGUI.toast, so they are placed clear of the dock and the player strip
if(window.MutationObserver){
  const sv=$("svtoast");
  new MutationObserver(()=>{ const B=BG(), m=sv.textContent; if(B&&B.toast&&luxeOn()&&m) B.toast(m,{icon:"save",ms:2200}); }).observe(sv,{childList:true,characterData:true,subtree:true});
}
// ui/ui.js is deferred: it arrives after this script. Then the icons go in, the strip gets its CPU badges and turn ring, the
// dialogs become Luxe sheets, the toasts Luxe toasts, and the page's Back steps join the shared TV Back default.
document.addEventListener("DOMContentLoaded",()=>{
  const B=BG();
  if(B&&B.back) B.back.on(backStep);
  else window.__tvBack=()=>{   // no ui.js: the same steps, without the Luxe layers
    if(window.Sound&&Sound.panelOpen&&Sound.panelOpen()){ Sound.closePanel(); return "panel"; }
    const r=backStep(); if(r) return r;
    location.href=$("homeBtn").getAttribute("href"); return "hub";
  };
  if(!B||!B.effects) return;
  document.documentElement.classList.add("mn-luxe");
  pulseWatch(); document.addEventListener("bgui:stage",pulseWatch);   // the turn token's pulse rides the effects ticker
  if(B.icon) document.querySelectorAll("[data-icon]").forEach(el=>{ if(!el.querySelector("svg")) el.insertAdjacentHTML("afterbegin",B.icon(el.getAttribute("data-icon"))); });
  const hub=hubHref(); ["homeBtn","winHome"].forEach(id=>{ const a=$(id); if(a) a.setAttribute("href",hub); });   // TV: keeps ?tv=1
  ui.strip=""; renderStatus(); renderControls();
  if(setupShown()) openSetup();   // the setup page again, now with its icons
  document.addEventListener("bgui:tv",()=>{ ui.strip=""; renderStatus(); renderControls(); if(setupShown()) openSetup(); });
});

// Watchdog: if a turn ever gets stuck "moving" with no dialog/auction open, auto-recover
setInterval(()=>{
  try{
    if(!G || !G.started || G.over) return;
    const modalOpen=$("overlay").classList.contains("on");
    if(G.phase==="moving" && !modalOpen && !AUC && G.phaseSince && (Date.now()-G.phaseSince)>4000){
      log("<i>(recovering stuck turn…)</i>"); G.turnDouble=false; endOrContinue();
    }
  }catch(e){}
},1500);

if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}); }

// expose a few for inline handlers already set via window.__*
})();
</script>
</body>
