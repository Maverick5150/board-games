<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body{margin:0;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(130% 100% at 50% -10%,#24346b,#0e1630 60%);color:#eef2ff;font-family:sans-serif;text-align:center}
  h1{font-size:44px;margin:0 0 10px} p{font-size:26px;color:#9fb0d8;margin:6px 0 30px;max-width:80vw}
  button{font-size:32px;font-weight:800;color:#fff;background:#2b7be0;border:4px solid #2b7be0;border-radius:18px;padding:18px 44px}
  button:focus{outline:6px solid #fff}
</style></head>
<body>
  <h1>🎲 Can’t reach Board Games</h1>
  <p>Party Mode needs an internet connection (phones talk to the TV through it). Check your Wi-Fi, then try again.</p>
  <button id="r" autofocus onclick="AndroidTV.retry()">Try again</button>
  <script>document.getElementById("r").focus();</script>
</body></html>
